<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>The AI-Native SDLC Playbook - 互動式教學簡報系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anthropic《The AI-Native SDLC Playbook》互動式教學簡報系統，含 220+ 頁技術拆解、麥肯錫 SCQA 大綱模式、全域可縮放心智圖與各章 SVG 流程圖。">
  <style>
    :root {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-item: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --color-primary: #d97706; /* Anthropic Terracotta Gold */
      --color-primary-hover: #b45309;
      --color-accent-bg: #f0fdf4; /* 綠色生活化類比卡片 */
      --color-accent-border: #bbf7d0;
      --color-accent-text: #166534;
      --color-accent-icon: #22c55e;
      --color-badge-bg: #fef3c7;
      --color-badge-text: #92400e;
      --color-num-bg: #fef3c7;
      --color-num-text: #b45309;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-item: #334155;
      --border-color: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --color-primary: #fbbf24;
      --color-primary-hover: #f59e0b;
      --color-accent-bg: #14532d;
      --color-accent-border: #15803d;
      --color-accent-text: #bbf7d0;
      --color-accent-icon: #4ade80;
      --color-badge-bg: #78350f;
      --color-badge-text: #fde68a;
      --color-num-bg: #78350f;
      --color-num-text: #fde68a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Header styling matching McKinsey/Anthropic aesthetic */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #d97706, #b45309);
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 2px 4px rgba(217, 119, 6, 0.3);
    }

    .header-logo h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .header-logo .version-badge {
      font-size: 11px;
      font-weight: 600;
      background-color: var(--color-badge-bg);
      color: var(--color-badge-text);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Tabs in the header center */
    .tab-container {
      display: flex;
      background-color: var(--bg-item);
      border: 1px solid var(--border-color);
      padding: 3px;
      border-radius: 8px;
      gap: 4px;
    }

    .tab-btn {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--bg-card);
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-main);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Chapter select dropdown */
    .chapter-select {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
      min-width: 200px;
      max-width: 280px;
      transition: all 0.2s;
    }

    .chapter-select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
    }

    .icon-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background-color: var(--bg-item);
      border-color: var(--text-muted);
    }

    /* Main Container & Slide Layout */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Slide Sidebar list */
    .sidebar {
      width: 320px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: margin-left 0.3s ease;
      z-index: 5;
    }

    .sidebar.collapsed {
      margin-left: -320px;
    }

    .search-box {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      background-color: var(--bg-item);
      color: var(--text-main);
      outline: none;
      transition: border 0.2s;
    }

    .search-input:focus {
      border-color: var(--color-primary);
      background-color: var(--bg-card);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .chapter-group {
      margin-bottom: 12px;
    }

    .chapter-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 8px;
      margin-bottom: 2px;
      border-bottom: 1px solid var(--border-color);
    }

    .page-item {
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
      margin-bottom: 2px;
    }

    .page-item:hover {
      background-color: var(--bg-item);
      color: var(--color-primary);
    }

    .page-item.active {
      background-color: var(--color-badge-bg);
      color: var(--color-badge-text);
      font-weight: 600;
    }

    .page-badge {
      font-size: 10px;
      padding: 1px 5px;
      background-color: var(--bg-main);
      color: var(--text-muted);
      border-radius: 4px;
      font-weight: 600;
    }

    .page-item.active .page-badge {
      background-color: var(--color-primary);
      color: #ffffff;
    }

    /* Slide area */
    .slide-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .slide-container-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    /* The Presentation Card (matching the mockup) */
    .slide-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 1240px;
      min-height: 640px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
      padding: 24px 28px;
      position: relative;
      transition: background-color 0.3s, border-color 0.3s;
    }

    /* Top Meta Badge Row */
    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .chapter-badge {
      background-color: var(--color-badge-bg);
      color: var(--color-badge-text);
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .page-indicator-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Slide Titles */
    .slide-title-block {
      margin-bottom: 16px;
    }

    .slide-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .slide-subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-primary);
    }

    /* Slide Content Columns */
    .slide-content-columns {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      margin-bottom: 16px;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Points Header */
    .section-header {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .section-header::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-primary);
    }

    /* Numbered boxes list (matching mockup) */
    .numbered-points-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .numbered-point-item {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .num-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: var(--color-num-bg);
      color: var(--color-num-text);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .point-text-box {
      flex: 1;
      background-color: var(--bg-item);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Metaphor card (matching green card in mockup) */
    .metaphor-card {
      background-color: var(--color-accent-bg);
      border: 1px solid var(--color-accent-border);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .metaphor-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--color-accent-text);
      margin-bottom: 6px;
    }

    .metaphor-icon {
      color: var(--color-accent-icon);
      display: flex;
      align-items: center;
    }

    .metaphor-text {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--color-accent-text);
      font-weight: 500;
    }

    /* Flowchart / Layout panel */
    .visual-layout-panel {
      background-color: var(--bg-item);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .visual-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .visual-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .visual-desc {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .flowchart-wrapper {
      flex: 1;
      min-height: 240px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #ffffff;
      overflow: hidden;
      cursor: grab;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Card Bottom Control bar */
    .card-bottom-bar {
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }

    .shortcut-tips {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .key-badge {
      background-color: var(--bg-item);
      border: 1px solid var(--border-color);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
    }

    .slide-counter {
      font-weight: 700;
      color: var(--text-main);
    }

    .slide-counter span {
      color: var(--color-primary);
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: var(--bg-item);
      border-color: var(--text-muted);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Fullscreen Mindmap Outer (Slide 2 in Overview) */
    .mindmap-outer-container {
      flex: 1;
      height: 100%;
      min-height: 520px;
      position: relative;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background-color: #f8fafc;
    }

    .mindmap-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
      z-index: 15;
    }

    .mindmap-control-btn {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      color: var(--text-main);
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .mindmap-control-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .mindmap-tooltip {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background-color: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 8px;
      max-width: 320px;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      z-index: 15;
      display: none;
      box-shadow: var(--shadow-lg);
    }

    .mindmap-tooltip-title {
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .link-active {
      stroke: #d97706 !important;
      stroke-width: 3.5px !important;
      filter: drop-shadow(0 0 4px rgba(217, 119, 6, 0.6));
    }

    .node-active {
      stroke: #d97706 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.5));
    }

    /* Code block styling in slides */
    pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body data-theme="light">

  <header>
    <div class="header-logo">
      <div class="logo-icon">C</div>
      <div>
        <h1>The AI-Native SDLC Playbook</h1>
      </div>
      <span class="version-badge">Anthropic Official Engineering</span>
    </div>
    
    <!-- Tab container: Overview vs Detailed -->
    <div class="tab-container">
      <button class="tab-btn" id="tab-overview" onclick="switchMode('overview')">簡報大綱 (Overview)</button>
      <button class="tab-btn active" id="tab-detailed" onclick="switchMode('detailed')">詳細說明 (220+ Slides)</button>
    </div>
    
    <div class="header-controls">
      <!-- Chapter Dropdown -->
      <select class="chapter-select" id="chapter-select" onchange="handleChapterSelect(this.value)">
        <option value="all">所有章節導覽 (20 章)</option>
        <option value="1">第 1 章：範式轉移 (Paradigm Shift)</option>
        <option value="2">第 2 章：核心原則 (Core Principles)</option>
        <option value="3">第 3 章：CLAUDE.md 憲章規範</option>
        <option value="4">第 4 章：自訂斜線指令 (Custom Commands)</option>
        <option value="5">第 5 章：專有工具擴展 (MCP Extensibility)</option>
        <option value="6">第 6 章：安全防護網 (Hooks & Safeguards)</option>
        <option value="7">第 7 章：Stage 1: Inception (意圖對齊)</option>
        <option value="8">第 8 章：Stage 2: Design (原型驗證)</option>
        <option value="9">第 9 章：Stage 3: Plan (計畫拆解)</option>
        <option value="10">第 10 章：Stage 3: Plan (Subagents & Tasks)</option>
        <option value="11">第 11 章：Stage 4: Test (反饋迴圈)</option>
        <option value="12">第 12 章：Stage 4: Test (CI 持續評測)</option>
        <option value="13">第 13 章：Stage 5: Deploy (PR 審查循環)</option>
        <option value="14">第 14 章：Stage 5: Deploy (零停機發佈)</option>
        <option value="15">第 15 章：Stage 5: Deploy (藍綠灰度部署)</option>
        <option value="16">第 16 章：Stage 6: Maintain (閉環修復)</option>
        <option value="17">第 17 章：Stage 6: Maintain (定期弱點掃描)</option>
        <option value="18">第 18 章：Stage 6: Maintain (線上值班與除錯)</option>
        <option value="19">第 19 章：Enterprise Governance (企業治理與路線圖)</option>
        <option value="20">第 20 章：Future Vision (自主軟體製造工廠)</option>
      </select>

      <!-- Sidebar toggler (Grid icon) -->
      <button class="icon-btn" id="grid-btn" title="檢索大綱清單 (M)" onclick="toggleSidebar()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>

      <!-- Theme button -->
      <button class="icon-btn" id="theme-btn" title="切換深淺主題 (D)" onclick="toggleTheme()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>

      <!-- Fullscreen button -->
      <button class="icon-btn" id="fullscreen-btn" title="全螢幕模式 (F)" onclick="toggleFullscreen()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4h4M4 16v4h4M20 8V4h-4M20 16v4h-4"></path></svg>
      </button>
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar Drawer (Grid slides list) -->
    <div class="sidebar collapsed" id="sidebar">
      <div class="search-box">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" class="search-input" id="search-input" placeholder="搜尋主題、關鍵字或頁碼..." oninput="handleSearch()">
        </div>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- Presentation Area -->
    <div class="slide-area">
      <div class="slide-container-wrapper">
        <div class="slide-card" id="slide-card">
          <!-- Slide Content Injected Here -->
        </div>
      </div>
    </div>
  </div>

  <script>

 <g class=\"ch-node-group\" data-ch=\"1\" data-links=\"link-ch-1\" transform=\"translate(540, 230)\" style=\"cursor: pointer;\">\n      <rect width=\"150\" height=\"40\" rx=\"8\" fill=\"#ffffff\" stroke=\"#94a3b8\" stroke-width=\"1.5\" filter=\"url(#node-shadow)\" />\n      <text x=\"75\" y=\"18\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">第 1 章：範式轉移</text>\n      <text x=\"75\" y=\"31\" fill=\"#64748b\" font-size=\"9\" text-anchor=\"middle\">代碼不再是系統瓶頸</text>\n    </g>\n\n    <!-- Ch 2: Principles -->\n    <g class=\"ch-node-group\" data-ch=\"2\" data-links=\"link-ch-2\" transform=\"translate(730, 230)\" style=\"cursor: pointer;\">\n      <rect width=\"150\" height=\"40\" rx=\"8\" fill=\"#ffffff\" stroke=\"#94a3b8\" stroke-width=\"1.5\" filter=\"url(#node-shadow)\" />\n      <text x=\"75\" y=\"18\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\">第 2 章：核心工程原則</text>\n      <text x=\"75\" y=\"31\" fill=\"#64748b\" font-size=\"9\" text-anchor=\"middle\">Anthropic 五大開發心法</text>\n    </g>\n\n    <!-- Ch 19: Governance -->\n    <g class=\"ch-node-group\" data-ch=\"19\" data-links=\"link-ch-19\" transform=\"translate(620, 80)\" style=\"cursor: pointer;\">\n      <rect width=\"160\" height=\"42\" rx=\"8\" fill=\"#ffffff\" stroke=\"#94a3b8\" stroke-width=\"1.5\" filter=\"url(#node-shadow)\" />\n      <text x=\"80\" y=\"19\" fill=\"#1e293b\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\">第 19 章：企業級治理</text>\n      <text x=\"80\" y=\"33\" fill=\"#64748b\" font-size=\"9.5\" text-anchor=\"middle\">ZDR 隱私與成熟度路線圖</text>\n    </g>\n\n    <!-- Ch 20: Future Vision -->\n    <g class=\"ch-node-group\" data-ch=\"20\" data-links=\"link-ch-20\" transform=\"translate(800, 80)\" style=\"cursor: pointer;\">\n      <rect width=\"170\" height=\"42\" rx=\"8\" fill=\"#ffffff\" stroke=\"#94a3b8\" stroke-width=\"1.5\" filter=\"url(#node-shadow)\" />\n      <text x=\"85\" y=\"19\" fill=\"#1e293b\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\">第 20 章：未來自主工廠</text>\n      <text x=\"85\" y=\"33\" fill=\"#64748b\" font-size=\"9.5\" text-anchor=\"middle\">多 Agent 集群與自癒生態</text>\n    </g>\n  </g>\n</svg>"}, {"meta": "痛點剖析：代碼生成時代的「新瓶頸轉移」", "chapter_id": 1, "title": "Code is no longer the bottleneck", "subtitle": "為什麼程式碼寫得越快，軟體交付週期反而沒有等比例縮短？", "takeaway": "研發流程的瓶頸已經從『實現代碼』轉移到『左右兩端』：需求對齊 (Plan)、人工審查 (Review) 與發布測試 (Deploy)。", "details": ["<strong>左側與右側的新阻礙</strong>：當 Agent 能在幾分鐘內產出數千行高品質 Diff 時，人類主管每週一次的架構審查會議瞬間成為最嚴重的限流閥。", "<strong>傳統控制手段失靈</strong>：逐行人工 Code Review 是假設每一行都是人類編寫的；當產出量暴增 10 倍，審查隊列只會無上限堆積，迫使團隊在『拖延』或『放行未檢代碼』間危險抉擇。", "<strong>治理成本呈指數級攀升</strong>：合規例外情況依舊仰賴定期委員會討論，安全團隊規模無法按 AI 產出倍數擴編，組織流程徹底與技術現實脫節。"], "metaphor": "就像一家餐廳引進了全自動機器人廚師，每分鐘能炒出 50 道菜（代碼生成），但點菜服務生（需求定義）和端菜服務生（審核部署）依然只有兩個人，餐廳大廳立刻被盤子堆爆癱瘓。", "layout": "漏斗對比圖：左側展示傳統 SDLC 編碼狹窄漏斗，右側展示 AI-Native 漏斗中 Build 擴大而前後端嚴重堵塞的對照。"}, {"meta": "麥肯錫 SCQA 故事框架：傳統研發的衝突與救贖", "chapter_id": 2, "title": "情境 (S) - 衝突 (C) - 疑問 (Q) - 回答 (A)", "subtitle": "以諮詢教練視角，建立組織全員共識的變革故事敘事弧線", "takeaway": "唯有將線性人工交接徹底轉化為以 Committed Artifact 為核心的自主反饋迴圈，才能釋放十倍工程效能。", "details": ["<strong>情境 (Situation)</strong>：組織已廣泛引入 Claude 等先進 AI 工具，工程師個人編碼效率實現跨越式成長，寫代碼不再是一件苦差事。", "<strong>衝突 (Conflict)</strong>：團隊組織規範、合規稽核流程與審查門禁依然停留在瀑布式思維，流程摩擦抵消了工具紅利，甚至引發更嚴峻的安全焦慮。", "<strong>疑問 (Question)</strong>：如何建立一套既能享受 Agentic AI 極致速度，又能滿足受監管企業嚴苛安全、合規與可審計要求的全新研發體系？", "<strong>回答 (Answer)</strong>：構建 AI-Native SDLC：將控制目標編碼為軟約束 (Skills) 與硬門禁 (Hooks)，讓 Artifact 驅動階段流轉，並在生產環境實現自愈閉環。"], "metaphor": "就像近代航海從依賴帆船水手手工拉繩（傳統 SDLC），升級為配置自動平衡舵與防禦雷達的現代化智慧貨輪（AI-Native SDLC）。", "layout": "麥肯錫經典四象限矩陣，按 S-C-Q-A 依序排列，疑問部分以亮紅色邊框加粗警示，解方部分以翠綠色標註落地成果。"}, {"meta": "六大階段轉變矩陣：傳統 vs AI-Native", "chapter_id": 2, "title": "軟體生命週期六大階段的範式光譜", "subtitle": "Anthropic 官方核心對照：全面從『人工承擔』轉化為『人機協同閉環』", "takeaway": "人的專注力從『逐行操作』釋放，全面轉移至『門禁審批、邊界裁決與意圖定調』。", "details": ["<strong>Plan & Design</strong>：從漫長的 PRD 撰寫與會議吵架，轉向非技術口語詰問提煉 `intent.md`，並由 Skills 約束自動生成 `spec.md`。", "<strong>Build & Test</strong>：從逐行手寫代碼與事後 QA 追捕 Bug，轉為 Plan Mode 前置詰問推演、Auto Mode 自主執行，以及 Agent 自動自我修復迴圈。", "<strong>Deploy & Maintain</strong>：從深夜人工值班部署與被動接客訴，轉化為 `REVIEW.md` 多層 AI 審查、Hooks 具名審批門禁，以及 `bands.yaml` 指標異常自愈。"], "metaphor": "就像從『傳統手工作坊工匠逐刀雕刻零件』，升級為『現代化工業 4.0 數位工廠』：工程師只需輸入設計圖與安全參數，產線自動切削組裝並即時質檢。", "layout": "6x2 對比矩陣表格，左側淺灰為傳統人工模式，右側藍綠高亮為 Claude 原生模式，底部標註跨階段核心 Artifact。"}, {"meta": "唯一信任鏈：The Committed Artifact Chain", "chapter_id": 2, "title": "以版本控制產物作為組織的唯一記憶與審計鏈", "subtitle": "為什麼 .md 文件是人與 AI 溝通的最佳橋樑？", "takeaway": "每個階段都以寫入 Git 的 Artifact 為終點，並作為下個階段的觸發信號，形成不可篡改的法定合規憑據。", "details": ["<strong>共通語言媒介</strong>：Markdown 檔案（`intent.md`, `spec.md`, `plan.md`）既是人類非技術主管能夠輕鬆閱讀與審批的文本，也是 LLM 最擅長精確解析的語境。", "<strong>審計鏈即 Git History</strong>：誰在何時提出了什麼意圖、Agent 依據哪版規格規劃了哪些步驟、哪位工程師簽署放行，全數永久留存於 Git 提交鏈中。", "<strong>事件驅動的流水線觸發</strong>：合併 `intent.md` 自動觸發規格 pass；批准 `spec.md` 自動喚醒 Claude Code 生成計畫，杜絕無謂的手動催促與交接會議。"], "metaphor": "這就像在精密製造業中的『隨車履歷卡』：零件每經過一個加工工位，機器和工長就蓋章簽收一次，任何瑕疵都能精準溯源至特定的參數與工序。", "layout": "箭頭式時間線：intent.md → spec.md → plan.md → diff & tests → review findings → incident bands，節點下方展示對應的簽核角色。"}, {"meta": "雙層防禦體系：軟約束 (Skills) 與硬門禁 (Hooks)", "chapter_id": 8, "title": "企業落地的安全護城河：諮詢式引導與確定性攔截", "subtitle": "如何既給予 Agent 充分創造力，又確保 100% 不越雷池一步？", "takeaway": "用 Skills 提供最佳實務與業務情境引導（軟約束），用 Hooks 在本地底層提供不可逾越的確定性攔截（硬門禁）。", "details": ["<strong>軟約束 (Skills)</strong>：將企業安全手冊、API 標準與品牌原則寫為 `SKILL.md`。Agent 在遇到特定任務時主動載入，大幅降低犯錯與偏離常軌的機率。", "<strong>硬門禁 (Hooks)</strong>：屬於確定性的 Shell/Python 腳本。在 Agent 執行工具動作前（`PreToolUse`）毫秒級觸發，一旦碰觸未授權檔案或生產指令，立即以 exit 2 物理阻斷。", "<strong>合力效果</strong>：Skill 讓違規極其罕見，Hook 讓違規完全不可能。兩者結合構成了受監管金融與醫療企業敢於大規模擁抱 Agent 的核心基石。"], "metaphor": "Skill 就像是高速公路上的『導航語音提示與交通規則告示牌』，而 Hook 則是道路兩側的『鋼製防撞護欄與收費站升降桿』，兩者缺一不可。", "layout": "雙層盾牌示意圖：外層為綠色半透明的 Skill 智慧濾網，內層為厚實深藍的 Hook 確定性鋼板，中間穿梭著 Agent 的操作指令。"}, {"meta": "企業落地路線圖：從手動提示走向完全自主研發閉環", "chapter_id": 19, "title": "AI 原生化轉型的四階成熟度模型", "subtitle": "循序漸進解鎖價值飛輪，安全穩健邁向自動化軟體工廠", "takeaway": "先在個人端導入 Plan Mode 與 CLAUDE.md，逐步鋪設企業級 Hooks 與 Evals，最終實現生產監控閉環自愈。", "details": ["<strong>L1 輔助生成 (Prompt Assisted)</strong>：工程師在 IDE 中手動對話提問，依賴個人自律維護品質，收益局限於個人打字加速。", "<strong>L2 規格引領 (Spec-Driven)</strong>：引入 `intent.md` 與 `spec.md`，推動 Plan Mode 與 Auto Mode，建置期實現單次高質交付。", "<strong>L3 門禁防禦 (Gated Pipeline)</strong>：全面部署 `CLAUDE.md`, Skills, Hooks, Continuous Evals 與 PR Review Loop，建立堅固安全護欄。", "<strong>L4 自主閉環 (Autonomous Loop)</strong>：生產環境透過 `bands.yaml` 自動捕獲異常，自動回流至 Plan 階段提修復 PR，實現軟體自我進化。"], "metaphor": "這就像人類自動駕駛的演進歷程：從 L1 定速巡航、L2 車道保持、L3 有條件自動駕駛，最終進化至真正無人值守的 L4 智慧調度計程車隊。", "layout": "四階階梯圖（從左下至右上），每階標註關鍵機制、所需工具與組織預期收穫的 ROI 倍率。"}];
    const detailedSlides = [{"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 1, "title": "軟體開發生命週期的六大歷史階段回顧", "subtitle": "從構想到生產：傳統瀑布與敏捷架構下漫長的人力交接鏈", "takeaway": "傳統 SDLC 的六大階段皆由不同職能角色手工驅動，跨階段交接成為組織內部最大的溝通耗損。", "details": ["<strong>經典六大階段</strong>：涵蓋 Plan（需求）、Design（架構）、Build（編碼）、Test（測試）、Deploy（發布）至 Maintain（運維）。", "<strong>孤島式職能割裂</strong>：產品經理寫需求、架構師畫藍圖、工程師敲代碼、QA 找漏洞、發布團隊發版、維運團隊接告警，角色各自為政。", "<strong>繁複的文件與審批傳遞</strong>：工作以 PRD、架構圖、Jira 工單與簽核信件為載體，在各部門間層層拋接，每次交接都伴隨資訊丟失與溝通延遲。"], "metaphor": "這就像傳統的『驛站送信制』，一份公文需要經過六個不同驛站的驛卒手手相傳，每換一次驛馬就得等待半天，一旦有人字跡潦草就得打回重寫。", "layout": "水平箭頭進度軸，展示 Plan → Design → Build → Test → Deploy → Maintain 的傳統人工作業模式。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 2, "title": "傳統 SDLC 為什麼如此繁複沉重？", "subtitle": "PRD、估時儀式與安全評審的真正歷史成因", "takeaway": "傳統流程的重度管控並非官僚主義，而是為了保護過去最昂貴、最耗時的資產——『人力編碼時間』。", "details": ["<strong>代碼實作是歷史最高成本</strong>：過去編寫功能往往需要耗費數週、數月甚至數季，一旦方向錯誤，組織將承受巨大的沉沒成本。", "<strong>強制事前對齊 (Alignment)</strong>：詳盡的 PRD 與反覆的評審會議，本質上是為了在昂貴的動工之前，強迫所有人對齊認知，防止做白工。", "<strong>人工假設的全面滲透</strong>：傳統 SDLC 中的所有控制手段（Control Objectives），其底層假設都是『每一步驟皆由人類手動完成』。"], "metaphor": "如同古代建造摩天石造大教堂，因為開採石料與手工雕刻耗資巨大，必須在工匠動鑿前花幾年反覆繪製藍圖並召開神學委員會嚴審，容不得分毫差錯。", "layout": "成本對比天平圖：左側為昂貴的人力編碼成本，右側為沉重的事前審查流程，兩者在舊時代形成脆弱平衡。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 3, "title": "2026 生成式 AI 的真實爆發：代碼生成提速 10 倍", "subtitle": "Claude Code 等自主 Coding Agent 帶來的研發衝擊", "takeaway": "以 Claude Code 為代表的 Agentic AI 工具，將代碼編寫的邊際時間與成本徹底粉碎。", "details": ["<strong>編程速率質的飛躍</strong>：一年前難以想像的代碼產出速度，如今工程師透過指令即可在幾分鐘內完成數百行精準架構與實作。", "<strong>複雜情境理解與重構</strong>：Claude 不僅能補全代碼，更能深入跨模組上下文，進行重構、修復複雜 Bug 與整合外部 API。", "<strong>一人全端時代開啟</strong>：前端、後端、腳本與測試編寫門檻驟降，工程師不再受限於單一語言語法細節，產能呈指數級釋放。"], "metaphor": "這就像從前需要由數十位抄寫員在羊皮紙上點燈夜戰抄書（手動編程），一夕之間擁有了全自動高速印刷機（Claude Code），文字噴湧而出。", "layout": "時間軸柱狀圖：對比 2024 年手工編碼平均耗時（數天）與 2026 年 Claude Code 輔助下的實作耗時（分鐘級）。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 4, "title": "代碼已不再是研發瓶頸：驚人的生產力假象", "subtitle": "為什麼大家都在用 AI，企業軟體發布週期卻依然沒有變快？", "takeaway": "代碼寫得再快，只要周遭的流程、審批、評估與策略依然故我，整體組織交付效率將停滯不前。", "details": ["<strong>局部優化不等於整體提速</strong>：根據約束理論（Theory of Constraints），僅加速非瓶頸環節，只會讓半成品在庫存中大量積壓。", "<strong>工程師個人的偽高產</strong>：工程師在本地終端機以極速產出了數十個 Pull Requests，但它們全部卡在審批與部署隊列中等待人眼過目。", "<strong>組織效率的失速感</strong>：管理層看到工具使用率攀升，但業務部門卻抱怨需求依然需要排期數週才能上線，引發對 AI 價值的懷疑。"], "metaphor": "就像在擁堵的市區早高峰道路上，就算換上了一輛零百加速 2 秒的超級跑車，你也只能以時速 15 公里跟在公車後面動彈不得。", "layout": "流程漏斗圖：寬闊的中間建置段被狹窄的前端需求與後端部署所卡死，展示整體產出受限於系統瓶頸。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 5, "title": "新瓶頸的左右轉移：Plan 與 Test/Deploy", "subtitle": "當 Build 階段提速千倍，真正的障礙遷移到了何處？", "takeaway": "研發瓶頸徹底轉移到了 Build 兩側：以人類速度運轉的需求規劃 (Plan)、安全審查 (Review) 與部署發布 (Deploy)。", "details": ["<strong>左側瓶頸：需求規格對齊 (Plan)</strong>：業務人員不知道如何精確描述需求，依然等待產品經理排期撰寫傳統規格書，耗時數週。", "<strong>右側瓶頸：代碼審查與測試 (Test)</strong>：人工 Reviewer 面對海量 Agent 產出的 Diff 疲於奔命，手工回歸測試成為嚴重的吞吐阻礙。", "<strong>交付終點：部署把關 (Deploy)</strong>：變更管理委員會 (CAB) 依然每週開會一次，手動核准發布，徹底抹煞了即時編碼的速度優勢。"], "metaphor": "宛如在高速鐵路兩端，旅客必須排長隊手工買紙質車票（Plan），下車後還得逐一開箱手動安檢才能出站（Deploy），高鐵跑再快也無濟於事。", "layout": "三階段對比圖：中央 Build 階段標註綠色高鐵圖標，兩端 Plan 與 Deploy 標註紅色塞車擁堵圖標。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 6, "title": "傳統控制手段的致命錯位：逐行審查的極限崩潰", "subtitle": "當代碼量暴增十倍，手動人眼 Code Review 宣告破產", "takeaway": "逐行人工審核是建立在『產出緩慢且由人手撰寫』的前提上；當面對 Agent 產出的龐大 Diff，人眼審查完全不可持續。", "details": ["<strong>審查機制的歷史假設</strong>：過去工程師一天寫 50 行代碼，審核者花 15 分鐘逐行品味變數命名、邏輯分支是合理的。", "<strong>認知超載與視覺疲勞</strong>：當 Claude 一次提交 1,000 行包含完整測試的代碼變更，資深工程師根本無法在有限工時內逐行嚴審。", "<strong>審查品質斷崖式下跌</strong>：面對巨大 PR，審核者往往被迫妥協，變成隨意翻翻便點擊 Approve，反而更容易漏掉深層漏洞。"], "metaphor": "就像過去海關官員每天只要開箱檢查三名旅客的行李箱，現在突然開來了一列包含 100 節車廂的貨運列車要求他在半小時內逐件開箱手檢。", "layout": "折線圖對照：展示 PR 代碼行數激增曲線與人類審查專注度與缺陷檢出率的下滑曲線。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 7, "title": "審查隊列無限堆疊的兩難困境", "subtitle": "延遲交付 vs 裸奔上線：受監管企業不可承受之重", "takeaway": "隊列無限積壓將阻礙業務創新，隨意放行則可能引發重大合規與安全事故，兩者皆非可行解。", "details": ["<strong>困境一：審查隊列無底線堆積 (Backlog)</strong>：變更卡在 PR 階段數週，代碼迅速與主幹分岔 (Drift)，合併時產生巨大衝突與重工代價。", "<strong>困境二：未經深審的代碼上線 (Under-reviewed)</strong>：為了趕上商業競賽進度，團隊降低安全門檻，隱匿漏洞直接進入生產環境。", "<strong>嚴格監管機構的零容忍</strong>：金融、醫療、公共事業等受法規嚴格約束的企業，完全不能接受任何可能引發合規災難的妥協。"], "metaphor": "這是在『排隊等到中暑餓死』與『吃下未經檢驗的野生毒蘑菇充飢』之間的危險賭博，任何理性管理者都不能接受這兩種結局。", "layout": "天平兩難圖：左盤放『交付嚴重停滯』，右盤放『生產資安事故』，正中間為警示紅框標註『死局』。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 8, "title": "治理成本的指數級爆炸", "subtitle": "每週召開一次的委員會，如何跟上秒級反應的 Agent？", "takeaway": "當例外審批與安全豁免依然透過每週或每月的會議裁決時，治理成本與決策摩擦將呈指數級飆升。", "details": ["<strong>會議驅動治理的極限</strong>：傳統架構評審委員會 (ARB) 與變更委員會 (CAB) 依賴 PPT 匯報與定時會議，決策頻率完全無法匹配 Agent。", "<strong>溝通鏈路過長與摩擦倍增</strong>：為了解決一個依賴升級或資料庫欄位微調，可能需要跨越三個不同委員會的往返答辯。", "<strong>治理成本壓倒研發收益</strong>：團隊花在準備審查材料、解釋 AI 生成邏輯、填報例外工單的時間，遠超過寫代碼所節省的時間。"], "metaphor": "就像在全自動機器人無人駕駛賽車場上，每過一個彎道都必須把車停下來，等待由三位白髮長老組成的委員會舉牌表決是否允許轉向。", "layout": "成本對比圓餅圖：傳統時代治理溝通佔比 20%，而在代碼提速後，未重塑流程下的治理與等待耗時飆升至 75%。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 9, "title": "資安團隊的容量危機：當產出乘以十倍", "subtitle": "有限的安全專家如何抵禦幾何級數增長的代碼洪流？", "takeaway": "安全團隊規模不可能按代碼產量成比例擴充，安全檢測必須與 Agent 站在相同的自動化節奏上。", "details": ["<strong>人手比例的嚴重失衡</strong>：典型企業中安全工程師與開發工程師比例常為 1:50；當 50 位開發者藉由 AI 產出 500 人的代碼量時，安全防線瞬間被撕裂。", "<strong>依賴人工靜態掃描複審的極限</strong>：傳統 SAST/DAST 工具誤報率高，需要專家逐條排查，在代碼洪流下直接導致警報疲勞 (Alert Fatigue)。", "<strong>安全前移 (Shift-Left) 的全新意義</strong>：安全防護不能再留到上線前的最後一道關卡，必須在 Agent 構思規格與編碼的當下即時約束。"], "metaphor": "就像城市自來水廠的檢測員，原本每天檢驗 10 瓶水樣，現在水管突然被擴建成大瀑布，檢驗員如果不換用全自動光譜感測器，只能眼睜睜看著水流過。", "layout": "比例失衡示意圖：展示 1 個安全盾牌面對著由 50 個 Agent 同時發射的大量代碼火箭。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 10, "title": "全生命週期轉型迫切性：同步重塑周邊流程", "subtitle": "Anthropic Applied AI 團隊核心建言：以 AI 原生思維改造全流程", "takeaway": "唯有對傳統 SDLC 的全生命週期進行與編碼同等深度的革命性改造，企業才能真正收穫 Agentic AI 的商業紅利。", "details": ["<strong>保留控制目標，徹底翻新執行方式</strong>：我們不能放鬆合規與安全標準，但必須將傳統『人工開會審查』升級為『確定性代碼門禁』。", "<strong>重新設計工作流邊界</strong>：消除手動文件傳遞，讓上下游工具鏈能夠被 Agent 自然調用與觸發，建立流暢的高速公路。", "<strong>人和機器的最佳定位劃分</strong>：讓 Agent 承擔日常繁重的邏輯生成、自我測試與自動排查，讓人類專注於商業意圖、邊界評判與關鍵放行。"], "metaphor": "這不是在舊馬車上綁火箭，而是重新鋪設無縫鋼軌、架設接觸網與智慧信號系統，打造真正安全奔馳的全新高速鐵路體系。", "layout": "雙軌演進圖：上方展示修補傳統流程的崩潰結局，下方展示全面重構為 AI-Native SDLC 的順暢價值曲線。"}, {"chapter_id": 1, "chapter_name": "第 1 章：典範轉移：傳統 SDLC 的瓶頸與危機", "page_num": 11, "title": "第一章實戰總結：邁向 AI 原生重構的思考起點", "subtitle": "從工具採納者進化為研發流程架構師的認知升級", "takeaway": "忘掉單純的打字提效，將目光投向整體組織流程的閉環打通與制度化治理。", "details": ["<strong>核心結論一</strong>：代碼已非瓶頸，圍繞代碼的組織協議才是決定研發生死的新戰場。", "<strong>核心結論二</strong>：舊世界的控制手段在 AI 洪流下已不可行，亟需新一代確定性防護與評測體系。", "<strong>行動指引</strong>：緊接著在第二章，我們將正式揭開 Anthropic 官方『AI 原生 SDLC』的核心架構與閉環運轉哲學！"], "metaphor": "當蒸汽機發明後，工廠沒有因為只是把紡織機搖柄換成馬達而偉大，而是因為重新設計了流水線廠房與供應鏈，才開創了工業革命的新時代。", "layout": "三條黃金總結卡片，搭配下方指向第二章『架構重塑』的躍遷箭頭。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 1, "title": "AI 原生 SDLC 的核心定義與精神實質", "subtitle": "結合舊有的嚴謹控制目標，與全新的自動化強制執行機制", "takeaway": "AI 原生 SDLC 不是單純在現有流程中加入 AI 聊天機器人，而是圍繞 Agentic AI 能力徹底重構的自驅動閉環。", "details": ["<strong>舊目標，新執行 (Old objectives, new enforcement)</strong>：合規、審計、安全性與架構穩健性目標維持不變，但落實手段從人工開會轉為確定性自動化門禁。", "<strong>以 Agentic AI 為核心的重構</strong>：認知到模型具備推理、規劃、編碼與自我驗證能力，消除人機間無謂的摩擦環節。", "<strong>名稱多樣，本質統一</strong>：業界無論稱之為 Agentic SDLC、AI SDLC 或 Agentic Software Development，指向的皆為同一場研發架構革命。"], "metaphor": "就像銀行從傳統的手工紙本記帳與定期查帳員訪查，轉變為全自動化的分散式即時清算系統，安全目標絲毫不減，但運轉效率提升萬倍。", "layout": "核心概念對比圖：中央為『堅守控制目標』的金色盾牌，左右兩翼分別為傳統人工執行與 AI 原生自動執行的強烈對照。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 2, "title": "從「線性瀑布拋接」徹底轉向「事件驅動閉環」", "subtitle": "打破孤島與手動摩擦，邁向自動銜接與連續流轉", "takeaway": "AI-Native SDLC 將孤立的線性階段重構為循環迴圈，每個階段的完成自動觸發下一個環節。", "details": ["<strong>告別手動催促與交接</strong>：傳統流程中，文件撰寫完畢需要手動寄信通知、等待對方排期；AI-Native 模式下，事件一旦觸發即刻啟動下游 Agent。", "<strong>反向自愈迴圈</strong>：流程不再是一條走到底的單行道，生產環境的異常告警能夠直接反向重啟 Stage 1 規劃，形成自動修復自愈環。", "<strong>零手動損耗的高速流動</strong>：各階段的銜接由清晰的事件與介面驅動，徹底消除跨部門等待與資訊在會議中的失真。"], "metaphor": "這就像從傳統的手工接力賽跑（隊員可能在交接區發呆或掉棒），轉變成一組運轉精準的高速齒輪箱，前一個齒輪的旋轉必然精準帶動下一個齒輪旋轉。", "layout": "雙環示意圖：左側展示傳統線性瀑布斷點，右側展示 AI-Native 的雙向有機閉環，箭頭首尾相連。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 3, "title": "核心基石：Committed Artifact 作為唯一的組織信任鏈", "subtitle": "版本控制產物如何貫穿全生命週期，消除資訊偏差？", "takeaway": "每個階段都以向 Git 提交一個確定性的 Artifact 為終點，下個階段以讀取該 Artifact 為起點。", "details": ["<strong>唯一信任源 (Single Source of Truth)</strong>：不再依賴個人口頭承諾或 Jira 隨意備註，所有決策、規格、代碼與日誌全數持久化於版本控制庫中。", "<strong>產物的承先啟後鏈條</strong>：intent.md 啟動 spec.md 設計，spec.md 啟動 plan.md，批准的 plan.md 產出 Diff 與 Tests，PR 合併觸發管線發布。", "<strong>客觀中立的協同媒介</strong>：Markdown 檔案是人與 Agent 都能毫無歧義精準理解的結構化數據，消除人機間的解讀鴻溝。"], "metaphor": "如同古代建造長城或金字塔時，每塊巨石都刻有採石場名、石匠印章與驗收官印記，所有產物環環相扣，共同構成堅不可摧的信任城牆。", "layout": "鏈條式架構圖：一個個代表 Artifact 的 Git 提交節點緊密相扣，展示前後階段的輸入輸出相依性。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 4, "title": "為什麼 Markdown 是人機協同的最佳媒介？", "subtitle": "簡潔、純文字、結構化與版本控制原生相容的黃金格式", "takeaway": "在 SDLC 早期階段，.md 檔案之所以佔據統治地位，是因為產品負責人與 Agent 能共同讀寫同一個檔案。", "details": ["<strong>人類極致可讀性</strong>：業務人員、產品經理不需要懂得複雜的 JSON Schema 或 AST 語法樹，直接使用乾淨的標題、列表與段落表達思維。", "<strong>LLM 天生友好的結構</strong>：Markdown 的階層標題（#、##）與前置元數據（YAML frontmatter）是現代大語言模型理解度最高的組織格式。", "<strong>Git 差異比對的原生優勢</strong>：純文字格式讓每一次修改都能產生清晰乾淨的 Git Diff，審批者能一眼洞悉修改細節，完全契合審計訴求。"], "metaphor": "Markdown 就像是聯合國會議上的『世界通用語 (Esperanto)』，人類外交官和 AI 同聲傳譯員都能講得極其流暢，絕不產生語言隔閡與歧義。", "layout": "雙向箭頭圖：左側為人類 PO 編輯 Markdown，右側為 Claude 解析與生成 Markdown，中央為 Git 歷史記錄徽章。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 5, "title": "六大階段產物全景：從 intent.md 到 incident record", "subtitle": "貫穿整個研發週期的法定 Artifact 清單", "takeaway": "從 Build 階段以前是 .md 文檔，從 Build 階段以後是 Code、Tests 與自動化日誌，鏈條不可斷裂。", "details": ["<strong>Stage 1 (Plan) & Stage 2 (Design)</strong>：`intent.md`（原始意圖與邊界 proto-spec）→ `spec.md`（技術規格與爭議點，結合 Claude Design 原型）。", "<strong>Stage 3 (Build) & Stage 4 (Test)</strong>：`plan.md`（執行檔案清單、先後序與驗證證明）+ 代碼 Diff → 回歸測試套件（Tests）+ CI Continuous Evals 結果報告。", "<strong>Stage 5 (Deploy) & Stage 6 (Maintain)</strong>：帶有 `REVIEW.md` 審核結果的 PR + 具名發布審批標籤 → `bands.yaml` 監控記錄 + 事件診斷與修復 `intent.md`。"], "metaphor": "這就像一顆種子經歷發芽（intent）、長出枝葉（spec）、開出花苞（plan/code）、結成果實（deploy），最終落葉歸根滋養泥土（maintain）的完整生命循環。", "layout": "6 階段矩陣清單，每階段展示產物名稱、檔案類型、主要責任人與下游觸發動作。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 6, "title": "人類角色的深刻轉型：從操作員到仲裁者", "subtitle": "人的注意力從『打字產出』轉移至『門禁審批與價值判斷』", "takeaway": "工程師不再需要為每一行括號或語法勞神費力，而是將寶貴的智力資源投入到架構邊界與關鍵放行裁決上。", "details": ["<strong>人類對所有需要判斷力的決策負全責</strong>：Agent 負責生成與推演，但最終承擔商業後果與倫理責任的永遠是具名的人類工程師。", "<strong>集中專注於門禁 (Concentrate at the Gates)</strong>：審閱 Agent 標註出的矛盾爭議（Flagged concerns），而非從零起草每一份文檔或代碼。", "<strong>從代碼匠人晉升為系統指揮官</strong>：工程師的職責轉型為制定規格、編寫 Skills 規則、配置 Hooks 防線，並調度多個 Agent 並行作戰。"], "metaphor": "這就像從前需要親自下地揮舞鐮刀收割麥子的農夫，升級為駕駛配備 GPS 定位與自動收割脫粒的一體化現代農業旗艦機的農場總指揮。", "layout": "角色轉型天平圖：左側展示『手工編碼 80% + 思考 20%』的舊常態，右側展示『架構裁決 80% + 門禁把關 20%』的 AI-Native 狀態。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 7, "title": "審計鏈條與 Git History 的完美共生", "subtitle": "誰提需求、Agent 產出什麼、誰批准上線——完全留痕", "takeaway": "將研發活動的所有 Artifact 納入版本控制，直接天然滿足了最嚴苛金融與國防級別的法規審計要求。", "details": ["<strong>不可篡改的法定紀錄</strong>：每一次文件的演進都有具名的 Git Commit，包含作者、時間戳與精確差異，徹底消除責任推諉空間。", "<strong>誰提出了什麼需求</strong>：intent.md 記錄了原始業務提議者與業務動機；spec.md 記錄了產品主管對規格的修改與簽核。", "<strong>誰批准了代碼與發布</strong>：PR Review 執行記錄了 Agent 審核結果與 Code Owner 的具名批准，部署門禁記錄了 Release Manager 的授權憑證。"], "metaphor": "這就像法律契約公證制度：每一次交易、條款修訂與簽字畫押都被刻在花崗岩石碑上，任何公證人與審計員都能在數秒內調出完整歷史檔案。", "layout": "Git Commit 視覺化樹狀圖，節點旁標註對應的業務事件與簽署人權限標籤。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 8, "title": "模組化落地路徑：無需一次到位，分步穩健實踐", "subtitle": "組織可根據自身痛點，優先選擇收益最高的模組切入", "takeaway": "Playbook 中的每個 Play 都是模組化設計的，團隊可以根據自身的瓶頸狀況靈活排序導入順序。", "details": ["<strong>瓶頸在編碼品質？</strong>：優先引入 Stage 3 的 Plan Mode 與 CLAUDE.md，立即規範 Agent 的行為習慣。", "<strong>瓶頸在代碼審查塞車？</strong>：優先在 Stage 5 導入 REVIEW.md 與 @claude 自動修復循環，立刻分流 70% 的低級審查負擔。", "<strong>瓶頸在安全與合規恐慌？</strong>：優先在 Stage 3/5 部署確定性的 PreToolUse Hooks 與生產發布門禁腳本，建立堅定信心。"], "metaphor": "就像搭建樂高積木城堡，你可以先搭建防禦城牆（Hooks），也可以先拼裝起重吊車（Claude Code），每個模組都能獨立運作並持續發揮局部價值。", "layout": "三條自選起步路徑圖：速度導向路線、品質導向路線與安全合規導向路線的推進對照。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 9, "title": "前置相依圖 (Prerequisites) 與推進順序解析", "subtitle": "理解技術機制之間的階梯關係，少走彎路", "takeaway": "某些高階自動化機制的運轉，依賴於前置基礎規範的成熟鋪墊。", "details": ["<strong>Auto Mode 依賴健全的防護網</strong>：唯有當 CLAUDE.md、Skills、Hooks 與高覆蓋率測試準備就緒，才能放手讓 Agent 自主套用修改。", "<strong>Closing the Loop 依賴預演過的回滾與 Evals</strong>：生產自愈不能冒險，唯有在 Stage 4/5 驗證了自動測試與一鍵 Rollback 後才能在 Stage 6 放權。", "<strong>循序漸進的自動化階梯</strong>：先手動 Prompt 每一階段，待格式穩定後寫成 Slash Command，最後串聯成 CI/CD 觸發的自動管線。"], "metaphor": "這就像學開飛機：必須先在模擬器中掌握儀表板操作（CLAUDE.md/Plan Mode），通過地面考核後（Hooks/Tests），才能獲准開啟高空自動巡航（Auto Mode）。", "layout": "DAG 有向無環圖：展示各技術機制之間的嚴格相依性與解鎖條件。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 10, "title": "自主閉環自愈：當生產異常反向重啟生命週期", "subtitle": "從監控指標偏離到自動拉起 intent.md 的自適應進化", "takeaway": "當系統在生產環境監測到異常，確定性腳本將直接產出診斷報告並提交 intent.md，自動重啟下一輪優化流程。", "details": ["<strong>確定性監控觸發</strong>：由非模型的數學統計腳本（如 Western Electric 規則）監測 CI 失敗率或 API 錯誤率，排除 AI 主觀幻覺。", "<strong>診斷意圖自動化生成</strong>：指標突破控制帶時，Agent 被唯讀喚醒，分析日誌並自動撰寫包含證據與建議的 intent.md。", "<strong>無人值守但透明留痕</strong>：這份自動產生的修復意圖匯入 Stage 1 意圖庫，由值班負責人裁決放行，隨後自動流經 Design、Build 與 Test。"], "metaphor": "就像人體的免疫系統：一旦白血球探測到外來細菌入侵（指標異常），立即自動合成抗體並調動防禦細胞（觸發 intent.md 自愈），無需大腦主動下達指令。", "layout": "閉環銜接圖：展示 Stage 6 Maintain 的異常信號跨越時空直接注入 Stage 1 Plan 的循環脈絡。"}, {"chapter_id": 2, "chapter_name": "第 2 章：什麼是 AI 原生 SDLC？閉環迴圈哲學", "page_num": 11, "title": "第二章實戰總結：以產物為中心的自治研發流水線", "subtitle": "確立全團隊對 AI-Native SDLC 的底層共識", "takeaway": "當所有階段都以標準化 Artifact 交互，並由確定性門禁保護時，軟體工程將迎來十倍效能的真正釋放。", "details": ["<strong>核心公式</strong>：AI 原生 SDLC = 嚴格控制目標 + 自動化強制執行 + Committed Artifact 信任鏈 + 事件閉環。", "<strong>文化變革</strong>：從『防範 AI 犯錯而處處設卡』轉變為『用系統架構為 AI 劃定安全邊界，放手讓其全速奔馳』。", "<strong>即刻啟程</strong>：下一章我們將深入 Stage 1: Plan，探索如何將最模糊的想法打磨為堅實的 intent.md！"], "metaphor": "我們不再是守在河邊用小網打撈游魚的漁夫，而是建立了一座包含智慧濾網、分流渠道與自動增氧的現代化生態漁業基地。", "layout": "架構核心公式卡片，搭配指向 Stage 1 Plan 的引導指示。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 1, "title": "為什麼軟體起點不再是 PRD？傳統需求的低效痛點", "subtitle": "傳統產品需求文檔動輒數十頁，往往耗時數週且充滿資訊失真", "takeaway": "在代碼不再是瓶頸的世界裡，等待產品經理撰寫厚重 PRD 成為阻礙業務創新的最大堵點。", "details": ["<strong>撰寫門檻極高</strong>：業務線人員（如理賠員、客服主管）有了極佳改善點子，卻因不會寫技術 PRD，必須求助產品經理幫忙排期代筆。", "<strong>溝通鏈條層層損耗</strong>：業務講給 PM 聽，PM 轉述給架構師，架構師轉給工程師，原始業務痛點在漫長的會議拋接中嚴重失真。", "<strong>過時風險巨大</strong>：花了一個月寫完的 50 頁 PRD，常常在上線前市場環境早已改變，導致大量文件沉澱為無用垃圾。"], "metaphor": "就像一位前線偵察兵發現了敵方碉堡（業務痛點），但他不能直接呼叫無人機打擊，必須徒步回營總部向參謀官口述，等待參謀官花三天畫成作戰圖紙。", "layout": "對比圖：傳統 PRD 耗時 2~4 週 vs AI 原生意圖捕獲耗時 15 分鐘的鮮明對照。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 2, "title": "意圖的多元入口：人腦靈光、工單與生產警報", "subtitle": "任何業務需求與技術故障，皆可標準化匯入同一意圖源頭", "takeaway": "intent.md 不僅源於人類產品規劃，也可源於客服工單甚至生產環境的監控告警，實現萬流歸宗。", "details": ["<strong>入口一：人類業務創意 (Human Idea)</strong>：第一線員工在日常工作中產生的功能想法或自動化建議。", "<strong>入口二：客服與工單反饋 (Tickets & Issues)</strong>：使用者在支援系統中積累的高頻投訴或故障回報。", "<strong>入口三：生產異常警報 (Incident Alerts)</strong>：由 Stage 6 監控系統偵測到指標偏離時，自動產生的修復診斷需求。"], "metaphor": "這就像一座現代化智慧水庫的集水系統：無論是天降暴雨（人腦突發靈感）、山間溪流（使用者工單），還是地下湧泉（系統故障告警），全部匯入同一個蓄水池集中調度。", "layout": "三條匯流箭頭指向中央的 intent.md 核心圖標，標註多元入口統一標準化的特質。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 3, "title": "非技術人員的福音：用最樸素的自然語言對話", "subtitle": "無需具備技術背景，只要能把痛點講清楚，就能啟動研發", "takeaway": "發起者只需用日常語言向 Claude 描述今天無法做什麼、誰受到影響、更好的狀態是什麼。", "details": ["<strong>零格式壓力</strong>：不需要知道什麼是 REST API、資料庫表結構或微服務架構，用大白話描述現狀與痛點即可。", "<strong>隨心所欲的非結構化輸入</strong>：哪怕是一段語音轉文字、幾張雜亂的截圖或幾條聊天記錄，Claude 都能迅速理解並整理脈絡。", "<strong>消除跨職能溝通壁壘</strong>：業務專家能夠專注於業務實質問題本身，而不被技術黑話或文檔格式規範所綁架。"], "metaphor": "就像走進一家頂級私人西服訂製店，你不需要懂得如何剪裁打版，只要告訴裁縫你打算穿去參加什麼場合、希望感覺如何舒適，大師便能為你量身繪製草圖。", "layout": "左側為非技術人員的口語表達對話框，右側為 Claude 整理出的結構化思考導圖。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 4, "title": "如頂級諮詢分析師般的詰問：釐清範疇與指標", "subtitle": "Claude 主動發問，逼出模糊隱含的業務邊界與成功定義", "takeaway": "Claude 不只是單純記錄，而是扮演經驗豐富的麥肯錫分析師，主動探討範疇、目標受眾、約束與成功衡量標準。", "details": ["<strong>深度邊界詰問</strong>：『這個功能是否需要支援第三方人員訪問？』『如果外部系統當機，最長容忍延遲是多久？』", "<strong>探討非功能性約束</strong>：主動確認機密敏感資料 (PII) 規範、現有身份認證機制與相容性限制。", "<strong>確立可量化成果</strong>：將原本抽象的『希望能快一點』具體化為『在門戶網站顯示即時狀態與預計完成日期』。"], "metaphor": "就像蘇格拉底式的智慧詰問：導師不直接給答案，而是透過連續而犀利的反問，引導學生自己發現原本思維中的盲區與矛盾，將模糊直覺轉化為嚴謹定義。", "layout": "雙人對話剖析圖，展示 Claude 提出的四維度詰問矩陣：範疇 (Scope)、用戶 (Users)、約束 (Constraints)、指標 (Success)。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 5, "title": "提煉為標準 Proto-spec：intent.md 骨架拆解", "subtitle": "Anthropic 官方規範架構：精簡、標準且直接可被機器解析", "takeaway": "提煉後的 intent.md 包含五大核心段落：Problem、Proposed outcome、Affected users/systems、Constraints 與 Open questions。", "details": ["<strong>Problem（核心問題）</strong>：精確指出目前的痛點與量化損失（如：客服人員 1/3 時間耗費在查詢狀態）。", "<strong>Proposed outcome（預期產出）</strong>：清晰描述功能完成後的用戶體驗（如：門戶直觀呈現進度與預估日期）。", "<strong>Affected users and systems（影響範圍）</strong>：列出涉及的業務角色（理賠員）與技術系統（Portal、Claims-Core API）。", "<strong>Constraints（邊界約束）</strong>：嚴格限制如禁止引入新 PII、沿用現有驗證等。", "<strong>Open questions（開放問題）</strong>：標註尚待決策的爭議盲點，交由下階段仲裁。"], "metaphor": "這就像醫院的『急診分診病歷卡』：無論病人進來時多麼混亂，護士必定迅速量化血壓、體溫、病徵、過敏史與待檢查項目，一張卡片讓全體醫生秒懂狀況。", "layout": "標準 intent.md 卡片結構解析圖，各段落以鮮明邊框標註作用與價值。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 6, "title": "官方實戰範例：理賠狀態自助查詢", "subtitle": "從一通電話到標準 intent.md 的真實落地蛻變", "takeaway": "幾句看似尋常的業務痛點，透過 Claude 整理後成為結構工整、無懈可擊的 Proto-spec。", "details": ["```markdown\n# Intent: claims status self-service\nAuthor: J. Ortiz (claims operations). Status: draft.\n\n## Problem\nCustomers phone the contact center to ask where their claim is.\nHandlers spend roughly a third of call time on status-only queries.\n\n## Proposed outcome\nCustomers see claim status, next step and expected date in the portal.\n\n## Affected users and systems\nClaims handlers, portal team, claims-core API.\n\n## Constraints\nNo new PII in the portal session. Existing authentication only.\n\n## Open questions\nDo third-party loss adjusters need access too?\n```", "<strong>高度精煉性</strong>：不寫廢話，全篇控制在 20 行內，任何人都能在一分鐘內徹底理解業務脈絡。", "<strong>作者與狀態明確標記</strong>：作者具名，初始狀態設為 draft，為後續 Git 審查奠定基礎。"], "metaphor": "宛如一份精準的『外科手術意圖確認書』：主刀醫生看一眼便知病灶所在、手術目標、預期切除範圍與不可碰觸的神經血管約束。", "layout": "代碼高亮區塊展示 Anthropic 原文 intent.md 範例，並於右側附帶名詞解析註解。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 7, "title": "約束條件與開放問題 (Open Questions) 的價值", "subtitle": "及早暴露未知，遠勝於在最後一刻痛苦重構", "takeaway": "允許甚至鼓勵在 intent.md 中列出『未解問題』，避免了傳統團隊假裝一切明確、實則埋雷的壞習慣。", "details": ["<strong>誠實面對不確定性</strong>：例如『第三方公證人是否需要訪問權？』這個問題業務人員當下可能拿不準，直接列出能避免工程師做錯誤假設。", "<strong>引導 Stage 2 規格深化</strong>：在第二階段，架構師或產品負責人的首要任務就是協同法規與安全專家逐一攻克這些開放問題。", "<strong>明確約束降低試錯成本</strong>：事前鎖定『禁止引入新 PII』，直接在第一道防線阻止了可能引發 GDPR 違規的設計缺陷。"], "metaphor": "這就像在施工圖紙上用醒目的黃色三角警示牌標註『此處地下可能有未標註的古老自來水管，挖掘前必須會同水務局探勘』，杜絕挖斷水管引發水淹工地的慘劇。", "layout": "黃色警示卡片突出 Open Questions，展示其如何被自動傳遞至 Stage 2 進行政策裁決。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 8, "title": "意圖中心倉庫 (Intent Home) 的建置與權限", "subtitle": "平台團隊的一次性工作：為全體員工打造思想孵化基座", "takeaway": "建立一個專門存放 intent.md 的中心代碼庫，讓全公司非技術人員都能安全、無阻地發起軟體意圖。", "details": ["<strong>一次性基礎設施搭建</strong>：工程或平台團隊建立集中式的 Git 倉庫（如 github.com/org/intents），配置目錄結構與權限組。", "<strong>廣泛的發起權限 (Broad Write Access)</strong>：讓各業務線、運維線的同仁都具備提交權限，釋放全員創新熱情。", "<strong>模組化範本注入</strong>：平台團隊將 intent 規範定義為組織級 Skill，任何人在啟動 Claude 時都會自動套用標準模板。"], "metaphor": "就像在公司大廳設立一個『智慧市政建議箱與孵化器』，每位員工都能投遞規範化的建議卡片，後台系統自動為每張卡片建立數位流水號與追蹤系統。", "layout": "系統架構拓撲圖：展示來自不同業務部門的意圖流，如何被引流並彙整至唯一的 Intent Home 倉庫。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 9, "title": "免 Git 體驗：VCS 連接器代為提交", "subtitle": "讓不熟悉 Git 的業務人員，也能透過 Claude.ai 寫入版本控制", "takeaway": "利用 GitHub/GitLab 連接器，非技術人員在聊天視窗中確認無誤後，Claude 自動代其在背景完成 Git Commit。", "details": ["<strong>消除 Git 命令列認知負擔</strong>：業務人員不需要安裝 git、配置 ssh-key、學習 branch、add、commit 與 push 等技術細節。", "<strong>網頁端與 Cowork 無縫整合</strong>：直接在 Claude.ai 網頁端或 Cowork 介面點擊確認，底層連接器自動建立分支並發起 PR 或提交。", "<strong>保留完整的身分憑證</strong>：即使由 Agent 代提，提交中依然明確記錄原始人類發起者的作者資訊與時間戳，保證審計鏈條不可篡改。"], "metaphor": "就像你寄掛號信不需要親自走進郵政分揀中心去操作傳送帶與蓋戳機，你只要在櫃台把信交給專員，系統自動為你貼上條碼、蓋上郵戳並送上貨運班機。", "layout": "雙層架構圖：上層為友善的 Claude 網頁對話介面，下層為底層 VCS Connector 自動執行的 Git Commit 流水線。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 10, "title": "治理與審計落實：產品負責人的審批門禁", "subtitle": "intent.md 提交非終點，PO 的審查與合併才是真正通行證", "takeaway": "意圖的接受或拒絕決定，由產品負責人在審查合併中具名記錄，這正是邁向 Stage 2 的觸發器。", "details": ["<strong>客觀嚴格的意圖過濾</strong>：產品負責人 (PO) 評估該意圖是否符合當前季度的商業優先級與技術路線圖。", "<strong>及時修正與補充</strong>：如果發起者的描述存在偏誤，PO 可以在 PR 討論串中直接給予反饋，或讓 Claude 重新調整內容。", "<strong>自動觸發下一階段</strong>：一旦 PO 批准並合併 intent.md，Webhook 自動觸發後續的 Stage 2 規格工程作業，無需人工催促。"], "metaphor": "如同專利審查局的專利審查官：發明人提交了專利草案（intent.md），審查官認真覆核其創新性與合規性後，鄭重蓋上『准予立案』的鋼印，正式啟動後續流程。", "layout": "審核門禁流程圖：展示 Draft intent.md → PO 審查 → [駁回/修改/批准] → Merge 觸發 Stage 2 的完整生命週期。"}, {"chapter_id": 3, "chapter_name": "第 3 章：Stage 1: Plan — 意圖捕獲與 intent.md", "page_num": 11, "title": "第三章實戰總結：讓任何有價值想法零阻力立案", "subtitle": "Stage 1 Plan 核心收穫與最佳實務清單", "takeaway": "建立清晰、規範、低摩擦的意圖捕獲體系，是徹底解放企業被壓抑創新潛力的第一步。", "details": ["<strong>實踐清單一</strong>：立刻為團隊建立一個共享的 intent 倉庫，並發布標準 template skill。", "<strong>實踐清單二</strong>：鼓勵第一線業務同仁透過對話形式梳理痛點，善用分析師詰問逼出邊界約束。", "<strong>實踐清單三</strong>：在第四章中，我們將見證這些被批准的 intent.md，如何結合企業 Skills，自動昇華為具備深層架構規範的 spec.md！"], "metaphor": "每一項偉大的工程都始於一張小小的素描草圖；Stage 1 賦予了組織內每個人親手繪製這張草圖的能力，並用現代化工裝體系將其精確送入生產線。", "layout": "三條核心守則總結卡片，底部搭配通往 Stage 2 Design 的高亮箭頭。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 1, "title": "從 intent.md 到 spec.md：架構設計的自動化跨越", "subtitle": "將粗糙的商業意圖，轉化為工程團隊可直接施工的嚴謹藍圖", "takeaway": "產品負責人不再需要一行行痛苦地編寫規格書，而是讓 Claude 讀取已批准的 intent.md 並自動產出 spec.md。", "details": ["<strong>意圖與規格的本質鴻溝</strong>：intent.md 講述『為什麼要解決、目標是什麼』；spec.md 必須闡明『如何與現有代碼整合、架構邊界在哪』。", "<strong>自動化跨越的推動力</strong>：Claude 深入分析代碼庫現狀，結合業務約束，自動生成涵蓋 API 定義、狀態流轉與資料流的完整規格。", "<strong>徹底釋放產品經理精力</strong>：PO 的核心任務從『鍵盤打字撰寫者』轉型為『高階規格審核員與衝突協調者』。"], "metaphor": "這就像從業主的『室內裝潢願望清單』（想要寬敞客廳與現代極簡風），自動轉化為包含承重牆標註、水電走線路徑與消防規格的『施工級工程建築圖』。", "layout": "轉化圖示：左側為 20 行簡約的 intent.md，穿過中央的 Claude 轉化引擎，右側噴湧出長達數頁的專業架構 spec.md。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 2, "title": "拒絕白紙一張：讓企業 Skills 全程引領規格生成", "subtitle": "如果沒有約束，AI 生成的規格只是一紙無法落地的空中樓閣", "takeaway": "規格生成絕非盲目提問，必須在 Prompt 中明確掛載組織的各項 Skills，確保設計與企業標準天然契合。", "details": ["<strong>無約束生成的災難</strong>：未加約束的 LLM 可能會隨意設計出不符合公司技術棧的協定（例如公司用 gRPC，AI 卻設計出 GraphQL）。", "<strong>Skills 作為規格護欄</strong>：將企業的技術標準、API 規範、登入授權機制封裝為 Skills，在生成階段直接對 Claude 進行嚴格約束。", "<strong>事前合規 (Compliance-by-Design)</strong>：規範不再是上線前安全評審時的絆腳石，而是在繪製規格草圖的第一天就內化於骨髓之中。"], "metaphor": "就像在電腦輔助設計軟體 (CAD) 中預先載入了國家建築防震法規與標準型鋼零件庫，工程師畫出的每一根樑柱，系統都自動校驗其承重與合規性。", "layout": "約束注入圖：中央為正在生成的 spec.md，上方注入 Brand/Security/UX 等多個 Skill 模組，下方展示產出的高合規規格。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 3, "title": "注入四大支柱：品牌、資安、合規與 UX 標竿", "subtitle": "多維度企業制度資產在設計階段的全面融合", "takeaway": "一份合格的 spec.md 必須同時經受品牌準則、資安條例、法規合規與用戶體驗四重標準的嚴格淬煉。", "details": ["<strong>品牌準則 (Brand Guidelines)</strong>：元件色彩體系、字體排版層次、按鈕交互動效與企業專屬語調風格。", "<strong>資安條例 (Security Policies)</strong>：無匿名訪問、API 必須經過 Gateway JWT 驗證、敏感資訊嚴格脫敏。", "<strong>合規要求 (Compliance & Governance)</strong>：審計日誌全量採集、符合 GDPR/HIPAA 等資料主權規範。", "<strong>UX 標竿 (UX Standards)</strong>：響應式介面支援、無障礙訪問標準 (a11y) 與高頻異常提示友好度。"], "metaphor": "如同製造一輛現代化汽車，底盤設計（架構）必須同時滿足歐盟五星防撞標準（安全）、歐盟六期排放（合規）、品牌家族水箱罩外觀（品牌）與人體工學座椅舒適度（UX）。", "layout": "四象限盾牌圖：中央為 spec.md 核心，四角分別排列 Brand、Security、Compliance、UX 四大標誌徽章。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 4, "title": "標註爭議點 (Flagged Concerns)：及早暴露政策衝突", "subtitle": "不可調和的矛盾絕不暗箱掩蓋，主動向上呈報給主管裁決", "takeaway": "Claude 在編寫 spec.md 時，必須主動列出所有相互抵觸的政策要求，這正是傳統分析師最寶貴的升級職能。", "details": ["<strong>政策衝突的真實存在</strong>：例如『業務希望在入口頁面展示理賠進度詳情』 vs 『安全政策禁止在未經二次身分驗證下暴露個人醫療敏感資訊』。", "<strong>拒絕 AI 自作主張的妥協</strong>：如果 Agent 暗中隨意偏向某一方，上線後必將引發重大爭端；正確作法是明確標註為 Flagged Concerns。", "<strong>呈交負責人仲裁</strong>：PO 在工程團隊看到文檔前，優先專注於調解這些標註的矛盾點，與法規及資安主管達成權衡共識。"], "metaphor": "這就像在法庭上，助手律師主動向首席大律師遞交紅筆標註的條款：『這兩條法律判例存在司法解釋衝突，我們必須在庭審前確定優先順序！』", "layout": "衝突標註卡片：以顯眼的紅色引號展示矛盾政策，下方標註箭頭指向政策主管仲裁按鈕。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 5, "title": "產品負責人的全新職責：從撰寫者轉型為協調者", "subtitle": "專注於價值判斷與人際跨部門共識達成", "takeaway": "PO 的注意力從逐字排版中解放出來，全面聚焦於回答開放問題與推動爭議點的最終決策。", "details": ["<strong>逐條檢視業務意圖落實</strong>：spec.md 是否真正解決了 intent.md 中指出的理賠員話務負擔？預期收益是否清晰？", "<strong>閉合意圖中的 Open Questions</strong>：帶領團隊落實『第三方公證人是否需要訪問』，確認權限矩陣與資料隔離方案。", "<strong>跨部門利益對齊</strong>：與風控主管、合規主管在會議室中拍板安全爭議點，將裁決結論白紙黑字寫入 spec.md 的簽核歷史中。"], "metaphor": "就像交響樂團指揮家：他自己不需要同時演奏小提琴、長笛與大提琴，他的價值在於調整各樂器部的平衡，化解刺耳的節奏衝突，引領全曲和諧高潮。", "layout": "職責轉型環狀圖：展示 PO 將 80% 時間投入在『爭議調解、跨部門溝通、業務指標審批』的高價值活動上。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 6, "title": "視覺與前端實戰：Claude Design 快速原型迭代", "subtitle": "從 intent.md 到像素級可互動介面設計的無縫演進", "takeaway": "前端工作是 AI-Native SDLC 最直觀的突破點：PO 可藉由 Claude Design 直接從 intent.md 生成互動原型並持續迭代。", "details": ["<strong>直觀視覺化回饋</strong>：將『展示理賠狀態與預估日期』一鍵轉化為完整的 Web/Mobile UI 原型畫面，包含顏色、字體與間距。", "<strong>口語化即時微調</strong>：『把進度條改成四階段時間軸』『加一個聯絡理賠員的折疊抽屜』，介面在數秒內實時響應刷新。", "<strong>消除設計與代碼的鴻溝</strong>：原型不再是 Figma 裡冷冰冰的靜態畫布，而是具備真實 DOM 結構、可直接導出工程代碼的動態原型。"], "metaphor": "就像走進好萊塢特效攝影棚，導演對著虛擬攝影機說：『把背景燈光調暗一點，主角左側加一扇落地窗』，畫面立刻在螢幕上即時渲染成型。", "layout": "雙聯預覽圖：左側展示自然語言對話框，右側展示 Claude Design 即時生成的理賠狀態查詢前端介面。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 7, "title": "原型導出至 Claude Code：從像素草圖到工程規格", "subtitle": "打通設計與實作的最後一哩路，終結切圖時代", "takeaway": "在 Claude Design 中驗收完成的原型，可無損導出至 Claude Code，作為 Stage 3 編碼的直接依據與測試基準。", "details": ["<strong>自動萃取前端元件結構</strong>：導出乾淨的 React/Vue 元件樹、Tailwind CSS 樣式與 TypeScript 介面定義。", "<strong>雙重佐證規格 (Visual Proof)</strong>：將原型截圖與佈局規格納入 spec.md，工程師和 Agent 都不會對界面長相產生任何誤讀。", "<strong>後續自動化比對基石</strong>：該導出原型將在 Stage 4 (Test) 中作為視覺迴圈的基準圖（Baseline Mock），驅動截圖差異自動比對。"], "metaphor": "這就像從 3D 虛擬黏土模型，一鍵轉換成可以直接輸入五軸 CNC 數控車床的精密切削代碼，完全不需要中間繪圖員重新手工描圖製版。", "layout": "數據流動箭頭：Claude Design 原型 → 導出組件代碼與 Mock 截圖 → 注入 spec.md 交付 Claude Code。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 8, "title": "官方標準 Prompt 深度拆解與 Slash Command", "subtitle": "Anthropic 團隊沉澱的黃金提示詞範式", "takeaway": "掌握觸發規格生成的標準 Prompt 結構，並將其封裝為組織級斜線指令，實現全團隊的一致性調用。", "details": ["```\nRead the attached intent.md and produce a requirements and design spec\nfor integrating it into our existing codebase. Apply the skills available\nto you so the plan conforms to our brand guidelines, security policies and UX standards.\nDocument the spec fully as spec.md, ready to hand to the engineering team.\nDescribe clearly any areas of concern, especially where you cannot satisfy\ncontradicting policies.\n```", "<strong>四個核心指令要素</strong>：指定輸入目標 (intent.md)、指明整合代碼庫語境、強制套用 Skills 約束、明確要求標註爭議點。", "<strong>自訂斜線指令 (Slash Command)</strong>：在團隊中固化為 `/spec` 指令，任何成員只需鍵入 `/spec` 即可自動發起規格 Pass。"], "metaphor": "這就像工業標準化作業程序 (SOP) 中的『特級點火口令』，語法經過無數次實戰測試與壓力校驗，能穩定激發出模型最卓越的工程分析力。", "layout": "Prompt 結構拆解卡片：以高亮顏色標註『輸入源、語境邊界、約束引用、爭議回報』四大模組。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 9, "title": "自動化觸發流水線：intent.md 合併觸發規格 Pass", "subtitle": "告別手動開會催促進度，邁向事件驅動的流水線作業", "takeaway": "當 intent.md 在主幹被 PO 批准合併時，CI/CD 自動啟動非互動式作業，載入組織 Skills 並自動提交 spec.md PR。", "details": ["<strong>無人值守自動銜接</strong>：利用 Webhook 監聽 intents/ 目錄的 PR 合併事件，一旦合併立即在背景喚醒 Claude 進行分析。", "<strong>全自動提交規格 PR</strong>：Claude 產出 spec.md 後自動建立新分支並發起 PR，同時在 PR 描述中清晰標列出所有待決策的爭議點。", "<strong>PO 的第一時間介入</strong>：產品主管不再需要手動點擊任何工具，其介入的第一個時間節點就是打開這個已經備妥的規格 PR 進行覆核！"], "metaphor": "如同工廠傳送帶：工長剛在上一工位蓋下合格章（Merge intent.md），機械手臂立刻將半成品自動抓取傳送至下一個精密加工機台，無縫開工。", "layout": "CI/CD 事件時序圖：Git Merge intent.md → Webhook 喚醒 Worker → 執行 Claude Pass → 提交 spec.md PR。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 10, "title": "規格治理與風險簽核：技術專家的裁決防線", "subtitle": "針對高風險變更的雙人簽章制 (Four-Eyes Principle)", "takeaway": "一般例行規格由 PO 簽核即可；但涉及高風險核心系統時，必須強制引入架構師或安全專家進行聯合簽章。", "details": ["<strong>風險分級判定</strong>：若變更觸及核心金流 (Payment)、身分認證 (Auth) 或重大架構變革，系統自動標記為 Higher Risk。", "<strong>明確記錄審查證據</strong>：生成的 spec.md、使用的 Prompt、引用的 Skills 版本全數與 PR 歷史一同鎖定，形成完整審計軌跡。", "<strong>啟動 Stage 3 的法定開關</strong>：只有當 spec.md 獲得具名授權並合併入版本庫時，Stage 3 的 Plan Mode 才能被獲准啟動。"], "metaphor": "如同火箭發射程序：常規感測器檢測只需一位工程師打勾，但最後注入低溫推進劑與點火發射，必須由兩位指揮官同時插入並旋轉鑰匙。", "layout": "雙軌審批流程圖：低風險單人批准路線 vs 高風險雙人聯簽路線的清晰決策樹。"}, {"chapter_id": 4, "chapter_name": "第 4 章：Stage 2: Design — 規格工程與 spec.md", "page_num": 11, "title": "第四章實戰總結：在動筆編碼前將架構衝突清零", "subtitle": "Stage 2 Design 核心價值與落地心得", "takeaway": "規格階段的嚴謹程度，直接決定了後續代碼實作的成敗與重構成本。", "details": ["<strong>核心心法</strong>：在純文字 Markdown 階段修改設計，成本是 1；在代碼階段修改是 10；在生產環境修復是 100！", "<strong>制度保障</strong>：Skills 將死板的 Wiki 制度轉化為活生生的 Agent 約束，爭議點的主動暴露避免了上線後的致命扯皮。", "<strong>邁向建置</strong>：下一章我們將進入最激動人心的 Stage 3: Build，探索 Claude Code 如何在 Plan Mode 下啟動縝密的實作推演！"], "metaphor": "在沙盤上多推演三小時，就能在戰場上少流三萬人的鮮血；Stage 2 就是軟體工程的終極數位沙盤推演。", "layout": "三條核心守則總結卡片，底部搭配通往 Stage 3 Build 的躍遷箭頭。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 1, "title": "為什麼 Plan Mode 必須是 Claude Code 的默認起點？", "subtitle": "拒絕盲目敲代碼：頂級工程師的第一動作永遠是架構思考", "takeaway": "未經縝密規劃的代碼生成無異於災難；Plan Mode 強迫 Agent 在敲下任何一行代碼前完成全局推演。", "details": ["<strong>生成式 AI 的致命誘惑</strong>：Agent 寫代碼太快，導致工程師容易沉溺於『直接讓它寫』的快感中，往往在寫了幾百行後才發現走入死胡同。", "<strong>思考先於編碼 (Think before you code)</strong>：真正的技術實力體現在架構分層、邊界判斷、潛在副作用評估與測試覆蓋方案。", "<strong>官方最佳實務起手式</strong>：在啟動 Claude Code 時，始終以 `plan mode` 開局，將 Stage 2 批准的 `spec.md` 餵入，展開深度推演。"], "metaphor": "這就像專業的外科主刀大夫，在走進手術室拿起手術刀前，必須站在燈箱前仔細審查病人的 CT 斷層掃描片，規劃好進刀路徑與避開主動脈的備案。", "layout": "警告與正解對比圖：左側為直接編碼導致的混亂與重構死局，右側為 Plan Mode 引領下的清晰架構樹。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 2, "title": "物理禁止修改檔案的強大安全防護", "subtitle": "Plan 模式下的沙盒鐵律：只能閱讀與思考，絕不改動硬碟", "takeaway": "Plan Mode 在機制底層剝奪了 Agent 編輯檔案的權限，工程師可毫無心理負擔地與其大膽探討最激進的方案。", "details": ["<strong>唯讀沙盒環境</strong>：在該模式下，Claude 具備文件讀取 (Read)、全庫搜尋 (Grep/Glob) 能力，但所有寫入操作 (Edit/Write) 全數被軟硬體鎖定。", "<strong>零污染試錯成本</strong>：你不用擔心 Agent 在探索過程中不小心覆蓋了關鍵配置、刪除了未提交的代碼或弄髒了本地 Git 工作區。", "<strong>構建工程師與 AI 的極致信任</strong>：工程師能完全放鬆警惕，專注於概念辯論與架構可行性評估，把注意力投向方案本質。"], "metaphor": "如同走進核電站的『全真數位模擬控制台』，你可以嘗試把冷卻水閥門關閉或將反應爐功率推至極限，觀察儀表反應，而不會引發哪怕一微米的真實輻射洩漏。", "layout": "安全鎖定圖示：一把巨大的藍色鋼鎖鎖定在硬碟圖標上，上方顯示『唯讀推演中，實體檔案受 100% 絕對保護』。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 3, "title": "互動式深度詰問：讓 Agent 面試工程師", "subtitle": "雙向質詢逼出潛在盲區與未考量的技術邊界", "takeaway": "優秀的 Plan Mode 不是單向輸出清單，而是主動針對架構模糊點對工程師進行嚴格詰問與反向面試。", "details": ["<strong>反向排查架構隱患</strong>：『如果後端 API 在高峰期返回 429 限流，前端 Panel 應該重試幾次？是否有備用快取機制？』", "<strong>挖掘未考量的依賴衝突</strong>：『升級此套件將導致舊版 Auth 模組棄用，我們是就地重構還是先做轉接器相容？』", "<strong>迭代打磨至水晶般透明</strong>：持續與 Claude 往返辯論，直到一個完全沒有參與過對話的新人工程師，僅看計畫就能獨立實作為止。"], "metaphor": "就像一場頂級的博士論文答辯會，答辯委員會教授（Claude）用最刁鑽、最根本的技術問題反覆拷問答辯人（工程師），直到整個理論架構無懈可擊。", "layout": "雙向思維火花碰撞圖：工程師拋出初步想法，Claude 反問潛在漏洞，雙方共同迭代推導出最優方案。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 4, "title": "破壞性推演：最壞情況可能破壞什麼？", "subtitle": "主動探討連鎖反應、高風險步驟與被放棄的備選方案", "takeaway": "主動向 Claude 提問：這項改動最可能搞垮什麼？哪個步驟最危險？你為什麼放棄了其他備選架構？", "details": ["<strong>連鎖破壞分析 (Blast Radius)</strong>：修改共用資料庫欄位或通用工具函式時，追蹤是否有其他十幾個無關微服務依賴它。", "<strong>高危步驟特別標註</strong>：標記出涉及資料庫 Migration、金流交易狀態改變或緩存一致性的高危險工序。", "<strong>記錄『放棄的替代方案』</strong>：記錄為什麼不採用 Redis 快取而選擇記憶體快取？這些被否決的思路是未來排查故障時最無價的背景知識。"], "metaphor": "如同民航客機交付前進行的『極限風洞與斷翼測試』：工程師故意推演雙引擎同時失效、全機斷電的最慘烈狀態下，備用機械滑翔舵是否依然受控。", "layout": "破壞性排查清單：高危步驟紅燈標註、依賴受損範圍黃燈標註、被否決方案灰色歸檔對照。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 5, "title": "plan.md 實戰標準骨架：四大支柱", "subtitle": "Anthropic 官方規範：變更檔案清單、先後順序、風險防範與驗證證明", "takeaway": "一份合格的 plan.md 必須清晰定義：變更檔案、施工順序、系統性風險，以及如何證明代碼正確（Proof）。", "details": ["<strong>Files that change（檔案清單）</strong>：列出所有即將新建、修改或刪除的具體檔案路徑，杜絕越權散彈式修改。", "<strong>Order of work（作業順序）</strong>：分步驟編排任務（例如：先加後端 API → 再寫前端 Panel → 最後掛接導航），層次分明。", "<strong>Risks（風險考量）</strong>：直擊效能瓶頸與外部依賴限制（如外部 API 限流 50 rps）。", "<strong>Proof（驗證證明）</strong>：明確定義何種測試通過、何種截圖匹配才能證明本計畫成功完成。"], "metaphor": "這就是一張極其精確的『軍事作戰行動手冊』：作戰目標地圖（檔案）、推進波次序列表（步驟）、敵方雷區座標（風險）與插旗獲勝的判定標準（證明）。", "layout": "四大區塊結構展示圖，分別以藍、紫、黃、綠四色對應 Files、Order、Risks、Proof。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 6, "title": "官方實戰範例分析：理賠查詢的完整 plan.md", "subtitle": "從 intent 2026-06-02 演進而來的實作架構規劃", "takeaway": "僅用不到 20 行的純文字，就將一個複雜跨端功能的實作步驟與防禦邏輯規範得清清楚楚。", "details": ["```markdown\n# Plan: claims status self-service (from intent.md 2026-06-02)\n\n## Files that change\nportal/src/claims/StatusPanel.tsx (new), claims-api/routes/status.py,\nclaims-api/tests/test_status.py\n\n## Order of work\n1. Add the status endpoint behind existing auth.\n2. Panel against the endpoint.\n3. Wire into the portal nav.\n\n## Risks\nThe claims-core API rate-limits at 50 rps; the panel must cache.\n\n## Proof\ntest_status.py covers the four claim states; screenshot matches the\napproved mock.\n```", "<strong>精確的邊界界定</strong>：明確限定在三個檔案內，任何其他檔案皆不可碰觸。", "<strong>驗證閉環定義</strong>：將『涵蓋四種理賠狀態的單元測試』與『截圖匹配 Stage 2 原型』作為驗收硬指標。"], "metaphor": "宛如一張精簡無比的『阿波羅登月著陸清單』：每個動作只有一行，但每一步都經過了地面控制中心上萬次模擬驗算。", "layout": "代碼區塊完整呈現 plan.md 實例，旁邊附帶高亮圖章標註各段落的審查重點。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 7, "title": "單次通過實作 (Single-pass Implementation) 的奇蹟", "subtitle": "為什麼磨刀不誤砍柴工？縝密計畫下的驚人編碼品質", "takeaway": "有了堅若磐石的 plan.md，當切換回執行模式放行 Claude 編碼時，通常能在『單次通行 (Single-pass)』下完美收官。", "details": ["<strong>告別反覆試錯修復的泥潭</strong>：傳統未經規劃的 AI 編碼往往陷入『寫了錯、錯了改、改了又引入新 Bug』的無限重試深淵，消耗大量 Token。", "<strong>順理成章的流水線組裝</strong>：因為檔案路徑、函式簽名、依賴關係與風險防護早已在 plan 中定義完畢，Agent 只需要專注將邏輯精確填入。", "<strong>工程師心智負擔最小化</strong>：代碼一氣呵成，終端編譯一次通過，單元測試全綠亮起，帶來前所未有的編程暢快感。"], "metaphor": "如同世界上最頂級的精密手錶匠人：他在圖紙上已經將幾百個游絲與齒輪的咬合公差計算至微米級，實際組裝時，每一顆螺絲擰下去都分毫不差，發條一轉立刻精準走時。", "layout": "對比折線圖：展示無計畫模式下漫長震盪的修復循環 vs 有計畫模式下一條直線抵達 100% 綠燈的極速路徑。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 8, "title": "計畫與實作脫節的應對：同步修正原則", "subtitle": "真實編碼遇到意外阻礙時，切記不可讓文檔淪為謊言", "takeaway": "當實際編碼被迫偏離原始計畫時，必須在同一個 Git Commit 中同步更新 plan.md，保持言行合一。", "details": ["<strong>現實工程的突發挑戰</strong>：寫代碼時可能突然發現某個內部庫缺少期待的匯出方法，被迫更換實現手段或額外修改第四個檔案。", "<strong>最可怕的技術債：文檔失真</strong>：如果代碼改了但 plan.md 依然保持原樣，後續審核者將無法判斷這究竟是深思熟慮的變更還是 Agent 暴走。", "<strong>同次提交原子性更新</strong>：將修改後的代碼與同步修訂的 plan.md 捆綁在同一個提交中，並註明偏離原因，維持審計鏈條的絕對真實。"], "metaphor": "就像戰場指揮官根據突發暴雨臨時改變了部隊進軍路線，他必須立刻在作戰沙盤上記錄新的行軍路線，絕不能讓後方大本營繼續看著舊地圖瞎指揮。", "layout": "原子提交示意圖：一個 Git Commit 包裹著 code_diff + updated_plan.md，兩者不可分割。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 9, "title": "使用 Hook 強制保持 plan.md 與 Diff 一致", "subtitle": "用代碼約束代碼：防止 Agent 偷摸修改未報備檔案", "takeaway": "透過本地 Git Hook 或 Claude Hook，在提交時自動比對修改檔案是否完全在 plan.md 申報清單之內。", "details": ["<strong>防範範圍蔓延 (Scope Creep)</strong>：AI Agent 有時會『過於熱心』，順手幫你重構旁邊的工具類或格式化無關檔案，引發潛在回歸風險。", "<strong>自動校驗腳本攔截</strong>：在 pre-commit 或 pre-push 階段運行檢查腳本，提取 git diff --name-only 與 plan.md 的清單交叉比對。", "<strong>越權即阻斷</strong>：一旦發現改動了 plan.md 未提及的檔案，腳本立即返回非零退出碼阻斷提交，強制要求更新計畫或回滾多餘改動。"], "metaphor": "這就像機場行李托運處的雷射安全門：旅客申報托運了三件行李（plan.md），如果過檢時傳送帶上突然冒出了第四個未申報的包裹，警報立刻響起並停機排查。", "layout": "Hook 檢查邏輯流程圖：提取 Git Diff 檔案名 → 比對 plan.md 清單 → [吻合：放行 / 溢出：終止並提示更新計畫]。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 10, "title": "治理考量：文檔階段架構審查的百倍效益", "subtitle": "在文字編輯器裡改航向，代價只是刪除幾行文字", "takeaway": "架構審查前移至 plan.md 批准前完成，例行變更由工程師簽核，重大風險由資深架構師把關。", "details": ["<strong>成本最小化的審查黃金期</strong>：修改一個方案在 plan 階段只需打字溝通 3 分鐘；一旦幾千行代碼成型，重構往往需要數天且伴隨牴觸情緒。", "<strong>合規與架構把關機制</strong>：plan.md 納入版本庫審計，清晰記錄是哪位工程師批准了這項實作方案。", "<strong>為 PR Review (Stage 5) 鋪路</strong>：後續的 AI 程式碼審查機器人，將直接讀取這份 plan.md，逐條核對最終的 Diff 是否誠實履約！"], "metaphor": "就像在蓋摩天大樓時，發現地基設計不合理，在建築師的藍圖上用橡皮擦擦掉重畫只需兩秒鐘；但如果等鋼筋水泥已經澆灌到十層樓高才來改地基，損失將是天文數字。", "layout": "成本對比圖：Plan 階段修改成本 ($) vs 代碼階段修改成本 ($$$$) vs 生產環境修復成本 ($$$$$$$$) 的指數級對比。"}, {"chapter_id": 5, "chapter_name": "第 5 章：Stage 3: Build — Plan Mode 默認啟動", "page_num": 11, "title": "第五章實戰總結：Plan Mode 賦予編碼戰略地圖", "subtitle": "Stage 3 Build 核心基石總結與前瞻", "takeaway": "始終以 Plan Mode 開局，透過破壞性詰問產出嚴謹的 plan.md，為後續的所有自動化建置鋪平道路。", "details": ["<strong>牢記三大金律</strong>：始終開局 Plan Mode、始終審問最壞風險、始終在同一 Commit 同步更新計畫。", "<strong>邁向更高階的自動化</strong>：有了堅固的 plan.md 和防護網，我們就能放心地在下一章解鎖『Auto Mode』與 Git Worktrees 多線並行！"], "metaphor": "Plan Mode 就像是賦予了士兵一張高精度的衛星空照地圖與夜視鏡，讓原本在黑夜中盲目摸索前進的部隊，瞬間轉變為精確打擊的特種部隊。", "layout": "三條核心實踐卡片，底部搭配通往第六章 Auto Mode 的躍遷按鈕。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 1, "title": "告別逐行回車確認：Auto Mode 的誕生背景", "subtitle": "當計畫足夠堅固，逐次按『y』批准已成為最大的時間小偷", "takeaway": "Auto Mode 允許工程師在審批完 plan.md 後，授權 Claude Code 自主套用多步改動，無須每處編輯按次回車。", "details": ["<strong>手動確認的心理摩擦</strong>：看著終端一處處彈出『Do you want to edit foo.ts? (y/n)』，工程師被迫像人肉打樁機一樣機械式敲回車。", "<strong>從『微觀監工』邁向『宏觀驗收』</strong>：當邊界清晰且有測試保護時，逐行確認並不能增加安全性，反而嚴重破壞思考心流。", "<strong>自動應答的底氣所在</strong>：Auto Mode 不是盲目冒險，它的前提是 Stage 2 的緊湊 spec 與 Stage 3 的周密 plan.md。"], "metaphor": "就像在工廠裡，你已經向技術熟練的工匠交代了精準的裝配圖紙，你不需要站在他身後，每當他拿起一把螺絲刀都得向你敬禮請示：『報告長官，我現在可以擰這顆螺絲了嗎？』", "layout": "心理耗損對比圖：左側展示被 50 次 (y/n) 打斷的破碎心流，右側展示 Auto Mode 一氣呵成的順暢生產力曲線。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 2, "title": "Auto-accept 成為默認狀態的成熟度條件", "subtitle": "四重防護網就緒後的安全放權", "takeaway": "唯有當 CLAUDE.md、Skills、Hooks 與本機測試四大護欄成熟時，Auto-accept 才能安全成為日常默認。", "details": ["<strong>條件一：微調好的 CLAUDE.md</strong>：為 Agent 提供清晰的架構約束與避坑指南，避免低級錯誤。", "<strong>條件二：制度化的 Skills</strong>：自動套用組織級的編碼標準與安全規範。", "<strong>條件三：確定性的 Hooks 攔截</strong>：在本地物理阻斷對保護路徑的意外竄改。", "<strong>條件四：完備的自動化測試套件</strong>：Agent 寫完代碼能夠立即自主運行測試驗證綠燈。"], "metaphor": "這就像汽車的『主動防撞與車道偏離輔助系統』：唯有當雷達、攝影鏡頭、ABS 煞車與行車電腦全部通過自檢時，儀表板上的全自動定速巡航燈號才會亮起綠燈。", "layout": "四重護城河雷達圖：展示 CLAUDE.md、Skills、Hooks、Tests 四大支柱如何共同支撐起 Auto Mode 的安全基座。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 3, "title": "小爆炸半徑原則 (Small Blast Radius)", "subtitle": "什麼樣的任務適合全自動？劃定放權邊界", "takeaway": "緊湊的 spec、狹小的破壞半徑、且代碼已被現有測試充分覆蓋的任務，是 Auto Mode 的最佳戰場。", "details": ["<strong>高契合度任務特徵</strong>：修復邊界 Bug、新增純展示型 UI 元件、為現有 API 新增過濾欄位、更新文檔與單元測試。", "<strong>低契合度高危任務</strong>：核心資料庫遷移、跨十個微服務的底層協定變更、涉及千萬級用戶權限體系重構。", "<strong>階梯式授權策略</strong>：依據爆炸半徑動態調整監督等級，常規工作全速奔馳，高危工作收緊至半自動步進。"], "metaphor": "就像在化學實驗室裡：混合兩瓶溫和的食鹽水（小半徑任務），你可以放心交給自動攪拌機運轉；但如果涉及硝酸甘油調配（高危任務），教授必須親自穿上防爆服近距離操作。", "layout": "2x2 決策象限圖：橫軸為爆炸半徑大小，縱軸為測試覆蓋率，右上角標註『Auto Mode 甜點區』。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 4, "title": "人機互動重心的歷史性轉移：事後產物審查", "subtitle": "從盯著終端螢幕看字符跳動，轉向審視長時間自主工作後的完整 Artifact", "takeaway": "工程師的角色從『在線即時監工』徹底升級為『離線交付審查官』，釋放寶貴的即時等待時間。", "details": ["<strong>擺脫終端機凝視</strong>：過去工程師不敢離開螢幕，生怕 Agent 走火入魔；在 Auto Mode 下，你可以放心泡一杯咖啡或切換處理另一項任務。", "<strong>長時間自主對話 (Long Autonomous Sessions)</strong>：Agent 在背景自主進行 20 分鐘的探索、代碼修改、除錯與測試運行。", "<strong>專注於最終產物的綜合驗收</strong>：回來時直接檢視 Git Diff、生成的測試報告與架構一致性證明，評估整體完成度。"], "metaphor": "如同委託資深裝潢師傅粉刷房間，你不需要搬張椅子坐在油漆桶旁邊盯著他每一刷的動作，你只要在下班回來後檢查整面牆是否平整、顏色是否均勻、邊角是否有污漬。", "layout": "時間分配轉移圖：將『盯梢等待時間 70%』成功替換為『非同步專注自身業務 + 10% 集中審閱』的高效模式。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 5, "title": "結合 Git Worktrees 實現個人產能的並行倍增", "subtitle": "一人驅動三條獨立產線：告別多分支頻繁切換的痛苦", "takeaway": "Auto Mode 與 Git Worktrees 是天作之合，允許一個工程師在本地同時掛起多個相互隔離的 Agent 自主任務。", "details": ["<strong>Worktrees 物理目錄隔離</strong>：每個獨立任務擁有自己專屬的實體檔案夾與 Git 分支，徹底解決單一倉庫切換分支編譯鎖定衝突。", "<strong>並行終端窗口驅動</strong>：終端 1 在 `worktree-auth` 開啟 Auto Mode 實作身分模組；終端 2 在 `worktree-cache` 開啟 Auto Mode 修復 Redis 限流。", "<strong>人成為調度樞紐</strong>：工程師在多個工作區之間巡檢，哪邊完成自主實作就驗收哪邊，個人生產力實現非線性幾何暴增。"], "metaphor": "這就像五星級大廚同時管理四個灶台：一號灶慢燉高湯（Worktree A），二號灶烤箱低溫烘烤牛排（Worktree B），三號灶大火翻炒時蔬（Worktree C），大廚只需穿梭調味擺盤。", "layout": "多終端並行拓撲圖：一個工程師大腦同時連接三個獨立的 Git Worktrees，下方標註無衝突的目錄結構。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 6, "title": "Auto Mode 下的安全防禦防護網：無聲守護者", "subtitle": "當放手讓 Agent 奔馳時，底層防線如何確保不脫軌？", "takeaway": "在 Auto Mode 下，Hooks 的確定性防護地位更加凸顯，成為 Agent 無法逾越的物理安全底線。", "details": ["<strong>PreToolUse 實時動態攔截</strong>：即使開啟了 Auto Mode，底層 Hook 依然對每一次 Tool 調用進行微秒級過濾，越權動作即刻彈出紅牌。", "<strong>自適應中斷機制</strong>：如果連續多次測試失敗或進入邏輯死循環，系統自動退出 Auto Mode 並發送通知喚醒人類介入。", "<strong>變更透明可回溯</strong>：所有自動套用的變更在本地都有完整的 Stash 或 commit log，一鍵即可完全還原至乾淨初始態。"], "metaphor": "宛如現代高鐵的 ATP (Automatic Train Protection) 自動列車防護系統：司機可以將列車設定為自動巡航，但一旦經過紅燈區間或超速，ATP 會瞬間強制介入制動停車。", "layout": "安全防禦架構圖：Auto Mode 引擎高速運轉，外圍包裹著 PreToolUse Hooks 實時雷達掃描網與緊急制動閥。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 7, "title": "Stage 6 閉環維運的基石：自主研發工廠的核心動力", "subtitle": "沒有 Auto Mode，完全無人值守的自主修復閉環將無從談起", "takeaway": "Auto-accept 不僅造福個人工程師，更是 Stage 6 實現生產環境監控警報自動修復閉環的底層引擎。", "details": ["<strong>無人值守閉環要求</strong>：當生產環境指標異常觸發自愈管線時，系統無法停下來等待工程師在深夜 3 點按回車批准。", "<strong>全自動端到端推動</strong>：Stage 6 的 Headless Worker 依賴 Auto Mode，在沙盒環境中自動讀取 intent、生成計畫、編寫代碼並提交 PR。", "<strong>門禁轉移至 PR 階段</strong>：所有的自主操作最終匯流至 Stage 5 的 PR 審查門禁，由隔天早晨的值班工程師集中驗收審批。"], "metaphor": "就像全自動化工廠的夜間無人值守生產模式：夜間車間關燈後，機器人依然根據訂單排程自動切削裝配，只將最後的質檢合格品推送到出貨碼頭等待晨檢。", "layout": "夜間閉環流水線示意圖：展示生產異常如何無人值守調用 Auto Mode 實作，並安全抵達審查門禁。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 8, "title": "實戰避坑指南：Auto Mode 的常見陷阱與對策", "subtitle": "Anthropic 實戰工程團隊踩過的坑與黃金教訓", "takeaway": "防範過度依賴、盲目放權與代碼庫悄然膨脹，建立健康平衡的使用文化。", "details": ["<strong>陷阱一：對模糊計畫開啟 Auto Mode</strong>：plan.md 還沒想清楚就放手讓它跑，結果產出大量方向偏離的無效垃圾代碼。", "<strong>陷阱二：測試覆蓋不足下的盲目自信</strong>：本地缺少自動化測試，Agent 自我感覺良好地改了 20 個檔案，實際上一跑全是 Runtime Error。", "<strong>黃金定則</strong>：嚴格遵循『先 Plan 明確、再 Auto 執行、後 Test 驗證』的三部曲，絕不在混沌狀態下啟動全自動。"], "metaphor": "不要把一輛自動駕駛汽車開進沒有地圖資料、沒有道路標線且沒有行車感測器的原始森林裡去開啟最高車速巡航。", "layout": "三組警示看板：展示『模糊計畫、零測試覆蓋、範圍過大』三大危險禁區及對應的安全處方。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 9, "title": "團隊級配置管理：透過受管設定統一行為", "subtitle": "避免個別工程師隨意關閉防護，確保全組織安全基線", "takeaway": "在企業環境中，Auto Mode 的放權權限應與組織受管設定 (Managed Settings) 連動，落實分級管控。", "details": ["<strong>敏感分支禁用全自動直推</strong>：配置規則鎖定保護分支（如 main/prod），Auto Mode 產生的任何變更強制只能存在於 feature 分支中。", "<strong>設定集中式白名單</strong>：IT 管理員可設定哪些指令允許在 Auto 模式下執行，哪些高危指令（如 rm -rf、drop table）必須強制彈出確認。", "<strong>合規審計全量存證</strong>：Auto Mode 期間調用的所有工具動作與參數，全數在背後打上時間戳並流式寫入企業審計日誌。"], "metaphor": "如同特種車輛限速器：雖然賽車手技術高超，但市政救護車在市區行駛依然受到車載黑盒子限速與 GPS 全程軌跡記錄的法定硬性約束。", "layout": "中央受管設定控制台示意圖：展示組織策略如何向下推送到每位工程師的本地終端環境。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 10, "title": "工程師心理學變革：重塑產出成就感與控制感", "subtitle": "從『逐行敲代碼的工匠心態』走向『掌控千軍萬馬的元帥心態』", "takeaway": "克服『不親手敲每一行代碼就心慌』的心理障礙，體會架構設計與結果驗證帶來的更高層次成就感。", "details": ["<strong>破除代碼虛榮心</strong>：敲代碼行數從來不等於商業價值，架構優雅性、系統穩定性與業務創新交付速度才是工程師的最高榮譽。", "<strong>建立高品質驗收眼光</strong>：學會如何從成百上千行的 Diff 中迅速敏銳地捕捉架構缺陷、極限邊界漏洞與潛在效能瓶頸。", "<strong>專注力的極致釋放</strong>：將省下來的寶貴精力，投入到新技術預研、業務架構深度溝通與底層演算法突破上。"], "metaphor": "這就像從一位每天在沙灘上手工挑揀貝殼的潛水員，晉升為指揮一整支深海探測潛水艇艦隊的海洋科學考察首席科學家。", "layout": "思維模型演進圖：從『細節工匠』躍遷至『系統架構師』的心理認知與價值天花板躍遷。"}, {"chapter_id": 6, "chapter_name": "第 6 章：Stage 3: Build — Auto Mode 與自主執行", "page_num": 11, "title": "第六章實戰總結：安全釋放十倍工程效能", "subtitle": "Stage 3 Build 自主執行核心精髓與下章預告", "takeaway": "Auto Mode 讓工程師徹底擺脫機械重複勞動，配合 Worktrees 實現一人成軍；下章我們將深入守護這一切的知識基石——CLAUDE.md！", "details": ["<strong>核心公式</strong>：嚴謹 plan.md + 健全護欄 + 小爆炸半徑 + Auto Mode = 極速高質交付。", "<strong>行動建議</strong>：今天就為你的日常開發分支嘗試開啟一次 Auto Mode，體驗非同步審查帶來的極致專注心流。", "<strong>前瞻下一章</strong>：Agent 每次啟動究竟該如何精準繼承團隊的所有潛規則與架構智慧？第七章將為您徹底揭密 CLAUDE.md 的架構心法！"], "metaphor": "當發動機的齒輪已經嚴絲合縫，請勇敢踩下油門，在安全護欄的護航下，享受飛馳在軟體工程全新高速公路上的極致快感。", "layout": "三條核心守則總結卡片，底部搭配通往第七章 CLAUDE.md 的高亮引導箭頭。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 1, "title": "大腦的開機配置：為什麼每個倉庫都需要 CLAUDE.md？", "subtitle": "將沉澱在大腦與 Wiki 中的潛規則，化為 Agent 每次啟動必讀的上下文", "takeaway": "CLAUDE.md 是新加入工程師第一天上班所需的一切核心上下文，覆蓋常用命令、架構慣例與高頻踩坑禁忌。", "details": ["<strong>拯救散落的隱性知識</strong>：公司內部無數不言自明的約定（如『貨幣只能用 BigDecimal』）過去只存在資深員工口中，新人和 Agent 極易踩雷。", "<strong>開箱即用的冷啟動</strong>：Agent 進入陌生代碼庫的第一時間，透過根目錄的 CLAUDE.md 瞬間熟悉全局架構與日常規範，宛如資深員工附身。", "<strong>集中維護與代碼同壽</strong>：不再將架構手冊放任在發霉的 Confluence 頁面上，而是與代碼放置在同一 Git 倉庫中同步審查演進。"], "metaphor": "這就像新員工入職第一天，師傅遞給他的一張塑膠護貝的『終極通關小抄』：上面寫著伺服器密碼重置規則、各模組負責人是誰、以及微波爐絕對不能加熱金屬便當盒等保命常識。", "layout": "雙向轉換圖：左側展示雜亂無章的 Wiki、Slack 聊天記錄，透過中央過濾漏斗，右側凝聚成簡潔強悍的 CLAUDE.md。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 2, "title": "執行 /init 自動生成：萃取專案技術基因", "subtitle": "從零起步的最佳途徑：讓 Claude 深入掃描代碼庫結構", "takeaway": "在專案根目錄鍵入 /init，Claude 將主動分析專案檔案、建置腳本與目錄結構，自動提煉出一份高質量的初版 CLAUDE.md。", "details": ["<strong>自動探測建置與測試指令</strong>：掃描 package.json、Makefile、pom.xml 或 Cargo.toml，精準識別常用 build/test 指令。", "<strong>識別核心架構分層</strong>：辨識前後端目錄結構、資料庫遷移腳本存放路徑與 API 定義規範。", "<strong>人類工程師的精簡裁切</strong>：/init 生成的文件只是原材料，工程師必須大刀闊斧剪除冗餘，只保留第一天必須知曉的關鍵命脈。"], "metaphor": "就像地質學家帶著探地雷達在未知島嶼上掃描一圈（/init），立刻標註出淡水源、金屬礦脈與斷層帶，繪製出第一張基礎拓荒軍用地圖。", "layout": "終端互動示意圖：鍵入 /init 命令，展示 Claude 掃描各專案目錄並輸出結構化草案的動態過程。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 3, "title": "四大核心板塊設計：Commands, Conventions, Architecture, Mistakes", "subtitle": "Anthropic 官方規範的黃金四段式架構", "takeaway": "一份結構優秀的 CLAUDE.md 必須嚴格包含：常用命令、編碼慣例、系統架構概覽與高頻避坑清單。", "details": ["<strong>Commands（建置與測試指令）</strong>：提供標準執行腳本，並清晰標註健康輸出範例，讓 Agent 能自主運行。", "<strong>Conventions（團隊約定）</strong>：語言版本標準、禁用的舊庫、特定資料型別強制規範（如禁 double、強制 BigDecimal）。", "<strong>Architecture（架構導航）</strong>：REST 控制器在 api/、領域邏輯在 core/、外部介面在 adapters/，模組邊界一清二楚。", "<strong>Things Claude gets wrong（高頻踩坑清單）</strong>：明確警示 Agent 過去最容易犯錯的盲區（如禁自作主張升級依賴）。"], "metaphor": "這就像古代軍營的『治軍四訓』：一訓軍號口令（Commands）、二訓操練陣式（Architecture）、三訓軍規軍紀（Conventions）、四訓斬立決重罪（Things not to do）。", "layout": "四宮格卡片版面：分別展示 Commands、Conventions、Architecture、Things Claude gets wrong 的標準排版。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 4, "title": "官方實戰範例拆解：支付微服務的真實設定", "subtitle": "僅僅一頁紙，如何精準約束一個複雜的 Spring Boot 專案？", "takeaway": "Anthropic 原文範例向我們展示了極致精簡與高度權威性的完美結合。", "details": ["```markdown\n# Payments service\n\n## Commands\n- Build: make build\n- Test: make test (unit), make itest (integration, needs docker)\n- Lint: make lint (runs in CI; fix before pushing)\n\n## Conventions\n- Java 21, Spring Boot 3. No new Lombok.\n- Money is always BigDecimal, never double.\n- Every endpoint needs an integration test in src/itest.\n\n## Architecture\n- api/ holds REST controllers, core/ holds domain logic,\n  adapters/ talks to external systems.\n- Kafka events are defined in schemas/; never edit generated classes.\n\n## Things Claude gets wrong\n- Do not bump dependency versions; the platform team owns them.\n- The legacy v1/ package is frozen; changes go in v2/.\n```", "<strong>金錢精度鐵律</strong>：『Money is always BigDecimal, never double』徹底消滅浮點數舍入財務事故。", "<strong>凍結舊包保護</strong>：『The legacy v1/ package is frozen』直接在第一時間斷絕了 Agent 篡改舊遺留系統的可能。"], "metaphor": "宛如十誡石碑：文字極其精練，沒有一句廢話，但每一條誡命都精準命中了歷史上無數血淋淋的慘痛教訓。", "layout": "代碼高亮展示官方 Payments service CLAUDE.md 全文，重點行次以亮藍色標註解說。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 5, "title": "犯錯兩次法則 (The Mistake Rule)：動態演進的智慧庫", "subtitle": "不要指責 Agent，要將錯誤化為不可磨滅的制度防禦", "takeaway": "當 Claude 在開發或審查中第二次犯下同樣的錯誤時，修正必須立即作為一條新規則寫入 CLAUDE.md。", "details": ["<strong>從抱怨 AI 轉向制度修復</strong>：遇到 Agent 寫錯代碼，僅僅在聊天視窗斥責毫無意義；關閉視窗後，下個對話依然會重蹈覆轍。", "<strong>一處受傷，全員免疫</strong>：工程師在 PR 審查時把教訓寫入根目錄的 CLAUDE.md，自此全公司所有的工程師與 Agent 在下次啟動時瞬間獲得免疫力。", "<strong>動態生長的知識有機體</strong>：代碼庫經歷一年的實戰打磨，CLAUDE.md 將沉澱為該領域最權威、最珍貴的專屬工程百科全書。"], "metaphor": "這就像現代航空安全事故調查機制：每次黑盒子破譯出事故原因後，波音與空巴立刻將修正後的標準檢查程序 (Checklist) 發送到全球所有飛行員的駕駛手冊中，終身杜絕同類空難再度發生。", "layout": "閉環演進迴圈圖：Agent 犯錯 → 人類指出修正 → 寫入 CLAUDE.md → 全域對話即刻免疫的進化閉環。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 6, "title": "上下文長度控制：為什麼必須嚴格控制在一頁紙以內？", "subtitle": "少即是多：避免注意力稀釋 (Context Dilution) 與 Token 浪費", "takeaway": "因為 Claude 在每次開啟新會話時都會全量閱讀 CLAUDE.md，過時、冗長或過細的內容只會擠佔寶貴的思考窗口。", "details": ["<strong>上下文稀釋效應</strong>：當文件超過千行，大語言模型對個別關鍵誡命的注意力權重將不可避免地下滑，反而容易遺忘核心約束。", "<strong>過時資訊是隱形毒藥</strong>：三個月前寫死在裡面的臨時依賴版本，很可能在系統升級後誤導 Agent 做出荒謬的逆向降級。", "<strong>嚴格劃定邊界</strong>：只保留全域性的黃金規則；凡是針對特定領域的深度規範（如複雜的 API 安全審查條例），應移出並封裝為獨立的 Skill！"], "metaphor": "如同特種部隊突擊隊員的隨身戰術腰帶：只能放置求生刀、急救止血帶與彈匣；如果你把整部大英百科全書綁在腰帶上，隊員只會被壓得寸步難行、喪失戰鬥力。", "layout": "長度對比標尺圖：展示一頁紙 (30~50行) 的黃金甜點區，以及過度膨脹導致模型注意力衰減的警告紅區。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 7, "title": "驗證段落規範：將 Verification 內化為完成標準", "subtitle": "明確定義何謂『Done』：不跑綠燈測試禁止回報完成", "takeaway": "在 CLAUDE.md 中明確寫入 Verifying your work 區塊，命令 Agent 必須在回報任務完成前自主運行所有測試並貼出輸出。", "details": ["<strong>拒絕假象完成</strong>：杜絕 Agent 寫完代碼後隨口回報『我已經幫你實現好了』，實則編譯根本跑不通的尷尬境地。", "<strong>明確退出指標</strong>：包含 Build、Test、Lint 三大強制檢驗項，要求 Lint 必須零警告，測試全綠且絕不允許跳過或刪除失敗測試。", "<strong>修復代碼而非修復測試</strong>：白紙黑字規定『If a test fails, fix the code, not the test』，從根本上斬斷 Agent 為了投機取巧偷改測試斷言的劣習。"], "metaphor": "就像外科手術室的『手術器械計數清單』：護士長必須在主刀醫生縫合傷口前，逐件清點紗布與止血鉗數量完全吻合並大聲報讀，才能宣告手術結束。", "layout": "代碼區塊展示標準 Verifying your work 配置，右側標註『強制輸出證明、禁止竄改測試』雙重圖章。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 8, "title": "版本控制與 Code Review：像對待代碼一樣對待指令", "subtitle": "CLAUDE.md 享有與核心業務邏輯完全相同的代碼地位", "takeaway": "CLAUDE.md 必須被納入 Git 根目錄，全團隊共享一份真相，任何修改都必須經過 Pull Request 與 Code Owner 嚴格審批。", "details": ["<strong>嚴禁本地私藏</strong>：禁止工程師將關鍵配置只放在本地環境，全團隊必須步調一致，共享同一個 Agent 大腦設定。", "<strong>審計透明化</strong>：每次規則修訂都有具名的 Git 提交記錄，誰在何時、因何事故調整了架構約束，歷歷在目。", "<strong>Code Owner 強制把關</strong>：只有資深架構師或平台工程師擁有批准 CLAUDE.md 變更的權限，防止不成熟的個人偏好污染全局環境。"], "metaphor": "這就像國家的『憲法修正案』：憲法條文公開印製發行給所有公民，任何人不能在私底下偷改法條，任何條文修訂都必須經過國會全體辯論與三分之二多數表決通過。", "layout": "PR 流程圖：展示修改 CLAUDE.md 建立分支 → CI Evals 自動跑回歸 → 架構師 Code Review 簽署 → 合併生效的全流程。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 9, "title": "PR Review 反饋機制：讓審查持續滋養知識庫", "subtitle": "當 PR Review 發現二次失誤時，自動發起 CLAUDE.md 更新", "takeaway": "在 Stage 5 的 PR Review 中，一旦審查機器人或人工評審第二次抓出同類命名或邏輯偏誤，直接在該 PR 中提議更新 CLAUDE.md。", "details": ["<strong>審查與知識庫的雙向互哺</strong>：PR Review 既是代碼的把關者，也是 CLAUDE.md 規則是否有效的即時檢驗場。", "<strong>及時識別過時規則</strong>：當專案完成 Spring Boot 3 升級後，Review 流程會主動警示『CLAUDE.md 中舊版的 Java 17 規範已過期，請同步修正』。", "<strong>全自動健康巡檢</strong>：每月定期評估 CLAUDE.md 中每條規則的命中率與攔截效果，淘汰無效噪音，保持精幹強健。"], "metaphor": "就像在現代軍事演習中，前線假想敵部隊（PR Review）一旦發現防禦陣地存在重複的防禦盲區，立刻將該漏洞情報反饋給軍校教研室，當晚改寫作戰訓練教材。", "layout": "雙向箭頭閉環：PR Review 發現重複問題 ⇆ 自動建議更新 CLAUDE.md ⇆ 下次對話 Agent 預防犯錯。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 10, "title": "多專案組織分層治理：全局配置與模組覆蓋", "subtitle": "在大型 Mono-repo 或多微服務巨型企業架構中的落地策略", "takeaway": "採用『根目錄全局共享 + 子目錄按需覆蓋』的層次結構，兼顧全組織統一標準與子服務專屬特質。", "details": ["<strong>全局基線 (Root CLAUDE.md)</strong>：定義全公司統一的 Git Commit 規範、安全底線與通訊協議。", "<strong>子模組特化 (Sub-module CLAUDE.md)</strong>：在 `frontend/` 或 `payment-service/` 等子目錄下放置專屬說明，覆蓋特定框架指令與測試命令。", "<strong>動態繼承與優先權判定</strong>：Claude Code 在進入特定目錄時，優先就近讀取子配置，並無縫繼承父級安全原則，兼顧靈活性與嚴肅性。"], "metaphor": "如同聯邦法律與州法律的關係：聯邦憲法（Root CLAUDE.md）確立了不可侵犯的公民基本權利與國家安全底線；各州政府（子模組）可根據本地農業或商業特點頒布更具體的交通法規。", "layout": "樹狀目錄分層架構圖：展示 Root CLAUDE.md 與各 Sub-package CLAUDE.md 之間的繼承與覆蓋關係。"}, {"chapter_id": 7, "chapter_name": "第 7 章：Stage 3: Build — 團隊智慧庫：CLAUDE.md", "page_num": 11, "title": "第七章實戰總結：讓每一次犯錯都成為永恆的資產", "subtitle": "Stag
