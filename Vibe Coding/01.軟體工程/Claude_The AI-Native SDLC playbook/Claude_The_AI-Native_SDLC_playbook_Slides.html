的閉環防禦：自動收錄至 Continuous Evals 套件"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>單一真相源與合規傳承</strong>：企業安全運營中心 (SOC) 不需要適應新介面，漏洞自動轉化為符合企業 SLA 的安全工單。", "<strong>可自動化關閉工單</strong>：當後續每週掃描確認修復 PR 已經合併且漏洞徹底消失時，Webhook 自動將對應的 Jira 工單流轉為 Closed。", "<strong>法規審計報表一鍵導出</strong>：一鍵生成符合 PCI-DSS、HIPAA 或金融審管要求的全年度代碼弱點修復與閉環趨勢報表。"], "layout": "數據打通架構圖：Claude Security 發現 → Webhook 轉發 → 企業現有 Jira/ServiceNow 工單池 → 自動雙向狀態同步。", "metaphor": "這就像全球各地的氣象觀測站：觀測站採用了最先進的量子雷達掃描大氣，但在發布數據時，依然按照世界氣象組織 (WMO) 的標準格式打包發送，全球各國的氣象預報台與機場調度中心能直接無縫接收讀取。", "page_num": 9, "subtitle": "不創造資訊孤島：讓審計員在他們習慣的 Jira/ServiceNow 中看到一切", "takeaway": "支援將掃描發現無縫導出為 CSV、Markdown，或透過 Webhook 自動同步至企業現有的 Jira / ServiceNow 追蹤系統中。", "title": "與現有安全工單體系整合：CSV、Markdown 與 Webhooks"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>倉庫接入白名單控制</strong>：只有經過資安委員會批准的核心專案倉庫才允許掛接掃描管線，防止外洩私有專案邊界。", "<strong>統一的預算與調度策略</strong>：平台管理員設定每週掃描的 Token 預算上限與並發任務數，防止費用失控。", "<strong>無可辯駁的合規問責制</strong>：審計日誌完整記錄：何時發現了漏洞、置信度評分是多少、誰在幾點幾分簽核駁回、誰在幾點幾分批准補丁上線。"], "layout": "管理控制台視圖：展示連接的倉庫清單、席位授權矩陣、月度掃描算力消耗儀表與合規日誌審計出口。", "metaphor": "如同國家外匯管理局的中央監控機房：每一筆跨國外匯交易的額度、授權銀行代碼與兌換時間戳全數在中央伺服器大螢幕上即時滾動，任何超額或異常調度在千分之一秒內被中央鎖定。", "page_num": 10, "subtitle": "安全主管在管理員控制台中的全面掌控力", "takeaway": "企業中央管理控制台統一掌控哪些倉庫允許連接、誰持有掃描席位、算力預算限額，以及所有審查歷史的法定留痕。", "title": "集中式安全管理：配額、席位與審計治理"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>四大核心落腳點</strong>：每週全量掃描、置信度過濾、小漏洞一鍵提 PR、大架構缺陷回流 Stage 1 重做 intent.md。", "<strong>常態巡檢已佈防，但突發深夜事故怎麼辦？</strong>：警報常常在半夜十點突襲，工程師不在電腦前該如何應對？", "<strong>前瞻第十八章</strong>：如果事故直接降臨在 Slack/Teams 通訊群組中，如何讓 Claude 成為全天候輪值待命的第一響應者？第十八章『Claude on call with Claude Tag』將震撼為您揭曉！"], "layout": "三條核心實踐卡片，底部搭配通往第十八章 Claude Tag 突發事件響應的高亮通訊標誌。", "metaphor": "定期掃描就像一位永不疲倦的深海潛水巡檢員，每週末安靜地巡視著大壩的每一條水下接縫與基樁；而下一章，我們將為整個工程指揮部配備一名 24 小時值班待命、一聲召喚瞬間抵達戰場的終極救火特工！", "page_num": 11, "subtitle": "Stage 6 Maintain 安全巡檢核心總結與下章預告", "takeaway": "定期代碼庫弱點掃描消滅了『靜態代碼雙向過期』的威脅，讓系統代碼庫在模型能力的演進洪流中永遠立於不敗之地！", "title": "第十七章實戰總結：讓代碼庫隨著時代進化而愈發堅固"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>海量警報帶來的資訊過載 (Alert Fatigue)</strong>：當線上服務雪崩時，Slack 警報頻道瞬間被數百條告警洗版，值班人員極難抓出源頭特徵。", "<strong>上下文斷層與歷史盲區</strong>：凌晨被 PagerDuty 叫醒的工程師，往往對白天同事剛合併的邊界邏輯變更一無所知，缺乏全域感知。", "<strong>高壓之下的手忙腳亂</strong>：在客戶停擺、高層盯場的極限壓力下，手動執行日誌搜尋與資料庫排查極易引發人為二次失誤，拉長 MTTR。"], "layout": "事故現場壓力對比圖：上方展示深夜警報狂轟與工程師焦慮尋找 Log 的高壓時鐘，下方展示傳統診斷流程在各環節造成的 MTTR 延誤。", "metaphor": "這就像凌晨發生的大樓火警：警報器響成一片，濃煙遮蔽了視線（海量日誌過載），剛剛被警鈴驚醒的消防隊員根本不知道哪個房間堆放了易燃物（上下文丟失），必須摸黑在一千個房間裡翻找火源起點。", "page_num": 1, "subtitle": "為什麼凌晨兩點的線上 P0 事故，總是讓工程師手忙腳亂、身心俱疲？", "takeaway": "線上排錯最耗時的不是改那行代碼，而是在上萬行日誌、雜亂監控圖表與無數 Git Commit 中定位根本原因的巨大認知摩擦！", "title": "線上事故與值班工程師的深夜困境：平均修復時間 (MTTR) 的瓶頸"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>零切換的通訊端原生調度</strong>：無需登入獨立管理後台，在團隊所有人共同關注的 Slack 應急頻道中直接對話，全體成員資訊同頻透明。", "<strong>全自動上下文匯流 (Context Aggregation)</strong>：收到呼叫時，Claude 自動讀取該討論串的所有前後對話、錯誤截圖與工程師先前的推測論述。", "<strong>以同僚身分加入作戰</strong>：不再是呆板的關鍵字 Bot，而是能夠理解自然語言提問、主動提出假設並進行驗證的多模態智能應急專家。"], "layout": "Slack 聊天介面示意圖：展示值班工程師在 `@incident-checkout` 頻道標註 `@Claude`，Claude 立即在線回覆事故摘要與關聯日誌連結。", "metaphor": "就像在火警現場的對講機頻道裡，直接呼叫總部的金牌資深結構工程師：他雖然不在火場，但能同步調閱大樓三維管線圖與所有感應器數據，在對講機裡精準指引火源位置與安全撤離路線。", "page_num": 2, "subtitle": "將 Claude 深度接入 Slack、Discord 或 PagerDuty，如同呼叫常駐線上救火隊員", "takeaway": "工程師只需在事故頻道中 `@Claude`，Agent 即刻在通訊串中以專案全域上下文接管事故調查，秒級生成事故特徵與修復建言。", "title": "什麼是 Claude Tag？在協同通訊中一鍵召喚 AI 應急專家"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>打破資料孤島 (Breaking Data Silos)</strong>：傳統排查要在 4 個不同的瀏覽器標籤頁來回切換複製查詢語法，Claude 一次調用即可並行整合所有指標。", "<strong>錯誤堆疊特徵深度解析</strong>：Claude 自動解析混淆（De-minify）後的崩潰堆疊，精確對齊至 Git 代碼庫的具體提交（Commit SHA）與程式碼行號。", "<strong>日誌時序交叉比對</strong>：將應用層日誌、資料庫慢查詢記錄與反向代理（Nginx/Envoy）的 HTTP 5xx 突增曲線進行時序關聯對齊。"], "layout": "監控匯流架構圖：左側 Sentry/Datadog/CloudWatch 透過 MCP Tools 將遙測數據即時推送至中央 Claude 事故分析大腦，右側呈現多維診斷特徵。", "metaphor": "這就像急診室主任醫師手邊的智慧監控儀表：不必奔走於心電圖室、驗血科與放射科之間，病人的血氧飽和度、腦部斷層掃描與用藥歷史瞬間在一張整合儀表板上並列呈現。", "page_num": 3, "subtitle": "利用 MCP 連接器無縫拉取線上監控數據，打破觀測性孤島", "takeaway": "透過 MCP 賦能，Claude 能直接調用 Datadog API 抓取錯誤尖峰、從 Sentry 提取 Stacktrace，並檢索 CloudWatch/Loki 日誌！", "title": "第一現場數據匯流：整合 Sentry、Datadog 與雲端日誌"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>Git Blame 與變更時間軸比對</strong>：自動抓取最近發佈的版本差異（Git Diff），特別檢驗修改了共用配置、DB 索引或併發鎖機制的提交。", "<strong>邊界情境推理與因果鏈推導</strong>：推導事故場景：『當高並發請求湧入時，該 PR 引入的局部快取未設置 TTL，導致 Redis 連接池耗盡引發雪崩』。", "<strong>排除假警報與下游次生危害</strong>：過濾掉因為上游資料庫連線超時而引發的下游十幾個微服務的連鎖假報警，直搗真正的初級爆發源頭。"], "layout": "因果推導流程鏈：從線上報錯異常尖峰 -> 檢索 2 小時內 Commit 歷史 -> 語義比對差異邏輯 -> 輸出精確的事故因果鏈分析報告。", "metaphor": "如同名偵探柯南在命案現場勘查：他不僅僅盯著死者身上的傷口（報錯日誌），而是翻看訪客出入登記簿（Git 提交記錄），迅速推斷出半小時前進入宅邸的神秘維修工才是這起投毒案的真正兇手。", "page_num": 4, "subtitle": "從海量雜訊中辨識訊號：為什麼這個 Bug 恰好在此時此刻爆發？", "takeaway": "事故發生前 2 小時合併的 PR 往往是罪魁禍首；Claude 主動關聯 Git 歷史與異常 Log，精準推導事故因果鏈！", "title": "智慧根本原因分析 (RCA)：關聯代碼變更與異常模式"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>最小變更原則 (Principle of Minimal Changes)</strong>：在緊急補丁中僅修改 3~5 行關鍵代碼，避免在線上高壓情境中引入未知的次生 Bug。", "<strong>動態特徵防禦 (Circuit Breaker)</strong>：自動注入短路保護機制或條件過濾器，在不重啟整組服務的前提下先隔離惡意/畸形請求流量。", "<strong>生成配對的單元復現用例</strong>：自動編寫能直接復現線上崩潰情境的測試腳本，確保補丁應用後該特定邊界情況絕對能被覆蓋並通過驗證。"], "layout": "代碼 Diff 對比圖：展示左側崩潰空指針問題代碼，與右側 Claude 生成的最小化防禦補丁（包含非空檢查與平滑降級預設值）。", "metaphor": "這就像輪船船體在高海況下被暗礁撞出裂縫：損管隊員現在最需要的是快乾止水水泥與加固鋼板（最小緊急修復），而不是試圖在驚濤駭浪中重新改造整艘船的龍骨架構。", "page_num": 5, "subtitle": "分秒必爭的線上救火：由 Agent 即刻提供最小侵入性（Minimal Invasive）的補丁方案", "takeaway": "緊急熱修復切忌大刀闊斧重構！Claude 專注於生成安全防禦護欄、降級開關或邊界防禦補丁，第一時間阻斷故障擴散。", "title": "自動生成緊急修復補丁 (Hotfix Patch)：從定位到代碼生成"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>嚴格禁止無驗證直推 (No Blind Push)</strong>：即使模型置信度高達 99%，也必須通過標準自動化編譯、單元測試與集成測試管線。", "<strong>短暫沙盒環境秒級拉起</strong>：調用雲端 API 即時啟動鏡像容器，將有問題的代碼打上 Hotfix Patch，回放線上崩潰時的畸形請求 Payload。", "<strong>驗證修復有效性與性能耗損</strong>：確認崩潰不再復現，且 CPU 與記憶體佔用保持平穩，完全消除『修復補丁引發更大災難』的恐懼。"], "layout": "沙盒驗證架構圖：Hotfix 代碼分支與線上脫敏 Payload 同步灌入獨立 Ephemeral Docker 沙盒，綠色 Checkmark 點亮後才解鎖 PR 合併按鈕。", "metaphor": "就像在給瀕危病人注射未經大規模試驗的特效解毒劑之前，醫生先在離體細胞樣本（隔離沙盒）中滴入藥液：親眼觀察到毒素被中和且細胞未發生破裂後，才放心推入病人的靜脈血管。", "page_num": 6, "subtitle": "為什麼不能直接把 AI 產生的 Hotfix 盲目推上生產環境？", "takeaway": "將補丁自動注入臨時雲端容器（如 Modal/Docker 沙盒），重現真實故障流量進行壓測驗證，確認無誤後才允許進入發佈流程！", "title": "隔離沙盒預演 (Isolated Staging Sandbox)：不碰生產環境驗證"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>明確劃分決策邊界</strong>：AI 永遠不擁有直接向生產環境執行 `git push --force` 或修改生產資料庫 schema 的權限。", "<strong>給出多重應對選項 (Option Matrix)</strong>：提供方案 A（立即回滾代碼，影響 5 分鐘可用性）與方案 B（應用熱補丁，需重啟特定 Pod）並標註風險權重。", "<strong>一鍵審批與審計日誌</strong>：工程師在 Slack 頻道點擊『批准發佈 Hotfix』按鈕，後台自動記錄操作授權者的電子簽名與時間戳記。"], "layout": "決策矩陣圖：左側列出 Claude 提供的診斷日誌與補丁對比，右側為人類指揮官審核面板（包含回滾 vs 熱修復按鈕與一鍵審批授權）。", "metaphor": "這如同現代戰鬥機的雙座作戰配置：AI 是後座的武器雷達導航官，負責雷達掃描、威脅判定與鎖定目標；坐在前座的人類飛行員始終握有握把上的開火扳機，任何飛彈發射都必須由人類確認按下。", "page_num": 7, "subtitle": "在極端事故響應中，AI 是超級參謀，值班工程師是最高指揮官", "takeaway": "Claude 負責偵察、歸納、假設與提案；人類工程師負責業務權衡、風險評估與最後那一次點擊發佈的授權！", "title": "人機協同決策模型：工程師始終掌控最後一公里授權 (Human Gatekeeper)"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>嚴格的唯讀 API 連接</strong>：MCP 授予 Claude 的日誌與監控工具僅具備查詢權限，絕不開放寫入、刪除或資料庫 DROP/TRUNCATE 介面。", "<strong>PII 與密鑰自動脫敏過濾</strong>：在日誌文本傳入模型上下文之前，本機代理層先以正則自動遮蔽信用卡號、JWT Token 與密碼欄位。", "<strong>會話記憶體隔離防洩露</strong>：每次事故調查創建獨立的臨時上下文 Session，事故結案後自動銷毀，避免跨事故發生資料交叉污染。"], "layout": "安全防禦四重護欄圖：唯讀閘道 (Read-Only Gateway) -> PII 脫敏過濾網 -> 指令語意防禦閥門 -> 審計日誌儲存庫。", "metaphor": "就像進入中央銀行地下金庫調查失竊案的外部私家偵探：他被允許佩戴特製的放大鏡翻看現場指紋與監控錄影（唯讀偵查），但他身上不准攜帶任何鑰匙、螺絲起子或火藥，且全程處於保全主管的視線之內。", "page_num": 8, "subtitle": "如何防止 Agent 在除錯時意外洩露敏感資料或誤刪生產資源？", "takeaway": "嚴格實施唯讀授權 (Read-Only)、日誌資料脫敏 (Data Masking) 以及對高危破壞性指令的硬性阻斷！", "title": "安全護欄與權限最小化：維護環境中的防越權防禦"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>精確到秒的時序線重建 (Timeline Reconstruction)</strong>：從 Slack 訊息與監控圖表中自動提取各階段重要時間戳，告別人工拼湊會議記錄的痛苦。", "<strong>五個為什麼 (5 Whys) 深層因果挖掘</strong>：自動撰寫從表層錯誤到架構缺陷的遞進分析：『為什麼拋出 NPE？因為快取為空。為什麼快取為空？因為...』。", "<strong>自動衍生長期改進行動項 (Action Items)</strong>：不僅總結事故，更自動向 Jira/GitHub 發起補全防禦測試、調整監控閾值與架構重構的具體 Issue。"], "layout": "SRE 覆盤報告範本結構：事故影響時長 -> 核心受影響服務指標 -> 精確時序記錄表 -> 根本原因分析 (5 Whys) -> 預防重現行動清單。", "metaphor": "如同黑盒子空難調查組：在飛機迫降搶救成功後，自動黑盒子分析器直接將飛行軌跡、座艙通話錄音與儀表氣壓數據打印成一份圖文並茂的官方事故調查報告，並為航空公司開列出十條安全改進法規。", "page_num": 9, "subtitle": "事故解決後，讓 Claude 自動梳理精確到秒的時間線與事故剖析", "takeaway": "從警報響起、呼叫診斷、定位問題、應用補丁到服務恢復，所有動作精確轉化為符合 Google SRE 規範的覆盤文檔！", "title": "事故後覆盤報告 (Postmortem) 自動生成：告別手寫報告的折磨"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>提煉架構防禦教訓 (Architectural Lesson)</strong>：將特定的邊界漏洞抽象為編程約束，例如：『所有跨微服務調用必須顯式宣告超時與斷路器』。", "<strong>更新專案級 CLAUDE.md</strong>：自動在專案的規範檔案中追加規則條目，下一次任何開發者讓 Claude 寫代碼時，Agent 自動嚴格遵守該約束。", "<strong>生成防回歸的合約測試</strong>：在全域測試套件中永久新增一組針對該事故特徵的端到端防衛測試案例，納入 CI/CD 強制把關。"], "layout": "閉環演化迴圈圖：線上事故 (Incident) -> 根本原因解析 -> 萃取防範規則 -> 注入 CLAUDE.md -> 全團隊未來代碼免疫此類缺陷。", "metaphor": "這就像航空安全管理條例的誕生歷史：民航歷史上的每一條嚴苛飛行安全手冊規章，背後都是一次慘痛的真實事故；而我們將每次事故化作代碼憲章中的一條金科玉律，讓未來的每架航班永遠避開那道風切變。", "page_num": 10, "subtitle": "絕不踩進同一個泥潭兩次：讓每一次線上故障都成為團隊知識庫的永恆養分", "takeaway": "事故修復完成並不意味著結束！將引發事故的反面模式寫入 CLAUDE.md，讓未來的代碼生成在源頭直接杜絕重犯！", "title": "防禦閉環：將線上事故經驗固化為 CLAUDE.md 憲章規則"}, {"chapter_id": 18, "chapter_name": "第 18 章：Stage 6: Maintain — 線上值班與即時除錯：Claude on Call", "details": ["<strong>徹底告別警報恐慌症 (No More On-call PTSD)</strong>：輪值工程師不再害怕半夜的手機鈴聲，因為深知背後有隨叫隨到、知識完備的 AI 夥伴隨時待命。", "<strong>初級工程師的升維賦能</strong>：即使是剛入職的菜鳥工程師，在 Claude 智慧助手即時導引下，也能沉著應對並解決複雜的線上事故。", "<strong>將精力重新聚焦於高價值架構</strong>：大幅壓縮每次事故的處理週期（MTTR 從數小時縮短至數分鐘），讓團隊將 90% 的精力重新投回前瞻功能研發。"], "layout": "文化躍升前後對比：左側展現疲憊焦慮的傳統值班工程師（被日誌與警報淹沒），右側展現神態自若的現代 SRE 指揮官（在 AI 輔助下胸有成竹決策）。", "metaphor": "從拿著水桶在黑夜中疲於奔命舀水滅火的村民，升級為坐在高科技水情防洪指揮中心裡的調度官：螢幕上清晰可見水閘各處壓力，輕輕撥動推桿，智能引流系統早已平穩化解洪峰。", "page_num": 11, "subtitle": "從提心吊膽的『救火隊員』，轉身成為駕馭 AI 矩陣的『系統穩定性工程指揮官』", "takeaway": "當 AI 接管了日誌過濾與補丁初稿的繁重體力活，工程師終於能重獲優質睡眠與對系統架構穩定性的長遠信心！", "title": "團隊文化重塑：告別值班倦怠，擁抱智慧應急指揮"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>資安與合規的嚴苛紅線</strong>：金融、醫療與跨國企業對專有原始碼外洩、智慧財產權 (IP) 污染具有近乎零容忍的底線要求。", "<strong>組織慣性與心智防線</strong>：資深工程師習慣於手工雕刻每行代碼，往往將 Agent 視為可能破壞系統純潔性的不可控黑盒子。", "<strong>ROI 與研發效能衡量真空</strong>：管理層無法評估高昂的 Token 帳單是否真正轉化為業務交付速度與代碼品質的客觀提升。"], "layout": "企業阻力三角圖：安全合規門檻、工程文化抗拒、財務 ROI 模糊三個頂角，圍繞著中間停滯不前的企業 AI 規模化試點。", "metaphor": "這就像工業革命初期，紡織行會的大師級工匠們拒絕引進蒸氣動力織布機：他們既擔心鍋爐爆炸引發火災（安全疑慮），又對機器生產的布料結構充滿偏見（文化抗拒），同時廠長也不知道採購煤炭的開銷能否透過產量回本。", "page_num": 1, "subtitle": "為什麼許多大企業的 AI 編程試點，始終停留在少數極客的個人玩具階段？", "takeaway": "企業規模化普及 AI 的最大阻礙從來不是模型智力，而是合規資安的擔憂、資深架構師的文化抗拒與缺乏科學量化的價值指標！", "title": "企業引入 AI-Native SDLC 的三重挑戰：合規、慣性與 ROI"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>嚴格禁止數據訓練 (Zero Training)</strong>：所有通過企業 API 與 Claude Code 發送的專有代碼與提示詞，Anthropic 嚴禁將其用於模型後續微調訓練。", "<strong>零資料保留政策 (Zero Data Retention)</strong>：請求在伺服器推論完成後立即自揮發性記憶體清除，不在雲端留存任何磁碟日誌拷貝。", "<strong>專屬 VPC 與私有端點打通</strong>：支援透過 AWS Bedrock 或 Google Cloud Vertex AI 在企業專有私有子網內調用，流量不出企業內網。"], "layout": "企業安全架構隔離圖：企業私有 VPC 內部代碼倉庫 -> 專屬端點 (PrivateLink) -> 加密傳輸 -> 揮發性記憶體推論 (ZDR) -> 銷毀。", "metaphor": "如同國家級外交特使使用的單向自毀密碼箱：機密公文在接收端被特使閱覽解讀後，密碼箱內的化學藥劑即刻將文件氣化銷毀，絕不給任何外部間諜留下半個字跡的抄錄機會。", "page_num": 2, "subtitle": "Anthropic 企業級安全協議：確保企業核心商業機密絕對私密安全", "takeaway": "企業版 Claude 恪守三大隱私原則：用戶資料永不參與模型訓練、支援零資料保留 (ZDR) 與私有雲專屬端點部署！", "title": "資料隱私與合規底線：零資料保留與專屬 VPC 隔離"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>開源許可相容性掃描 (License Scanning)</strong>：自動檢測生成的代碼是否無意中照搬了具有傳染性開源授權（如 AGPL/GPLv3）的專有片段。", "<strong>商業代碼版權賠償保障 (Copyright Indemnification)</strong>：Anthropic 提供企業級智慧財產權法律賠償條款，承擔客戶因使用模型輸出可能產生的版權抗辯。", "<strong>代碼血統與追溯鏈 (Code Provenance)</strong>：詳細記錄每行代碼的生成來源、模型版本、提示詞上下文與人類審核者的簽署紀錄。"], "layout": "智慧財產權過濾漏斗：AI 生成建議 -> 開源協議特徵指紋比對 -> 企業合規黑名單過濾 -> 輸出具備版權免責擔保的商業級代碼。", "metaphor": "這就像頂級食品工廠的原物料溯源機制：每一批進廠的麵粉與香料都附帶產地基因檢驗證明與有機認證標籤，確保出廠的每一包點心絕對沒有混入任何未經檢驗的過敏原與違禁防腐劑。", "page_num": 3, "subtitle": "如何防止 AI 生成的代碼引發未知的開源協議 (GPL) 法律訴訟？", "takeaway": "在企業級管線中內建授權許可審查與代碼查重篩檢，確保 AI 生成內容完全原創且具備商業版權免責保障。", "title": "智慧財產權與代碼版權防護：杜絕開源代碼污染"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>分級授權機制 (Tiered Tool Permissions)</strong>：唯讀工具（讀取代碼、拉取日誌）開放全域默認授權；變更工具（寫入資料庫、發起部署）需顯式動態審批。", "<strong>指令語義防禦防火牆 (Semantic Firewall)</strong>：在 MCP 傳輸層攔截惡意模糊匹配，自動阻斷形如 `rm -rf /` 或 `DROP TABLE` 等破壞性操作指令。", "<strong>端到端審計追蹤 (Immutable Audit Trail)</strong>：Agent 執行的每一次工具調用、入參出參及調用者身份均被寫入防篡改的集中式審計數據庫。"], "layout": "MCP 工具權限階梯圖：底層（唯讀工具：開放存取）-> 中層（寫入操作：本機確認）-> 頂層（生產環境工具：需主管雙重數位簽章授權）。", "metaphor": "如同核潛艇的發射控制台：日常水溫測量與聲納偵聽由單一操作員隨時調閱，但若要轉動飛彈發射鑰匙，必須艦長與副艦長同時將各自保管的防偽鑰匙插入相距兩公尺的插孔中旋轉。", "page_num": 4, "subtitle": "賦能 Agent 執行操作的同時，如何給它的雙手套上最堅固的安全手銬？", "takeaway": "依據員工與角色等級，對 MCP Tools 實施動態白名單授權，涉及資料修改或發佈指令強制要求雙人多重確認 (Two-Person Rule)！", "title": "權限最小化與工具審批：MCP 工具的企業沙盒化防禦"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>Level 1：代碼補全 (Autocomplete)</strong>：單行語法預測，單純提高打字速度，對軟體架構與端到端交付週期幾乎沒有本質改變。", "<strong>Level 2：互動式結對助手 (Interactive Copilot)</strong>：對話式答疑、單函數重構、單元測試補全，開發者單兵作戰能力提升 30%~50%。", "<strong>Level 3：規範驅動的半自主工程 (Spec-Driven Agent)</strong>：以架構規範為錨，Agent 承接完整模組端到端實作，引入自動化審查與驗證閉環。", "<strong>Level 4：全流程自主演化工廠 (Autonomous Software Factory)</strong>：多 Agent 集群協同完成需求分解、架構設計、實作、測試與自動上線運維。"], "layout": "階梯演進成熟度圖：橫軸為企業組織複雜度，縱軸為 AI 自主化程度，清晰標註 L1 到 L4 的技術特徵、ROI 效益與所需治理能力。", "metaphor": "這就像交通載具的自動駕駛分級：從最原始的定速巡航（L1 補全），到車道保持與自動跟車（L2 結對），再到高速公路點對點導航輔助（L3 規範驅動），最終走向真正取消方向盤的完全無人駕駛計程車隊（L4 自主工廠）。", "page_num": 5, "subtitle": "你的企業目前停留在哪一個發展階段？認清現狀才能精準推進", "takeaway": "企業 AI 轉型不是一蹴而就的狂歡，而是從被動代碼補齊逐步演進到自主多 Agent 研發生態的嚴肅架構升級！", "title": "企業 AI 成熟度四級模型：從『自動補全』到『自主工廠』"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>階段一：試點破冰 (0~2 個月)</strong>：挑選 1~2 個邊緣業務或內部工具專案，由核心種子工程師驗證工作流，沉澱第一批成功案例。", "<strong>階段二：規範立憲 (2~4 個月)</strong>：標準化專案級 `CLAUDE.md` 模板，制定代碼審查與架構評審基準線，消弭團隊間的風格分歧。", "<strong>階段三：平台工程賦能 (4~8 個月)</strong>：在內網發佈統一部署的 MCP Tools 服務中心，將企業內部私有 API 與 CI 系統封裝為標準 Agent 技能。", "<strong>階段四：全員規模化 (8~12 個月)</strong>：將 AI-Native 納入全員新員工入職培訓 (Onboarding)，全面重塑研發績效評估體系。"], "layout": "甘特時間軸路線圖：清晰劃分 4 個季度（Q1 試點 -> Q2 規範 -> Q3 平台化 -> Q4 規模化），各階段列出具體的里程碑交付成果。", "metaphor": "如同古代大禹治水或現代大型電網鋪設：不能在第一天就把高壓電流直接灌入千家萬戶的插座；必須先建好水電樞紐（試點），鋪設絕緣變壓站（規範與平台），最後才合閘通電點亮整座現代化都市。", "page_num": 6, "subtitle": "由點及面、以小博大：如何規劃 6~12 個月的企業級落地節奏？", "takeaway": "遵循『先評估試點、再立憲建規、繼而平台賦能、最後全員推廣』的科學節奏，避免盲目全面鋪開引發混亂！", "title": "企業落地四階段實施路線圖 (Transition Roadmap)"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>維護企業 MCP 應用市集 (Internal MCP Registry)</strong>：審核、發佈與託管公司各部門共用的 MCP Servers，統一權限管控與版本升級。", "<strong>構建秒級隔離沙盒環境 (Ephemeral Sandboxes)</strong>：為 Agent 自動執行代碼與回歸測試提供即開即用、用完即毀的輕量級虛擬容器資源。", "<strong>打造組織級上下文知識索引</strong>：將企業內部數百個代碼庫、Confluence 文檔與架構決策記錄 (ADR) 構建成語義向量檢索中樞。"], "layout": "現代平台工程架構圖：最底層為企業雲基礎設施，中層為平台團隊提供的 Internal MCP Registry 與沙盒調度集，頂層供全公司 Agent 調用。", "metaphor": "以前的後勤兵只負責給士兵發放步槍與乾糧（傳統 CI/CD）；現在的現代化戰略勤務部隊，則是在高空佈設低軌通訊衛星網、無人偵察機群與數位化戰術作戰面板（為 Agent 提供全維度基礎設施支撐）。", "page_num": 7, "subtitle": "從維護傳統 CI/CD 伺服器，轉變為提供『Agent-Ready』的基礎設施", "takeaway": "現代平台工程的核心任務，是把企業內部的所有複雜系統（DB、內部服務、監控）打包成 Agent 一眼就能看懂的 MCP 工具介面！", "title": "平台工程團隊 (Platform Engineering) 的全新戰略使命"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>明確能力價值的重塑方向</strong>：打字速度與語法記憶不再是核心競爭力；問題定義、系統分解、邏輯嚴密性與邊界審查成為全新黃金能力。", "<strong>建立安全友善的試錯氛圍</strong>：鼓勵團隊在每週技術分享會中分享『我是如何利用 Agent 踩坑與成功脫困的』，將踩坑經驗轉化為組織資產。", "<strong>資深架構師轉型為『Prompt/Spec 導師』</strong>：引導經驗豐富的老將將數十年積累的架構智慧與踩坑記憶，轉寫為高價值的專案規範體系。"], "layout": "工程師技能升維金字塔：底層（記憶語法、寫樣板代碼：由 AI 承擔）-> 中層（寫規範、架構設計：人機協作）-> 頂層（業務洞察、哲學價值判斷：人類獨佔）。", "metaphor": "這就像從手工繪製建築藍圖時代邁入 AutoCAD 電腦輔助設計時代：老建築師最初抗拒螢幕鼠標，但一旦掌握了 CAD 的精髓，他們便能把原本耗費在擦拭橡皮擦屑與拉平行尺上的精力，完全專注於巴黎聖母院般的宏偉力學造型設計。", "page_num": 8, "subtitle": "工程師不會被 AI 取代，但使用 AI 的工程師將迅速取代不用 AI 的人", "takeaway": "組織管理層必須公開向工程師賦予安全感：AI 的目標是消除繁瑣重複的體力活，解放人類去追求更高維度的系統架構與業務創新！", "title": "變革管理與文化重構：化解『被取代焦慮』與心智重塑"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>警惕『代碼通貨膨脹』陷阱</strong>：用 LOC 作為指標會刺激工程師讓 Agent 瘋狂生成無意義的冗長樣板代碼，惡意增加系統維護負擔。", "<strong>對齊 DORA 四大黃金效能指標</strong>：部署頻率 (Deployment Frequency)、變更前置時間 (Lead Time for Changes)、修復時間 (MTTR) 與變更失敗率。", "<strong>引入『架構乾淨度與技術債縮減率』</strong>：鼓勵工程師利用 Agent 主動發起代碼精簡、過期依賴移除與測試覆蓋率補齊的重構 PR。"], "layout": "研發指標升級對照表：左側展示傳統錯誤指標（LOC、Commit 數、PR 數量），右側展示現代領先指標（Lead Time、DORA 四大維度、技術債消除速度）。", "metaphor": "這就像考核小說家的寫作成就：愚蠢的出版社按照稿紙字數給作家發稿費，結果作家寫出了八百頁不知所云的口水廢話；而偉大的文學評論家只看作品是否能在讀者心中激盪起永恆的哲理波瀾與震撼力。", "page_num": 9, "subtitle": "如果還在用代碼行數衡量 KPI，將會徹底毀滅 AI-Native 的工程價值", "takeaway": "禁止將代碼行數、Commit 數量或 PR 個數作為績效標準！將考核焦點轉向交付前置時間 (Lead Time) 與線上故障逃逸率！", "title": "研發效能指標升維：拋棄行數 (LOC)，擁抱 DORA 與品質領先指標"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>直接人工時數節省模型</strong>：實踐數據顯示，熟練運用 AI-Native 工作流的團隊，在模組原型開發、除錯與測試撰寫上節省了 40%~60% 的工時。", "<strong>缺陷外溢防範帶來的隱性回報</strong>：在編碼早期利用 Agent 多視角審查攔截一個潛在架構漏洞，避免了線上停擺百萬美元級別的商業損失。", "<strong>加速 Time-to-Market 的戰略溢價</strong>：新產品搶在競爭對手前 3 個月上線所鎖定的市場壟斷份額，其商業價值遠超全公司全年的 Token 成本支出。"], "layout": "財務 ROI 精算柱狀圖：對比傳統手工研發的人工時薪消耗成本，與 AI-Native 研發模式下的極低 Token 支出 + 超額業務增長收益。", "metaphor": "如同給每位建築工人配備了一輛價值 50 美元的高效電動推土機：看似增加了一筆汽油與設備開銷，但工人從此不必拿著鏟子挖地基三個月，而是在三天之內直接築起摩天大樓，讓整棟商城提早半年開始招商收租！", "page_num": 10, "subtitle": "花費的每一分 API Token 預算，到底能為企業換回多少商業回報？", "takeaway": "一位資深工程師的時薪高達 80~150 美元，而一個極端複雜的 Agent 任務耗費的 Token 僅約 0.5~2 美元，ROI 達到驚人的數十倍！", "title": "TCO 與 ROI 經濟學：Token 成本與研發倍增效應精算"}, {"chapter_id": 19, "chapter_name": "第 19 章：Enterprise Governance — 企業級治理架構與轉型路線圖", "details": ["<strong>基礎架構檢驗</strong>：是否已與雲端供應商簽訂 ZDR 零資料保留協議？是否已打通內部 MCP 服務註冊中心？", "<strong>工程規範檢驗</strong>：核心代碼庫是否具備詳盡且自動驗證的 `CLAUDE.md`？CI 管線中是否內建自動化測試與代碼規範檢查門檻？", "<strong>組織文化檢驗</strong>：是否建立了安全透明的人機協同指南？工程師的績效考核是否已成功從行數轉向價值交付？"], "layout": "檢查清單互動看板：分為『安全合規』、『平台設施』、『架構規範』與『組織文化』四大象限，清晰羅列必備評估準則。", "metaphor": "如同太空梭發射前的倒數計時點檢清單：從航電系統、液氧加注、隔熱瓦完整度到宇航員生命體徵，唯有每一道檢查格都打上綠色勾號，火箭推進器才能在萬眾矚目下噴出烈焰衝向星辰大海。", "page_num": 11, "subtitle": "在全面啟動 AI-Native 轉型前，技術長與工程副總裁必答的十項自檢題", "takeaway": "涵蓋資料隱私、架構規範、平台工具與團隊文化的完整體檢，確保企業在奔向未來的軌道上既快速又穩健！", "title": "企業轉型準備度自我檢驗清單 (Enterprise Readiness Checklist)"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>從作坊手工時代走向流水線工業時代</strong>：半個世紀以來軟體工程本質上仍像木匠手工雕花；如今 Agent 將其推入自動化量產時代。", "<strong>注意力焦點的根本遷移</strong>：工程師不再浪費腦力去記憶語法糖、框架 API 參數或拼寫函數名，而是全面轉向思考業務價值與系統邊界。", "<strong>軟體生產的邊際成本革命</strong>：構建一個新功能模組的耗時從數週壓縮至數分鐘，軟體迭代的週期將以小時甚至分鐘為單位刷新。"], "layout": "範式轉移時代軸：從 1970 手工打孔紙卡 -> 1990 IDE 輔助 -> 2010 雲原生與 DevOps -> 2026 AI-Native 自主軟體製造工廠。", "metaphor": "這就像從文藝復興時期印刷大師用鵝毛筆人工抄寫羊皮卷聖經，一躍邁入古騰堡活字印刷術與現代高精度全自動輪轉印刷機時代：書籍不再是少數修道院修道士窮盡一生手繪的珍寶，而是能以千萬冊規模迅速傳播全人類智慧的通用載體。", "page_num": 1, "subtitle": "我們正親歷人類軟體建構歷史上最壯闊的一次生產力大躍進", "takeaway": "未來的代碼不再是由人類逐行手寫出來的工藝品，而是在嚴格的規範藍圖與自動化流水線上由 Agent 自主鍛造出的現代化工業產品！", "title": "軟體工程的世紀範式轉移：從手工雕刻到自主製造工廠"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>角色專業化分工 (Role Specialization)</strong>：不同的 Agent 配備不同的系統提示詞、記憶體模型與專有工具鏈，各司其職。", "<strong>生成與對抗的自我進化 (Adversarial Self-Improvement)</strong>：紅隊測試 Agent 以最刁鑽的攻擊 Payload 攻擊開發 Agent 產出的代碼，在發佈前逼出所有盲區。", "<strong>非同步非阻塞並行協同</strong>：數十個 Agent 可以在同一時間非同步並行處理資料庫遷移、前端介面重構與國際化多語言支援，研發吞吐量成倍暴增。"], "layout": "多 Agent 協同拓撲圖：中央由人類架構師提供戰略規範，周圍分佈 Architect Agent、Coder Agent、Security Red Team 與 Auditor Agent，彼此環形通訊交織。", "metaphor": "如同世界頂級的維也納愛樂交響樂團：首席指揮（人類架構師）揚起指揮棒，第一小提琴（開發組）、大提琴（資料庫組）、管樂部（測試組）與定音鼓（安全組）各自精準演奏自己聲部的旋律，交織成澎湃震撼的生命樂章。", "page_num": 2, "subtitle": "未來的開發不再是單一 Agent 的獨角戲，而是由專業角色組成的集群化作戰", "takeaway": "架構師 Agent 規劃拓撲、開發 Agent 模組編程、紅隊 Agent 滲透攻防、審計 Agent 驗證合約，形成自我博弈與持續優化的超級團隊！", "title": "多 Agent 協同集群 (Multi-Agent Swarms)：分散式智能交響樂"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>自主異常免疫反應 (Autonomous Immune Response)</strong>：一旦線上捕獲到未知的崩潰邊界，自癒守護進程自動啟動分析並在隔離環境測試補丁。", "<strong>依賴庫與架構自適應升級</strong>：當底層語言版本（如 Python 3.14 到 3.15）或關鍵框架升級時，Agent 自動拉取分支、更新語法並修復所有廢棄 API。", "<strong>持續消除技術債 (Zero Technical Debt)</strong>：代碼庫在每週深夜閒置算力時段自主進行死代碼清理、性能熱點優化與文檔自動對齊。"], "layout": "自癒系統閉環圖：線上遙測異常 (Telemetry) -> Agent 觸發自癒流水線 -> 隔離合成防護補丁 -> 驗證通過熱更新上線 -> 系統恢復綠燈健康態。", "metaphor": "就像人體神奇的免疫系統：當皮膚不小心被小石子擦傷或微量細菌侵入時，白血球與血小板自動在傷口處聚集殺菌凝血並生成新表皮，根本不需要大腦每秒鐘下達指令去指揮細胞分裂。", "page_num": 3, "subtitle": "系統不再是死板的二進制檔案，而是具有免疫與自我修復能力的有機體", "takeaway": "當生產環境出現異常或第三方 API 發生變更，系統能在無人值守的情況下自主診斷、重構代碼並發佈修補！", "title": "自癒與自主演化的代碼庫 (Self-Healing & Evolving Codebases)"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>從『如何實現 (How)』轉向『實現什麼與為何實現 (What & Why)』</strong>：工程師的核心產出物不再是一萬行代碼，而是一份數學級嚴密的架構規範規格書。", "<strong>語義契約成為唯一事實來源 (Source of Truth)</strong>：規範不再是落後於代碼的陳舊 Word 文檔，而是可以直接被編譯為代碼與驗證套件的動態藍圖。", "<strong>高階抽象層的持續攀升</strong>：正如現代工程師不再手寫 x86 組合語言一樣，未來的工程師將在比高級語言更高維度的語義規範層指點江山。"], "layout": "職責金字塔遷移圖：底層（樣板語法、函數實作）完全被自動化底座吸收，人類工程師的重心全量上浮至頂層的『架構規範 (Spec)』與『業務不變式 (Invariants)』。", "metaphor": "這就像摩天大樓的首席總建築設計師：他從來不需要親自去工地現場拌水泥或捆紮鋼筋；他的核心工作是計算地質承重極限、規劃防震風阻結構力學，並在圖紙上精確勾勒出整座大廈的幾何外觀與安全邊界。", "page_num": 4, "subtitle": "當編碼被徹底自動化，什麼才是軟體架構師不可撼動的核心資產？", "takeaway": "定義目標函數、系統邊界、不變式約束 (Invariants) 與業務意圖，將成為工程師最具價值的本質工作！", "title": "架構即規範 (Architecture-as-Spec)：工程師職責的終極收斂"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>一次性專屬軟體 (Disposable Ephemeral Apps)</strong>：為了分析某位財務分析師今天的一張特殊報表，Agent 在 5 秒內生成專屬 UI 工具，分析完畢後自動銷毀。", "<strong>告別臃腫的套裝通用軟體</strong>：使用者不再需要為了一個簡單需求去購買塞滿 99% 無用功能的龐大 ERP，而是隨需生成完全貼合個人習慣的工作流。", "<strong>長尾小眾需求的大爆發</strong>：過去因為商業收益太小而無法立項的冷門領域需求，在 AI 自主生成賦能下將獲得全面的數位化解決方案。"], "layout": "軟體生命形態演進：傳統巨石套裝軟體（昂貴、笨重、功能冗餘） vs 未來即時生成微軟體（極輕、極快、百億人百億面）。", "metaphor": "這就像從傳統服裝店買標準 S/M/L 號成衣，飛躍到了高科技奈米量體裁衣鏡前：鏡頭掃描你的身材三秒鐘，一台精密的分子編織機立刻為你量身織出一件完美貼合每一處肌肉線條的專屬晚禮服，穿完當天還能回收分解。", "page_num": 5, "subtitle": "軟體不再是通用的一體化巨石，而是針對單一使用者即時生成的微型工具", "takeaway": "當構建軟體的成本接近於零，軟體將從『昂貴的耐用品』轉變為『即用即棄的流動性服務』！", "title": "邊際成本趨零下的超客製化軟體 (Hyper-Personalized Software)"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>直覺探索與符號裁決的完美共生</strong>：由神經網路（Claude）負責天馬行空地探索潛在演算法路徑，由形式化符號系統進行嚴苛的數學邏輯推導。", "<strong>零漏洞證明的航太級可靠性</strong>：在航空航天、自動駕駛與核心加密金融合約中，代碼必須通過形式化數學證明，確保永不發生狀態死鎖或溢出。", "<strong>終結幻覺引發的信任危機</strong>：機率模型生成任何代碼，如果通不過背後的符號邏輯驗證網，根本無法走出沙盒，從根本上消弭安全焦慮。"], "layout": "神經符號雙螺旋架構：左螺旋為 LLM 直覺生成空間（機率型、發散式），右螺旋為 Formal Solver 形式化驗證空間（確定型、收斂式），交匯處輸出零缺陷代碼。", "metaphor": "如同法庭上的最佳搭檔：神經網路大模型就像充滿洞察力的刑事警探，在千萬條線索中敏銳直覺鎖定嫌疑人作案邏輯；而符號形式化系統則是精通法典的嚴肅法官，必須每一條證據都具備無可辯駁的 DNA 與指紋鏈，才允許下達有罪判決。", "page_num": 6, "subtitle": "用數學邏輯的絕對確定性，徹底馴服大語言模型的機率性幻覺", "takeaway": "結合機率大模型 (LLM) 的廣泛直覺創造力，與數學定理證明器 (Z3/Coq) 的絕對嚴謹性，締造堅不可摧的關鍵安全系統！", "title": "形式化驗證與神經符號結合 (Neuro-Symbolic & Formal Verification)"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>定義『什麼是有價值的問題』</strong>：Agent 可以解答一千個技術難題，但只有深刻理解人類痛苦與渴望的人類工程師，才知道哪一個問題值得被解答。", "<strong>極致的人性化同理體驗</strong>：對使用者微弱情感變化的共情、對介面流暢度的心靈契合，這些微妙的美學直覺源於人類血肉之軀的生命體驗。", "<strong>倫理底線與安全價值的守門人</strong>：決定哪些代碼『不應該被寫出來』、堅守資料平權與隱私倫理，是人類對文明不可推卸的責任。"], "layout": "人類核心護城河價值模型：三大不可取代維度——深層業務同理心 (Empathy)、批判性架構審美 (Aesthetics)、道德倫理守門人 (Ethics)。", "metaphor": "就像在電影創作領域：無論未來的 3D 渲染引擎與 AI 視頻生成多麼震撼逼真，真正能讓觀眾在黑暗電影院中淚流滿面的，永遠是導演對人世間愛恨離合、孤獨與救贖的深刻靈魂共鳴。", "page_num": 7, "subtitle": "在 AI 無所不能的時代，人類不可被取代的神聖特質是什麼？", "takeaway": "機器永遠不知道人類為何而渴望；同理心、深層人本關懷、跨領域美學與倫理價值審判，是人類工程師永遠的護城河！", "title": "人類軟體工程師的終極價值錨點：意義、同理心與倫理邊界"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>粉碎人月神話 (The Mythical Man-Month Disrupted)</strong>：傳統 500 人團隊中 80% 的精力消耗在跨部門拉扯開會；而 5 人架構團隊各自調度 Agent 集群，溝通零延遲。", "<strong>超級個體 (Super-Individual) 的崛起</strong>：一位精通 AI-Native SDLC 的架構師，一天之內完成過去需要一整個前端、後端、QA 團隊兩週的工作量。", "<strong>扁平高敏捷的現代軟體組織</strong>：管理層級被徹底壓平，工程師全員直面業務問題，研發響應速度提升十倍以上。"], "layout": "生產力對比天平圖：左側展示傳統 500 人龐大臃腫組織（層層會議、溝通損耗），右側展示 5 位 AI-Native 架構師操縱 Agent 集群的高速輕盈作戰單元。", "metaphor": "這就像從古代需要數萬名民夫靠肩膀拉縴的巴比倫工程隊，變成了現代由五名重型機械駕駛員操縱的現代化全自動盾構機隊：五個人坐在有空調的駕駛艙內操縱手柄，推進速度與隧道精度超過萬名苦力百倍！", "page_num": 8, "subtitle": "小即是美，精悍即是強大：組織架構與工程生產力的超級重組", "takeaway": "擺脫布魯克斯人月神話的詛咒！溝通成本不再隨團隊規模指數暴增，極簡的精銳架構師團隊將具備媲美跨國巨頭的吞吐量！", "title": "認知槓桿的千倍放大：5 人架構師團隊抗衡 500 人傳統軍團"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>即時需求回饋流 (Real-time Feedback Streams)</strong>：使用者在客戶端的一個困惑操作手勢，即時觸發後台 Agent 的交互優化與 A/B 測試發佈。", "<strong>持續無感的動態演進</strong>：不再有浩大且令人神經緊繃的『大版本發佈日』，系統在每一次 HTTP 請求之間動態自適應演進。", "<strong>軟體從『名詞』變成『動詞』</strong>：軟體不再是一個固定存放在磁碟裡的靜態發行套件，而是一股持續解決現實世界問題的智慧算力流。"], "layout": "有機生命流動圖：打破傳統 Waterfall / Agile 的硬性方塊，以首尾相連、平滑流動的動態莫比烏斯環展示自主創造生命週期的有機演進。", "metaphor": "就像熱帶雨林中的有機生態：樹木與藤蔓從不需要等待一份季度升級計畫才開始生長；它們每一秒都在根據陽光角度、雨水降量與土壤養分自主調節葉片方向與根系伸展，展現出無窮的生機活力。", "page_num": 9, "subtitle": "軟體生命週期從封閉的階段式流程，演變為生生不息的自我演進系統", "takeaway": "需求、設計、編碼、測試、上線與維運的離散界限徹底消失，軟體研發演化為持續適應環境變化的有機呼吸過程！", "title": "從 SDLC 到自主創造生命週期 (Autonomous Creation Lifecycle)"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>憲政 AI (Constitutional AI) 的價值基石</strong>：從預訓練與 RLHF 階段即內建嚴格的安全原則，確保模型誠實、無害且始終遵循人類憲章約束。", "<strong>前沿紅隊防禦 (Frontier Red Teaming)</strong>：在每一次旗艦模型發布前進行極限滲透攻防測試，嚴格防範模型在生化、網路攻擊與越權操作中的風險。", "<strong>賦能人類而非取代人類 (Augmenting, Not Replacing)</strong>：Anthropic 的所有工具設計均堅持 Human-in-the-Loop，致力於將人類工程師的潛能放大到極致。"], "layout": "安全架構基石圖：最底層為 Constitutional AI 憲政基石，中層為前沿安全防護網與嚴苛可解釋性研究，頂層承載賦能人類的 AI-Native 工具矩陣。", "metaphor": "如同在建造人類歷史上速度最快的超音速噴射客機時，頂級工程師首先投入最多心血研發的是三重冗餘液壓剎車系統、航電防撞雷達與防火逃生艙：唯有最可靠的剎車系統，才賦予飛行員在藍天中極速翱翔的底氣與自由！", "page_num": 10, "subtitle": "在狂飆突進的智能浪潮中，唯有對安全與道德的敬畏才能引導技術向善", "takeaway": "Anthropic 始終將模型安全性、可解釋性與 Constitutional AI 置於首位，為全球工程師提供最值得信賴的 AI 底座！", "title": "Anthropic 的技術信仰與承諾：安全優先、憲政 AI 與責任賦能"}, {"chapter_id": 20, "chapter_name": "第 20 章：Future Vision — 未來展望與自主軟體製造工廠", "details": ["<strong>擁抱變革是唯一的生存法則</strong>：歷史從不憐憫沉溺於舊技能的固執者，它永遠獎賞勇敢邁入未知新大陸的拓荒者與探險家。", "<strong>即刻行動：從第一個專案的 CLAUDE.md 開始</strong>：不要被宏大的未來設想嚇倒，今天就為你的代碼庫立憲，開啟人機共創的第一步。", "<strong>致敬每一位勇敢的架構領航員</strong>：在這個大時代的破曉時分，願你能揮灑人類最深邃的智慧，與 AI 一同編織出造福全人類的偉大軟體！"], "layout": "宏偉未來啟航圖：金色晨曦的地平線上，一艘高科技現代化巨輪揚帆啟航，象徵每一位掌握 AI-Native SDLC 的軟體工程師昂首航向智慧時代的星辰大海。", "metaphor": "如同在大航海時代的黎明，哥倫布站在聖瑪利亞號的艦首眺望大西洋深處那片未知的海平線：海風呼嘯，星斗指路；那些勇敢收起近海漁網、升起遠航巨帆的航海家們，終將抵達一片無比壯麗的新大陸！", "page_num": 11, "subtitle": "未來已來，唯變不變；掌握 AI-Native SDLC，開啟屬於你的全新軟體黃金時代！", "takeaway": "不要等待未來的到來，而要親手去構建它；以架構師的格局思考，以指揮官的姿態引領，我們都是新一代自主軟體工廠的奠基者！", "title": "結語：站在新舊時代交替的地平線上——成為未來的軟體架構領航員"}];

    let currentMode = 'detailed'; // 'overview' or 'detailed'
    let currentDetailedIdx = 0;
    let currentOverviewIdx = 0;

    let flowchartTransform = { x: 0, y: 0, scale: 1 };
    let mindmapTransform = { x: 0, y: 0, scale: 1 };

    // 初始化載入
    document.addEventListener("DOMContentLoaded", () => {
      buildSidebar();
      renderSlide();
      setupKeyboardShortcuts();
    });

    // 切換模式：大綱 vs 詳細
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("tab-overview").classList.toggle("active", mode === 'overview');
      document.getElementById("tab-detailed").classList.toggle("active", mode === 'detailed');
      buildSidebar();
      renderSlide();
    }

    // 切換章節下拉選單
    function handleChapterSelect(chVal) {
      if (chVal === 'all') return;
      const targetCh = parseInt(chVal);
      
      if (currentMode === 'overview') {
        switchMode('detailed');
      }
      
      const targetIdx = detailedSlides.findIndex(s => s.chapter_id === targetCh);
      if (targetIdx !== -1) {
        currentDetailedIdx = targetIdx;
        renderSlide();
      }
    }

    // 建構側邊欄列表
    function buildSidebar() {
      const listContainer = document.getElementById("sidebar-list");
      listContainer.innerHTML = "";

      const slides = (currentMode === 'detailed') ? detailedSlides : overviewSlides;

      // Group by chapter
      const groups = {};
      slides.forEach((slide, idx) => {
        const chName = slide.chapter_name || `Chapter ${slide.chapter_id}`;
        if (!groups[chName]) groups[chName] = [];
        groups[chName].push({ slide, idx });
      });

      for (const [chName, items] of Object.entries(groups)) {
        const groupDiv = document.createElement("div");
        groupDiv.className = "chapter-group";

        const headerDiv = document.createElement("div");
        headerDiv.className = "chapter-header";
        headerDiv.textContent = chName;
        groupDiv.appendChild(headerDiv);

        items.forEach(item => {
          const itemDiv = document.createElement("div");
          itemDiv.className = `page-item page-item-${item.idx}`;
          
          const currentIdx = (currentMode === 'detailed') ? currentDetailedIdx : currentOverviewIdx;
          if (item.idx === currentIdx) itemDiv.classList.add("active");

          itemDiv.onclick = () => {
            if (currentMode === 'detailed') {
              currentDetailedIdx = item.idx;
            } else {
              currentOverviewIdx = item.idx;
            }
            renderSlide();
          };

          const titleSpan = document.createElement("span");
          titleSpan.style.overflow = "hidden";
          titleSpan.style.textOverflow = "ellipsis";
          titleSpan.style.whiteSpace = "nowrap";
          titleSpan.style.marginRight = "8px";
          titleSpan.textContent = item.slide.title;

          const badgeSpan = document.createElement("span");
          badgeSpan.className = "page-badge";
          badgeSpan.textContent = `P.${item.slide.page_num}`;

          itemDiv.appendChild(titleSpan);
          itemDiv.appendChild(badgeSpan);
          groupDiv.appendChild(itemDiv);
        });

        listContainer.appendChild(groupDiv);
      }
    }

    // 渲染投影片
    function renderSlide() {
      const card = document.getElementById("slide-card");
      const slides = (currentMode === 'detailed') ? detailedSlides : overviewSlides;
      const idx = (currentMode === 'detailed') ? currentDetailedIdx : currentOverviewIdx;
      const slide = slides[idx];

      if (!slide) return;

      // 更新側邊欄高亮
      document.querySelectorAll(".page-item").forEach(el => el.classList.remove("active"));
      const activeItem = document.querySelector(`.page-item-${idx}`);
      if (activeItem) {
        activeItem.classList.add("active");
        activeItem.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      // 更新 Header 下拉選單同步
      const chSelect = document.getElementById("chapter-select");
      if (chSelect && slide.chapter_id) {
        chSelect.value = slide.chapter_id.toString();
      }

      // 檢查是否為大綱第 2 頁心智圖特殊處理
      if (currentMode === 'overview' && slide.is_mindmap) {
        renderMindmapSlide(card, slide, idx, slides.length);
        return;
      }

      // 一般投影片渲染
      const currentChapterFlowchart = flowcharts[slide.chapter_id] || "";

      let detailsHtml = "";
      if (Array.isArray(slide.details)) {
        detailsHtml = slide.details.map((d, i) => `
          <div class="numbered-point-item">
            <div class="num-badge">${i + 1}</div>
            <div class="point-text-box">${d}</div>
          </div>
        `).join("");
      }

      let metaphorHtml = "";
      if (slide.metaphor) {
        metaphorHtml = `
          <div class="metaphor-card">
            <div class="metaphor-header">
              <span class="metaphor-icon">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14H8a4 4 0 01-.9-7.898 4 4 0 017.8 0A4 4 0 0112 14z" />
                </svg>
              </span>
              <span>實務概念類比 (Conceptual Metaphor)</span>
            </div>
            <div class="metaphor-text">${slide.metaphor}</div>
          </div>
        `;
      }

      let rightColContent = "";
      if (currentChapterFlowchart) {
        rightColContent = `
          <div class="visual-layout-panel">
            <div class="visual-header-row">
              <span class="visual-title">章節架構流程圖 (Flowchart)</span>
              <button class="mindmap-control-btn" style="width:22px;height:22px;font-size:11px;" title="重置縮放" onclick="resetFlowchartZoom()">↺</button>
            </div>
            <div class="visual-desc">${slide.layout || "滾輪縮放、拖曳平移觀察各階段架構演進"}</div>
            <div class="flowchart-wrapper" id="flowchart-wrapper">
              ${currentChapterFlowchart}
            </div>
          </div>
        `;
      } else {
        rightColContent = `
          <div class="visual-layout-panel">
            <span class="visual-title">視覺版面設計與配置建言</span>
            <div class="visual-desc" style="font-size:13px;line-height:1.6;color:var(--text-main);margin-top:10px;">${slide.layout || "暫無特別排版說明"}</div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="card-meta-row">
          <span class="chapter-badge">${slide.chapter_name || `Chapter ${slide.chapter_id}`}</span>
          <span class="page-indicator-text">Page ${slide.page_num}</span>
        </div>

        <div class="slide-title-block">
          <h2 class="slide-title">${slide.title}</h2>
          <div class="slide-subtitle">${slide.subtitle || slide.takeaway || ""}</div>
        </div>

        <div class="slide-content-columns">
          <div class="left-col">
            <div class="section-header">關鍵核心技術要點 (Core Takeaways)</div>
            <div class="numbered-points-list">
              ${detailsHtml}
            </div>
            ${metaphorHtml}
          </div>
          <div class="right-col">
            ${rightColContent}
          </div>
        </div>

        <div class="card-bottom-bar">
          <div class="shortcut-tips">
            <span>快捷鍵：</span>
            <span><kbd class="key-badge">←</kbd> <kbd class="key-badge">→</kbd> 翻頁</span>
            <span><kbd class="key-badge">M</kbd> 目錄</span>
            <span><kbd class="key-badge">D</kbd> 主題</span>
            <span><kbd class="key-badge">F</kbd> 全螢幕</span>
          </div>
          <div class="slide-counter">
            <span>${idx + 1}</span> / ${slides.length}
          </div>
          <div class="nav-btns">
            <button class="nav-btn" onclick="prevSlide()" ${idx === 0 ? 'disabled' : ''}>
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
              上一頁
            </button>
            <button class="nav-btn" onclick="nextSlide()" ${idx === slides.length - 1 ? 'disabled' : ''}>
              下一頁
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
          </div>
        </div>
      `;

      if (currentChapterFlowchart) {
        setupFlowchartInteraction();
      }
    }

    // 大綱第 2 頁心智圖渲染
    function renderMindmapSlide(card, slide, idx, totalCount) {
      card.innerHTML = `
        <div class="card-meta-row">
          <span class="chapter-badge">全書架構導覽</span>
          <span class="page-indicator-text">Overview Mindmap (Slide 2)</span>
        </div>

        <div class="slide-title-block" style="margin-bottom:10px;">
          <h2 class="slide-title">${slide.title}</h2>
          <div class="slide-subtitle">${slide.subtitle}</div>
        </div>

        <div class="mindmap-outer-container" id="mindmap-svg-wrapper">
          <div class="mindmap-controls">
            <button class="mindmap-control-btn" title="放大" onclick="zoomMindmap(1.2)">+</button>
            <button class="mindmap-control-btn" title="縮小" onclick="zoomMindmap(0.8)">-</button>
            <button class="mindmap-control-btn" title="重置" onclick="resetMindmap()">↺</button>
          </div>
          
          <div class="mindmap-tooltip" id="mindmap-tooltip">
            <div class="mindmap-tooltip-title" id="mm-title">模組標題</div>
            <div id="mm-desc">模組詳細說明文字...</div>
            <div style="font-size:10px;color:#94a3b8;margin-top:4px;">💡 提示：點擊節點可直接跳轉至該章詳細投影片</div>
          </div>

          ${slide.svg_content}
        </div>

        <div class="card-bottom-bar" style="margin-top:10px;">
          <div class="shortcut-tips">
            <span>操作指南：滑鼠拖曳平移、滾輪縮放、懸停高亮連線、點擊節點跳轉各章</span>
          </div>
          <div class="slide-counter">
            <span>${idx + 1}</span> / ${totalCount}
          </div>
          <div class="nav-btns">
            <button class="nav-btn" onclick="prevSlide()" ${idx === 0 ? 'disabled' : ''}>上一頁</button>
            <button class="nav-btn" onclick="nextSlide()" ${idx === totalCount - 1 ? 'disabled' : ''}>下一頁</button>
          </div>
        </div>
      `;

      setupMindmapInteraction();
    }

    // 下一頁
    function nextSlide() {
      if (currentMode === 'detailed') {
        if (currentDetailedIdx < detailedSlides.length - 1) {
          currentDetailedIdx++;
          renderSlide();
        }
      } else {
        if (currentOverviewIdx < overviewSlides.length - 1) {
          currentOverviewIdx++;
          renderSlide();
        }
      }
    }

    // 上一頁
    function prevSlide() {
      if (currentMode === 'detailed') {
        if (currentDetailedIdx > 0) {
          currentDetailedIdx--;
          renderSlide();
        }
      } else {
        if (currentOverviewIdx > 0) {
          currentOverviewIdx--;
          renderSlide();
        }
      }
    }

    // 搜尋功能
    function handleSearch() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const groups = document.querySelectorAll(".chapter-group");
      const slides = (currentMode === 'detailed') ? detailedSlides : overviewSlides;

      slides.forEach((slide, idx) => {
        const node = document.querySelector(`.page-item-${idx}`);
        if (!node) return;

        const matchTitle = slide.title.toLowerCase().includes(query);
        const matchSubtitle = (slide.subtitle || "").toLowerCase().includes(query);
        const matchTakeaway = (slide.takeaway || "").toLowerCase().includes(query);
        const matchPage = slide.page_num.toString() === query;
        const matchDetails = Array.isArray(slide.details) && slide.details.some(d => d.toLowerCase().includes(query));

        if (matchTitle || matchSubtitle || matchTakeaway || matchPage || matchDetails || query === '') {
          node.style.display = 'flex';
        } else {
          node.style.display = 'none';
        }
      });

      groups.forEach(group => {
        const visibleItems = group.querySelectorAll('.page-item[style*="display: flex"], .page-item:not([style])');
        if (visibleItems.length === 0 && query !== '') {
          group.style.display = 'none';
        } else {
          group.style.display = 'block';
        }
      });
    }

    // 流程圖互動 (拖曳平移與滾輪縮放)
    function resetFlowchartZoom() {
      const svg = document.querySelector(".flowchart-wrapper svg");
      if (svg) {
        flowchartTransform = { x: 0, y: 0, scale: 1 };
        svg.style.transform = 'translate(0px, 0px) scale(1)';
      }
    }

    function setupFlowchartInteraction() {
      const wrapper = document.getElementById("flowchart-wrapper");
      if (!wrapper) return;
      const svg = wrapper.querySelector("svg");
      if (!svg) return;

      let dragging = false;
      let start = { x: 0, y: 0 };

      svg.style.transition = "transform 0.08s ease-out";
      svg.style.transformOrigin = "center center";

      wrapper.onmousedown = (e) => {
        dragging = true;
        start = { x: e.clientX - flowchartTransform.x, y: e.clientY - flowchartTransform.y };
        wrapper.style.cursor = "grabbing";
      };

      window.onmousemove = (e) => {
        if (!dragging) return;
        flowchartTransform.x = e.clientX - start.x;
        flowchartTransform.y = e.clientY - start.y;
        svg.style.transform = `translate(${flowchartTransform.x}px, ${flowchartTransform.y}px) scale(${flowchartTransform.scale})`;
      };

      window.onmouseup = () => {
        dragging = false;
        if (wrapper) wrapper.style.cursor = "grab";
      };

      wrapper.onwheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 0.88;
        flowchartTransform.scale *= factor;
        flowchartTransform.scale = Math.max(0.5, Math.min(3.5, flowchartTransform.scale));
        svg.style.transform = `translate(${flowchartTransform.x}px, ${flowchartTransform.y}px) scale(${flowchartTransform.scale})`;
      };
    }

    // 心智圖互動 (縮放、平移、懸停連線高亮、點擊跳轉)
    function zoomMindmap(factor) {
      const container = document.getElementById("mindmap-container");
      if (!container) return;
      mindmapTransform.scale *= factor;
      mindmapTransform.scale = Math.max(0.4, Math.min(3.5, mindmapTransform.scale));
      container.setAttribute("transform", `translate(${mindmapTransform.x}, ${mindmapTransform.y}) scale(${mindmapTransform.scale})`);
    }

    function resetMindmap() {
      const container = document.getElementById("mindmap-container");
      if (!container) return;
      mindmapTransform = { x: 0, y: 0, scale: 1 };
      container.setAttribute("transform", `translate(0, 0) scale(1)`);
    }

    function setupMindmapInteraction() {
      const wrapper = document.getElementById("mindmap-svg-wrapper");
      const container = document.getElementById("mindmap-container");
      if (!wrapper || !container) return;

      let dragging = false;
      let start = { x: 0, y: 0 };

      wrapper.onmousedown = (e) => {
        if (e.target.closest('.ch-node-group')) return;
        dragging = true;
        start = { x: e.clientX - mindmapTransform.x, y: e.clientY - mindmapTransform.y };
        wrapper.style.cursor = "grabbing";
      };

      window.onmousemove = (e) => {
        if (!dragging) return;
        mindmapTransform.x = e.clientX - start.x;
        mindmapTransform.y = e.clientY - start.y;
        container.setAttribute("transform", `translate(${mindmapTransform.x}, ${mindmapTransform.y}) scale(${mindmapTransform.scale})`);
      };

      window.onmouseup = () => {
        dragging = false;
        if (wrapper) wrapper.style.cursor = "grab";
      };

      wrapper.onwheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        zoomMindmap(factor);
      };

      // 節點懸停與點擊跳轉
      const nodeGroups = document.querySelectorAll(".ch-node-group");
      const tooltip = document.getElementById("mindmap-tooltip");
      const mmTitle = document.getElementById("mm-title");
      const mmDesc = document.getElementById("mm-desc");

      const nodeInfoText = {
        "1": "探討傳統手寫代碼模式向 AI 原生架構驅動的百年範式轉移，開發者轉變為高階指揮官。",
        "2": "Anthropic 官方五大核心工程哲學：Small Loops、Clean Context、Spec-Driven 等原則。",
        "3": "專案代碼庫的最高治理憲章：如何撰寫高品質、可自動驗證的 CLAUDE.md。",
        "4": "自訂命令與自適應工作流：封裝重複任務與多步驟編排的斜線指令架構。",
        "5": "Model Context Protocol：打破模型孤島，連接本地工具、資料庫與外部 API 的標準協議。",
        "6": "安全防護網：Pre/Post Tool Use Hooks 與不可篡改的安全審查防火牆體系。",
        "7": "Stage 1 概念構思：從模糊需求到確定性 intent.md 與需求澄清對齊。",
        "8": "Stage 2 原型設計：極速打造可交互原型、視覺驗證與消除歧義的反饋閉環。",
        "9": "Stage 3 系統架構：編寫嚴謹的 spec.md 與可落地的 plan.md 實施藍圖。",
        "10": "Stage 3 任務編排：Subagents 隔離分工與 Tasks 模組化自主推進機制。",
        "11": "Stage 4 驗證閉環：Non-zero 退出碼、TDD 失敗測試先行與自我驗證循環。",
        "12": "Stage 4 持續評測：在 CI 中運行 Continuous Evals，建立永不磨損的模型度量衡。",
        "13": "Stage 5 程式碼審查：託管審查服務、REVIEW.md 憲章與 @claude 互動修復循環。",
        "14": "Stage 5 自動化部署：自動化部署流水線配置、發佈守護與異常快速回滾。",
        "15": "Stage 5 進階發佈：藍綠部署、金絲雀灰度發佈與全自動健康監控網。",
        "16": "Stage 6 線上維護：從線上異常警報自動定位修復並建立長效防範措施。",
        "17": "Stage 6 定期掃描：代碼漂移與模型躍遷下的全自動週期性弱點檢測巡檢。",
        "18": "Stage 6 即時除錯：在 Slack/PagerDuty 中透過 Claude Tag 即時召喚值班專家救火。",
        "19": "企業級治理架構：Zero Data Retention 隱私、MCP 沙盒授權與四階段落地轉型路線圖。",
        "20": "未來願景展望：多 Agent 集群協同、自癒演化代碼庫與自主軟體製造工廠。"
      };

      nodeGroups.forEach(group => {
        const chId = group.getAttribute("data-ch");

        group.onmouseenter = () => {
          const linksStr = group.getAttribute("data-links") || "";
          const linkIds = linksStr.split(",");
          linkIds.forEach(id => {
            const path = document.getElementById(id.trim());
            if (path) path.classList.add("link-active");
          });
          const rect = group.querySelector("rect");
          if (rect) rect.classList.add("node-active");

          const textEl = group.querySelector("text");
          if (textEl) mmTitle.textContent = textEl.textContent;
          mmDesc.textContent = nodeInfoText[chId] || "點擊跳轉至該章詳細投影片。";
          tooltip.style.display = "block";
        };

        group.onmouseleave = () => {
          const linksStr = group.getAttribute("data-links") || "";
          const linkIds = linksStr.split(",");
          linkIds.forEach(id => {
            const path = document.getElementById(id.trim());
            if (path) path.classList.remove("link-active");
          });
          const rect = group.querySelector("rect");
          if (rect) rect.classList.remove("node-active");
          tooltip.style.display = "none";
        };

        group.onclick = () => {
          const firstSlideIdx = detailedSlides.findIndex(s => s.chapter_id.toString() === chId);
          if (firstSlideIdx !== -1) {
            currentDetailedIdx = firstSlideIdx;
            switchMode('detailed');
          }
        };
      });
    }

    // 鍵盤快捷鍵
    function setupKeyboardShortcuts() {
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
          e.preventDefault();
          nextSlide();
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          prevSlide();
        } else if (e.key.toLowerCase() === "m") {
          toggleSidebar();
        } else if (e.key.toLowerCase() === "d") {
          toggleTheme();
        } else if (e.key.toLowerCase() === "f") {
          toggleFullscreen();
        }
      });
    }

    // 切換側邊欄
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("collapsed");
    }

    // 切換主題 (深色 / 淺色)
    function toggleTheme() {
      const currentTheme = document.body.getAttribute("data-theme") || "light";
      const nextTheme = currentTheme === "light" ? "dark" : "light";
      document.body.setAttribute("data-theme", nextTheme);
    }

    // 全螢幕切換
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
