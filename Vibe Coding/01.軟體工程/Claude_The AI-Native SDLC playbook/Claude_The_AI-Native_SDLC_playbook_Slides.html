e 3 Build 團隊智慧核心心法與下章預告", "takeaway": "CLAUDE.md 是人機協同的大腦中樞，但若要承載深度、專業化的企業制度，我們需要更模組化的利器——Skills！", "details": ["<strong>三大黃金法則</strong>：保持在 1 頁以內、恪守犯錯兩次法則、將完成標準 (Verification) 白紙黑字固化。", "<strong>立即行動</strong>：在終端機對你的核心倉庫運行一次 `/init`，提煉出屬於你們團隊的第一份 CLAUDE.md！", "<strong>前瞻第八章</strong>：當某些安全與 API 規範過於龐大、無法塞進一頁紙時該怎麼辦？第八章將為您呈現『Skills 機構知識模組化』的卓越架構！"], "metaphor": "不貳過，是古代賢人的最高修養；而 CLAUDE.md 則是將這種最高修養，以一行行代碼與規範的形式，賦予了整個團隊的每一次 AI 工作階段。", "layout": "三條核心實踐卡片，底部搭配通往第八章 Skills 的高亮躍遷箭頭。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 1, "title": "什麼是 Agent Skills？將機構知識轉化為可執行操作", "subtitle": "超越提示詞的模組化外掛：讓特定領域的專業規章成為活生生的能力", "takeaway": "Skills 是組織將制度化隱性知識轉化為標準化、版本控制、可廣泛分發且按需加載的模組化能力。", "details": ["<strong>解決知識膨脹與混亂</strong>：如果把所有 API 規範、資安準則全部塞進 CLAUDE.md，檔案將迅速突破數萬字導致模型癱瘓；Skills 完美實現了按需解耦。", "<strong>明確的觸發邊界</strong>：每個 Skill 都有前置的 YAML 元數據宣告『何時應該被觸發』，Agent 只有在處理相關任務時才會精準加載。", "<strong>中央集中更新與即時生效</strong>：安全團隊更新了 API 安全標準，全公司所有工程師在下次啟動相關任務時，全自動繼承最新版防禦策略。"], "metaphor": "就像急診室醫生隨身攜帶的『專業急救操作指南插卡』：平時不佔用大腦記憶體，但一遇到『心跳驟停』或『劇毒蛇咬傷』，醫生立刻抽取出對應卡片精準施救。", "layout": "插卡式模組拓撲圖：Agent 主機作為底座，上方插滿了 API Security、Brand Guideline、DB Migration 等各類專業 Skill 插卡。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 2, "title": "Skills vs CLAUDE.md vs Prompts：黃金劃分界線", "subtitle": "Anthropic 官方經驗法則 (Rule of Thumb)：什麼內容該放在哪裡？", "takeaway": "凡是全域必須知曉的一頁內放 CLAUDE.md；凡是單次自定義想法放 Prompt；凡是跨團隊必須一致執行的機構制度放 Skill！", "details": ["<strong>CLAUDE.md 的職責</strong>：全倉庫開機必讀、建置測試指令、核心架構邊界、全域避坑禁忌（少於 1 頁）。", "<strong>Prompts 的職責</strong>：特定具體任務的臨時要求（如：『幫我把這個圖標換成綠色』），一次性消費即丟。", "<strong>Skills 的職責</strong>：在組織內執行參差不齊的制度化知識（如 API 安全標準、微服務通訊契約、合規審計埋點），需要被反覆嚴格落實。"], "metaphor": "CLAUDE.md 就像公司的『員工守則手冊』；Prompt 就像主管今天交辦的一張『即時便利貼』；而 Skill 則是厚重且權威的『特種設備操作執照認證手冊』。", "layout": "三欄矩陣對照表：清晰比較 CLAUDE.md、Prompts 與 Skills 在觸發頻率、生命週期、擁有者與適用場景的本質差異。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 3, "title": "SKILL.md 檔案剖析：YAML Frontmatter 與指令主體", "subtitle": "標準化目錄結構與語法規範：以 .claude/skills/<name>/SKILL.md 為家", "takeaway": "一個標準的 Skill 包含兩個關鍵部分：描述觸發條件的 YAML 前置元數據，以及描述具體行動步驟的 Markdown 正文。", "details": ["<strong>標準路徑約定</strong>：存放在倉庫根目錄的 `.claude/skills/<skill-name>/SKILL.md`，隨著代碼一起納入 Git 版本控制。", "<strong>YAML Frontmatter</strong>：定義 `name` 與 `description`。描述必須極其精確地說明『何時觸發（Trigger condition）』，引導 Agent 自動判斷調用時機。", "<strong>Markdown 內容主體</strong>：分步驟列出合規清單、參數格式、範例代碼與驗證腳本路徑，讓 Agent 照方抓藥。"], "metaphor": "就像藥品包裝盒：正面標註適應症與用藥時機（YAML 元數據：咳嗽發燒時使用），盒子裡面附帶詳細的藥物化學結構與按體重計算的服用劑量說明書（Markdown 正文）。", "layout": "雙層結構卡片展示：上半部為藍色背景的 YAML 元數據，下半部為白色背景的具體實施細則。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 4, "title": "官方實戰範例拆解：secure-api-review 安全審查", "subtitle": "Anthropic 原文剖析：對外 API 端點的四大必殺防線", "takeaway": "這個官方範例展示了如何用清晰、條理化的規則，在編碼當下徹底杜絕匿名訪問與 PII 外洩。", "details": ["```markdown\n---\nname: secure-api-review\ndescription: Apply the API security standard. Use whenever creating or\n  modifying an external-facing endpoint, reviewing API code, or\n  generating an OpenAPI spec.\n---\n# Secure API review\n\nWhen you create or change an API endpoint:\n1. Authentication: every endpoint requires the gateway JWT;\n   no anonymous routes outside /health.\n2. Input validation: validate request bodies against the OpenAPI\n   schema and reject unknown fields.\n3. Audit: every state-changing endpoint emits an audit event with\n   actor, action, entity and timestamp.\n4. Data classification: fields tagged pii in the schema must never\n   appear in logs or error messages.\n\nRun scripts/check-endpoints.sh and include its output in your summary.\n```", "<strong>強制四項鐵律</strong>：JWT 驗證、嚴格輸入白名單過濾、狀態變更審計事件發射、PII 欄位日誌絕對脫敏。"], "metaphor": "宛如民航客機起飛前的『防空識別與地空通信檢查單』：飛行員逐項勾選應答機編碼、高度表氣壓設定與二次雷達校準，漏勾一項禁止推入跑道。", "layout": "代碼區塊完整高亮 secure-api-review 全文，四項條例配有醒目的安全盾牌圖示。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 5, "title": "落地執行四步法：如何將一項團隊規範提煉為 Skill？", "subtitle": "從發掘痛點到組織分發的完整工業化落地閉環", "takeaway": "執行步驟：挑選一項執行不一致的痛點、協同負責人編寫 SKILL.md、測試觸發靈敏度、透過 Plugin 全局分發。", "details": ["<strong>步驟一：鎖定一項痛點</strong>：挑選當前團隊中經常被違反的規範（如 API 設計風格、日誌脫敏、品牌前端元件）。", "<strong>步驟二：編寫 SKILL.md</strong>：工程師利用 Claude 協助，將資深政策主管的 Word/Wiki 文件轉化為精確的 Markdown 步驟與 YAML 觸發詞。", "<strong>步驟三：測試觸發邊界</strong>：用多種不同的用戶提示詞測試，確保 Agent 在該觸發時 100% 喚醒，不相關任務時絕不誤加載。", "<strong>步驟四：政策變更與簽核</strong>：政策更新時修改 Skill 並由政策主管審批，全團隊在下次對話中自動無縫繼承新標準。"], "metaphor": "就像工業流水線製造模具：先找出手工打磨容易出次品的零件，將標準圖紙雕刻成高強度鋼製模具，試模衝壓確認無瑕疵後，分發給各車間直接衝壓生產。", "layout": "四步流程進度條：痛點診斷 → 編寫封裝 → 靈敏度測試 → 組織分發發布。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 6, "title": "Skills 作為軟約束 (Advisory Control) 的本質局限", "subtitle": "清醒認知：Skill 能極大降低犯錯機率，但不能保證 100% 零違規", "takeaway": "Skill 屬於諮詢式引導，是基於提示詞層面的『軟約束』；沒有任何物理力量能強制一個對話絕對不會偏離。", "details": ["<strong>提示詞遵循度的客觀邊界</strong>：即使加載了 Skill，大語言模型在極端複雜或上下文衝擊下，依然存在微小概率遺漏某些條例。", "<strong>非確定性本質</strong>：Skill 讓 Agent 傾向於主動遵守規範，在代碼被敲下的當下盡量做對，大幅減少後續審查摩擦。", "<strong>硬約束兜底的絕對必要性</strong>：對於必須零容忍、絕不允許有任何例外的底線政策，後端必須配備確定性腳本（Hooks）作為防線！"], "metaphor": "Skill 就像是交通警察發放的『安全駕駛宣傳手冊』與路口豎立的『請減速慢行』告示牌：絕大多數司機會自覺遵章守紀，但要防止酒駕衝撞，路口依然必須安裝防撞石墩與阻車釘。", "layout": "軟硬約束對比圖：左側展示 Skill 的智力引導與柔性防禦，右側展示確定性防禦的必要性與邊界。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 7, "title": "軟硬兼施的組合拳架構：Skill 鋪路，Hook 把關", "subtitle": "Anthropic 官方推薦的最佳防禦陣型", "takeaway": "Skill 負責讓違規行為變得極其罕見 (Rare)，而 Hook 則負責讓違規行為變得完全不可能 (Impossible)！", "details": ["<strong>前置智力賦能</strong>：Skill 引導 Agent 理解代碼為什麼要這樣寫、給出合規代碼骨架與最佳實務，避免盲人摸象。", "<strong>後置確定性截殺</strong>：Hook 在底層監控工具調用，一旦 Agent 偏離規範碰觸受保護路徑或遺漏 JWT，毫秒級截斷執行。", "<strong>絕佳的研發體驗</strong>：如果只有 Hook 沒有 Skill，Agent 將像個瞎子一樣不斷撞牆被拒；有了 Skill 引導，Agent 幾乎一次就能走通綠燈路徑。"], "metaphor": "這就像一場高等級高爾夫球賽：Skill 是經驗豐富的球童，在耳邊輕聲指點風向、草紋與推桿力道（智力引導）；而球洞周圍的平整果嶺與邊界圍繩（Hook）則保證球絕不會滾落懸崖。", "layout": "雙層防禦時序圖：Skill 提示在思考期生效 → Agent 生成合規代碼 → Tool 執行期由 Hook 進行確定性驗收放行。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 8, "title": "企業級分發管道：透過組織 Plugins 統一管理", "subtitle": "告別手動複製貼上，實現全公司幾千個代碼庫的秒級策略同步", "takeaway": "利用 Antigravity / Claude Code 的 Plugin 機制，中心平台團隊可將通用 Skills 統一套件化，一鍵下發給全體團隊。", "details": ["<strong>單一真相源</strong>：所有公共 Skills（如資安規範、日誌庫標準）存放在中心治理倉庫中，由各領域專家集中維護與發行版本。", "<strong>自動化依賴訂閱</strong>：各業務專案透過配置文件引入插件，每次 Agent 啟動時自動拉取最新通過測試的穩定 Skill 版本。", "<strong>避免標準碎片化</strong>：徹底杜絕『A 團隊還在用三年前的舊 API 規範，B 團隊用自己的土方法』的混亂局面。"], "metaphor": "就像手機應用商店的自動靜默更新機制：當國家頒布了新的隱私條例，銀行 App 團隊在後台發布安全更新套件，全球用戶的手機在夜間充電時自動更新完畢，無需用戶手動重新下載安裝。", "layout": "分發拓撲圖：中央 Plugin Registry 向幾十個微服務代碼庫輻射推送最新 Skills 套件。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 9, "title": "驗證與測試 Skill：確保觸發的精準度", "subtitle": "如何避免 Skill 成為僵死無效的沉睡文件？", "takeaway": "必須為 Skill 建立專屬的觸發測試用例，用多種不同提問方式確認 Agent 確實能被激活動態加載。", "details": ["<strong>測試正面觸發 (Positive Test)</strong>：嘗試多種表達方式（如『幫我開一個給外部調用的用戶查詢接口』），驗證 `secure-api-review` 確實每次都能被自動載入。", "<strong>測試負面排除 (Negative Test)</strong>：提出不相干問題（如『幫我寫一個字串反轉工具函式』），驗證該 Skill 不會被無謂加載污染上下文。", "<strong>評估建議落實度</strong>：檢查 Agent 生成的最終代碼，是否確實呼叫了指定的驗證腳本（如 `scripts/check-endpoints.sh`）。"], "metaphor": "就像在火災報警系統安裝完成後，安全員手持煙霧噴罐對著每個探測器進行噴煙測試，確保探測器既能在起火時第一秒刺耳報警，又不會因為有人噴香水而頻繁誤報。", "layout": "測試驗證矩陣：展示正面觸發測試（綠色勾選）與負面排除測試（灰色排除）的自動化驗收結果。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 10, "title": "合規與審計：Skill 調用記錄在 Session Trace 中的留痕", "subtitle": "證明你在寫代碼時確實遵守了政策的法定證據", "takeaway": "Agent 在對話中加載了哪些 Skills，全數被如實記錄在 Session 日誌中，成為日後安全審計的無可辯駁之證。", "details": ["<strong>追溯代碼合規起因</strong>：當審計員詢問『為什麼這個介面強制使用了特定的 JWT 結構？』工程師能直接調出該 Session 載入該 Skill 的歷史留痕。", "<strong>量化制度遵從率</strong>：企業安全主管可透過審查 Session Trace 大數據，統計全公司 API 任務中安全 Skill 的加載率是否達到 100%。", "<strong>持續改進依據</strong>：如果發現某些項目雖然觸發了 Skill 但依然需要人工修正，代表 Skill 描述不夠具體，指導安全團隊持續打磨文檔。"], "metaphor": "這就像民航客機的『飛行資料記錄器（黑盒子）』：飛機起飛過程中有沒有依照標準作業程序開啟襟翼、有沒有放下起落架，感測器每一秒都有數位訊號留存備查。", "layout": "審計日誌 JSON 截圖：展示 Session Trace 中記錄的 Skill 觸發時間戳、版本號與對應代碼生成歷史。"}, {"chapter_id": 8, "chapter_name": "第 8 章：Stage 3: Build — 制度化知識：Skills 深度應用", "page_num": 11, "title": "第八章實戰總結：讓資深專家的智慧全天候賦能", "subtitle": "Stage 3 Build 制度化沉澱核心總結與下章預告", "takeaway": "Skills 讓個人智慧昇華為組織集體智慧，但要築起絕對不可攻破的鋼鐵長城，我們必須在下一章請出真正的硬門禁——Hooks！", "details": ["<strong>核心心法</strong>：將不言自明的潛規則挑出來、封裝為標準 SKILL.md、設定精確 YAML 觸發詞、用 Plugin 全局分發。", "<strong>銘記本質</strong>：Skill 是柔性智力引導，它讓違規變稀少；但要讓違規徹底不可能，必須依賴下一章的確定性防衛！", "<strong>前瞻第九章</strong>：如何寫一個毫秒級的本地腳本，在 Agent 意圖碰觸受保護目錄時瞬間將其阻斷？第九章 Hooks 將為您揭密！"], "metaphor": "每一位資深架構師都無法分身坐在每一位工程師旁邊指導，但透過 Skills，他的智慧與原則宛如分身億萬，安靜地守護在每一次人機協同的鍵盤敲擊旁。", "layout": "三條核心實踐卡片，底部搭配通往第九章 Hooks 的鋼鐵防禦箭頭。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 1, "title": "確定性防線的不可替代性：為什麼需要 Hooks？", "subtitle": "當柔性提示詞面臨嚴苛合規時，必須有一道實體物理防線", "takeaway": "Hooks 是底層的確定性腳本層，在 Agent 執行文件修改或終端命令的微秒瞬間進行強制攔截。", "details": ["<strong>Prompt 不是防彈衣</strong>：提示詞存在微小機率被繞過或忽視，在受監管行業中，『99% 遵守』等同於『0% 合規』。", "<strong>建置階段是最高頻戰場</strong>：在實作期間，Agent 絕大部分動作都是調用 File Edit 與 Shell Bash，這正是 Hooks 大顯身手的最佳卡點。", "<strong>毫秒級本地攔截</strong>：不依賴昂貴的雲端 API 往返，純本地 Shell/Python 腳本瞬間完成正則與路徑檢驗，零延遲守護環境。"], "metaphor": "如果說 Skill 是航海圖上的暗礁標註，那麼 Hook 就是船頭配備的高靈敏度聲納自動防撞制動器，一旦探測到距離礁石只有十米，自動切斷主機動力，絕不由人機爭辯。", "layout": "雙層防禦架構圖：外層為 Skill 智慧導引，內層為厚實的 Hook 鋼鐵閘門，精準卡位在 Agent 與作業系統核心之間。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 2, "title": "三大典型守護場景：保護路徑、格式化與憑證防洩", "subtitle": "Anthropic 官方推薦的建置期三大必備 Hook 策略", "takeaway": "Build-time Hooks 的核心任務：阻斷受保護路徑修改、自動執行 Formatter 防止漂移、杜絕金鑰憑證外洩。", "details": ["<strong>場景一：阻斷保護路徑編輯</strong>：禁止 Agent 篡改自動生成的程式碼類（如 `src/gen/`）、資料庫遷移歷史或已凍結的舊版本包（`v1/`）。", "<strong>場景二：即時自動格式化與 Lint</strong>：在檔案編輯後自動調用 prettier/eslint，將代碼風格差異消滅在萌芽狀態，保持 Git 歷史乾淨。", "<strong>場景三：憑證與金鑰硬攔截</strong>：即時掃描即將寫入的文本，一旦發現匹配 AWS Key、JWT Token 或私鑰正則，立刻暴力中斷！"], "metaphor": "這就像在精密晶圓廠車間門口安裝的三道感應閘門：第一道攔截未授權人員進入核心光刻區（保護路徑），第二道強制吹風除塵（格式化），第三道金屬探測器攔截未報備電子設備（憑證防洩）。", "layout": "三防衛盾牌卡片：分別展示 Protected Paths、Auto-formatters、Secret Detection 的實體過濾邏輯。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 3, "title": "輕量快速原則 (Fast and Scoped)：避免拖垮心流", "subtitle": "為什麼全量單元測試絕對不能放在 Build Hook 裡？", "takeaway": "Build 階段的 Hook 必須極速運行（<100ms），且嚴格限制在當前修改的單一檔案範圍內。", "details": ["<strong>微秒級響應要求</strong>：Agent 在寫代碼時可能一分鐘內進行十幾次微調，如果每次保存都要等待 2 分鐘跑完整個測試套件，心流將被徹底摧毀。", "<strong>分層把關哲學</strong>：輕量檢查（路徑白名單、語法 Lint、格式化）放在每次動作的 Hook；重量級全量測試與安全掃描留到 Commit 或 PR 階段。", "<strong>單檔案聚焦 (Scoped)</strong>：只針對 `$TOOL_INPUT` 中正在改動的單一檔案進行檢驗，絕不引發跨模組的連鎖編譯負擔。"], "metaphor": "如同高速公路上的收費閘口：ETC 電子感應器必須在 0.1 秒內完成扣款抬桿（輕量 Hook），你絕不能在收費口強迫司機把整輛車拆開進行全面的年度汽車大修檢驗（全量測試）。", "layout": "時間軸對比圖：展示 <50ms 的輕量級 Hook 順暢流動，與耗時 >30s 的臃腫 Hook 導致終端徹底凍結的災難對比。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 4, "title": "PreToolUse 攔截機制：在動作生效前奪回控制權", "subtitle": "Anthropic 架構深度揭秘：Tool 調用前的最後審判", "takeaway": "PreToolUse Hook 賦予系統在 Agent 的意圖轉化為真實系統調用之前，進行檢查與裁決的絕對權力。", "details": ["<strong>標準 JSON 輸入通道</strong>：Claude 在決定調用工具時，底層將工具名稱與入參打包為標準 JSON，透過 stdin 管道輸入給 Hook 腳本。", "<strong>透明深入的參數檢查</strong>：腳本利用 `jq` 輕鬆解析 Agent 意圖編輯的檔案名、寫入的內容片段或打算執行的終端 Shell 命令。", "<strong>三大裁決走向</strong>：允許執行 (Allow, exit 0)、攔截阻斷 (Block, exit 2)，或在發布階段轉交人類審批 (Ask)。"], "metaphor": "就像最高法院法官在行政命令正式加蓋國璽、頒布生效的前一秒，擁有憲法賦予的緊急禁制令簽發權，一票否決任何違憲指令。", "layout": "資料管道時序圖：Agent Tool Use Intent → stdin 注入 Hook 腳本 → jq 解析入參 → 輸出 Exit Code 裁決結果。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 5, "title": "阻斷與自省：退出碼 2 (Exit 2) 與友善引導", "subtitle": "好的 Hook 不僅要能殺人，更要能教人：引導 Agent 自我修正", "takeaway": "當 Hook 決定阻斷時，必須退出碼為 2，並將清晰的阻斷原因與合規路徑寫入 stderr，讓 Agent 能立刻調整策略。", "details": ["<strong>標準退出碼語意</strong>：Exit 0 表示完全合規、批准執行；Exit 2 表示確定性阻斷，且 stderr 中的文字將直接作為環境反饋回傳給 Claude。", "<strong>提供清晰的導航指南</strong>：不要只冷冰冰地印出『Permission Denied』，而應輸出：『禁止修改 v1/legacy 目錄；所有新功能必須實現在 v2/ 目錄下』。", "<strong>激發 Agent 的自我調整</strong>：Claude 讀到這條錯誤提示後，會立即向工程師致歉，並在 plan.md 中調整路徑，重新在合規目錄下建立檔案！"], "metaphor": "就像迷宮裡的智慧防撞牆：當老鼠撞上牆壁時，牆壁不是放電把它電死，而是亮起一個語音箭頭指示：『此路不通，請向右轉進入第二號通道』。", "layout": "雙向終端反饋圖：展示 Hook 輸出 Exit 2 包含詳細提示，Claude 收到提示後自動改變實作路徑的智能適應過程。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 6, "title": "保護測試防篡改：捍衛驗證真偽性的防護罩", "subtitle": "杜絕 Agent 投機取巧：任何修復任務禁止改動現有測試", "takeaway": "在 Bug 修復任務中，必須透過 Hook 物理封死對測試目錄的寫入權限，確保紅燈變綠燈是真正修復了業務代碼。", "details": ["<strong>Agent 的偷懶本能 (Short-circuiting)</strong>：有時為了讓測試通過，模型可能會投機取巧地把斷言改小（例如將 `assert result == 100` 改為 `assert result >= 0`）。", "<strong>測試檔案防竄改 Hook</strong>：當當前任務為 Bug Fix 時，Hook 匹配 `test/**` 或 `*_test.go` 檔案路徑，一旦有寫入意圖直接 exit 2 阻斷。", "<strong>確保綠燈含金量 100%</strong>：被保護的測試套件是系統唯一的尺規；唯有尺規不可動搖，測量出來的品質才是真金白銀。"], "metaphor": "這就像在高考考場上，考生絕不可能被允許拿著紅筆去修改試卷評分標準答案；你只能竭盡全力把題目算對，絕不能把答案卷的標準改成你算錯的數字。", "layout": "天平圖示：左側為受保護的不可篡改測試檔案（標註防護罩），右側為被嚴格檢驗的業務代碼。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 7, "title": "為什麼不能在 Build 階段放入真人審批彈窗？", "subtitle": "避免人肉塞車：把需要人批准的關卡留給 Stage 5 Deploy", "takeaway": "建置期的 Hook 必須是『全自動允許或阻斷』，絕不能彈窗等待真人確認，否則將徹底摧毀並行多線作業。", "details": ["<strong>並行架構的致命毒藥</strong>：當一位工程師在背景掛著三個 Worktrees 同時跑任務時，任何一個終端彈出人肉確認，都會直接凍結該任務的心流。", "<strong>非黑即白的建置邏輯</strong>：建置期間要麼合規放行、要麼違規阻斷；凡是需要人類判斷『是否放行發布』的權力，統一收攏至 Stage 5 的 Release Gate。", "<strong>維持極致吞吐量</strong>：讓 Agent 在安全沙盒內全速前進，人的注意力只在起點（Plan）和終點（PR Review/Deploy）進行高品質裁決。"], "metaphor": "就像在半導體無人全自動無塵室晶圓傳送流水線上，你絕不能在兩台精密光刻機之間安排一個人工收費亭，每送一片晶圓就得人工蓋一次章，整個千億產線將瞬間癱瘓。", "layout": "架構警示對比圖：展示 Build 階段插入人工審批導致的所有線程卡死紅燈，與統一收口至 Deploy 階段的順暢綠燈。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 8, "title": "設定檔配置範例：.claude/settings.json 語法拆解", "subtitle": "如何用幾行簡潔的 JSON 聲明一個全局匹配的 PreToolUse Hook？", "takeaway": "標準配置直觀優雅，支援按工具類型（Bash、FileEdit）進行正則匹配並掛載執行腳本。", "details": ["```json\n{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"${CLAUDE_PROJECT_DIR}/.claude/hooks/protect-secrets.sh\"\n          }\n        ]\n      }\n    ]\n  }\n}\n```", "<strong>變數精準尋址</strong>：`${CLAUDE_PROJECT_DIR}` 自動解析當前工程根目錄，保證跨平台與團隊成員路徑一致性。", "<strong>多工具疊加防護</strong>：可同時為 `Bash`、`FileEdit`、`FileWrite` 等多個核心工具掛載專屬的校驗鏈條。"], "metaphor": "宛如現代智能家居的自動化觸發器設定：『當感測器偵測到窗戶被打開時（Matcher），立刻執行拉響警報器腳本（Command）』，簡明扼要且嚴密可靠。", "layout": "JSON 語法高亮卡片，各欄位旁附帶浮動標籤解釋其作用與匹配邏輯。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 9, "title": "保護機密實戰腳本：protect-secrets.sh 實作剖析", "subtitle": "短短十行 Shell，如何在終端底層築起防洩密天羅地網？", "takeaway": "透過讀取 stdin 中的命令文本，用 grep 正則瞬間甄別潛在私鑰與機密外洩風險。", "details": ["```bash\n#!/bin/bash\n# 讀取 Claude 即將執行的命令文本\ncmd=$(jq -r '.tool_input.command // empty' < /dev/stdin)\nif [ -z \"$cmd\" ]; then exit 0; fi\n\n# 檢驗是否包含關鍵機密檔或特權指令\nif echo \"$cmd\" | grep -E -q '(id_rsa|\\.env|AWS_SECRET|credentials)'; then\n  echo \"[Security Hook] 嚴重阻斷：檢測到指令觸及敏感憑證路徑！\" >&2\n  echo \"請改用環境變數注入或聯絡安全團隊授權。\" >&2\n  exit 2\nfi\nexit 0\n```", "<strong>攔截即銷毀</strong>：命令在尚未送達作業系統內核前就被徹底掐死，日誌中絕不留下任何洩密痕跡。"], "metaphor": "這就是防毒軟體中的『實時啟發式文件防火牆』，在病毒即將被雙擊運行的千分之一秒前，內核驅動瞬間將其隔離封裝。", "layout": "代碼區塊完整展示 protect-secrets.sh，並標註 stdin 讀取、正則判定與 Exit 2 阻斷三大環節。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 10, "title": "受管設定 (Managed Settings) 的不可覆蓋性", "subtitle": "防止個別員工擅自關閉防禦：全組織維度的強制策略繼承", "takeaway": "企業非妥協性 (Non-negotiable) 的底線 Hooks 存放於受管系統目錄，個別工程師在本地配置中無法停用或覆蓋。", "details": ["<strong>個人設定與組織設定的層次劃分</strong>：工程師可在 `.claude/settings.json` 中添加輔助個人習慣的友善 Hook。", "<strong>管理員策略強制覆蓋</strong>：由 IT/Platform 部署於系統級目錄（如 `/etc/claude/` 或 Windows 註冊表策略）的受管配置擁有最高優先權。", "<strong>合規合法的基石</strong>：即使工程師本地誤刪了 `.claude/` 目錄，核心安全攔截網依然在全局生效，徹底滿足 SOC2/ISO27001 審計標準。"], "metaphor": "如同公司發配的商務筆記本電腦：員工可以自由更換桌面壁紙和滑鼠游標（個人設定），但硬碟全盤加密 BitLocker 與企業防毒軟體，員工哪怕擁有管理員權限也絕對無法解除卸載（受管設定）。", "layout": "雙層配置覆蓋圖：上層個人配置遇到下層組織受管配置時，衝突條款強制以受管策略為準。"}, {"chapter_id": 9, "chapter_name": "第 9 章：Stage 3: Build — 確定性防禦：Build-time Hooks", "page_num": 11, "title": "第九章實戰總結：將安全性深植於每一次工具調用", "subtitle": "Stage 3 Build 確定性防禦核心總結與下章預告", "takeaway": "Hooks 與 Skills 構成了軟硬一體的絕妙防禦組合拳，讓團隊既能放手奔馳，又永遠高枕無憂！", "details": ["<strong>核心公式</strong>：輕量化腳本 + 嚴格範圍限定 + PreToolUse 毫秒截殺 + Exit 2 智能自省引導。", "<strong>安全基線已立</strong>：至此，我們已經為建置期打造了完整的智慧大腦（CLAUDE.md）、專業外掛（Skills）與防禦裝甲（Hooks）。", "<strong>前瞻第十章</strong>：單兵作戰已經無懈可擊，如何進一步組織大規模 Agent 兵團並行推進？第十章『Parallel Sessions & Subagents』將帶您進入集群協同的新紀元！"], "metaphor": "當鋼鐵裝甲已經武裝到牙齒，每一發子彈都有智慧制導與自爆保險，現在正是吹響衝鋒號角、調集千軍萬馬協同作戰的黃金時刻！", "layout": "三條核心實踐卡片，底部搭配通往第十章並行協同的高亮躍遷箭頭。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 1, "title": "一人驅動多條戰線：並行會話 (Parallel Sessions) 的魅力", "subtitle": "打破單線程瓶頸：一名工程師如何同時推進多個複雜專案？", "takeaway": "並行會話是指在各自獨立的 Git Worktree 中啟動多個完整的 Claude Code 實例，各任務互不干擾、同時並進。", "details": ["<strong>單線程等待的巨大浪費</strong>：傳統模式下，工程師開著一個終端等待 Agent 思考或運行測試，這段時間人的智力被迫閒置。", "<strong>任務間的物理隔離</strong>：不同任務在檔案系統層面完全分離，各自擁有獨立的分支與工作目錄，消除衝突。", "<strong>工程師的總體指揮權</strong>：各並行會話彼此完全不知曉對方的存在，唯一的紐帶就是身處中央調度室、掌握全局的工程師本人。"], "metaphor": "就像一家大型建築工程公司的總指揮，同時指揮著 A 區的體育館鋼結構吊裝、B 區的五星級酒店內部裝潢與 C 區的地下管網鋪設，各工區互不干擾，總進度神速推進。", "layout": "星狀拓撲圖：中央為人類工程師指揮官，向外輻射連接三個並行的 Claude Code 終端進程。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 2, "title": "什麼是 Subagent？會話內部的專職特戰隊", "subtitle": "獨立上下文與工具白名單：解決特定重複性專業任務的利器", "takeaway": "Subagent 是在單一會話內部運行的輕量特化助手，擁有獨立的上下文窗口與工具限制，避免污染主會話記憶體。", "details": ["<strong>上下文保護 (Context Protection)</strong>：如果讓主 Agent 去做耗費幾萬 Token 的全文搜索或代碼簡化，主會話的注意力將迅速被無關日誌沖垮。", "<strong>工具最小權限原則 (Least Privilege)</strong>：例如只給予 Researcher 讀取權限（Read/Grep），剝奪其寫入權限，確保安全探索。", "<strong>專業化聚焦 (Specialization)</strong>：專人專事，例如 Verifier 專職負責環境啟動與行為驗收，Simplifier 專職精簡重構冗餘邏輯。"], "metaphor": "如同主治外科醫生在手術台上，身邊隨時跟隨專職的麻醉師、器械護士與巡迴護士（Subagents）；主刀醫生不需要親自去清洗消毒鑷子，只需發出指令，助手精準完成後報告結果。", "layout": "雙層架構對照圖：展示主會話（Main Agent）如何派遣並管理多個具備獨立 Context 視窗的專職 Subagents。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 3, "title": "Parallel Sessions vs Subagents：本質維度對比", "subtitle": "Anthropic 官方核心架構：水平擴展 vs 垂直深耕", "takeaway": "Parallel Sessions 提升了一名工程師同時處理的『任務數量』；Subagents 則確保了單個任務內部的『極致專注與上下文純淨』。", "details": ["<strong>Parallel Sessions（並行會話）</strong>：橫向擴充。完全獨立的進程、獨立的 Git Worktree、處理完全不同的業務功能，由人協調。", "<strong>Subagents（子代理人）</strong>：縱向專業化。附屬於某個主會話、共享工作目錄、處理任務內部的特定子階段，由主 Agent 調度。", "<strong>二者合力的化學反應</strong>：工程師開啟三個並行會話，每個會話內部又按需調用 Subagents，構成強大的蜂巢式研發軍團！"], "metaphor": "Parallel Sessions 就像是同時派出三艘獨立的深海科考船前往太平洋、大西洋與印度洋（多任務並行）；而每艘船上又配備了專職的潛水員、聲納員與標本採集員（Subagents）。", "layout": "2x2 矩陣圖：從進程隔離度、上下文邊界、調度發起者與核心目的四個維度全面對照二者。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 4, "title": "任務拆解的藝術：依檔案相依性劃分無衝突邊界", "subtitle": "並行作業的先決條件：利用 plan.md 識別解耦模組", "takeaway": "凡是觸及相同檔案的任務，必須在單一會話中循序執行；凡是操作不同模組且檔案無交集的任務，大膽並行開工！", "details": ["<strong>依據 plan.md 判定邊界</strong>：回顧 Stage 3 初期的 plan.md，精確比對各任務的 `Files that change` 清單。", "<strong>零衝突保證</strong>：任務 A 修改 `portal/src/claims/`，任務 B 修改 `api/payment/`，兩者毫無交集，是完美的並行候選者。", "<strong>及早發現潛在死鎖</strong>：如果兩個任務都需要重構同一個共用工具函式庫 `utils/auth.ts`，強制排期為先後依序推進，避免 Git Merge 地獄。"], "metaphor": "這就像交響樂團排練：管樂部在主音樂廳練習，弦樂部在隔音排練室練習（無衝突並行）；但如果要合奏同一首協奏曲的高潮段落（共用代碼），大家必須在同一個大廳聽從同一個拍子。", "layout": "依賴分析文氏圖：展示兩個無交集的集合（並行）與一個有重疊交集的集合（序列推進）。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 5, "title": "Git Worktrees 實戰指南：零成本創建隔離工作區", "subtitle": "徹底淘汰傳統笨拙的 git checkout 分支切換手法", "takeaway": "一行指令建立全新目錄與分支，讓多個終端同時對不同代碼空間進行讀寫，互不踩腳。", "details": ["```bash\n# 終端 1：開闢認證功能獨立工作區\nclaude --worktree feature-auth\n\n# 終端 2：開闢修復限流問題獨立工作區\nclaude --worktree fix-rate-limit\n```", "<strong>共享底層對象庫，極致節省空間</strong>：Git Worktree 不需要像完整 git clone 那樣重複複製全部歷史記錄，瞬間完成目錄掛載。", "<strong>徹底杜絕編譯暫存污染</strong>：前端的 `node_modules` 與構建產物在各自目錄內獨立生成，再也不會發生分支切換導致熱更新崩潰。"], "metaphor": "這就像在同一個中心圖書館旁，為兩位研究員各自搭建了一間獨立的隔音研究室，兩間房間共用圖書館的藏書底庫，但各自桌面上攤開的筆記稿紙互不影響。", "layout": "代碼終端視窗對比：展示終端 1 與終端 2 在不同工作目錄下的命令調用與乾淨隔離狀態。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 6, "title": "控制並行會話的極限：人類專注力才是真正上限", "subtitle": "不要貪多嚼不爛：兩到三個會話是黃金平衡點", "takeaway": "技術上你可以同時啟動二十個 Claude Code，但實務上的天花板取決於你能高品質審查多少條產出流。", "details": ["<strong>審查超載與防禦崩潰</strong>：如果同時開啟 10 個任務，工程師將再次陷入認知癱瘓，無法仔細驗收任何一個產物，本末倒置。", "<strong>2~3 個會話的黃金律動</strong>：當 Session 1 在跑編譯與測試時，審查 Session 2 的計畫，並在 Session 3 與產品經理確認邊界，節奏行雲流水。", "<strong>只有當審查跟得上時才加任務</strong>：守住審查品質底線，絕不盲目追求終端機窗口的數量虛榮。"], "metaphor": "如同特技雜耍雜技演員同時在空中拋接彩球：經驗豐富的演員接拋三個球可以維持一小時不落地且姿態優雅；但如果硬塞給他十個球，幾秒鐘後所有球都會劈啪掉在地上砸碎。", "layout": "專注力曲線圖：展示並行會話從 1 個提升至 3 個時產能直線飆升，超過 4 個後因審查疲勞導致品質急墜。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 7, "title": "Subagent 定義規範：以 .claude/agents/ 為家", "subtitle": "用聲明式 Markdown 定義專屬子特工的角色與工具白名單", "takeaway": "每個 Subagent 都是存放在 `.claude/agents/<name>.md` 的獨立文件，由全團隊透過 Git 共同分享與維護。", "details": ["<strong>標準存放目錄</strong>：倉庫根目錄的 `.claude/agents/`，團隊成員隨時可共享已驗證的特工設定。", "<strong>YAML 前置參數</strong>：定義特工名稱 (name)、適用時機描述 (description) 與允許調用的工具清單 (tools)。", "<strong>正文角色提示詞 (System Prompt)</strong>：給出清晰的行為準則、禁止動作與輸出格式規範。"], "metaphor": "這就像特警部隊的『特種戰術崗位說明書』：明確定義狙擊手（狙擊槍、夜視鏡、禁止近戰衝鋒）與防暴手（防彈盾牌、催淚彈、禁止擅自開火）的裝備與作戰手則。", "layout": "檔案結構剖析圖：展示 `.claude/agents/` 目錄下的多個 `.md` 特工定義卡片。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 8, "title": "官方實戰特工拆解：verifier.md 驗證員", "subtitle": "Anthropic 原生定義：獨立於編碼上下文的客觀質檢官", "takeaway": "Verifier 擁有完全乾淨的上下文窗口，不受主 Agent 編碼時的主觀偏見影響，客觀啟動應用並檢驗行為。", "details": ["```markdown\n---\nname: verifier\ndescription: Runs the app and checks the change works before the session\n  reports done\ntools: Bash, Read\n---\nStart the app with make run. Exercise the changed behavior and the two\nnearest neighboring flows. Report what you ran, what you saw, and any\nbehavior that does not match plan.md. Do not fix anything; report only.\n```", "<strong>乾淨視野 (Fresh Context)</strong>：沒有任何編碼時的思維定勢與藉口，純粹以黑盒角度運行程式並對照 plan.md 驗收。", "<strong>職責隔離：只報告、不修復</strong>：『Do not fix anything; report only』防止質檢員自作主張越權修補，維持客觀中立。"], "metaphor": "就像汽車製造廠裡專門的『出廠質檢員』：他沒有參與發動機的打磨與組裝，他拿著質檢單坐進駕駛座發動引擎、猛踩煞車、測試空調，任何不符合指標的瑕疵直接貼上紅標駁回。", "layout": "代碼高亮完整呈現 verifier.md 全文，重點註解『tools 白名單』與『只報告不修復』核心條款。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 9, "title": "經典特工軍團：Simplifier 與 Researcher", "subtitle": "專職化特工生態：為特定高頻工作流打造專屬助手", "takeaway": "除了 Verifier，團隊中最受歡迎的兩大專職特工分別為：代碼瘦身專家 (Simplifier) 與情報偵察兵 (Researcher)。", "details": ["<strong>Code Simplifier（代碼精簡員）</strong>：在主 Agent 完成功能後介入，專職掃除冗餘代碼、內聯無謂的單次抽象、去除過度設計，讓 Diff 極致優雅。", "<strong>Codebase Researcher（代碼庫偵察員）</strong>：配備 Read/Grep 工具，深入未知大型代碼庫搜集函式調用鏈與型別定義，輸出簡要報告而絕不污染主會話。", "<strong>特工組合拳</strong>：主 Agent 規劃編碼 → Simplifier 瘦身整理 → Verifier 啟動驗證，流水線一氣呵成。"], "metaphor": "就像電影劇組裡的各司其職：導演（主 Agent）負責說戲指導拍攝，燈光攝影（Researcher）負責布光取景，剪輯師（Simplifier）負責咔嚓剪掉贅餘鏡頭，質檢放映員（Verifier）負責檢查拷貝色彩音軌。", "layout": "特工協同工作流卡片：展示 Researcher → Main Agent → Simplifier → Verifier 依序銜接的精確節奏。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 10, "title": "並行治理與合規：更多會話意味著更嚴格的倉庫配置", "subtitle": "多線推進下的權限歸屬與審計歸因", "takeaway": "會話數量增加導致代碼產出暴增，所有會話必須強制繼承倉庫根目錄的 Hooks 與 Managed Settings，所有行為歸因至啟動工程師。", "details": ["<strong>防禦配置的全局穿透</strong>：無論開啟多少個並行會話或派遣多少個子代理，根目錄的 PreToolUse Hooks 毫無例外地對所有終端生效。", "<strong>不可抵賴的身分歸因</strong>：每個會話產生的 Git Commit 與操作日誌，全數綁定啟動該終端的工程師帳號，確保權責清晰。", "<strong>資源與費用熔斷</strong>：企業可集中設定每位工程師的同時在線會話上限與 API 費用配額，防止背景無效空轉消耗資金。"], "metaphor": "這就像軍隊指揮系統：無論派遣多少個獨立特戰小隊深入敵後作戰，每位隊員的無線電通訊都受到中央指揮部的加密監聽，每顆發射的子彈都登記在該分隊指揮官名下。", "layout": "中央控制台視圖：展示企業管理員統一監控多個並行會話的活躍狀態、資源佔用與安全合規日誌。"}, {"chapter_id": 10, "chapter_name": "第 10 章：Stage 3: Build — 多代理人協作：Subagents 專職分工", "page_num": 11, "title": "第十章實戰總結：邁向集群協同的工程大格局", "subtitle": "Stage 3 Build 建置全階段圓滿收官與下章預告", "takeaway": "我們完成了從 Plan Mode、Auto Mode、CLAUDE.md、Skills、Hooks 到集群並行的全面佈局，正式敲開 Stage 4 Test 的大門！", "details": ["<strong>建置階段核心全景</strong>：思考先於編碼 (Plan) → 安全自主加速 (Auto) → 開機大腦智慧 (CLAUDE.md) → 機構規範 (Skills) → 確定性防禦 (Hooks) → 集群並行 (Subagents)。", "<strong>代碼已經寫好，如何證明它正確？</strong>：沒有經過嚴密自檢的代碼不能交付，第十一章我們將解鎖 Stage 4 的『Feedback Loops 驗證反饋循環』！"], "metaphor": "我們已經建立了一支紀律嚴明、武裝到牙齒且配備高科技協同通訊的現代化工程兵團；現在，我們將把這支部隊開赴最殘酷的實戰檢驗場——自動化驗證與評測！", "layout": "Stage 3 全六大核心機制徽章總覽，正中央指向 Stage 4 Test 的明亮大門。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 1, "title": "賦予 Claude 自我除錯的鏡子：Feedback Loop 的核心價值", "subtitle": "不要替 Agent 擦屁股：讓它自己發現錯誤、自己修復", "takeaway": "永遠給予 Claude 一個驗證自身工作的閉環機制，無論是單元測試、建置編譯還是前端截圖比對。", "details": ["<strong>把低級錯誤消滅在出生地</strong>：未配備反饋迴圈的 Agent 會把包含語法錯誤或空指標的代碼交給工程師，浪費寶貴的人力審查精力。", "<strong>自主修復的驚人韌性</strong>：當擁有反饋通道時，Agent 在遇到測試報錯後能自動分析 Stack Trace，修改代碼並重新運行，直到全綠。", "<strong>工程師驗收時的從容</strong>：當你回到終端時，看到的是已經自主循環嘗試了三次、最終全部綠燈通過的高品質交付成果。"], "metaphor": "這就像給一位正在練習射箭的盲人射手配備了一名報靶語音機器人：每射出一箭，耳機立刻提示『偏左三公分、偏高兩公分』，射手能自主微調姿勢，直到連續命中十環。", "layout": "自適應迴圈圖：編碼 → 執行測試 → 捕獲錯誤輸出 → 分析反思 → 自動調整代碼 → 再次執行，直到完全綠燈。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 2, "title": "Feedback Loop vs Verifier Subagent：維度辨析", "subtitle": "Anthropic 官方澄清：貫穿始終的實時反饋 vs 最終的獨立大檢", "takeaway": "反饋迴圈是貫穿整個編碼任務的『心跳循環』；而驗證員特工 (Verifier) 則是全部完工後在乾淨視窗進行的『最終驗收審計』。", "details": ["<strong>Feedback Loop（常態化反饋）</strong>：每改動幾行或一個函數就運行一次快速檢查，陪伴整個實作過程，及時糾偏。", "<strong>Verifier Subagent（獨立質檢特工）</strong>：實作全部宣告結束後啟動，具備乾淨未被污染的 Context，從用戶黑盒角度啟動應用端到端驗收。", "<strong>內外兼修的品質保障</strong>：內部靠 Feedback Loop 確保邏輯零件無瑕疵，外部靠 Verifier 確保組裝後的整車運轉流暢。"], "metaphor": "Feedback Loop 就像砌牆泥瓦匠手中的『水平尺與鉛垂線』，每砌一塊磚就看一眼氣泡是否居中；而 Verifier 則是樓房封頂後的『第三方國家房屋安全檢測工程師』帶著專用儀器上門驗收。", "layout": "2x2 維度對照矩陣：從執行頻次、上下文純淨度、修復權限與核心目的四個維度嚴密區分二者。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 3, "title": "封裝單一簡潔的退出指令：Non-zero Exit Code 的魔力", "subtitle": "消除環境複雜性：將繁瑣的驗證流程打包為 make test 或 npm test", "takeaway": "如果檢查工作需要一系列複雜命令，必須將其封裝為一個單一 target，且在失敗時精確返回非零退出碼。", "details": ["<strong>Agent 最擅長二元判定</strong>：Exit 0 代表通過，Non-zero（非零）代表失敗；簡潔的退出碼是激發 LLM 反省的最強信號。", "<strong>消滅多步驟交互摩擦</strong>：不要讓 Agent 分別手動執行編譯、啟動容器、執行 curl、過濾 grep，打包成一鍵式 `make test`。", "<strong>在 CLAUDE.md 中給出健康範例</strong>：在文檔中明確列出健康時的輸出日誌，讓 Agent 能精準比對終端反饋是否符合預期。"], "metaphor": "這就像汽車儀表板上的『故障警報紅燈』：司機不需要懂得複雜的曲軸轉速感測器電壓脈衝，只要紅燈亮起（Non-zero），就知道出問題了必須檢查；紅燈熄滅（Exit 0），放心上路。", "layout": "封裝示意圖：複雜的 Docker 啟動、資料庫 Migration、單元測試被包裹進一個簡潔的 `make test` 黑色魔術箱中。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 4, "title": "設定可量化的清晰目標：讓 Agent 懂得何謂『成功』", "subtitle": "拒絕模糊的指令：提供非黑即白的機器可判定斷言", "takeaway": "不要只說『幫我測試一下』，而要給出可量化的確定性指標，例如：『test_status.py 全部通過』或『接口返回 200 且包含新欄位』。", "details": ["<strong>模糊指令引發幻覺妥協</strong>：如果目標不明確，Agent 看到幾行無關的輸出就可能自作主張判定為『測試看起來已經差不多了』。", "<strong>精確的量化驗收目標</strong>：指定具體的測試檔案名稱、預期的 HTTP 狀態碼、預期產出的 JSON Schema 結構或覆蓋率百分比。", "<strong>賦予無人值守的自主評判權</strong>：當目標高度量化時，Claude 完全不需要中途停下來詢問人類『這樣算不算成功』，自主直奔終點。"], "metaphor": "就像跳高比賽的『橫竿標尺』：橫竿精確架在 2 米 10 的高度，運動員跳過去了就是成功，碰落了就是失敗，絕對沒有裁判主觀給『印象分』的模糊空間。", "layout": "指標看板對照：左側為模糊指令（紅色叉號：隨便測測），右側為量化斷言（綠色勾選：12 tests passed, 0 failures, 100% assertions met）。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 5, "title": "Bug 修復的 TDD 鐵律：必須先寫失敗測試 (Failing Test First)", "subtitle": "Anthropic 官方核心實戰原則：未重現的 Bug 絕不能直接修", "takeaway": "遇到 Bug 時，要求 Claude 先編寫一個能精準重現該 Bug 的失敗測試，提交該測試，然後才能著手修復業務代碼。", "details": ["<strong>第一步：用測試重現問題</strong>：要求 Claude 將使用者報告的故障現象編寫為單元測試，執行並親眼確認失敗原因與預期一致。", "<strong>第二步：鎖定並提交失敗測試</strong>：將這個紅燈測試單獨 Commit，作為該 Bug 存在過的鐵證，並在後續修復中被 Hook 保護。", "<strong>第三步：只修代碼，使測試翻綠</strong>：在不允許碰觸測試檔案的前提下，讓 Claude 專注修改業務代碼，直到測試全綠。", "<strong>終生免疫的防回歸資產</strong>：這個由故障轉化而來的測試用例，將永久留存在代碼庫中，未來任何重構都無法再度引發同類歷史悲劇！"], "metaphor": "就像刑警破案：在抓捕嫌疑人之前，必須先在犯罪現場用石灰線精準圈出受害人倒地位置、提取指紋彈殼（編寫失敗測試並固定物證），絕不能憑空想像隨意抓人交差。", "layout": "TDD 三步法箭頭圖：1. 編寫重現測試 (紅燈) → 2. Git Commit 固化防篡改 → 3. 修改代碼 (綠燈通過)。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 6, "title": "保護測試防篡改：禁止修改考卷的防禦 Hook", "subtitle": "斬斷投機取巧：防止 Agent 在遇到挫折時偷改測試斷言", "takeaway": "必須配合使用 PreToolUse Hook，在 Bug 修復任務中徹底封鎖對測試檔案的寫入權限，或者在 PR Review 中將其一票否決。", "details": ["<strong>模型的逃避心理機制</strong>：當經過幾次迭代依然無法讓複雜演算法通過測試時，模型可能為了『滿足全綠要求』而調低測試標準。", "<strong>確定性腳本守護</strong>：在任務啟動時標記上下文，Hook 攔截一切針對 `tests/**` 目錄的編輯意圖，退出碼為 2，強制把精力鎖死在業務邏輯上。", "<strong>最純粹的真理檢驗</strong>：在修復任務之前就已存在、且在修復過程中完全不可被 Agent 改動的測試，是證明 Bug 徹底消失的唯一權威真理！"], "metaphor": "這就像防作弊監考員：考生的鉛筆盒只能放在桌角，草稿紙由考場統一發放且蓋有鋼印，考卷標準答案鎖在保險箱中，考生休想用修正帶塗改評分規則。", "layout": "防禦攔截時序圖：Claude 意圖調用 Edit(test_status.py) → Hook 觸發正則攔截 → 回傳 Exit 2 阻斷 → Claude 轉而修改業務檔案。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 7, "title": "前端視覺驗證閉環：自動截圖與 Pixel Diff", "subtitle": "讓 Agent 睜開眼睛：告別純代碼盲打，邁向所見即所得的視覺自愈", "takeaway": "對於 UI 與前端工作，給予 Claude 瀏覽器控制或截圖工具，將 Stage 2 批准的原型作為基準，進行多輪自動對比修復。", "details": ["<strong>視覺感知工具賦能</strong>：透過 Playwright 或 Chrome DevTools 協議，Agent 在本機啟動無頭瀏覽器，自動導航至頁面並擷取全高解析度截圖。", "<strong>閉環迭代三部曲</strong>：實作組件 (Implement) → 拍攝截圖 (Screenshot) → 比對差異 (Compare) → 微調 CSS 樣式 (Adjust)。", "<strong>兩到三輪的常態收斂</strong>：通常經過 2~3 輪的微調，按鈕邊距 (Padding)、字體層次、色彩對比度將迅速與設計圖完美契合。"], "metaphor": "就像一位繪製古典寫實肖像的油畫家：他一邊看著眼前的模特兒（設計 Mock），一邊在畫布上塗抹油彩，每畫幾筆就退後三步瞇起眼睛比對光影（截圖 Diff），反覆修飾直到神形兼備。", "layout": "視覺反饋閉環示意圖：左側為基準 Mock 圖，中間為當前截圖與 Diff 熱力圖，右側為 Claude 正在微調的 Tailwind CSS 類名。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 8, "title": "CLAUDE.md 中的 Verification Block 實戰模組", "subtitle": "Anthropic 官方支付服務實例深度解構", "takeaway": "將驗證段落寫入 CLAUDE.md，是一套低成本卻能立竿見影提升全團隊交付品質的神級習慣。", "details": ["```markdown\n## Verifying your work\n\n- Build: make build (must finish with \"Build succeeded\")\n- Test: make test (all green; never skip or delete a failing test)\n- Lint: make lint (zero warnings)\n\nRun all three before reporting any task complete, and paste the output.\nIf a test fails, fix the code, not the test.\n```", "<strong>三大紀律八項注意</strong>：明確列出 Build、Test、Lint 的終點線標準與禁止跳過指令。", "<strong>黏貼證據 (Proof of Work)</strong>：要求 Agent 在回報任務完成的同時，必須將真實終端機的綠燈日誌貼在回覆末尾，供人類一目了然驗收。"], "metaphor": "這就像快遞簽收制度：派送員不僅要按門鈴，還必須請收件人簽署大名並拍攝收件人親手接過包裹的照片上傳至系統，才算完成交付任務。", "layout": "代碼高亮展示 Verification Block，右側附帶『強制綠燈日誌證明』的金色檢查標籤。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 9, "title": "極限邊界與自適應容錯：防止陷入死循環", "subtitle": "當修復嘗試超過五次依然失敗時，如何優雅止損？", "takeaway": "設定最大迭代次數閾值，一旦自我修復陷入僵局，立即終止循環並主動向工程師呈報詳細診斷報告。", "details": ["<strong>死循環的風險</strong>：如果錯誤根源在於底層架構缺陷或第三方庫 Bug，Agent 可能在錯誤的代碼周圍反覆打轉無效修補。", "<strong>計數器與超時保護</strong>：配置單一任務最大修復嘗試輪次（如 5 輪），超過閾值自動中斷執行並保存當前上下文。", "<strong>結構化故障報告輸出</strong>：向工程師清晰列出：『我嘗試了方案 A（失敗於 X）、方案 B（失敗於 Y），推測可能是資料庫連線池耗盡，請人工介入裁決』。"], "metaphor": "就像潛水艇上的『自動逃生浮標』：在深度故障無法自愈時，系統不再做無謂的動力掙扎，而是及時向海面釋放高亮信號浮標與位置黑盒子，等待外部救援力量精準介入。", "layout": "容錯流動圖：修復計數器 N<5 → 繼續自我修復；N>=5 → 觸發緊急制動並產出結構化診斷摘要交由人類接管。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 10, "title": "單機自檢與持續集成的銜接：為 Continuous Evals 鋪路", "subtitle": "本地小閉環是雲端大評測的堅實基礎", "takeaway": "本地的 Feedback Loop 解決的是『當前特定功能有沒有寫對』；而下一章的 Continuous Evals 將在雲端解決『系統全局大腦有沒有退化』。", "details": ["<strong>微觀與宏觀的互補</strong>：本地測試是針對單一 PR 變更的微觀防線，運行快速、反饋敏捷。", "<strong>將修復任務沉澱為資產</strong>：每次本地透過 TDD 捕獲並修復的重大缺陷，都是未來收錄進入全庫持續評測套件 (Evals Suite) 的黃金原材料！", "<strong>無縫對接 CI/CD</strong>：本地能全綠通過的代碼，推送到 GitHub Actions 後幾乎能保證 100% 一次通過，徹底消滅 CI 紅燈堵塞現象。"], "metaphor": "這就像航天飛機發射前的兩級點火測試：本地 Feedback Loop 是在裝配廠對單個火箭推進噴管進行氣密性自檢；而雲端 Continuous Evals 則是整個航天飛機垂直豎立在發射台上的全系統聯合熱試車。", "layout": "雙層階梯遞進圖：展示底層本地 Feedback Loops 與頂層雲端 CI Evals 的流暢交接脈絡。"}, {"chapter_id": 11, "chapter_name": "第 11 章：Stage 4: Test — 自我驗證循環：Feedback Loops", "page_num": 11, "title": "第十一章實戰總結：讓代碼帶著『綠燈保證書』出廠", "subtitle": "Stage 4 Test 本地自我驗證心法與下章預告", "takeaway": "永遠不要把包含低級錯誤的代碼交給真人審查；讓 Agent 帶著自我驗證的綠燈日誌出廠，是對人類時間的最大尊重！", "details": ["<strong>三大心法</strong>：始終包裹單一 non-zero 命令、Bug 修復必須 TDD 失敗測試先決、用 Hook 保護測試防篡改。", "<strong>品質躍遷</strong>：當本地驗證閉環就緒，代碼品質已經達到前所未有的高度。", "<strong>前瞻第十二章</strong>：如果我們更新了模型、重寫了 Prompt 或微調了 Skill，如何確保 Agent 的大腦整體能力沒有悄悄倒退？第十二章『Continuous Evals in CI』將震撼登場！"], "metaphor": "一家只出售經過 100% 通電自檢合格產品的電器工廠，其品牌聲譽與客戶信任將堅如磐石；Feedback Loop 就是每位工程師手中那張蓋有『質檢合格』鋼印的出廠通行證！", "layout": "三條核心實踐卡片，底部搭配通往第十二章 Continuous Evals 的躍遷箭頭。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 1, "title": "AI 時代的 Stage-Gate QA：什麼是 Continuous Evals？", "subtitle": "當傳統 QA 速度跟不上 Agent 產出，評測體系必須走向持續自動化", "takeaway": "Evals 是 AI 原生時代等同於傳統階段門禁 QA 的核心機制；它是一套客觀的黃金測試任務庫，用於衡量 Agent 表現是否達標。", "details": ["<strong>傳統手動 QA 的崩潰</strong>：面對每天數十個由 Agent 生成的 PR，傳統測試團隊按照用例手動點擊已完全無以為繼。", "<strong>配置與模型的即時回歸測試</strong>：當團隊更換底層模型、重寫 System Prompt 或修改 Skill 時，Evals 系統能客觀給出通過率指標，回答『能力是否倒退？』", "<strong>活生生的演進套件</strong>：Evals 不是死板的考卷，隨著模型能力提升與線上新事故的湧現，用例套件處於持續動態擴充之中。"], "metaphor": "這就像國家公務員考試或民航機師的『常態化飛行模擬器複訓考評』：每隔半年，所有機師都必須在模擬器中應對一次雙發失效與強側風降落，分數不達標立刻停飛受訓。", "layout": "門禁審核架構圖：中央為 Agent Configuration 變更，右側為必須通過的 Evals Gate 評測防線，綠燈才允許合併。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 2, "title": "提煉真實任務庫：從 20 到 50 個歷史生產任務起步", "subtitle": "不要編造玩具用例：黃金評測集必須深植於真實業務泥土", "takeaway": "平台工程師挑選 20 到 50 個團隊近期真實完成、且驗收標準清晰的代表性任務，作為基準評測集。", "details": ["<strong>拒絕脫離實際的合成數據</strong>：從歷史 Git Commit 中挖掘真實的 Bug 修復、功能開發與重構工單，包含真實的代碼上下文與依賴。", "<strong>評測用例的標準結構</strong>：每個 Eval 包含兩個核心部分：當時發給 Agent 的原始 Prompt，以及一套客觀可判定的驗證檢查腳本。", "<strong>多樣性覆蓋</strong>：涵蓋簡單語法修復、跨檔案重構、API 接口實現、資料庫 Migration 與前端元件開發等各類真實場景。"], "metaphor": "如同特種部隊特訓基地：基地內的障礙設施不是憑空捏造的遊樂園道具，而是 1:1 等比例複製了過往最凶險、最慘烈的巷戰街區與反劫機客艙真實場景。", "layout": "金字塔架構圖：底部為海量歷史生產任務，中層為篩選出的 50 個精選高頻案例，頂部為標準 JSON 格式的 Eval 用例庫。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 3, "title": "定義嚴格的客觀驗收標準：何謂『Acceptable』？", "subtitle": "四維硬性標準：測試通過、Lint 清潔、行為不變、策略遵守", "takeaway": "每個 Eval 用例都配備一套多維度的自動檢查腳本，絕不依賴評估員的主觀感受判定。", "details": ["<strong>維度一：Tests Pass（單元測試全綠）</strong>：生成的代碼必須能編譯並通過該任務對應的單元與整合測試。", "<strong>維度二：Lint Clean（語法無警告）</strong>：嚴格遵守專案代碼風格與規範，零 ESLint/Pylint 報警。", "<strong>維度三：Behavior Unchanged（未破壞現有行為）</strong>：系統全量回歸測試無衰退，邊界行為完全吻合預期。", "<strong>維度四：Policy Followed（恪守組織策略）</strong>：嚴格遵循了相關的 Security Skill，無明文金鑰、無匿名路徑、無日誌 PII。"], "metaphor": "如同奧運體操比賽的打分：難度分有嚴格的動作代碼對照表，完成分則對落地晃動、腳尖是否繃直有毫米級的硬性扣分細則，容不得裁判主觀徇私。", "layout": "四象限質檢清單：Tests Green、Zero Lint、No Regression、Policy Met，四項全綠方可判定為 PASS。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 4, "title": "CI 自動化觸發時機：定時排程與設定檔變更聯動", "subtitle": "為什麼對 CLAUDE.md 的修改必須像代碼一樣接受回歸測試？", "takeaway": "評測套件在 CI 中非互動式執行，觸發點為：夜間排程，以及任何對 CLAUDE.md、Skills 或 Hooks 的 PR 修改！", "details": ["<strong>配置即代碼 (Config as Code)</strong>：`CLAUDE.md`、Skills 與 Hooks 是引導 Agent 大腦行為的指揮棒，對它們的修改同樣具有破壞全局的威力！", "<strong>防範提示詞暗中劣化</strong>：有人試圖在 CLAUDE.md 中加了一句看似無害的『請使用簡短變數名』，結果導致變數可讀性暴跌、Evals 通過率急降 20%。", "<strong>夜間定時跑批 (Cron Schedule)</strong>：每晚凌晨 2 點全量執行，及時捕獲底層基礎模型（如 Anthropic 雲端模型平滑更新）可能帶來的行為微小漂移。"], "metaphor": "這就像給自動化工廠的中央控制程式軟體編寫自動化測試：每當工程師微調了機械手臂的控制算法參數（修改 CLAUDE.md），系統在正式下發到車間前，必須在虛擬沙盒中把 50 種零件全部模擬裝配一遍，確認合格才允許保存。", "layout": "GitHub Actions 觸發流程圖：paths: ['CLAUDE.md', '.claude/**'] + schedule: cron: '0 2 * * *' 雙軌觸發時序。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 5, "title": "官方 GitHub Actions 流水線實戰剖析", "subtitle": "Anthropic 官方 agent-evals.yml 腳本深度逐行拆解", "takeaway": "透過無人值守的非互動模式調用 `claude -p`，結合工具白名單限制，安全高效跑完評測集。", "details": ["```yaml\nname: Agent evals\non:\n  pull_request:\n    paths: ['CLAUDE.md', '.claude/**']\n  schedule:\n    - cron: '0 2 * * *'\njobs:\n  evals:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm install -g @anthropic-ai/claude-code\n      - name: Run eval suite\n        env:\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}\n        run: |\n          for eval in evals/*.json; do\n            claude -p \"$(jq -r '.prompt' $eval)\" \\\n              --allowedTools \"Read,Edit,Bash(make test)\" \\\n              --output-format json > result.json\n            ./evals/check.sh \"$eval\" result.json\n          done\n```", "<strong>無人值守核心參數</strong>：`-p` 非互動式執行、`--allowedTools` 嚴格限制只能執行 make test、`--output-format json` 方便機器解析驗證。"], "metaphor": "宛如一條全自動軍犬敏捷度巡檢流水線：每一隻特種工作犬被自動引導至 50 道不同難度的跨欄、鑽圈與排雷障礙道，計時器與雷射感測器全程精確記錄每隻犬的通關秒數與犯規次數。", "layout": "YAML 代碼區塊完整高亮，旁邊附帶終端日誌循環解析圖標。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 6, "title": "通過率閾值卡點 (Pass-Rate Threshold)：合併的生死線", "subtitle": "評測結果如何作為 GitHub PR 的硬性 Status Check？", "takeaway": "設定基準通過率門檻（如 90%）；任何導致通過率下跌的配置變更，直接在 PR 阻斷合併，直到作者查明並修復退化。", "details": ["<strong>數據說話，杜絕主觀臆斷</strong>：不再爭吵『我覺得這個新提示詞更好』，直接看 Evals 分數是上升了 3% 還是下降了 5%。", "<strong>機器人自動發佈對比評論</strong>：CI 完成後，自動在 PR 評論區發佈對比表格：列出本次變更修復了哪些歷史用例、又打破了哪些用例。", "<strong>團隊領導最終裁決</strong>：如果為了引入重大架構升級而暫時放棄某個過時用例，必須由配置負責人具名批准並同步廢棄舊 Eval。"], "metaphor": "這就像汽車出廠的安全防撞星級評定：如果工程師為了追求省油而擅自削薄了車門防撞鋼樑，導致在假人碰撞測試中的保護評分從五星跌落至三星，廠長直接下令整條生產線停產整頓，絕不允許出廠！", "layout": "PR 狀態指示卡片：展示紅色的『Evals failed: Pass rate dropped from 94% to 88% (Blocked)』與對比明細清單。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 7, "title": "事故轉測試 (Incidents as Evals)：線上缺陷的終身免疫", "subtitle": "每一次生產事故，都必須在當周沉澱為一個全新的 Eval 用例", "takeaway": "由發生事故的負責團隊，將該事故提煉為一個標準 Eval，永久收錄至評測集，確保 Agent 永遠不會重蹈覆轍。", "details": ["<strong>事故調查的閉環終點</strong>：傳統事後覆盤會議 (Post-mortem) 往往寫完報告就束之高閣；AI-Native 模式下，必須以提交一個 PR 新增 Eval 為結案標誌。", "<strong>重現環境與邊界條件</strong>：將觸發線上當機的特定邊界輸入、網路重試風暴或資料庫競爭條件，提煉為單一測試 JSON。", "<strong>防禦性資產的滾雪球效應</strong>：經過三年運轉，你的 Evals 套件將累積數百個高價值的實戰防禦用例，構成企業最寬廣的技術護城河！"], "metaphor": "這就像現代疫苗的研發歷程：每次世界上出現了一種新型突變病毒（線上故障），生物學家在治癒病人的同時，立刻提取病毒樣本滅活製成標準抗原，並加入到全體新生兒的必打疫苗接種清單中，實現全種族的終身群體免疫！", "layout": "事故轉化循環箭頭：生產事故 (Incident) → 根因分析 (RCA) → 提煉為 eval.json → 納入 CI 全局套件 → 永不復發。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 8, "title": "動態演進與汰換機制：避免測試用例飽和鈍化", "subtitle": "隨著底層大模型智力提升，如何維持評測集的區分度 (Discrimination)？", "takeaway": "當新一代模型讓舊用例輕鬆達到 100% 全綠時，這些用例將失去區分能力，必須引入更高難度的真實任務。", "details": ["<strong>天花板飽和效應 (Ceiling Effect)</strong>：一年前對 Claude 3 Sonnet 極其困難的並發鎖定問題，Claude 3.5 可能一秒解出；若只依賴舊用例，將無法衡量高階邊界。", "<strong>分級保留歷史資產</strong>：將已輕鬆通過的舊用例降級為『回歸底線套件（耗時短、每 PR 必跑）』，將精力聚焦於最新編寫的『挑戰者套件』。", "<strong>淘汰過時與錯誤假設</strong>：業務重構後已經不適用的業務邏輯用例，必須有秩序地被淘汰，避免無效紅燈阻礙創新。"], "metaphor": "就像中學數學奧林匹克競賽題庫：十年前被列為決賽壓軸題的難題，現在隨著教學水準提升已經變成初中課後思考題；國家隊選拔必須持續引進由數學家新設計的高階前沿競賽題目。", "layout": "梯隊演進圖：第一梯隊『前沿挑戰集 (新模型區分)』、第二梯隊『核心生產集 (日常 PR 門禁)』、第三梯隊『歷史基線集 (夜間跑批)』。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 9, "title": "離線與在線的節奏權衡：成本與反饋的平衡點", "subtitle": "不是所有團隊都需要在每一次 Git Push 都跑全量 Evals", "takeaway": "根據團隊規模與預算，靈活選擇『輕量級 PR 即時門禁』或『夜間/每週離線定時跑批』的混合策略。", "details": ["<strong>全量評測的成本考量</strong>：跑完 50 個複雜任務可能消耗數百萬 Token 與 15 分鐘的 CI 資源，每次普通代碼 Push 都跑成本過高。", "<strong>精準路徑過濾 (Path Filtering)</strong>：只有在 PR 觸及了 `CLAUDE.md` 或 `.claude/**` 時才觸發 Evals；普通業務代碼變更只跑傳統單元測試。", "<strong>階梯式執行頻次</strong>：精選 5 個核心金絲雀用例在 PR 實時跑（<3分鐘），全量 50 個用例留給夜間 Cron 執行，完美平衡成本與防禦。"], "metaphor": "這就像銀行金庫的安全檢查：營業期間每筆大額存取款只進行指紋與密碼驗證（輕量即時檢查）；而在每天營業結束、大門關閉後的深夜，安保部隊會帶著防暴犬進行全館拉網式紅外線徹底大排查（離線全量檢查）。", "layout": "成本效益天平矩陣：橫軸為執行頻率，縱軸為 Token 預算與時間耗時，清晰標註出最優混合實踐點。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 10, "title": "評測大數據與歷史趨勢洞察：組織級效能儀表板", "subtitle": "用長期數據證明 AI-Native SDLC 對組織工程效能的真正貢獻", "takeaway": "記錄每一次 Evals 的詳細指標，將其視覺化為歷史趨勢圖，讓管理層清晰洞悉團隊工程智力的演進歷程。", "details": ["<strong>量化指標體系</strong>：追蹤 Pass Rate（通過率走勢）、Token Efficiency（平均解決問題耗費的 Token 數量）、Task Duration（自主解決時長）。", "<strong>評估模型升級收益</strong>：當 Anthropic 發布新版模型時，在同一套 Evals 上運行基準測試，用客觀數據向領導層展示『升級後研發提速 30%、錯誤率下降 15%』的量化依據。", "<strong>識別系統性架構短板</strong>：如果發現涉及資料庫事務的用例經常不及格，精準指導架構團隊在該領域加強專屬 Skill 或重構 SDK。"], "metaphor": "這就像專業運動員的『生理機能大數據監控雷達圖』：長期記錄心率、最大攝氧量與肌肉耐力變化曲線，教練團隊能精準發現運動員是在體能儲備期還是在競技巔峰期，並制定科學的訓練計畫。", "layout": "效能儀表板視覺化展示：包含通過率隨時間推移的平滑攀升曲線、不同模組的能力雷達圖與 Token 消耗散佈圖。"}, {"chapter_id": 12, "chapter_name": "第 12 章：Stage 4: Test — CI 持續評測系統：Continuous Evals", "page_num": 11, "title": "第十二章實戰總結：為 Agent 智力打造永不磨損的度量衡", "subtitle": "Stage 4 Test 評測體系圓滿收官與下章預告", "takeaway": "Continuous Evals 讓 AI 原生研發擺脫了玄學與主觀臆斷，賦予了團隊客觀、科學、可度量的工業級品質保證！", "details": ["<strong>四大核心心法</strong>：收集 20~50 個真實案例、四維客觀驗收標準、配置變更嚴格卡點、事故第一時間轉化為用例。", "<strong>代碼與大腦雙重合格</strong>：至此，代碼本身已經通過了本地 Feedback Loop，引導 Agent 的配置也通過了 Continuous Evals 的淬煉！", "<strong>前瞻第十三章</strong>：這批高品質代碼即將被推送到 GitHub 建立 Pull Request，如何讓 AI 深度融入 PR 審查？第十三章『AI in the PR review loop』將為您揭示全新玩法！"], "metaphor": "巴黎國際度量衡局深處保存著由鉑銥合金製成的『國際千克原器』，世界因精確的標準而建立信任；Continuous Evals 就是我們為整個軟體研發工廠鑄造的那枚永不磨損的品質原器！", "layout": "三條核心實踐卡片，底部搭配通往 Stage 5 Deploy 的發布火箭箭頭。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 1, "title": "雙向奔赴的審查革命：Claude 既受審，亦審人", "subtitle": "打破傳統單向審核局限：AI 在 Pull Request 討論串中的全景角色", "takeaway": "Claude 在審查循環中具備雙重身分：它既作為資深審查員主動檢驗 PR 代碼，又作為修復者在評論區中聽從反饋推動修復。", "details": ["<strong>審查人寫的代碼</strong>：對人類工程師提交的 PR 進行細緻排查，找出潛在併發死鎖、邊界未處理或安全漏洞。", "<strong>自我修正自己的 PR</strong>：當它自己發起 PR 或收到人類 Reviewer 的修改意見時，能精準理解上下文並推代碼修復。", "<strong>解放人類工程師的核心認知</strong>：將資深審查員從繁雜的排版、常規邏輯與語法除錯中抽身，專注於判斷『這項業務意圖是否符合當前戰略』與『系統架構風險評估』。"], "metaphor": "就像一家老字號律師事務所裡的兩位搭檔：年輕的主力律師（Claude）負責審閱厚達數百頁的合同文本、標註違約風險條款並起草補充協議；而資深合夥人（人類負責人）只需點上一支雪茄，快速翻看摘要並在最後簽字蓋章確認大方向。", "layout": "雙向循環圖：左側展示 Claude Reviewer 給出審查意見，右側展示 Claude Fixer 收到反饋後自動提交代碼修復，人類居中把關。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 2, "title": "託管服務 vs CI Actions：兩種主流實踐架構", "subtitle": "Anthropic Managed Code Review vs 自建 claude-code-action", "takeaway": "依據企業安全邊界與雲端策略，自由選擇『一鍵託管的 SaaS 服務』或『自託管在私有 CI/CD 的 GitHub Action』。", "details": ["<strong>託管 Code Review 服務（極速啟動）</strong>：管理員在後台點選倉庫即可啟用，由 Anthropic 基礎設施自動監聽 PR 並發布審查結果，維護成本為零。", "<strong>自建 claude-code-action（深度可控）</strong>：在組織自身的 GitHub Actions 流水線中執行，所有 API 調用經由企業私有的 AWS/GCP 專用合約路由，數據嚴格不離境。", "<strong>統一的體驗基線</strong>：兩種方式皆完整支援 `@claude` 標籤對話與自動修復循環，兼顧了便利性與合規嚴肅性。"], "metaphor": "這就像企業差旅出行：你可以直接使用全託管的五星級酒店行政禮賓車隊服務（Managed Service，省心高質）；也可以在內部成立自己的特種專屬車隊並配備專職私家司機（自建 Action，絕對排他與自主掌控）。", "layout": "雙軌架構對照圖：左側展示 Anthropic 託管通道，右側展示企業內部 VPC 與自建 GitHub Runner 專用隧道。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 3, "title": "REVIEW.md 審查憲章：為 AI 審查員劃定法規", "subtitle": "Anthropic 核心實務：根目錄下的 REVIEW.md 到底該寫什麼？", "takeaway": "REVIEW.md 是整個 PR 審查的最高法規，精確定義了三道審查通道、何謂重要問題 (Important)，以及瑣碎問題的容忍上限。", "details": ["<strong>劃分三大必審通道</strong>：Bugs（邏輯漏洞與邊界崩潰）、Security（注入攻擊、認證缺失與日誌洩密）、Compliance（對齊 spec.md 與 plan.md）。", "<strong>重新定義 Important（重要性）</strong>：嚴格規定只有會引發功能故障、資料外洩或違背政策的發現才算 Important；變數命名或括號換行純屬 Nit（瑣碎瑕疵）。", "<strong>禁止回報噪音路徑</strong>：明確列出排除清單（如 `src/gen/` 自動生成代碼，或編譯器 CI 已經強制檢驗的格式）。"], "metaphor": "就像法庭上的『陪審團審判指引手冊』：法官嚴肅告誡陪審員，你們的職責是判定被告是否有意實施了重大違法行為（Bugs & Security），絕不能因為嫌棄被告衣服上有褶皺或領帶不對稱（Nits）而宣告他有罪。", "layout": "REVIEW.md 結構解析圖：三大檢查通道徽章、Important 判定標準、排除清單與評估權重分布。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 4, "title": "官方實戰範例拆解：REVIEW.md 黃金模板", "subtitle": "Anthropic 原生指南：不到二十行的極致精煉審查政策", "takeaway": "這份官方範例徹底解決了傳統靜態掃描工具滿屏紅字報警、卻沒有人願意看的致命痛點。", "details": ["```markdown\n# Review instructions\n\n## Passes\nRun three passes and tag each finding with its pass:\n- Bugs: logic errors, broken edge cases, subtle regressions\n- Security: injection risks, authentication gaps, PII in logs\n- Compliance: the change matches spec.md, plan.md and our design principles\n\n## What Important means here\nReserve Important for findings that would break behavior, leak data\nor breach a policy. Style and naming are nits.\n\n## Cap the nits\nReport at most five nits per review; summarize the rest as a count.\n\n## Do not report\nGenerated files under src/gen/ and anything CI already enforces.\n```", "<strong>壓制瑣碎問題 (Cap the nits)</strong>：『每次審查最多只允許報告 5 個 Nits，其餘全數合併為一個統計數字』，徹底杜絕無效噪音！"], "metaphor": "宛如一份外科專家的『重症巡房手冊』：巡房時只許把血壓異常、術後大出血或嚴重感染等致命指標當面大聲報告（Important）；病房床單微皺（Nits）一天最多提一次，絕不許喋喋不休打擾主刀救人。", "layout": "代碼區塊高亮展示 REVIEW.md 全文，重點註解『Cap the nits 規則』與『三道審查通道』。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 5, "title": "審查結果不具備投票權：堅守 Code Owner 批准防線", "subtitle": "AI 可以吹哨，但絕對沒有按下 Merge 的最終權力", "takeaway": "AI 審查的發現（Findings）本身絕不能自動 Approve 或 Block PR，分支保護規則依然強制要求具名人類 Code Owner 批准。", "details": ["<strong>職責分離的鐵律</strong>：AI 審查員提供情報與客觀記分板，但法定的合併責任始終由具備實體身分的工程師承擔。", "<strong>機器可讀的嚴重等級統計</strong>：Check Run 會將 Critical、Warning、Nit 統計為機器可讀的結構化數據，平台工程師可設定門禁閾值（例如 Critical > 0 禁止點擊 Merge）。", "<strong>輔助而非替代</strong>：人類審核者打開 PR 時，首先看的是 AI 整理出的這份精華記分卡，帶著精確的情報直接切入問題核心。"], "metaphor": "這就像足球場上的 VAR 影像輔助裁判系統：高科技攝影機與 AI 越位偵測線能清晰標記出球員是否越位，但在大螢幕前做出最後判罰手勢並吹響哨子的，永遠是奔跑在草皮上的主裁判本人。", "layout": "職責權限邊界圖：AI 負責『掃描排查、統計記分、提供建議』，人類 Code Owner 獨占『最終評定、責任擔當、點擊 Merge』。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 6, "title": "@claude 交互修復循環：在評論串中直接推代碼", "subtitle": "告別手動切換分支、修改、commit、push 的繁瑣套路", "takeaway": "無論是審查者還是作者，只要在 PR 評論中 @claude，Claude 將自動解析上下文、在背景修改代碼並將 Fix 提交至該分支。", "details": ["<strong>自然語言驅動代碼修補</strong>：工程師在第 42 行代碼旁留下評論：`@claude 這裡缺少對負數輸入的邊界校驗，請幫我補充單元測試並防禦`。", "<strong>自動產生修復 Commit</strong>：Claude 讀取 PR 歷史與評論內容，在幾十秒內向該 Pull Request 推送一個乾淨的修復提交，並在討論串中回覆說明。", "<strong>雙向透明的審計歷史</strong>：每一次業務要求與對應的代碼修正，完整作為評論與 Commit 記錄在 PR 歷史中，條理清晰無懈可擊。"], "metaphor": "就像主編在審稿時用紅筆在稿件旁畫了一個圈並寫上『第三段論證論據不足，請補充最新統計局數據』，幾分鐘後，特約助手立刻端來重新修訂裝訂完畢的最新稿件附在下方。", "layout": "PR 對話串截圖模擬：人類提出修復意見 → @claude 標籤觸發 Worker → 自動推送 Commit 0a4f3b → 評論串自動回報更新完畢。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 7, "title": "PR 保姆式全自動托育 (PR Babysitting)", "subtitle": "團隊高階玩法：自訂斜線指令，讓 Claude 陪跑 PR 直到綠燈", "takeaway": "編寫自訂指令讓 Claude 掃蕩 PR 上所有未解決的評論與失敗的 Check，自動推代碼修復，直到萬事俱備只差人眼點擊！", "details": ["<strong>自動清道夫 (Sweep the PR)</strong>：當 PR 提交後，自動掃描所有靜態檢查紅燈、單元測試失敗與 Reviewer 的未解決反饋。", "<strong>連續自主修復推進</strong>：逐一攻克所有報錯，自動推代碼，直到所有 CI 測試再次亮起全綠燈號。", "<strong>等待人類最後一瞥</strong>：當所有機器阻礙全數掃除，PR 處於『完全綠燈、等待 Code Owner 最終簽收』的完美待命狀態，工程師只需花 30 秒確認。"], "metaphor": "如同專業一級方程式賽車的進站維修保姆車隊：賽車一進站，十幾位技師在 2.5 秒內自主完成換胎、加油、前翼微調與散熱口清理，維修燈自動變綠，只等待車手掛檔起步衝刺。", "layout": "自適應修復流水線圖：掃描失敗 Checks → @claude 自動分析修補 → 再次觸發 CI → 全綠等待人眼 Approve。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 8, "title": "審查反饋回寫 CLAUDE.md：組織集體記憶的飛輪", "subtitle": "審查發現的任何二次失誤，立刻轉化為全體 Agent 的免疫規則", "takeaway": "當 Review 過程中第二次指出某項常規錯誤時，該 PR 的修復代碼必須順手把這條規則寫入 CLAUDE.md，自此絕不再犯。", "details": ["<strong>杜絕同類問題反覆折磨人眼</strong>：例如 Reviewer 兩次指出『禁止在日誌中列印用戶手機號』，這項規約在當次 PR 就必須寫入根目錄知識庫。", "<strong>審查工具自動監督文檔過時</strong>：審查機器人還會反向檢查：『本次 PR 修改了資料庫架構，但未同步更新 CLAUDE.md 中的架構段落，請修正』。", "<strong>知識庫越用越厚實</strong>：經過三個月運轉，團隊常見的壞習慣全數被沉澱在規則中，新員工與 Agent 的代碼品質自然脫胎換骨。"], "metaphor": "就像城市的道路交通管理局：一旦某個十字路口連續發生了兩起轉彎車輛刮蹭事故，交管局第二天立刻在該路口架設凸面反光鏡並在柏油路上刷上醒目的減速黃色斑馬線。", "layout": "飛輪效應循環圖：PR 審查抓出問題 → 寫入 CLAUDE.md → 下次編碼自動遵守 → PR 審查噪音歸零。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 9, "title": "每月例行調優：動態評級與雜訊控制", "subtitle": "技術主管的定期功課：淘汰鈍化規則，維持審查員的極致銳度", "takeaway": "技術專家每個月花費半小時，對 AI 審查員的評審表現進行打分評級，並在 REVIEW.md 中動態調整條款。", "details": ["<strong>評級審查發現 (Rate the Findings)</strong>：將誤報率高、毫無意義的挑刺標記為 Unhelpful，指導模型調整未來的評判閾值。", "<strong>動態調整 Nits 配額</strong>：如果發現團隊依然被格式噪音打擾，在 REVIEW.md 中進一步嚴格限制 Nits 上限（如從 5 個縮減為 3 個）。", "<strong>更新排除路徑與新工具鏈</strong>：隨著團隊引入了新的代碼自動生成器，及時將新產生的路徑納入『Do not report』名單，防止誤傷。"], "metaphor": "這就像頂級名廚每個月都要親自用磨刀石打磨自己的整套大馬士革鋼刀：剔除崩口的刀刃、重新研磨鋒芒，確保切片時肉質平整如鏡、絕不拖泥帶水。", "layout": "月度維護儀表板：展示審查準確率評分走勢、各類別 Finding 佔比餅圖，以及本月排除規則修訂歷史。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 10, "title": "合規與審計完整留痕：PR 成為無可辯駁的法律憑證", "subtitle": "誰審核了代碼、修改了什麼、哪位負責人批准——永遠鎖定", "takeaway": "職責分離原則得到完美捍衛，編寫代碼的 Agent 永遠無法批准自己的 PR，整個 PR 討論串即是法定的審計記錄。", "details": ["<strong>職責分離 (Separation of Duties, SoD)</strong>：即使代碼是由 Claude Code 編寫、且由 Claude Reviewer 初審，它依然受到分支保護封鎖，絕不可能自批自合。", "<strong>不可篡改的證據鏈條</strong>：PR 包含原始 intent.md、對應的 spec.md、審查發現清單、@claude 修復日誌與人類簽核時間戳。", "<strong>從容應對外部審計官</strong>：面對監管機構的突擊審計，只需導出 PR 的完整 PDF 或 JSON 存證，所有決策軌跡清清楚楚、有據可查。"], "metaphor": "這就像國際貿易中的『信用證與海關提單全套單據』：載貨清單、商檢合格證、船長簽署提單與銀行承兌匯票裝訂在一起，任何國際公證官都能在五分鐘內完成驗證合法性。", "layout": "審計檔案卷宗圖示：一個裝訂成冊的金色卷宗，封面印著 Pull Request #1428，內部整齊排列各類法規簽署憑證。"}, {"chapter_id": 13, "chapter_name": "第 13 章：Stage 5: Deploy — AI 驅動程式碼審查：PR Review Loop", "page_num": 11, "title": "第十三章實戰總結：讓審查成為研發生產力的助推火箭", "subtitle": "Stage 5 Deploy 審查閉環核心總結與下章預告", "takeaway": "PR Review Loop 將代碼審查從痛苦的人肉挑刺泥潭，昇華為人機雙向對話、知識自動沉澱與法規完美合規的高效舞台！", "details": ["<strong>三大核心落腳點</strong>：編寫精簡的 REVIEW.md、開放 @claude 自動修復循環、堅守 Code Owner 人類最終批准。", "<strong>PR 已經批准，代碼能隨意發布到生產嗎？</strong>：絕對不行！我們需要一道不可逾越的部署門禁！", "<strong>前瞻第十四章</strong>：在代碼推入生產環境的關鍵時刻，如何使用 Hooks 作為審批門禁，杜絕任何未經授權的發布？第十四章『Hooks as approval gates』將震撼呈現！"], "metaphor": "經過這座精密的多層智慧質檢過濾塔，每一滴即將流入生產環境的代碼都被過濾得純淨無暇；現在，它即將來到整個水庫最後的大壩閘門——生產審批門禁！", "layout": "三條核心實踐卡片，底部搭配通往第十四章 Release Gates 的鋼鐵閘門圖標。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 1, "title": "從建置防護到發布門禁：Hooks 的雙重身分蛻變", "subtitle": "在 Build 階段它是無人值守的護欄；在 Deploy 階段它是嚴肅的審批官", "takeaway": "建置期的 Hook 追求全自動（Allow or Block）；而部署期的 Hook 則引入『詢問與暫停 (Ask/Pause)』，直到特定人類授權方能放行。", "details": ["<strong>發布門禁的不可逾越性</strong>：將代碼推送到生產環境、執行生產資料庫遷移或調用雲端發布 API，是影響業務連續性的最高危動作。", "<strong>從軟性規則升級為硬門禁</strong>：不再寄望於工程師在命令列裡自覺不去敲生產命令，而是讓 Hook 腳本在底層截斷未經核准的發布指令。", "<strong>通用的 Hook 機制，分級的策略表達</strong>：相同的 PreToolUse 框架，在不同生命週期階段承載著完全不同嚴肅等級的治理目標。"], "metaphor": "這就像同一個安全檢查站：在平時內部園區巡邏時（Build 階段），雷達自動識別員工證件抬桿（全自動）；但當車輛即將駛出國境海關邊界時（Deploy 階段），路障升起、海關總督察親自核驗簽署的特許通行證，方可放行出境。", "layout": "雙重身分對比圖：左側展示 Build 階段的輕量級綠色自動抬桿，右側展示 Deploy 階段由紅燈守護的具名人工簽章門禁。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 2, "title": "鎖定不可妥協的門禁清單 (Human Approval Gates)", "subtitle": "工程領導層、變更管理與合規團隊必須共同堅守的底線", "takeaway": "哪些權力必須永遠保留在人類手中？變更管理簽核、生產發布授權與高危資料庫結構修改。", "details": ["<strong>門禁一：變更管理委員會 (CAB) 簽核標籤</strong>：生產發布必須關聯已被核准的 Jira/ServiceNow 變更工單號。", "<strong>門禁二：具名發布主管授權 (Release Authorization)</strong>：必須檢驗發布經理專屬的環境變數授權碼或數位簽章。", "<strong>門禁三：受保護的基礎設施路徑</strong>：禁止任何無人值守 Agent 擅自修改 Terraform 核心網路拓撲或 KMS 金鑰策略。"], "metaphor": "如同三峽大壩的防汛調度手冊：上游常規水庫排沙發電只需輪值工程師按電鈕，但如果遇到百年一遇特大洪峰需要開啟洩洪深孔閘門，必須由防汛抗旱指揮部總指揮親自簽署特級動員令。", "layout": "三重鋼鐵門禁示意圖：CAB Ticket、Named Release Authorization、Protected Infra 依序橫亙在發布管線前方。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 3, "title": "官方實戰範例：.claude/settings.json 門禁配置", "subtitle": "Anthropic 原生指南：如何宣告生產發布拦截規則？", "takeaway": "用簡潔清晰的聲明式配置，將 Bash 工具與專門的生產門禁檢查腳本進行剛性綁定。", "details": ["```json\n{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"${CLAUDE_PROJECT_DIR}/.claude/hooks/production-gate.sh\"\n          }\n        ]\n      }\n    ]\n  }\n}\n```", "<strong>全域無縫攔截</strong>：任何透過 Bash 工具發起的終端命令，在送交系統執行前，必先經過 `production-gate.sh` 進行政治審查！", "<strong>團隊共享與受管覆蓋</strong>：配置保存在代碼庫中由全隊共有，在受監管企業中更可由 IT 管理員部署為不可覆蓋的受管配置。"], "metaphor": "這就像在整座大樓的總水閥旁安裝了一組聯鎖電磁閥：任何水管工轉動水龍頭時，感應電磁閥必須先確認大樓總控室是否傳輸了水壓解鎖密碼，否則閥門死死鎖定、分水不漏。", "layout": "代碼高亮卡片展示 settings.json，旁邊附帶箭頭指向 production-gate.sh 實體腳本。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 4, "title": "官方門禁腳本深入拆解：production-gate.sh", "subtitle": "僅僅十行代碼，如何建構起價值連城的生產安全閘門？", "takeaway": "透過正則精準嗅探命令意圖，檢驗環境變數授權；一旦缺失，立刻以 Exit 2 阻斷並輸出明確審批指引。", "details": ["```bash\n#!/bin/bash\n# 生產環境發布必須具備具名的發布授權證明\ncmd=$(jq -r '.tool_input.command' < /dev/stdin)\nif [[ \"$cmd\" == *\"deploy\"* && \"$cmd\" == *\"production\"* ]]; then\n   if [ -z \"$RELEASE_APPROVAL\" ]; then\n     echo \"[Release Gate] 嚴重阻斷：生產環境部署需要具名發布授權碼！\" >&2\n     echo \"請先獲得發布經理核准，並注入 RELEASE_APPROVAL 變數。\" >&2\n     exit 2 # exit 2 阻斷動作；提示資訊將原樣呈報給 Claude\n   fi\nfi\nexit 0\n```", "<strong>退出碼 2 的精妙之處</strong>：不報廢整場會話，而是將阻斷理由傳遞給 Claude，Claude 能優雅地回覆用戶：『我已經備妥所有發布包，正在等待您的授權碼』。"], "metaphor": "如同金庫大門的雙鑰匙防護鎖：第一把機械鑰匙已經插好（代碼就緒），但旋轉手柄時感測器提示『缺少二號電子鑰匙（RELEASE_APPROVAL）』，蜂鳴器響起並提示請主管前來刷卡認證。", "layout": "代碼區塊高亮 production-gate.sh 全文，重點以紅綠雙色標註『變量檢驗』與『Exit 2 阻斷出口』。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 5, "title": "具名授權機制 (Named Release Authorization)", "subtitle": "告別含糊其辭的口頭批准：法定合規責任的數位烙印", "takeaway": "授權不是匿名點擊，而是將具體發布負責人的職工編號、時間戳或專屬簽章令牌注入環境，永久鎖定責任。", "details": ["<strong>明確責任人 (Accountability)</strong>：`RELEASE_APPROVAL=\"AUTH-2026-09-JSMITH\"`，一旦線上發生重大波及，能精準定位是哪位主管在何時做出的放行決策。", "<strong>防止授權令牌濫用</strong>：授權碼通常由內部變更管理系統動態發放，有效期僅限於發布窗口期的 30 分鐘，過期自動作廢。", "<strong>徹底杜絕 Agent 偽造授權</strong>：Agent 本身不具備向身份系統申請授權碼的權限，這個斷點牢牢掌握在人類管理者手中。"], "metaphor": "就像核潛艇發射戰略導彈的通信指令：大總統下達的核密碼必須包含總統個人的特徵識別碼、經過國防部長雙重核驗確認，兩把密碼鑰匙嚴絲合縫，發射電路才會正式接通。", "layout": "授權憑證卡片圖：展示帶有時間戳、工號、數位簽名與 30 分鐘倒計時的 Named Release Authorization 徽章。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 6, "title": "全鏈條審計存證：放行與阻斷日誌全量採集", "subtitle": "每一場嘗試、每一次成功、每一筆駁回，全數記錄在案", "takeaway": "門禁腳本的所有判決結果，自動附帶環境變數與調用參數，流式寫入不可篡改的集中式審計日誌中。", "details": ["<strong>合規追溯零死角</strong>：滿足金融與醫療機構對於『誰何時嘗試登錄生產機台、何時被阻斷』的法定監管存證訴求。", "<strong>及時發現異常入侵傾向</strong>：如果日誌顯示某個會話連續 5 次試圖強行調用生產部署命令，安全監控系統自動拉響警報並凍結權限。", "<strong>免受審計官質疑</strong>：審計季度到來時，一鍵導出門禁執行日誌報表，清晰展示每一次生產部署皆持有具名授權無一例外。"], "metaphor": "這就像飛機駕駛艙的『語音記錄儀與飛控黑盒子』：機長每一次拉動操縱桿、副駕駛每一次應答通話、地面防撞系統每一次語音告警，毫秒不差地記錄在防高溫防衝擊的高強度鈦合金外殼內。", "layout": "審計日誌流動圖：門禁攔截事件 → 格式化為 CEF/Syslog → 傳輸至 Splunk/Datadog SIEM 集中存證。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 7, "title": "環境自主權限分級 (Environment Tiers)", "subtitle": "Dev 自由奔馳、Staging 嚴格演練、Prod 門禁重重", "takeaway": "根據環境特質實施階梯式信任：開發環境全面放權，生產環境鐵板一塊，測試環境兼顧演練與安全。", "details": ["<strong>Development（開發環境）</strong>：Agent 擁有完全的自主部署權，隨意修改配置與重啟容器，最大化研發迭代敏捷度。", "<strong>Staging（預發布環境）</strong>：Agent 擁有部署權，但必須嚴格演練生產標準流水線，包括回滾腳本測試與性能壓測。", "<strong>Production（生產環境）</strong>：Agent 僅具備發布準備與演練權限，最終的發布執行必須由人類發布主管親自授權放行。"], "metaphor": "就像航天基地的測試環境：在地面重力實驗室（Dev），宇航員可以穿著拖鞋隨意拆裝模擬艙開關；在上層離心機艙（Staging），必須嚴格穿著宇航服進行失重演習；而在真正踏入發射架（Prod）的最後一刻，必須聽從地面控制中心總指揮官的口令。", "layout": "三級階梯金字塔：底部為綠色 Dev (自由度 100%)、中部為黃色 Staging (受限演練)、頂部為紅色 Prod (嚴格門禁審批)。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 8, "title": "回滾路徑 (Rollback) 的常態演練：最常被執行的安全路徑", "subtitle": "Anthropic 核心哲學：發布可能失敗，但回滾必須百發百中", "takeaway": "回滾路徑不能等出事了才臨時摸索，它必須是整個流水線中被最頻繁驗證、一鍵即可觸發的確定性指令。", "details": ["<strong>預演先於發布</strong>：在代碼踏入生產前，Staging 環境必須先執行一次自動發布並立刻執行一次一鍵回滾，證明逆向路徑完全暢通。", "<strong>封裝為單一極速指令</strong>：例如 `make rollback` 或 MCP 工具 `tools.rollback()`，不需要人工登入伺服器臨時手工找備份。", "<strong>Stage 6 閉環自愈的底層保障</strong>：下一章的閉環監控在發現生產指標崩潰時，呼叫的就是這條早已被反覆演練成肌肉記憶的一鍵回滾通道！"], "metaphor": "這就像客機起飛前空乘人員向全體旅客示範的『緊急逃生滑梯與氧氣面罩』：地勤人員每週都要對充氣滑梯進行彈出測試，確保在黑夜濃煙的極端狀態下，一拉閥門 5 秒鐘內滑梯必能完全充氣展開。", "layout": "雙向流水線圖：上方藍色箭頭為 Deploy 發布路徑，下方亮橘色箭頭為極速 Rollback 逆向秒級回滾通道。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 9, "title": "跨生命週期的 Hooks 聯動：處處有把關，處處皆通暢", "subtitle": "Hooks 不僅屬於 Deploy：它貫穿 SDLC 的每一個神經末梢", "takeaway": "雖然發布門禁最為典型，但 Hooks 活躍在所有階段：保護 Migration、鎖死測試檔案、杜絕機密洩漏。", "details": ["<strong>Stage 3 Build 聯動</strong>：阻斷無工單修改資料庫 Migration 檔案與 Terraform 代碼。", "<strong>Stage 4 Test 聯動</strong>：在 Bug 修復任務中，物理封死對單元測試檔案的寫入權限，防範作弊。", "<strong>Stage 5 Deploy 聯動</strong>：阻斷缺少 `$RELEASE_APPROVAL` 的生產發布指令。", "<strong>無處不在的守護</strong>：同一套 Hooks 機制在不同階段各司其職，共同編織出一張籠罩全生命週期的安全天網。"], "metaphor": "就像現代智慧大樓的安防門禁系統：大門口檢驗訪客二維碼（Deploy），各樓層電梯需要刷員工卡（Build），核心財務室需要雙人指紋加虹膜認證（Migration/Secrets），層層設防、環環相扣。", "layout": "全生命週期網絡圖：展示 Hooks 如何在 Plan、Build、Test、Deploy 各環節精確布防，構築立體縱深防禦。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 10, "title": "受管環境中的絕對防篡改：IT 管理員的終極權限", "subtitle": "如何防止個別員工在本地終端中偷偷 rm -rf .claude/hooks？", "takeaway": "在企業級部署中，核心門禁腳本存放於操作系統 root 權限保護目錄，即使本機開發者擁有 sudo 權限也無法篡改審查規則。", "details": ["<strong>只讀唯讀屬性鎖定</strong>：核心 Hook 檔案掛載為唯讀檔案系統 (Read-Only Mount)，或透過 MDM/Puppet 定時強制重置基線。", "<strong>雜湊值校驗 (Checksum Verification)</strong>：Claude Code 啟動時自動比對 Hooks 腳本的 SHA-256 數位簽名，一旦發現內容被篡改，立即拒絕開機。", "<strong>給予監管合規員最大底氣</strong>：無論工程師如何熱衷於折騰本地環境，這道由公司法規直接管轄的實體鋼鐵閘門永遠堅不可摧。"], "metaphor": "如同特種防彈運鈔車的後艙鎖芯：鎖芯由銀行安全總部統一雷射雕刻編碼封裝，押運員手裡只有方向盤和油門踏板，就算把整輛車開進私人修理廠，也絕不可能在不觸發警報的情況下撬開後艙分毫。", "layout": "防護鎖死架構圖：操作系統底層唯讀保護層包裹著 production-gate.sh，雜湊校驗盾牌守衛在啟動入口。"}, {"chapter_id": 14, "chapter_name": "第 14 章：Stage 5: Deploy — 部署把關：Hooks 作為審批門禁", "page_num": 11, "title": "第十四章實戰總結：讓 Agent 止步於生產門禁之前", "subtitle": "Stage 5 Deploy 審批門禁核心總結與下章預告", "takeaway": "核心治理鐵律：Agent 可以全自主行動直到生產門禁，但絕對不允許擅自跨過門禁！", "details": ["<strong>守護原則</strong>：分支保護強制 PR 合併、production-gate 攔截未授權發布、分級環境確保邊界分明、回滾常態化演練。", "<strong>門禁已經立起，如何將 Claude 真正接入 CI/CD 流水線？</strong>：第十五章將揭示如何在無人值守管線中安全運行 Claude！", "<strong>前瞻第十五章</strong>：容器沙盒隔離、短時效 Token、MCP 工具封裝部署權限，第十五章『CI/CD integration and deployment』即將登場！"], "metaphor": "大壩已經落成，閘門威嚴屹立；現在，我們將引導水流精準穿過渦輪發電機組，將這股龐大的奔湧能量安全轉化為驅動全城運轉的強勁電力！", "layout": "三條核心實踐卡片，底部搭配通往第十五章 CI/CD Integration 的高速流水線箭頭。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 1, "title": "無人值守流水線：在 CI/CD 中非互動式執行 Claude", "subtitle": "告別人工終端操作：讓 Agent 成為自動化流水線中標準的 Step", "takeaway": "透過 `claude -p` 命令，將 Claude Code 嵌入 GitHub Actions 或 GitLab CI，自動執行建置排查、文檔生成與自動修復。", "details": ["<strong>非互動式運行 (Non-interactive Mode)</strong>：在 CI 環境中沒有真人按鍵盤，`-p` 參數接收完整 Prompt，執行完畢輸出結構化結果後優雅退出。", "<strong>漸進式採納：從唯讀診斷起步</strong>：初期不賦予寫入權限，先讓 Agent 負責在建置失敗時排查日誌、分析不穩定測試 (Flaky Test) 或起草 Changelog。", "<strong>進階授權：受限的自動寫入</strong>：在嚴格門禁後方，允許 Agent 自動修復 Lint 報錯、更新 API 衍生文檔或處理 PR 上的 `@claude` 評論。"], "metaphor": "這就像工業裝配線上的『自動光學螺絲檢驗機器人』：它不需要工人盯著按開關，傳送帶每送過來一個發動機缸體，它自動啟動掃描螺絲孔位、檢驗扭矩並在合格證上打印二維碼，一氣呵成。", "layout": "CI/CD 流水線展示圖：Checkout → Build → [Claude Triage Job] → Unit Test → Deploy 依序排開。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 2, "title": "官方實戰範例：建置失敗自動排查 (Triage Step)", "subtitle": "Anthropic 原生指南：不到五行的 GitHub Action 神級步驟", "takeaway": "當 Build 步驟不幸紅燈時，自動喚醒 Claude 深度閱讀日誌，提煉出三行精華摘要直接貼入 PR 討論串。", "details": ["```yaml\n- name: Triage failed build\n  if: failure()\n  run: >\n    claude -p \"Read the build log at out/build.log. Identify the most\n    likely cause, say whether the failure looks flaky or real, and write a\n    three-line summary for the PR thread.\" >> triage.md\n```", "<strong>告別幾萬行晦澀日誌</strong>：工程師打開 PR 時，不再需要痛苦地在一萬行堆疊追蹤中尋找報錯，Claude 已經用三句話講清楚了根本原因。", "<strong>自動辨析真假故障</strong>：模型能精準識別這究竟是網路超時引起的偶然不穩定測試 (Flaky)，還是真正的空指標邏輯 Bug。"], "metaphor": "宛如醫院急診室裡的『資深檢傷分類護士』：在救護車剛把傷患推下來的十秒鐘內，快速測量瞳孔與心率，在急救手環上精準寫下『疑似顱內出血、失血性休克早期』，主刀醫生一眼便知搶救重點。", "layout": "YAML 區塊高亮展示 Triage Step，右側展示其自動輸出在 PR 上的簡潔三行診斷摘要。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 3, "title": "沙盒隔離與安全執行環境 (Execution Sandboxing)", "subtitle": "長時間運行的 Agent 如何在不受信任代碼庫中安全執行？", "takeaway": "無人值守的 Agent 必須嚴格運行於隔離的輕量級容器沙盒中，限制網路存取策略，且默認不持有任何生產憑證。", "details": ["<strong>容器與微虛擬機隔離</strong>：使用 Docker/Podman 或 Firecracker 微虛擬機，確保即使 Agent 執行了惡意腳本，影響範圍也被鎖死在容器內部。", "<strong>嚴格的網路出口策略 (Egress Network Policy)</strong>：限制 Agent 只能與特定的 API 閘道和內部 Git 倉庫通訊，禁止向不可信外網 IP 發送流量。", "<strong>生產金鑰絕對剝離</strong>：CI 運行環境中絕不注入任何生產 AWS/GCP 憑證，杜絕環境變數外洩風險。"], "metaphor": "這就像在最高等級生物安全 P4 實驗室（沙盒容器）內研究烈性病毒：實驗員必須穿戴正壓防護服、實驗室保持負壓氣流、所有廢水廢氣經過三級高溫焚化消毒，哪怕試管破裂，病毒也絕無可能洩漏到城市大氣中。", "layout": "三層沙盒防護架構圖：外層為 VPC 網路防火牆，中層為 Docker 容器硬體限制，內層為受管無憑證環境。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 4, "title": "短時效最小權限令牌 (Ephemeral Scoped Tokens)", "subtitle": "告別永久長效金鑰：讓每次 Agent 執行都持有自毀通行證", "takeaway": "透過 OIDC (OpenID Connect) 或臨時憑證機制，為每次 CI 執行動態頒發僅有 15 分鐘有效期的最小權限 Token。", "details": ["<strong>用完即作廢的臨時身分</strong>：Agent 執行的任務結束後，該 Token 自動在雲端身份中心失效，即使日誌外洩，黑客拿到也只是一張廢紙。", "<strong>嚴格限制操作範圍 (Scoped)</strong>：Token 僅允許讀取當前 PR 的變更、向當前分支推送 Commit，絕不具備訪問其他倉庫或後台管理員的權限。", "<strong>擺脫靜態 Secret 的管理噩夢</strong>：不再需要在 GitHub Secrets 中維護永不過期的私鑰，徹底根除金鑰輪替維護負擔。"], "metaphor": "就像現代高級酒店的『一次性電子門禁密碼』：這組六位數密碼只在保潔阿姨打掃房間的特定 20 分鐘內有效，保潔結束關上門的一瞬間，密碼立刻在後台系統中自動作廢失效。", "layout": "OIDC 令牌交換時序圖：GitHub Actions → 憑證簽名向 AWS IAM 交換 STS 臨時 Token → 15 分鐘後自動過期自毀。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 5, "title": "MCP 封裝部署權限：告別裸露的 Shell 腳本", "subtitle": "Model Context Protocol 如何將部署權力精準約束為白名單？", "takeaway": "不要給予 Agent 任意執行 bash deploy.sh 的無限 Shell 權力，而應將其封裝為受控的 MCP 工具：deploy, status, rollback。", "details": ["<strong>傳統 Shell 的巨大漏洞</strong>：如果給予 Agent 任意執行 Shell 指令並注入憑證，惡意提示詞可能誘騙其執行 `cat ~/.aws/credentials` 或 `curl attacker.com`。", "<strong>MCP 語意化抽象</strong>：透過 MCP 協議，Agent 只能調用經過嚴格型別定義的工具函式（如 `tools.deploy({ env: 'staging', tag: 'v1.2' })`）。", "<strong>白名單確定性防禦</strong>：MCP Server 在背後代為處理底層連線與憑證注入，Agent 從頭到尾看不見、摸不著任何底層真實憑證！"], "metaphor": "這就像把原本直接交給實習生一把能打開全樓所有大門的萬能黃銅鑰匙（任意 Shell 權限），改為只給他一個安裝在牆壁上的智慧觸控面板，面板上只有三個被授權的按鈕：開燈、關燈、重啟排風扇（MCP 工具封裝）。", "layout": "MCP 隔離層示意圖：Agent 透過 JSON-RPC 調用 MCP Server 白名單工具，MCP Server 隔離掌控生產憑證並執行安全發布。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 6, "title": "MCP 部署工具集標準規範：deploy / status / rollback", "subtitle": "為 Agent 量身打造的三大發布核心 API 介面", "takeaway": "標準 MCP 部署服務必須精確暴露三項核心工具：發布新版本、查詢運維狀態，以及緊急一鍵回滾。", "details": ["<strong>deploy({ environment, service, version })</strong>：觸發指定服務向指定環境的滾動更新，嚴格校驗入參格式。", "<strong>status({ environment, service })</strong>：查詢當前容器叢集的健康實例數、CPU/記憶體負載與最新錯誤率，供 Agent 自主評估。", "<strong>rollback({ environment, service, target_version })</strong>：秒級將流量切換回上一個健康版本，作為自愈迴圈的終極兜底武器！"], "metaphor": "宛如現代高鐵駕駛室裡的三個核心手柄：加速牽引手柄（deploy）、全景狀態儀表顯示幕（status），以及大紅色的緊急電磁制動回滾手柄（rollback），簡單直接且威力無窮。", "layout": "三面板工具卡片：分別展示 deploy、status、rollback 的 JSON Schema 參數規格與返回值結構。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 7, "title": "環境隔離的 MCP 實例：防止跨環境越權投毒", "subtitle": "開發工具與生產工具絕不混用同一條通道", "takeaway": "為不同的運行環境配置獨立的 MCP Server 實例，開發環境 Agent 甚至連通向生產 MCP 的網路路徑都不存在。", "details": ["<strong>實體隔離部署</strong>：`mcp-deploy-dev` 運行在開發網段，`mcp-deploy-prod` 隔離部署在核心生產網段。", "<strong>無效目標阻斷</strong>：即使 Agent 在開發會話中產生幻覺試圖調用 `deploy({ env: 'production' })`，開發端 MCP Server 直接拋出無效環境參數異常。", "<strong>符合最嚴格金融分級監管</strong>：從網路層面杜絕了任何因為設定混淆而將測試代碼誤推至生產伺服器的可能。"], "metaphor": "就像軍事基地裡的兩條獨立通信線路：普通步兵手中只有短波戰術對講機（Dev MCP），而能夠呼叫戰略轟炸機實施精確打擊的絕密衛星加密通信終端（Prod MCP），只放在最高司令部的防爆地下掩體中。", "layout": "網路隔離架構圖：展示 Dev VPC 與 Prod VPC 中的 MCP Server 完全處於不同安全區域，透過 API Gateway 分級認證。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 8, "title": "發布常態化預演 (Dress Rehearsal)：把發布做成肌肉記憶", "subtitle": "為什麼每一次 Staging 部署都必須伴隨一次一鍵回滾？", "takeaway": "在預發布環境中，讓 Agent 在部署成功的下一秒立刻執行一次 rollback 演練，確保回滾路徑隨時可用。", "details": ["<strong>打破對回滾的恐懼</strong>：很多傳統團隊一年都不敢執行一次回滾，導致真正故障時回滾腳本全報錯崩潰。", "<strong>常態化雙向檢驗</strong>：在每次合併到預發布環境時，管線自動執行：Deploy -> 驗證綠燈 -> Rollback -> 驗證原版本健康 -> 再 Deploy。", "<strong>給予 Stage 6 閉環百分百信心</strong>：只有在常規狀態下被反覆驗證過千百次的路徑，在深夜生產指標突發異常時，我們才敢放手讓 Agent 自主觸發回滾！"], "metaphor": "這就像特技跳傘運動員的訓練：每次穿好主降落傘後，教練強制要求他在地面拉動備用副傘手柄十次，直到在閉眼狀態下也能在半秒鐘內盲操拉出副傘，將求生動作刻進肌肉記憶。", "layout": "雙向循環預演圖：Staging Deploy → 冒煙測試 → 立即演練 Rollback → 確認原狀 → 再次 Deploy 放行，雙向暢通無阻。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 9, "title": "分支保護 (Branch Protection) 終極鐵律：main 永遠受保護", "subtitle": "Agent 哪怕智力再高，也沒有任何通道能直接 push 到 main 分支", "takeaway": "Agent 的任何寫入動作，終點只能是建立一個 Pull Request；main 分支的合併權限永遠受到分支保護鎖定。", "details": ["<strong>封死任何特權直推管道</strong>：在 GitHub/GitLab 倉庫設定中，main 分支開啟強制保護，禁止任何帳號（包括 Admin 與 Agent Service Account）直接 push。", "<strong>強制通過所有 Status Checks</strong>：必須等待單元測試、Continuous Evals、Code Review 記分卡全部綠燈，且獲得具名人類 Approve。", "<strong>審計鏈條的絕對閉環</strong>：這條鐵律保證了主幹上的每一個 Commit，背後必然對應著一份經過完整審查的 PR，沒有任何人可以走後門偷渡代碼！"], "metaphor": "如同國家金庫的核心金庫重門：金庫大門沒有任何機械把手可以從外面推開，只能在防彈玻璃後方由兩位持槍守衛同時在電腦中確認全部十道安檢手續全部打勾後，大門的液壓栓才會緩緩收回。", "layout": "Git 分支防禦示意圖：Feature Branch 充滿靈活性，而 Main Branch 被厚重金屬邊框包裹，中間必須跨越 Pull Request 橋樑。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 10, "title": "獨立 Agent 身分認證與管線日誌清晰歸因", "subtitle": "將機器人行為與觸發者行為嚴格分離，消除糊塗帳", "takeaway": "管線中的非互動式 Agent 必須在自身專屬的服務身分 (Service Principal) 下運行，日誌中清楚區分『機器做了什麼』與『誰觸發了流水線』。", "details": ["<strong>專屬 Bot 帳號標識</strong>：提交的 Commit 作者標記為 `claude-code-bot[bot]`，審批記錄中綁定點擊按鈕的人類工程師工號。", "<strong>審計日誌的乾淨清晰度</strong>：安全審計員能一目了然看清：『工程師張三發起了 PR，Claude Bot 執行了修復並由李四主管批准合併』。", "<strong>細粒度權限控制</strong>：可以隨時單獨吊銷或調整 Agent Bot 的權限，而完全不會波及任何真實人類開發者的日常帳號。"], "metaphor": "這就像在大型現代化醫院裡，手術輔助機器人達文西（Agent）擁有自己專屬的設備序列號與操作日誌記錄，而主刀外科醫生（觸發者）手腕上戴著電子工牌，系統同時記錄機器臂在幾點幾分切除了組織、是由哪位醫生踩下踏板下達的指令。", "layout": "雙身分標籤日誌卡片：展示 GitHub PR 歷史中清晰並列的『Triggered by @alice』與『Executed by @claude-bot』。"}, {"chapter_id": 15, "chapter_name": "第 15 章：Stage 5: Deploy — CI/CD 整合與 MCP 工具授權", "page_num": 11, "title": "第十五章實戰總結：築牢現代化交付的鋼鐵動脈", "subtitle": "Stage 5 Deploy 部署整合圓滿收官與下章預告", "takeaway": "透過容器沙盒、短時效 Token、MCP 工具封裝與分支保護，我們構建了一條既全自動、又絕對安全可審計的部署高速公路！", "details": ["<strong>四大基石回顧</strong>：非互動式流水線、沙盒隔離與最小權限、MCP 語意化部署封裝、常態化一鍵回滾預演。", "<strong>代碼已經上線，然後呢？</strong>：傳統 SDLC 在部署後就宣告結束，但 AI 原生 SDLC 才剛剛迎來最神奇的篇章！", "<strong>前瞻第十六章</strong>：當代碼在生產環境運行時，如何讓 Agent 全天候監控生產指標、在發生異常時自動閉環自愈？第十六章『Closing the loop』即將為您打開新世界大門！"], "metaphor": "火箭已經成功點火發射升空，衛星已精準送入預定軌道；現在，我們將啟動衛星的自主姿態調整引擎與深空遙測天線，讓系統在廣袤的宇宙中實現永不停歇的自我守護與閉環進化！", "layout": "三條核心實踐卡片，底部搭配通往 Stage 6 Maintain 的綠色自愈閉環雷達圖標。"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>從人類敲門到環境自驅動</strong>：前述階段都需要工程師在第一步敲入指令或發起需求；Stage 6 則由生產指標的客觀數據自主喚醒 Agent。", "<strong>反向重啟 Stage 1 (Plan)</strong>：當線上指標發生漂移，監控腳本不是發送無人理睬的報警郵件，而是直接產出一份標準的 `intent.md` 注入意圖庫。", "<strong>流水線全自動流轉</strong>：這份自動產生的修復意圖，經過獨立置信度門禁裁決後，自動流經 Design 規格設計、Build 程式碼建置與 PR Review 審查！"], "layout": "全生命週期莫比烏斯環圖：展示生產環境的運維信號如何跨越維度直接注入第一階段 Plan，形成一個首尾無縫相扣的永動閉環。", "metaphor": "這就像從傳統的人工掃地（必須有人拿著掃把走過去打掃），進化到現代的智慧掃地機器人：當雷達感測到客廳地板有灰塵積聚時，機器人自動從充電樁出發清掃、自動避障倒垃圾，並在完成後返回充電，全過程主人無需說一句話。", "page_num": 1, "subtitle": "從人工提報 Bug 到生產環境自感應重啟研發生命週期", "takeaway": "前五個階段解決了人如何調用 Claude；Stage 6 則標誌著核心質變：系統完全自主運轉，自行閉合研發迴圈。", "title": "終結單向瀑布：SDLC 的自主自愈閉環"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>防範警報幻覺與漏報</strong>：大語言模型不適合 7x24 小時盯著海量數字日誌看曲線，容易產生疲勞或主觀誤判。", "<strong>純數學統計指標</strong>：採用滾動 30 天移動平均線 (Rolling 30-day Baseline) 與標準差，利用經典的 Western Electric 統計過程控制規則。", "<strong>探測慢速漂移 (Slow Drift)</strong>：不僅能捕獲突發斷崖式暴跌，更能敏銳識別出過去三天連續偏離均值的微小退化趨勢。"], "layout": "控制圖 (Control Chart) 示意圖：展示滾動均值線、1σ、2σ、3σ 控制帶邊界，以及真實指標點在控制帶內外的分佈。", "metaphor": "就像重症監護室 (ICU) 的心電監護儀：監測心跳停止的傳感器必須是純粹的電生理脈衝電路（確定性數學腳本），絕不能裝一個只會聊天的人形機器人在旁邊盯著病人臉色猜測心跳。", "page_num": 2, "subtitle": "Anthropic 關鍵架構原則：異常探測絕不能交由 LLM 自由心證", "takeaway": "負責盯盤的探測腳本必須是純粹確定性、經過單元測試且版本控制的數學統計程式，不引入任何 AI 模型。", "title": "確定性監控腳本：排除模型主觀雜音的統計基石"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>1-Sigma（輕微波動）</strong>：僅記錄日誌 (log)，作為長期統計背景數據，不浪費任何 Token 或告警通道。", "<strong>2-Sigma（異常漂移）</strong>：唯讀喚醒 Claude 進行診斷 (diagnose)，授權調用 Read、Grep 與 `gh run view` 深入排查日誌。", "<strong>3-Sigma（嚴重事故）</strong>：正式採取行動 (propose)，授權發起修復 PR，或直接觸發預先批准的一鍵回滾 Runbook！"], "layout": "三級階梯儀表板：綠色 1σ (Log) → 黃色 2σ (Diagnose) → 紅色 3σ (Propose Action / Rollback) 的清晰權限矩陣。", "metaphor": "這就像防空警報體系：探測到遠處有未識別雷達信號亮黃燈僅作日誌記錄（1σ）；信號進入近海防空識別區拉響防空警報並起飛戰機查證（2σ）；敵機一旦越過海岸線防空導彈立刻鎖定發射攔截（3σ）。", "page_num": 3, "subtitle": "Anthropic 官方規範：1σ 記錄、2σ 唯讀診斷、3σ 採取行動", "takeaway": "將應變策略寫入版本控制的 bands.yaml，依據偏離標準差程度分級授予 Agent 診斷與處置權力。", "title": "配置化階梯響應：bands.yaml 的三級防禦體系"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["```yaml\nmetric: ci_test_failure_rate\nbaseline: rolling_30d\nrules: western_electric\ntiers:\n  1sigma: { action: log }\n  2sigma: { action: diagnose,\n            tools: \"Read,Grep,Bash(gh run view *)\" }\n  3sigma: { action: propose,\n            routes: [pull_request, runbook:rollback-deploy] }\n```", "<strong>工具精確授權</strong>：在 2σ 階段嚴格限制只能執行讀取與 `gh run view`，防止 Agent 在探測階段亂改系統。", "<strong>受控的行動路徑</strong>：在 3σ 階段，Agent 的處置動作被嚴格限定在預先批准的兩個管道：提 PR 或調用已演練過的回滾命令。"], "layout": "代碼區塊完整呈現 bands.yaml 配置，右側標註『西點規則、工具白名單、行動路由』三大要素。", "metaphor": "宛如民防應急救援預案卡片：上面印著當水位達到警戒水位時只加強巡堤（1σ）；達到保證水位時各級官兵進駐堤防沙袋待命（2σ）；一旦大水漫堤立刻炸開分洪閘分流（3σ），分毫不亂。", "page_num": 4, "subtitle": "Anthropic 原生指南：十行配置如何守護流水線健康？", "takeaway": "以監控 CI 測試失敗率為例，優雅展示如何將統計規則、工具限制與處置路徑結構化封裝。", "title": "官方實戰範例剖析：bands.yaml 監控 CI 失敗率"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>無狀態執行 (Stateless Execution)</strong>：Agent 每次被喚醒都是一個全新的容器進程，不依賴任何本地殘留記憶，排查完畢即刻銷毀容器。", "<strong>零人類等待點</strong>：從探測到 3σ 異常、喚醒 Claude、讀取錯誤日誌、生成診斷意圖到提交 PR，整個過程在 90 秒內無人值守全自動完成。", "<strong>自動產出符合 Stage 1 格式的 intent.md</strong>：包含異常證據、受影響系統與建議修復方案，完美融入常規研發流。"], "layout": "非同步時序圖：Cron Trigger → 喚醒 Stateless Runner → 抓取 Metric → Claude 生成 intent.md → 自動 Push Git 分支發起 PR。", "metaphor": "就像太空探測器上的『自主重啟看門狗電路』：當主處理器因宇宙射線輻射死機時，獨立的硬體計時器瞬間重置 CPU、清空緩存、重新加載安全韌體並向地球發送一條自檢報告，一切全自動完成在百毫秒之內。", "page_num": 5, "subtitle": "一個閉環如何不需要任何人敲鍵盤，就能自主開始並優雅結束？", "takeaway": "觸發層透過 GitHub 定時排程、監控 Webhook 或 Cron Job 喚醒，以完全無狀態方式在沙盒容器中運行。", "title": "無狀態非互動觸發：Stateless & Non-interactive"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>場景一：CI 測試失敗率突破 3σ</strong>：Agent 自動分析最新合併的提交，定位引發失敗的 Flaky 測試，自動開 PR 將該測試隔離 (Quarantine) 或提交 Revert PR。", "<strong>場景二：發布後 5xx 錯誤率突破 3σ</strong>：若在發布窗口期內錯誤率激增，Agent 自動觸發預先批准的一鍵回滾管線，秒級止血。", "<strong>場景三：PR 審查週期時間突破漂移規則</strong>：若發現團隊 PR 平均等待時間從 4 小時漂移至 48 小時，Agent 自動為研發主管產出一份流程瓶頸歸因診斷報告！"], "layout": "三場景卡片圖：分別展示 CI 測試隔離、生產秒級回滾、流程漂移診斷的觸發圖表與處置結果。", "metaphor": "這就像一個既懂得自我止血的智慧士兵（自愈代碼故障），同時還具備自我心理疏導能力的健康手環（診斷組織流程堵塞），身心雙重自愈進化。", "page_num": 6, "subtitle": "從生產運行指標到研發流程效能指標的全面覆蓋", "takeaway": "Closing the loop 不僅能自愈生產伺服器故障，更能主動診斷團隊組織流程本身的瓶頸漂移！", "title": "三大經典自愈場景：CI 失敗率、5xx 錯誤率與 PR 週期"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>路徑一：立即修復 (Fix Now)</strong>：確認是重大生產缺陷，一鍵批准將該 intent.md 推入後續的自動化實作與發布管線。", "<strong>路徑二：排入待辦 (Schedule)</strong>：非緊急的輕微效能優化，自動轉發給產品經理納入下個 Sprint 的正常迭代待辦池。", "<strong>路徑三：駁回忽略 (Dismiss with Reason)</strong>：判定為偶發雜訊，填寫駁回理由；這些駁回記錄將作為反饋數據，用於反向調優控制帶敏感度！"], "layout": "分流決策樹：自動生成的 intent.md → On-call Engineer 面板 → [Fix Now / Schedule / Dismiss] 分流處理。", "metaphor": "如同機場行李分揀台的安檢主管：自動光譜儀標記出可疑包裹後送上分揀轉盤，主管看一眼儀表：立即開箱檢查（Fix now）、貼上普通慢運標籤（Schedule），或是確認是無害液體揮手放行（Dismiss）。", "page_num": 7, "subtitle": "人依然是守門員：修復、排期或忽略的三岔路口", "takeaway": "自動生成的修復意圖並非直接上線，而是匯入值班工程師的排查隊列，由人類做出最高決策裁定。", "title": "值班負責人 (On-call) 的審批分流佇列"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>告別狼來了的警報疲勞</strong>：傳統運維中最怕雜訊過多導致工程師麻木忽視真正事故；自愈系統必須具備抗噪學習能力。", "<strong>動態校準統計窗口</strong>：如果某個指標在每週一上午業務高峰期都會自然上浮，系統自動將基線調整為區分工作日的季節性模型。", "<strong>持續精煉 trigger 規則</strong>：讓告警數量下降 80%，但真實事故的捕獲精準度維持在 100% 的極致水平。"], "layout": "反饋調優時序圖：駁回記錄 → 統計誤報頻次 → 自動微調 bands.yaml 的西點規則敏感度係數 → 雜訊下降。", "metaphor": "這就像訓練一隻忠誠的看門獵犬：當郵差送信過來時它狂吠被主人輕輕拍拍頭安撫（Dismiss），幾次之後，獵犬學會了郵差腳步聲是無害的不再亂吠，但一聞到翻牆小偷的氣味立刻猛烈撲咬！", "page_num": 8, "subtitle": "用人類的拒絕，教會監控系統什麼才是真正的異常", "takeaway": "每一次駁回都不是無效浪費，而是調優 bands.yaml 閾值、消除虛假告警的最珍貴標註數據。", "title": "駁回反饋調優控制帶：降低告警雜訊的演進機制"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>閉環的雙重閉合點</strong>：第一層閉合是線上指標恢復正常；第二層閉合是將事故機理寫入測試套件，形成永久免疫資產。", "<strong>自動化生成測試用例</strong>：Agent 在提修復 PR 的同時，順便在 `evals/` 目錄提交對應的邊界重現 JSON 文件。", "<strong>整個研發大腦的集體進化</strong>：下一次 CI 執行 Evals 時，該用例正式成為全局守門標準之一，任何未來的變更都不可能讓同一隻漏洞再度溜進生產！"], "layout": "終極閉環鏈條圖：生產異常 → intent.md → spec/plan → Code Fix → Deploy → 沉澱為 Eval → 系統免疫力永久提升。", "metaphor": "這就像森林大火撲滅之後：林業局不僅把明火澆滅（修復上線），更在焦土邊界挖出一條寬達五十米的永久防火隔離帶並裝上紅外火災監測雷達（沉澱為永久 Evals），確保百年內此處絕無山火蔓延可能。", "page_num": 9, "subtitle": "閉環的真正閉合：修好了 Bug，必須保證其永不復發", "takeaway": "當生產自愈 PR 成功發布後，最後一項強制動作就是將當次事故轉化為 Stage 4 的 Continuous Eval 測試用例。", "title": "修復上線後的終身免疫：自動沉澱 Continuous Evals"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>嚴禁給予生產資料庫任意寫入權</strong>：Agent 只能透過開 PR 走標準審查流程，或者觸發預先被架構師審批過的特定 Runbook（如調用標準回滾腳本）。", "<strong>所有決策具名存證</strong>：自愈進程的每一次診斷文本、生成的 intent.md 與人類主管的批准時間戳，全數存入審計鏈條。", "<strong>滿足最嚴苛合規要求</strong>：即使在無人值守運轉下，系統依然完美滿足職責分離 (SoD) 與不可篡改審計日誌的法律底線。"], "layout": "安全圍欄矩陣：展示 Agent 自主行動被嚴格限制在預先批准的 Runbook 跑道內，外圍有受管安全策略緊密鎖定。", "metaphor": "這就像在精密水族箱裡安裝的全自動恆溫加熱棒：加熱棒可以在水溫低於 24 度時自動通電升溫，但它的內部機械雙金屬片將最高加熱極限死死鎖定在 28 度，無論控制芯片如何死機，都絕對不可能把魚缸煮成開水。", "page_num": 10, "subtitle": "為什麼無人值守不會引發失去控制的惡性後果？", "takeaway": "Agent 的所有自愈動作被嚴密約束在版本控制的邊界之內，權限由受管設定封死，任何越權指令皆被無情阻斷。", "title": "閉環治理與合規：邊界受限於預先批准的配置"}, {"chapter_id": 16, "chapter_name": "第 16 章：Stage 6: Maintain — 自主閉環監控：Closing the Loop", "details": ["<strong>核心三步法</strong>：確定性數學腳本探測異常、bands.yaml 分級處置、異常自動轉化為 intent.md 重新啟動 SDLC 迴圈。", "<strong>指標監控只是運維的一個維度</strong>：代碼庫本身的深層安全隱患與陳舊漏洞，該如何持續掃蕩？", "<strong>前瞻第十七章</strong>：除了指標異常，底層代碼隨時可能面臨新型漏洞威脅；第十七章『Recurring codebase scans』將帶您領略每週自動巡檢代碼庫的硬核打法！"], "layout": "三條核心實踐卡片，底部搭配通往第十七章代碼庫定期弱點掃描的紫光雷達圖標。", "metaphor": "當一艘航行在深海的核潛艇學會了在艦體鋼板產生微小裂紋的瞬間，自動調動奈米修復機器人前往焊接修補並記錄應力數據；這艘潛艇便不再只是一堆冰冷的鋼鐵，而是一個具備永恆生命力的深海巨獸！", "page_num": 11, "subtitle": "Stage 6 Maintain 自主閉環核心總結與下章預告", "takeaway": "Closing the loop 讓軟體系統第一次擁有了像生物有機體般的自我感知、自我診斷與自我修復能力！", "title": "第十六章實戰總結：讓軟體工程擁抱自我進化的生命力"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>代碼本身每週都在漂移</strong>：工程師與 Agent 持續合併新的 PR，依賴關係每週都在更新，攻擊面不斷演變。", "<strong>檢測模型智力代際躍遷</strong>：一年前模型看不出的複雜跨函數記憶體洩漏或邏輯提權，新一代模型（如 Claude Mythos 5）能一眼洞穿。", "<strong>靜態一次性審查的破產</strong>：傳統在專案驗收時做一次滲透測試的作法徹底過時，代碼庫必須接受全天候、週期性的常態化自動巡檢。"], "layout": "雙向過期天平圖：左側展示代碼每週快速演變的時鐘，右側展示安全檢測模型能力代際躍遷的階梯，兩者共同促成常態巡檢的必然性。", "metaphor": "這就像防範新型傳染病：一年前醫學界甚至不知道這種病毒的基因序列（舊模型盲區），而人類每天都在出入公共場所接觸新人群（代碼變更）；你不能憑著一年前拿到的一張健康體檢表，就宣稱自己今天絕對百毒不侵。", "page_num": 1, "subtitle": "為什麼半年前通過安全審查的代碼，今天可能漏洞百出？", "takeaway": "安全掃描只是特定時間點在特定模型下的快照；代碼每週都在變，且新一代模型每隔半年就能發現舊模型完全看不見的深層漏洞！", "title": "靜態代碼安全的兩大時效性危機：雙向過期 (Both Halves Go Stale)"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>無需本地維護龐大模型算力</strong>：企業組織直接連接代碼庫，後台自動排程在雲端專有安全沙盒中執行全量代碼審查。", "<strong>自動驗證發現真偽 (Validated Findings)</strong>：模型在提報漏洞前，在背後沙盒中嘗試構建 PoC 進行自我實證，大幅過濾虛假誤報。", "<strong>一鍵輸出可審計修復補丁</strong>：不僅僅指出哪一行有問題，更直接在 Web 介面生成可一鍵 review 並發起 PR 的修復 Patch！"], "layout": "雲端架構圖：GitHub 倉庫透過專用安全 API 與 Anthropic 託管掃描基礎設施連通，右側輸出高置信度漏洞清單與修復補丁。", "metaphor": "就像企業聘請了一支由世界頂級白帽黑客組成的常駐安全巡防艦隊：他們每週末在獲得授權的代碼城堡外圍進行真實的模擬滲透攻防演練，週一早晨直接向城堡領主遞交一份包含修補水泥配方與修復藍圖的精華防禦戰報。", "page_num": 2, "subtitle": "Anthropic 官方託管安全架構：在雲端強大算力下進行深度語境掃描", "takeaway": "掛接 GitHub 倉庫，由 Anthropic 基礎設施中的前沿旗艦模型定時非同步跑批，自動驗證並附帶置信度評分。", "title": "什麼是 Claude Security？託管式代碼巡檢服務"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>傳統正則規則庫的死板</strong>：傳統靜態工具只會尋找 `strcpy` 或未過濾的 SQL 拼接字串，對深層業務邏輯漏洞盲目無知，且誤報成災。", "<strong>理解真實業務上下文 (Context-Aware)</strong>：Claude 能理解：『為什麼調用這條結算 API 前沒有檢查使用者的賬戶凍結狀態？』這種深層業務規則。", "<strong>互補共生陣型</strong>：確定性規則（如 SonarQube）留在 CI 中負責快速排查常規格式；模型掃描（Claude Security）每週負責排查複雜深層語境缺陷。"], "layout": "對比雷達圖：展示傳統 SAST 在語法級別的優勢，與 Claude Security 在架構級、業務邏輯級與複合攻擊鏈上的壓倒性優勢。", "metaphor": "傳統 SAST 就像機場安檢門的感應蜂鳴器，只要身上有金屬皮帶扣就尖叫（死板且誤報多）；而 Claude Security 則是經驗極其老道的情資便衣特工，他透過觀察可疑人員的微表情、購票時間線與隨身攜帶的多重假證件，精準揪出真正的跨國間諜。", "page_num": 3, "subtitle": "傳統靜態分析工具只懂匹配規則，大語言模型真正理解業務邏輯", "takeaway": "傳統工具對跨模組的商業邏輯缺陷束手無策，而 Claude 能精準識別隱蔽的業務提權與非預期狀態機跳轉。", "title": "突破傳統 SAST/DAST 的盲區：語境感知型漏洞挖掘"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>步驟一：初次全量掃描 (Baseline Scan)</strong>：即使是被認為代碼極度乾淨的核心老服務，第一次掃描也極大概率會揪出歷史盲點，以此確立安全基準線。", "<strong>步驟二：設定專案排程 (Weekly Cadence)</strong>：活躍開發的服務每週定期巡檢一次；超大型代碼庫可細分目錄與分支分批掃描。", "<strong>步驟三：置信度分級分流</strong>：優先處理 High Confidence 的漏洞；對不適用的發現標記理由駁回 (Dismiss)，防止下次重複出現。", "<strong>步驟四：走標準 PR 門禁進生產</strong>：修復補丁絕不允許走特權直推，全數作為 PR 匯入 Stage 5 的 Review 流程！"], "layout": "四步走流程示意圖：建立基準 → 週排程配置 → 置信度分流 → PR 門禁放行。", "metaphor": "這就像工廠引進高精度探傷雷達檢驗鋼樑：第一步對全廠現有結構做一次地毯式初檢摸底；第二步設定每週五下班後自動探傷巡檢；第三步工程師戴著護目鏡對可疑裂紋打標記；第四步按照標準焊接工藝修補復原。", "page_num": 4, "subtitle": "安全主管如何有條不紊地在組織內鋪開定期掃描？", "takeaway": "步驟：掛接關鍵倉庫建立基準、設定每週排程、帶有置信度進行分類審查、修復走常規 PR 門禁。", "title": "落地實踐四部曲：從基準掃描到排程巡檢"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>直觀的 Diff 預覽</strong>：在安全儀表板中，漏洞直接配備了推薦的修復代碼，清晰展示修改前後的語義變化。", "<strong>在 Web 終端中直接除錯驗收</strong>：點擊『Open in Claude Code』，在瀏覽器中啟動沙盒會話，與 Agent 對話微調補丁細節。", "<strong>自動掛載至 PR 討論串</strong>：一鍵點擊『Create PR』，修復代碼自動建立分支並關聯原安全報告，進入團隊的正常評審隊列。"], "layout": "網頁端介面原型模擬圖：展示左側漏洞描述與嚴重性評級，右側直接呈現綠色的修復代碼 Diff 與『Create PR』按鈕。", "metaphor": "就像輪胎被釘子扎了一個小孔（孤立漏洞）：維修師傅不需要把整輛車的發動機和底盤拆開，直接拿出一枚專用補胎膠條塞入孔洞，充氣驗證不漏氣後立刻簽字交車。", "page_num": 5, "subtitle": "小修補極速閉環：從漏洞報告到修復 PR 的一鍵式操作", "takeaway": "對於影響範圍僅限於少數幾行或單一函數的邊界漏洞，直接在 Claude Code 網頁端預覽補丁並一鍵發起審查。", "title": "邊界明確的孤立漏洞：Web 端一鍵補丁與審查"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>防範治標不治本的補丁地獄</strong>：如果十個微服務都存在身分驗證權限繞過，逐個打補丁只會讓系統更加脆弱且難以維護。", "<strong>提煉為架構重構意圖</strong>：將共性缺陷提煉為一份架構級的 `intent.md`（例如：『統一將內部服務改為零信任 mTLS 服務網格互通』）。", "<strong>走完完整的 AI-Native SDLC 流程</strong>：由 Stage 2 重新設計規範 `spec.md`，Stage 3 由 Agent 軍團並行重構，以系統工程徹底剷除病根！"], "layout": "雙軌處置分流圖：單點小漏洞 → 一鍵發起 PR；系統性架構缺陷 → 回流 Stage 1 寫成 intent.md 啟動全局重構。", "metaphor": "就像房屋地基下沉導致全樓十幾個房間的牆壁都出現了裂縫：如果你只是拿石膏逐個房間把裂縫抹平（打單點補丁），大樓遲早坍塌；你必須請建築工程隊重新打鋼管注漿加固地基（回流 Stage 1 架構重構）。", "page_num": 6, "subtitle": "如果漏洞不是單一補丁能解決的，而是跨多個服務的系統性架構缺陷？", "takeaway": "凡是涉及跨多個模組的共性安全漏洞或架構缺陷，嚴禁打補丁應付，必須寫成 intent.md 回到 Stage 1 重新正規立案！", "title": "廣泛性架構弱點的演進：回流 Stage 1 重塑 intent.md"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>杜絕週期性無效打擾</strong>：傳統掃描器最讓人痛恨的是，每週一掃出來的 100 個漏洞中有 90 個是工程師早就知道無害的歷史遺留。", "<strong>上下文增強記憶</strong>：當工程師駁回並標註：『此處未檢查 Token 是因為該接口僅在私有內網由健康檢查腳本調用』，模型下週自動記住此特例。", "<strong>審計員的法規存證庫</strong>：面對合規稽核時，駁回歷史清晰證明：團隊並不是忽視了漏洞，而是經過資深專家嚴格論證確認安全後受控放行。"], "layout": "審批彈窗示意圖：Dismiss 按鈕旁邊配備必填的『駁回原因下拉選單與備註文字方塊』，下方顯示歷史駁回記錄。", "metaphor": "這就像小區物業安保系統的白名單備註：業主家養了一隻受過專業訓練的大型導盲犬，保安在系統中備註『經街道與殘聯備案，免除禁養犬管制』，自此巡邏保安再也不會天天上門敲門盤問。", "page_num": 7, "subtitle": "為什麼每一次判定為誤報時，都必須認真寫下駁回理由？", "takeaway": "駁回理由被永久寫入系統審計記錄，模型在下週巡檢時自動讀取該上下文，保證同一個被證實無害的點絕不反覆報警！", "title": "駁回理由的價值 (Dismissal with Reason)：消滅死灰復燃"}, {"chapter_id": 17, "chapter_name": "第 17 章：Stage 6: Maintain — 定期弱點掃描：Recurring Codebase Scans", "details": ["<strong>防範未來編碼再犯</strong>：修復了當前代碼只完成了 50%，如果未來的 Agent 寫新功能時又寫出同樣的漏洞，等於前功盡棄。", "<strong>將漏洞寫入回歸套件</strong>：在 `evals/` 中新增該漏洞的攻擊測試題，任何對 `CLAUDE.md` 或 Skills 的修改，都必須能成功防禦該題目。", "<strong>推動組織免疫系統的指數級進化</strong>：每一次外界威脅的入侵與排除，都轉化為增強自身抗體密度的黃金養料！"], "layout": "漏洞進化閉環圖：安全掃描捕獲漏洞 → 發布修復 PR → 自動提煉為安全 Eval → 守門未來所有研發分支。", "metaphor": "就像海關查獲了一起利用偽裝空心油桶走私黃金的新手法（發現新漏洞）：海關不僅沒收了這批黃金（修復代碼），更立刻將這種空心油桶的 X 光透視特徵圖譜輸入到全國海關智慧安檢機的自動報警資料庫中（新增 Eval），今後任何口岸遇到類似包裝一秒識別報警！", "page_num": 8, "subtitle": "將修復的漏洞類別，轉化為檢驗全體 Agent 的防禦靶標", "takeaway": "當一項重大漏洞被修復並上線後，立刻為該漏洞類別新增一個 Eval，確保引導 Agent 的配置從此對該漏洞具備永久免疫力！", "title": "修復後
