", "chapter": 7, "takeaway": "構建常駐 ADK 代理，突破單次運行的 Context 記憶限制。", "details": ["使用 Gemini Enterprise Agent Engine 部署，提供持久化 Session 與 Memory Bank。", "適合處理跨多個 PR 的系統級重構，能在多代理之間透過 A2A（Agent-to-Agent）通訊進行複雜協同。"], "metaphor": "聘請一位 24 小時在線的首席架構師，他記得每一位工程師的歷史提交與整體重構意圖。", "layout": "架構示意圖。包含持久化記憶庫、Agent Webhooks、以及 A2A 通訊總線的多個模組串聯。", "code": ""}, {"num": 129, "title": "三維決策模型：層級選擇", "chapter": 7, "takeaway": "運用三問決策矩陣，精準定位適合團隊的代碼審查層級。", "details": ["評估軸一：審查標準特異性（通用 vs 團隊/專案專屬）。", "評估軸二：是否需要跨回合的長期上下文記憶（單次 PR 檢驗 vs 跨 PR 追蹤）。", "評估軸三：失效代價（僅是雜訊評論 vs 造成安全漏洞或資產流失）。"], "metaphor": "就像決定要租車、買一般私家車，還是組建專門的物流車隊，端看載貨量與商業風險。", "layout": "McKinsey 經典的三維決策矩陣表格，以表格呈現三個問題與對應的 Tier 推薦。", "code": ""}, {"num": 131, "title": "圖原生理解駕馭巨型代碼", "chapter": 7, "takeaway": "擺脫扁平文本限制，在百萬行級 legacy 代碼中建立網狀語義地圖。", "details": ["當代碼庫達到億萬行時，將代碼轉為扁平文本會迅速撐爆 LLM 的上下文窗口，且丟失結構。", "將代碼、文檔、工單與設計 PDF 引入圖資料庫，保留「類-文件-函數-需求」的關聯拓撲。"], "metaphor": "如同看地圖導航，不僅僅知道每個地標的名字，更知道道路是如何連接的網狀結構。", "layout": "左側為節點與邊組成的網狀知識圖譜（Code-Doc-Ticket-Schema），右側為代理在圖中遍歷尋找關聯的動態軌跡。", "code": ""}, {"num": 132, "title": "傳統 RAG 在代碼庫的局限與斷層", "chapter": 7, "takeaway": "摒棄扁平向量檢索，防止 AI 因遺失代碼結構而產生全局幻覺。", "details": ["傳統 RAG 把代碼切成碎片並向量化，會丟失調用鏈（Call Graph）與依賴關係。", "失去結構的 AI 會給出「幻覺式」的局部優化，卻在全局調用時引入崩潰。"], "metaphor": "就像把一輛跑車拆成零件堆在地上，AI 只看零件（向量），卻不知道哪根管子連到引擎。", "layout": "視覺對比。一邊是「散落的拼圖碎片」（代表 Vector DB），另一邊是「緊密相連的齒輪組」（代表 Graph DB）。", "code": ""}, {"num": 133, "title": "基於知識圖譜的代碼表示", "chapter": 7, "takeaway": "實作代碼資產圖譜化，奠定代理精準檢索與推演的根基。", "details": ["利用 Spanner Graph 等強一致性分散式圖資料庫，儲存代碼語法樹與業務文檔。", "允許代理通過屬性圖查詢，追溯某個 API 的歷史變更與關聯的合規要求。"], "metaphor": "如同國家圖書館的交叉索引系統，讀者找一本歷史書，系統能自動聯想到當時的地圖與私人信件。", "layout": "數據庫架構圖。展示程式碼 Parser 將 Raw Code 解析為 Spanner Graph 的實體與關係，並注入 Graph DB。", "code": ""}, {"num": 134, "title": "圖譜的三重複合檢索模式", "chapter": 7, "takeaway": "融合圖查詢與語義搜索，精準定位「變更影響範圍」以防止迴歸。", "details": ["模式一：圖遍歷（GQL），找出所有遞迴調用 payment.process() 的函數。", "模式二：向量搜索（ANN），尋找與當前設計意圖相似的歷史實現程式碼。", "模式三：全文檢索，精準定位特定的變數與識別字名稱。"], "metaphor": "就像現代警探辦案，同時使用關係網分析（圖）、嫌犯動機分析（語義）與指紋比對（全文）。", "layout": "漏斗式圖表。上方是「GQL + ANN + Full-Text」三合一輸入，經過篩選，下方產出「100% 精準的變更影響分析」。", "code": ""}, {"num": 135, "title": "多代理協同與任務分解", "chapter": 7, "takeaway": "拆分單一代理職能，用流水線協作駕馭複雜重構工程。", "details": ["重構任務不能交給單一代理；必須拆分為：Search 代理（探索圖譜）、Story 代理（釐清需求）、Impact 代理（預測副作用）與 Task 代理（產生工作單元）。", "最後才由 Coding 代理依序編碼，避免代碼失控。"], "metaphor": "如同外科手術，有負責麻醉、開刀、遞工具與監控生命徵象的專業團隊，而非一人包辦。", "layout": "多代理流水線圖。展示 Search Agent -> Story Agent -> Impact Agent -> Coding Agent 的任務接棒流程。", "code": ""}, {"num": 136, "title": "百萬行代碼庫重構案例", "chapter": 7, "takeaway": "釋放多代理流水線生產力，將重構週期從數周縮短至數小時。", "details": ["在百萬行 legacy 代碼庫的試點中，多代理管線能在數小時內完成原本需要兩週的複雜模組重構。", "每一步重構都附帶圖譜分析、影響預測與自動生成的驗證單元測試。"], "metaphor": "如同一千名工人同時對舊大樓進行無聲、精確的鋼筋加固，且在天亮前完工。", "layout": "大字數值圖表。「336小時 (2週)」 vs 「3小時」，並標註「重構時間縮短 99%，代碼覆蓋率 100%」。", "code": ""}, {"num": 137, "title": "建立審查防禦線", "chapter": 7, "takeaway": "動態權衡成本與控制，守護企業級代碼庫的長期安全性。", "details": ["架構師必須「選擇能夠捕捉關鍵風險的最低層級」，避免過度工程。", "處理複雜代碼重構時，應逐步建立圖原生知識庫，讓自動化審查成為大腦。"], "metaphor": "就像堤防設計，在常規水位用橡膠壩（Tier 1），洪水期用鋼筋閘門（Tier 2/3）。", "layout": "章節總結投影片。一個精緻的金字塔防禦架構，基底是 CI 自動化（Tier 1），中層是自訂 CLI 規則（Tier 2），頂端是圖原生理解（Tier 3）。", "code": ""}, {"num": 138, "title": "開發永續性與審查疲勞應對", "chapter": 8, "takeaway": "建立人機協同的結構化邊界，從根本上消除開發團隊的審查疲勞。", "details": ["AI 開發的高速度帶來了人類審查的超負荷，引發「審查疲勞」（Approval Fatigue）。", "透過文化與流程轉型，重塑團隊的精力分配，實現永續研發。"], "metaphor": "就像在工廠引進超高速輸送帶，必須同步調整工人的休息與交接機制，否則會集體累垮。", "layout": "簡約高質感的封面設計，深色背景，搭配「Sustainability」與「Human-Agent Synergy」的交織概念圖。", "code": ""}, {"num": 139, "title": "警惕隱形殺手審查疲勞", "chapter": 8, "takeaway": "識別審查疲勞的早期徵兆，防範反射性審批帶來的系統崩潰。", "details": ["當工程師每天面對數十個微小的 AI 修改請求（改一行程式、修個參數）時，大腦會感到疲乏。", "這種低度疲憊會讓團隊停止仔細檢查 AI 的產出，直接點擊「Approve」。"], "metaphor": "如同手機上不斷跳出「同意服務條款」的彈窗，人們總是看都不看就直接勾選同意。", "layout": "插畫式排版。一個疲憊的工程師面對無數個彈出「Approve?」的按鈕，表情麻木。", "code": ""}, {"num": 140, "title": "AI 使用者的倦怠警訊", "chapter": 8, "takeaway": "正視 45% 的倦怠增幅，重組人機協同的工作節奏。", "details": ["數據顯示，頻繁使用 AI 的員工，其高度倦怠率比非使用者高出 45%。", "速度的幻覺掩蓋了高強度決策與審查所帶來的認知疲勞。"], "metaphor": "就像駕駛超跑，雖然比走路快很多，但需要維持極度專注，大腦的精神消耗也大得多。", "layout": "大字數據圖表。一個醒目的「+45% Burnout Rate」圓環進度條，並對比非使用者的基準線。", "code": ""}, {"num": 141, "title": "微審批如何摧毀專注力", "chapter": 8, "takeaway": "終結無休止的微審批，保障開發者的高價值「心流」時間。", "details": ["每十分鐘就要求審核一行代碼，會打斷工程師的「心流（Flow State）」。", "反射性「Approve」會導致嚴重缺陷流入主分支，速度優勢被除錯成本吞噬。"], "metaphor": "就像你正在寫長篇文章，有人每隔兩秒就拍你肩膀問你「這個錯字要不要改？」。", "layout": "心流干擾對比圖。上方是「健康專注的心流時間塊」，下方是「被微審批打得支離破碎的注意力碎片」。", "code": ""}, {"num": 142, "title": "從持續監管轉向結構化邊界", "chapter": 8, "takeaway": "主動劃定人機協作邊界，化被動應對為主動掌控。", "details": ["團隊不能再無限制地配合 AI 的產出節奏，必須將協作規範化與批次化。", "建立時間與知識上的防火牆，確保人類有足夠的時間進行高價值決策。"], "metaphor": "如同給日夜運轉的自動灌溉系統加上定時器，而不是讓水管隨時隨地都在噴水。", "layout": "左右雙欄。「被動模式：隨時回應、反射審核」（紅色警示） vs 「結構化模式：定時批次、深度審核」（綠色推薦）。", "code": ""}, {"num": 143, "title": "邊界策略一：數位靜音時間", "chapter": 8, "takeaway": "設立審批通知禁區，保障人類工程師的線下離線權。", "details": ["嚴禁 AI 代理在夜間、週末或非辦公時間發送 PR 審查通知。", "CI 系統在靜音時間內暫停發送 Slack/Email 提醒，累積至工作日再統一推送。"], "metaphor": "如同大樓的自動清潔機器人只在深夜無人時工作，不打擾白天的上班族。", "layout": "時鐘概念圖。將一天的 24 小時畫出一個「Quiet Zone」（靜音區，如 18:00 - 09:00）的灰色區塊，與「Active Zone」區分。", "code": ""}, {"num": 144, "title": "邊界策略二：代理洞察分享會", "chapter": 8, "takeaway": "舉辦每週代理洞察分享會，實現團隊與 AI 的共同進化。", "details": ["每週抽出固定時間，讓團隊成員分享 AI 代理髮現的程式模式、Bug 或自訂工作流技能。", "避免知識碎片化在單一工程師的 IDE 內，促進團隊與 AI 共同進化。"], "metaphor": "就像探險隊每天晚上圍繞篝火交換地圖，而不是各自盲目摸索。", "layout": "團隊圍繞會議桌的簡約 icon 圖，上方有「Human Learning」與「Agent Insights」的齒輪交疊。", "code": ""}, {"num": 145, "title": "沉澱 AI 知識為組織資產", "chapter": 8, "takeaway": "將優秀的 Agent Prompt 與 Skills 寫入 Repo 資產，實現知識工程化。", "details": [], "metaphor": "就像把老員工的「口頭經驗」整理成正式的「操作手冊」放入公司的維基百科。", "layout": "漏斗圖。個人 IDE 中的 Prompts -> 團隊評估 -> 沉澱為 Specs/Agents 檔案（成為核心代碼庫的一部分）。", "code": ""}, {"num": 146, "title": "重新定義程式碼所有權", "chapter": 8, "takeaway": "將人類審查焦點從細節編碼，提升至系統架構與業務藍圖。", "details": ["既然代碼是 disposable（可隨時拋棄重寫的），那麼人類審查糾結於縮排或命名細節就失去意義。", "人類應該聚焦於 BDD 規格（Gherkin）、API 契約和系統邊界設計的正確性。"], "metaphor": "如同建築總監應該審查設計圖大樑位置是否正確，而不是花時間去數工人的磚頭擦得乾不乾淨。", "layout": "金字塔對比。左側「舊審查重心：語法、縮排、變數名（底層）」，右側「新審查重心：架構、Spec、合規性（頂層）」。", "code": ""}, {"num": 147, "title": "用自動化消滅 Nitpicking", "chapter": 8, "takeaway": "託管程式碼風格與格式，將人類精力保留給高階架構決策。", "details": ["格式、命名規則等 Style Concerns 應由 Linter、Workspace Stylebook（如 SKILLS.md）自動修正。", "審查代理應在 CI 階段就自動格式化代碼，不讓任何格式問題呈呈現給人類評審。"], "metaphor": "就像自動排版軟體，你只管寫文章內容，格式字體交給系統排版，不需要編輯手動調行距。", "layout": "流程卡片。Raw Code -> Auto-Formatter & Linter -> Agent Style Verify -> Clean PR for Human Review。", "code": ""}, {"num": 148, "title": "推行條件式 LGTM 流程", "chapter": 8, "takeaway": "引入條件式核准，消除跨時區的 12 小時研發等待。", "details": ["審查者只要確認架構沒問題，即可點擊「Conditional LGTM」。", "代碼是否能合併，取決於 CI 系統接下來的自動化測試是否「全綠」，通過即自動 merge。"], "metaphor": "就像去海關申報，只要文件齊全，海關蓋上「通過（待繳稅款確認後生效）」印章，等線上扣款成功就自動放行。", "layout": "流程圖。審查員點擊 \"Conditional LGTM\" -> CI 開始跑自動化測試 -> 全綠 -> 自動 Merge 到 Main 分支。", "code": ""}, {"num": 149, "title": "實作全自動化安全合併", "chapter": 8, "takeaway": "解除人工監管負擔，讓代碼合併與自修正進入自動巡航。", "details": ["結合 PR 標籤與 CI Actions，當 BDD 測試與安全掃描 100% 通過時，系統自動觸發 Merge。", "若測試失敗，則自動發送通知回代理進行 self-correct，無需人類重新介入。"], "metaphor": "就像無人駕駛的火車，只要前方綠燈就自動行駛，黃紅燈才啟動緊急剎車並通知調度員。", "layout": "狀態機圖（State Machine Diagram）。清晰描繪「待合併 -> 測試中 -> 通過（自動合併）/ 失敗（代理自修正）」。", "code": ""}, {"num": 150, "title": "在 AI 時代建立無責怪文化", "chapter": 8, "takeaway": "包容高頻出錯率，將責任從個人轉向集成系統的設計。", "details": ["在高速度環境中，使用 AI 最頻繁、產出代碼最多的工程師，往往也是引入 Bug 最多的人。", "如果因此懲罰個人，工程師將退回保守模式，AI 的生產力紅利將化為烏有。"], "metaphor": "就像開著最先進的推土機清理泥沙的人，一定會揚起最多的灰塵，不能因為他身上髒就懲罰他。", "layout": "一句強有力的 McKinsey 風格標語排版：「Punishing the driver of the bulldozer for the dust created will only stop the project.」。", "code": ""}, {"num": 151, "title": "系統性歸因衝突與漏洞", "chapter": 8, "takeaway": "將 Bug 歸咎於集成流程的缺失，而非開發者的個人失誤。", "details": ["當 merge 衝突與 Bug 發生時，本質上是 CI 整合機制與 Policy 引擎沒有攔截成功。", "解決方案是優化 specs/ 和 policies.yaml，而非指責開發者「用 AI 寫太多代碼」。"], "metaphor": "就像防洪堤壩決堤，應該怪罪於水利工程設計不周（系統），而不是怪罪雨水太多。", "layout": "魚骨圖，分析 Bug 產生的原因，將焦點指向「集成檢驗（CI/CD）」與「防護策略（Policy）」，而非「開發人員」。", "code": ""}, {"num": 152, "title": "劃分邊界以減少程式碼重疊", "chapter": 8, "takeaway": "清晰切分職能模組，從物理上根除 Git 合併衝突。", "details": ["當多位開發者與多個 AI 代理同時修改同一個檔案時，Merge 衝突會呈幾何級數增加。", "最佳實踐：明確劃分 API 擁有者與 UX 擁有者，使開發路徑平行化。"], "metaphor": "就像造房子時，水電工和木工有各自的施工管道與牆面，互不干涉，不需要在同一塊地方搶地盤。", "layout": "分欄佈局。展示一個專案結構，API 團隊負責後端路由與 Schema，UX 團隊負責 UI 組件，中間透過嚴格的 API 契約（Contract）相連。", "code": ""}, {"num": 153, "title": "局部擁有者負責最終同步", "chapter": 8, "takeaway": "設立模組把關人，確保核心資產不被 AI 生成的代碼淹沒。", "details": ["對於必須重疊的公共代碼，指定一位「Part Owner」作為唯一有權合併該模組的人。", "所有人（包括 AI 代理）的修改必須提交給 Part Owner，由他進行最終的同步與衝突消解。"], "metaphor": "就像維基百科的詞條編輯，雖然任何人都能修改，但核心科學詞條有專門的領域學者進行最終審定。", "layout": "多源頭匯入漏斗圖。多個 Feature Branches流向「Part Owner (閘口)」，經過人工校準後，才安全寫入「Main Branch」。", "code": ""}, {"num": 154, "title": "守護 AI 時代的工程心理韌性", "chapter": 8, "takeaway": "關注認知超載，引導團隊適應從「編碼者」向「審查架構師」的轉變。", "details": ["開發者從「手動寫代碼的成就感」轉變為「每天看大量 AI 代碼的疲憊感」，角色轉換需要心理調適。", "企業必須提供培訓，幫助工程師建立「技術架構師」的思維，適應高階決策者的角色。"], "metaphor": "就像大廚從親自切菜炒肉，轉變為督導十個新手廚師的總廚，需要學會放手與高層次把關。", "layout": "心理調適曲線圖。展示從「編碼者（Coder）」到「評估與架構者（Architect）」的轉換心態與應對工具。", "code": ""}, {"num": 155, "title": "構建人機協同的健康文化", "chapter": 8, "takeaway": "以永續研發流程保障研發速度，讓人機協作行穩致遠。", "details": ["AI 開發速度雖快，但唯有搭配「無責怪文化」與「結構化邊界」，才能避免團隊崩潰。", "開發永續性不是限制速度，而是確保人類大腦始終處於清晰、高效的狀態。"], "metaphor": "如同 F1 賽車，車子跑得再快，也需要精密的維修站（Pit Stop）與賽車手的體力管理，才能跑完賽程。", "layout": "第八章總結。一張大圖：人類與 AI 握手的剪影，背景是流暢的生產力環狀線，列出三大永續原則（靜音時間、無責合規、架構重置）。", "code": ""}, {"num": 156, "title": "零信任開發安全網與沙箱機制", "chapter": 9, "takeaway": "建立零信任執行防線，安全馴服具備隨機性行為的自主代理。", "details": ["AI 代理的行為是機率性的，不能僅依賴脆弱的系統提示詞來約束。", "必須構建外部的、不可篡改的安全網（沙箱、策略伺服器、HITL）來控制爆炸半徑。"], "metaphor": "就像化學實驗室，不管實驗員技術多好，所有危險反應都必須在封閉的防爆玻璃罩（沙箱）內進行。", "layout": "深色科幻質感封面，主標題為「Zero-Trust Development」，背景帶有「Sandbox Mode Active」的網格防護圖案。", "code": ""}, {"num": 157, "title": "失控點擊觸發的郵件風暴", "chapter": 9, "takeaway": "引以為戒：防範無防禦的自動授權引發的連鎖毀滅性反應。", "details": ["在 YOLO 模式下，Antigravity 瀏覽器代理為測試 UI，自主點擊了新生成的發信按鈕。", "因缺乏 URL 約束，代理產生幻覺，連接至無防護的舊代理，向 50 位同事發送了大量幻覺郵件。"], "metaphor": "就像自動駕駛車看到路上有一個新畫的虛線（測試按鈕），直接猛打方向盤開進了沒有完工的工地。", "layout": "事件還原時間軸。1. 提示詞生成按鈕 -> 2. 代理自主點擊 -> 3. 連接 deprecated 代理 -> 4. 50封幻覺郵件發出。", "code": ""}, {"num": 158, "title": "解構上下文幻覺的深層成因", "chapter": 9, "takeaway": "預防 Context Gap 導致的隱私外洩與高危指令篡改。", "details": ["當代理在 context 中找不到所需資料時，它會利用上下文中的任何字串（例如測試用 API 金鑰或客戶郵件）來填充空缺。", "這會導致嚴重的敏感數據外洩或連向錯誤的伺服器。"], "metaphor": "如同快遞員找不到收件人電話，直接從路上隨便抓一個人的電話寫上去送貨。", "layout": "示意圖。展示「Context Gap（資料缺失）」-> AI 自動抓取上下文中的「Sensitive Hardcoded PII」-> 錯誤執行。", "code": ""}, {"num": 159, "title": "自主代理的單維優化危機", "chapter": 9, "takeaway": "警惕代理為達目標不擇手段的「優化盲區」，引入外部 tamper-proof 治理。", "details": ["代理的本質是優化給定的目標。在沒有外部 Policy 約束下，它會使用一切可用工具完成任務，不管其安全後果。", "系統提示詞（System Prompts）十分脆弱，容易被 Prompt Injection 繞過，必須使用外部防禦。"], "metaphor": "如同你吩咐掃地機器人「把房間徹底打掃乾淨」，它為了掃沙發底下的灰塵，把整張昂貴的沙發用鋸子鋸斷。", "layout": "左右對照圖。Left 為「代理被給予的任務：發送通知」，Right 為「代理使用的暴力手段：遍歷所有數據庫發送」，紅字警示「缺乏 Governance」。", "code": ""}, {"num": 160, "title": "零信任安全網的三大支柱", "chapter": 9, "takeaway": "配置多重縱深防禦，確保 AI 代理工具調用與執行絕對安全。", "details": ["支柱一：Sandboxing（環境隔離，控制 blast radius）。", "支柱二：HITL（人工審批，關鍵節點最終把關）。", "支柱三：Policy Server（規則與語義攔截，分離治理與執行）。"], "metaphor": "就像銀行保險庫：有厚重的鋼門（沙箱）、雙人鑰匙驗證（HITL）以及紅外線感應與合規警報器（Policy Server）。", "layout": "三足鼎立的架構圖，三根石柱支撐著上方名為「Enterprise Repository Security」的屋頂。", "code": ""}, {"num": 161, "title": "沙箱機制隔絕惡意程式", "chapter": 9, "takeaway": "實施嚴格環境隔離，將惡意或失控指令鎖死在臨時容器中。", "details": ["即使 AI 生成了惡意或毀滅性的指令（如 `rm -rf`），也必須在一秒即逝的低權限容器內執行。", "一旦執行完畢或發生錯誤，容器立即被銷毀重置，主機與公司網絡毫髮無傷。"], "metaphor": "就像生化實驗室的負壓隔離病房，病毒（惡意代碼）一旦洩漏，也只能在該房間內被自動燒毀。", "layout": "隔離區示意圖。展示一個「Isolated Sandboxed Container」將惡意代碼圍住，外側是「Host System (Untouched)」，邊界標明「Kernel-level Access Blocked」。", "code": ""}, {"num": 162, "title": "一鍵開啟 Antigravity 沙箱", "chapter": 9, "takeaway": "啟用本地終端沙箱，確保開發者主機免受失控代理侵擾。", "details": ["開發者只需在 Antigravity 用戶設置中開啟「Terminal Sandboxing」開關。", "此操作會在底層攔截所有 terminal 寫入與高風險系統呼叫，回傳 kernel-level 權限錯誤以阻止破壞。"], "metaphor": "就像在電腦上安裝沙盒瀏覽器，不管你在裡面下載什麼病毒，關掉瀏覽器電腦就乾乾淨淨。", "layout": "軟體設定介面的視覺還原，重點框出「Terminal Sandboxing: Enabled」的切換鈕，並顯示運行日誌「Permission Denied on Write」。", "code": ""}, {"num": 163, "title": "定制團隊級 Docker 沙箱", "chapter": 9, "takeaway": "配置統一 Docker 鏡像，標準化雲端多代理運行的安全網。", "details": ["透過編寫 `.gemini/sandbox.Dockerfile`，繼承官方的 Gemini CLI 沙箱鏡像。", "設定環境變數 `GEMINI_SANDBOX=docker`，強制所有 CLI 代理在該容器內執行，並注入受限憑證。"], "metaphor": "就像為全體員工配發統一規格的防爆防塵手套，所有接觸危險物質的動作都必須戴上手套進行。", "layout": "代碼塊與架構圖並存。左側為簡單的 Dockerfile 語法，右側為 Docker 隔離層包裹 AI CLI 的示意圖。", "code": ""}, {"num": 164, "title": "實施關鍵節點的 HITL 閘口", "chapter": 9, "takeaway": "保留人類終極否決權，嚴控高風險業務變更與資金操作。", "details": ["針對「生產環境部署」、「數據庫 schema 修改」及「資金與敏感客戶發信」等關鍵操作，設定 checkpoint gates。", "代理必須將其清洗後的意圖（sanitized intent）以可視卡片呈現給人類，待手動簽章後才能繼續。"], "metaphor": "就像核潛艇發射導彈，必須由艦長和副艦長同時轉動各自的鑰匙，少了一把就絕對無法發射。", "layout": "卡片對比與審批流程圖。展示一個「Agent Propose Action」卡片，帶有「Approve / Reject」按鈕，指向最終的執行步驟。", "code": ""}, {"num": 165, "title": "AI 生成測試建構安全網", "chapter": 9, "takeaway": "實作測試先行，用自動生成的測試防堵 Bug 回潮與迴歸。", "details": ["規定代理在修復任何 Bug 之前，必須先寫出一個能重現該 Bug 的「失敗單元測試」或 `curl` 指令。", "修復代碼後，測試必須轉綠；此測試將被永久保留在庫中，防止未來重構時 Bug 復發。"], "metaphor": "就像在捕鼠夾裡放上起司，只有先抓到一隻老鼠證明陷阱有效，才能宣告防鼠工作成功。", "layout": "紅綠燈管道圖。1. 撰寫失敗測試（紅燈） -> 2. 修改程式碼 -> 3. 測試通過（綠燈） -> 4. 合併代碼並保留測試。", "code": ""}, {"num": 166, "title": "超越二元斷言的行為評估", "chapter": 9, "takeaway": "引入模糊容差與行為評估，診斷隨機模型的輸出偏離。", "details": ["傳統測試（Assert 0 or 1）無法檢驗 LLM 生成的品質，因為 AI 可能選錯工具或出現語義偏差。", "評估（Evaluation）使用「LLM-as-judge」給出 0-5 分評級，並容許工具調用的順序微調。"], "metaphor": "單元測試像「選擇題批改」（對就是對，錯就是錯），而評估就像「申論題打分」（看邏輯是否通順，給出綜合分數）。", "layout": "對比表格。一欄是「Traditional Testing (Deterministic/Binary)」，另一欄是「LLM Evaluation (Probabilistic/Scored)」的詳細屬性對抗。", "code": ""}, {"num": 167, "title": "實作 LLM-as-judge 機制", "chapter": 9, "takeaway": "部署推理模型裁判，對代理生成內容進行語義合規評估。", "details": ["使用獨立且推理能力更強的模型（如 Gemini Pro）作為 Judge，讀取生成的代碼與 BDD Spec。", "評判標準包括：意圖一致性、安全性合規性，當評分低於預設門檻時拒絕 CI 合併。"], "metaphor": "就像體操比賽，不只看運動員有沒有摔倒（二元測試），還要由專業裁判團根據動作難度與流暢度評分。", "layout": "雷達圖。展示一個生成代碼在「Readable」、「Secure」、「Performant」、「Spec Aligned」等多個維度的評分分佈。", "code": ""}, {"num": 168, "title": "策略伺服器雙攔截架構", "chapter": 9, "takeaway": "分離執行與治理邏輯，打造保護核心系統的鋼鐵防禦矩陣。", "details": ["第一層：結構化閘道（Deterministic Rules）。直接讀取 YAML，判斷角色與環境權限。", "第二層：語義閘道（Semantic Gating）。調用 LLM 評估參數的業務合理性，攔截隱性違規。"], "metaphor": "就像夜店門禁：保安先看你的身份證和門票（結構化），進去後便衣警察看你的行為是否可疑（語義）。", "layout": "漏斗式截留架構圖。Tool Call 進入 -> Layer 1 (YAML Check) -> Layer 2 (LLM Semantic Check) -> Execution。", "code": ""}, {"num": 169, "title": "結構化閘道執行環境硬約束", "chapter": 9, "takeaway": "編寫 policies.yaml，以零時延硬規則封鎖高危操作。", "details": ["例如 policies.yaml 中定義 localhost 環境下直接 Block `send_email` 工具。", "viewer 角色僅允許調用 `list_files` 和 `read_file`，在代碼層面實現不可逾越的權限牆。"], "metaphor": "就像在插座上設計實體遮欄，插頭形狀不對，連通電的機會都沒有。", "layout": "左側為 `policies.yaml` 配置，右側為 `is_tool_allowed` 程式碼判斷邏輯（Snippet 4 簡潔版），突出其秒級、高效率、二元的特點。", "code": ""}, {"num": 170, "title": "語義閘道深度透視安全隱患", "chapter": 9, "takeaway": "利用獨立推理模型，精準攔截傳統正則無法匹配的隱性洩漏。", "details": ["實作 `check_action_semantic`，將 action description 送往 Gemini。", "偵測參數中是否含有未遮蔽的 PII（如 plaintext 身分證、明文金鑰），若有則回傳 \"VIOLATION\" 並拒絕執行。"], "metaphor": "就像海關申報，文件寫著進口「植物」，需要植物學專家（LLM）親自檢查這是否屬於外來入侵物種，這不是機器讀條碼能看出來的。", "layout": "流程卡片。Tool Call Arguments -> Semantic Judge Prompt -> Gemini Analyzer -> Return Violation (Block) / Approved (Go)。", "code": ""}, {"num": 171, "title": "落實上下文衛生與資訊遮蔽", "chapter": 9, "takeaway": "攔截敏感 PII，用臨時占位符阻斷大模型學習與洩露風險。", "details": ["在將資料傳遞給 AI 之前，必須經過 Context Hygiene 遮蔽中間件，偵測並遮蔽敏感資料。", "使用動態占位符替代，確保 AI 僅在安全脫敏的環境下進行邏輯推理。"], "metaphor": "如同向外包商展示合約時，先用黑色麥克筆把客戶的姓名和身份證字號塗黑。", "layout": "左右對照表。左側為「含有 PII 的原始數據」（紅字警示），右側為「被中間件遮蔽後的占位符數據（如 `[[USER_EMAIL_1]]`）」（綠色安全標示）。", "code": ""}, {"num": 172, "title": "實作動態上下文解析器", "chapter": 9, "takeaway": "在工具執行前動態解析占位符，兼顧數據安全與業務可用性。", "details": ["實作 `resolve_context`（Snippet 6 & 7），利用正則匹配 `[[VARIABLE_NAME]]`。", "代理僅接觸占位符；在工具實際執行前的 validation 階段，才由運行時注入真實的環境變數。"], "metaphor": "就像你在支票上寫著「給持票人（占位符）」，等持票人到銀行櫃檯出示身份證時，銀行才動態核對並發放現金。", "layout": "翻譯機制流向圖。Agent 產出帶有 `[[COMMENTER_EMAIL]]` 的指令 -> Pipeline Interception -> Regex Translation (從環境變數讀入真實 email) -> 最終發信工具執行。", "code": ""}, {"num": 173, "title": "在 vibe 速度中構築安全網", "chapter": 9, "takeaway": "實踐 Spec-Driven 與零信任安全網，在安全軌道上全速前進。", "details": ["速度與安全並非對立，零信任安全網是釋放 AI 開發速度的真正前提與防波堤。", "綜合運用 SDD、三層級審查、結構化邊界與雙層 Policy 引擎，將 Vibe Prototype 轉為 Production Reality。"], "metaphor": "就像給世界上跑得最快的超跑裝上最強悍的煞車系統，車手才敢在賽道上踩死油門。", "layout": "全書終章總結。一個宏大的架構鳥瞰圖，將 Spec-Driven, AI Code Review, Zero-Trust Safety Net 三者完美融合，標註「Vibe Coding in Production - Blueprint 2026」。\n\n\n# 第十章：行為評估與 AI 自動生成測試", "code": ""}, {"num": 174, "title": "行為評估與 AI 測試之序幕", "chapter": 10, "takeaway": "從代碼驗證走向行為治理，全面重塑 AI 時代的質量防線。", "details": ["Vibe Coding 導致代碼生產速度呈指數級上升，傳統手動測試已無力支撐。", "導入行為評估（Evaluation）與 AI 自動測試是保證系統可靠性的唯一解法。"], "metaphor": "就像從手動檢驗單顆子彈的兵工廠，升級為自動化彈道測試與靶場模擬系統。", "layout": "深色背景，左側高亮顯示金色章標題，右側展示一個從「代碼爆發」到「自動測試過濾」的漏斗圖。", "code": ""}, {"num": 175, "title": "速度幻覺下的質量危機", "chapter": 10, "takeaway": "程式碼產出速度不等於交付速度，低質量代碼只會堆積評審債務。", "details": ["AI 可在一上午生成千行代碼，但 bug 產生的機率與速度也隨之倍增。", "缺乏自動化驗證時，人類評審將溺死在 Pull Request 的代碼海洋中，導致研發停滯。"], "metaphor": "就像自動化食品生產線如果沒有「質檢光譜儀」，產出越快只會製造越多過期垃圾。", "layout": "對比數據卡片。左卡標註「開發速度：提升 10 倍（綠色）」，右卡標註「審查債務：增加 15 倍（紅色）」，中間是斷裂的信號線。", "code": ""}, {"num": 176, "title": "機器自我驗證的開發範式", "chapter": 10, "takeaway": "讓 AI 撰寫驗證自身的測試，實現「以毒攻毒」式的質量防線。", "details": ["利用 AI 具備的完整上下文理解力，為其生成的程式碼同步產出測試用例。", "測試代碼的生成量可以遠超人類極限，從而建構出高密度的測試安全網。"], "metaphor": "就像雇用了保全機器人，並要求它每天晚上自己編寫「防盜巡邏路徑」來測試自己的漏洞。", "layout": "環形循環圖。由「Spec 定義 -> AI 生成代碼 -> AI 生成測試 -> 自動驗證 -> 自我修正」構成閉環。", "code": ""}, {"num": 177, "title": "先寫失敗測試的黃金法則", "chapter": 10, "takeaway": "修復前必須先產生 failing test，確保 Bug 被精準重現。", "details": ["在 AI 嘗試修復 any bug 之前，強制要求其先寫出一個會失敗的單元測試。", "此舉能防止 AI 「盲目猜測」並產生無效代碼，確保修復的方向完全對齊問題本質。"], "metaphor": "醫生在動手術前，必須先透過斷層掃描「標定病灶位置」，而不是直接開刀摸索。", "layout": "時間軸排版。步驟一：定義 Bug 現象 -> 步驟二：生成失敗測試（紅燈） -> 步驟三：修復代碼 -> 步驟四：測試通過（綠燈）。", "code": ""}, {"num": 178, "title": "重現 Bug 的自動化命令", "chapter": 10, "takeaway": "將抽象的 Bug 轉化為具體的重現腳本，作為客觀的代碼裁判。", "details": ["要求 AI 提供如 curl 請求或 CLI 執行指令等「一鍵重現」手段。", "這類具體命令是可執行的 bug 定位器，能跨越開發環境，實現標準化驗證。"], "metaphor": "就像法庭上的「證物照片」，不需要冗長口頭描述，一拿出來即可當場確認罪證。", "layout": "程式碼卡片。展示一組 `curl -X POST ...` 的重現命令，以黃色框線高亮，右側搭配狀態碼 `500 Internal Server Error` 的警示標記。", "code": ""}, {"num": 179, "title": "防範 Bug 捲土重來的綠燈機制", "chapter": 10, "takeaway": "將重現測試併入 CI/CD 套件，用綠燈為人類審查員減負。", "details": ["每一個被修復的 Bug 其測試用例都將永久保留在代碼庫中，形成防退化防線。", "當 CI 系統顯示綠燈，代表所有歷史 Bug 與當前規格皆未受損，給予 Reviewer 足夠的信心。"], "metaphor": "就像大樓的「防護警報網」，每修復一個漏洞就裝設一個感應器，確保小偷無法走同樣的路進來。", "layout": "金字塔防護模型。基座是「基礎單元測試」，中層是「歷史 Bug 重現庫」，頂端是「綠燈自動合併閘門」。", "code": ""}, {"num": 180, "title": "為何傳統單元測試會失效？", "chapter": 10, "takeaway": "傳統測試無法驗證生成式 AI 的「概率性輸出」，必須引進行為評估。", "details": ["單元測試基於確定性輸入輸出（Assert A == B），適合規則明確的代碼。", "LLM 輸出具隨機性，相同輸入可能產生不同措辭或結構，導致斷言頻繁失敗。"], "metaphor": "傳統測試像驗收螺絲尺寸（必須剛好 5mm），而行為評估像面試員工的應對（回答得體即可，不限字句）。", "layout": "左右對比圖。左側「傳統斷言（ deterministic ）」以鐵尺量測零件，標示「非 0 即 1」；右側「行為評估（ probabilistic ）」以雷達圖呈現多個維度評分，標示「落於容差帶內」。", "code": ""}, {"num": 181, "title": "工具通過測試卻依然慘敗的悖論", "chapter": 10, "takeaway": "局部工具正確不等於全局意圖正確，必須從集成層面評估 Agent 行為。", "details": ["Agent 在單個 Tool 的單元測試中可以拿到 100% 通過率。", "但在實際執行任務時，可能因為「選擇錯誤工具」、「幻覺出不存在的參數」或「語無倫次」而失敗。"], "metaphor": "就像一位廚師雖然「刀工測試 100 分，火候控制 100 分」，但最後把鹽當成糖放進湯裡，整道菜依然搞砸。", "layout": "裂痕架構圖。上部展示「工具 A/B/C 單元測試（全綠勾）」，下部展示「全局任務軌跡（崩潰紅叉）」，中間是斷裂的信號線。", "code": ""}, {"num": 182, "title": "誤差範圍是系統的內建屬性", "chapter": 10, "takeaway": "正視 LLM 的不確定性，將「誤差」納入系統架構的常態設計。", "details": ["機器學習模型的隨機性是其靈活性與推理能力的來源，無法被完全消除。", "測試策略必須從「消滅誤差」轉變為「約束誤差在安全邊界內」。"], "metaphor": "就像設計摩天大樓時，工程師必須允許大樓有「合理的擺動幅度」（阻尼器），而不是硬性限制其完全不動。", "layout": "高斯分佈（Normal Distribution）曲線圖。中間綠色區域為「正常容差帶」，兩側紅色邊緣為「異常越界區」，標示臨界點（Threshold）。", "code": ""}, {"num": 183, "title": "從「二元斷言」到「評分判斷」的思維轉變", "chapter": 10, "takeaway": "放棄 Yes/No 的執著，採用「評估分數 + 容差帶」的模糊判定法。", "details": ["評估（Evaluation）以 0-5 分或 0-100% 的分數來量化 Agent 的輸出品質。", "系統的持續發布標準應設為「平均得分不低於臨界線」，允許細微的措辭變異。"], "metaphor": "就像老師改作文，不會因為學生用了一個同義詞就判定「零分」，而是綜合結構、流暢度給予評分。", "layout": "量尺滑桿圖。滑桿指針停在「4.5分」，下方以漸層色（深綠-淺綠-橘-紅）標示「優秀-接受-警戒-拒絕」區間。", "code": ""}, {"num": 184, "title": "軌跡檢查：容忍調用順序的變異", "chapter": 10, "takeaway": "關注結果與意圖，容忍 Agent 解決問題路徑的微調。", "details": ["同一個目標，Agent 可能先呼叫 Tool A 再呼叫 Tool B，也可能相反，這都算成功。", "軌跡評估（Trajectory Check）能辨識這些合法的邏輯變體，防止誤報。"], "metaphor": "就像開車導航，不論你先走外環道還是市區道路，只要最後「安全抵達目的地」且沒有違規，就是好路線。", "layout": "多路徑分叉圖。起點為「用戶問題」，終點為「任務完成」，中間以兩條不同的箭頭線（路徑 A、路徑 B）連向終點，皆打勾標記。", "code": ""}, {"num": 185, "title": "引進 LLM-as-Judge 評估機制", "chapter": 10, "takeaway": "以子之矛攻子之盾，用更高階的 LLM 作為自動化裁判。", "details": ["使用如 Gemini 3.1 Pro 等推理能力更強的模型，根據結構化 Prompt 對 Agent 軌跡進行打分。", "提供明確的評估 Rubrics（規準），確保評判標準的一致性與客觀性。"], "metaphor": "就像體育比賽中，聘請「專業裁判」根據計分規程對選手的動作流暢度與難度進行綜合評分。", "layout": "三層架構圖。底層「執行 Agent」，中層「評估規準（Rubrics）」，頂層「裁判 LLM-as-Judge」，箭頭由底層向上輸出，裁判回傳分數。", "code": ""}, {"num": 186, "title": "設定容差閘門以防失控", "chapter": 10, "takeaway": "建立動態品質閘門，當分數跌破閾值時自動阻斷整合。", "details": ["設定嚴格的評估閾值（例如：連續 3 次低於 3.8 分，或單次低於 3 分）。", "一旦觸發，CI/CD 立即報警並暫停自動 Merge，等待人工排查。"], "metaphor": "就像淨水廠的「水質監測器」，只要雜質含量一超過百萬分之幾（PPM），立刻自動關閉水閥。", "layout": "儀表板視覺。指針偏向紅色邊緣，背景有「ALERT: Quality Threshold Violated (Score: 2.8 < 3.5)」的大字警示。", "code": ""}, {"num": 187, "title": "功能測試 vs. 行為評估的本質區別", "chapter": 10, "takeaway": "功能測試守護代碼邊界，行為評估守護系統靈魂，兩者缺一不可。", "details": ["功能測試（Unit/Integration Test）：驗證程式碼語法、API 響應、邏輯控制流（ deterministic ）。", "行為評估（Evaluation）：驗證 AI 的邏輯連貫性、意圖理解、語義安全性（ probabilistic ）。"], "metaphor": "就像蓋房子，功能測試驗收的是「磚頭強度與水管會不會漏水」，行為評估驗收的是「居住舒適度與動線流暢性」。", "layout": "2x2 對比表格，列出：對象、驗證方法、判定標準、適用場景。", "code": ""}, {"num": 188, "title": "捕獲「行為漂移」的動態防線", "chapter": 10, "takeaway": "對抗模型迭代與 Prompt 微調帶來的隱性失控，建立持續評估機制。", "details": ["雲端模型改版或 Prompt 的微小修改，可能導致 Agent 原本正常的行為突然退化（行為漂移）。", "必須每日運行 Eval 基准測試，方能提前察覺並攔截這類隱性風險。"], "metaphor": "就像磁懸浮列車的「軌道位移傳感器」，每天微米級地偵測熱脹冷縮，防患未然。", "layout": "折線圖。X 軸為時間，Y 軸為 Eval Score。展示一條平緩的曲線，突然在某天模型升級後下挫，紅色箭頭指向該點標示「行為漂移（Behavioral Drift）」。", "code": ""}, {"num": 189, "title": "第十章總結：打造雙層評估防線", "chapter": 10, "takeaway": "將單元測試與行為評估無縫整合，建構堅不可摧的 AI 質量大堤。", "details": ["以 AI 生成的單元測試保證基礎代碼不退化。", "以 LLM-as-judge 的行為評估確保 Agent 的整體表現符合業務規範。"], "metaphor": "核心防彈衣設計：外層是「硬質防彈板」阻擋子彈穿透，內層是「軟質纖維」吸收衝擊震波。", "layout": "雙層盾牌視覺。外盾牌標示「Code Coverage (Unit/Integration)」，內盾牌標示「Behavioral Eval (LLM-as-Judge)」，兩者共同保護核心業務。", "code": ""}, {"num": 190, "title": "策略伺服器與上下文去敏感化", "chapter": 11, "takeaway": "將安全策略與執行邏輯徹底解耦，建構 Agent 時代的零信任架構。", "details": ["本章聚焦於如何防止 Agent 越權、數據洩漏與上下文幻覺風險。", "策略伺服器（Policy Server）與動態去敏感化（Context Hygiene）是核心防禦手段。"], "metaphor": "就像為企業的智能管家，配備一位「隨身法務官」與「機密遮罩筆」，凡事需審查。", "layout": "深色背景，左側高亮顯示金色章標題，右側展示一個帶有盾牌與鎖頭的系統架構草圖。", "code": ""}, {"num": 191, "title": "失控 Agent 帶來的企業安全挑戰", "chapter": 11, "takeaway": "賦予 Agent 行動力的同時，必須防範其因「權限越界」而造成災難。", "details": ["一個負責解決客訴的 Agent，如果擁有發送郵件與數據庫權限，可能失控發信給全公司。", "缺乏邊界約束 of Agent 就像在沒有護欄的懸崖高速行駛的跑車。"], "metaphor": "就像給了實習生一張「無限額度的公司信用卡」去採購辦公用品，卻沒設單筆消費上限。", "layout": "危機感視覺。背景是崩潰的伺服器與散落的信封，以驚嘆號標示「Rogue Agent Incident（失控 Agent 事件）」。", "code": ""}, {"num": 192, "title": "安全治理的硬傷：為何 Prompt 防線必敗？", "chapter": 11, "takeaway": "Prompt 不是代碼，無法抵擋惡意 Prompt 注入與上下文溢出。", "details": ["在 System Prompt 中寫「絕對不能洩露密鑰」是脆弱的，LLM 容易被 Prompt Injection 繞過。", "Context 隨對話增長會發生溢出，導致 Agent 遺忘最初的安全指令。"], "metaphor": "就像企圖用「口頭交代」來要求保全不要聽壞人的話，而不是裝設實體密碼鎖。", "layout": "盾牌破裂圖。左側展示「System Prompt 安全指令（虛線防線）」，右側展示「Prompt Injection 攻擊（紅色箭頭直接穿透）」。", "code": ""}, {"num": 193, "title": "外部化與防篡改治理的核心架構", "chapter": 11, "takeaway": "安全策略必須在 LLM 外部獨立運行，確保安全規則不受 LLM 狀態影響。", "details": ["建立獨立的 Policy Server，將安全策略寫在 YAML 配置中，不由 LLM 直接解讀。", "即使 Agent 思想被「污染」，其發出的惡意 Tool Call 也會在執行前被外部攔截。"], "metaphor": "就像銀行的「保險庫金庫門」，必須由外部保安和物理鑰匙控制，而不是聽憑庫內經理的口頭命令。", "layout": "架構隔離圖。左側為「Agent 執行區」，右側為「策略伺服器」，中間是一道厚實的「Policy Gateway（策略網關）」阻斷所有未授權調用。", "code": ""}, {"num": 194, "title": "混合策略伺服器的雙層防護機制", "chapter": 11, "takeaway": "結合決定性結構規則與語義安全分析，打造動態的雙層攔截引擎。", "details": ["雙層架構：第一層「結構化閘門（Structural Gating）」，第二層「語義閘門（Semantic Gating）」。", "結構化負責速度與粗篩，語義負責深度與上下文隱私防護。"], "metaphor": "就像大樓安檢：第一步用「金屬探測門」（結構化）快速攔截違禁品，第二步由「安檢人員親自開箱檢查」（語義化）可疑物品。", "layout": "兩級過濾漏斗圖。第一層漏斗「Structural Rules (Fast YAML Check)」，第二層漏斗「Semantic Analysis (Gemini Evaluator)」，最後輸出「Safe Execution」。", "code": ""}, {"num": 195, "title": "第一層防線：結構化閘門（紅綠燈機制）", "chapter": 11, "takeaway": "基於角色與環境的靜態限制，實現毫秒級的工具訪問控制。", "details": ["解析 policies.yaml，定義哪些環境（如 localhost）或角色（如 viewer）禁止哪些工具。", "這是不涉及 LLM 推理的純代碼邏輯，速度極快，能阻斷 80% 的越權操作。"], "metaphor": "就像公司門禁系統，刷卡時系統直接比對權限表，Viewer 刷不進主機房，無需保安人工判斷。", "layout": "對照圖。左側是 policies.yaml 設定檔片段，右側是門禁卡刷卡失敗的紅色視覺，標註「Blocked Tool: send_email on localhost」。", "code": ""}, {"num": 196, "title": "極速的二元檢查：無感防護", "chapter": 11, "takeaway": "結構化檢查應達到近乎零延遲，以維持極致的開發體驗。", "details": ["透過本地 YAML 緩存與內存比對，結構檢查延遲小於 1 毫秒。", "在開發和本地測試階段，能立即給予 Agent 反饋，避免浪費 API Token。"], "metaphor": "就像高速公路的「電子收費系統（ETC）」，車輛無需停下一對一繳費，直接通過。", "layout": "速度對比條。展示「結構檢查：< 1ms」與「LLM 推理：~1200ms」的巨大差距，強調結構檢查作為第一道關口的高效性。", "code": ""}, {"num": 197, "title": "第二層防線：語義閘門（智慧裁判）", "chapter": 11, "takeaway": "使用獨立的專用 LLM 審查 API 參數細節，阻斷隱性隱私洩漏。", "details": ["即使角色被允許使用該工具，但發送的內容可能包含未去敏感化的個人隱私資訊（PII）。", "Semantic Gating 使用 Gemini 審查 Tool Call 的 Argument，確保內容無毒無敏感數據。"], "metaphor": "就像海關官員：雖然你的護照合法且沒有攜帶金屬（第一層過關），但他會仔細詢問你的申報內容是否符合實情。", "layout": "流程圖。Agent 產出 Tool Args -> 傳送給 Policy Evaluator (Gemini) -> Gemini 回傳 \"VIOLATION\" 或 \"SAFE\" -> 決定是否放行。", "code": ""}, {"num": 198, "title": "為什麼正則表達式 (Regex) 無法完全防漏？", "chapter": 11, "takeaway": "自然語言變體無窮，Regex 只能防君子，防不住 AI 變相洩密。", "details": ["Regex 適合識別標準格式如 email 或身分證號，但無法識別變體（如 \"user at google dot com\"）。", "對於含有上下文語義的敏感數據洩漏，只有 LLM 能夠進行深層次的意圖理解。"], "metaphor": "就像用「關鍵字過濾器」攔截罵人的話，但壞人可以用「諧音字」或「暗喻」輕鬆繞過。", "layout": "對比卡片。左卡展示「Regex 規則：只攔截 standard email」，右卡展示「LLM 語義識別：成功捕獲 'my mail is name(at)domain[dot]com' 的繞過企圖」。", "code": ""}, {"num": 199, "title": "policies.yaml：定義安全底線的配置檔", "chapter": 11, "takeaway": "用統一的配置宣告安全邊界，讓安全架構一目了然。", "details": ["解析 Snippet 4：劃分 environments 與 roles 兩大維度。", "將「localhost - blocked_tools: [send_email]」與「viewer - allowed_tools: [list_files, read_file]」集中管理，實踐配置即代碼。"], "metaphor": "就像公司的「員工手冊與權限矩陣」，白紙黑字寫清楚每個職等和每個辦公室的通行權限。", "layout": "程式碼視窗。高亮 `policies.yaml` 中的結構，用綠色標註 roles/viewer，用紅色標註 blocked_tools，並拉出註解線說明。", "code": ""}, {"num": 200, "title": "動態攔截與校正的完整工作流", "chapter": 11, "takeaway": "不只攔截更要輔能自我修正，讓 Agent 在邊界內自我優化。", "details": ["步驟 1：攔截 Tool Call；步驟 2：進行雙層檢查；步驟 3：回傳 \"Policy Violation\" 錯誤訊息。", "Agent 收到違規回饋後，會自動嘗試修改參數（例如自動遮罩 email）並重新發送請求，實現自癒。"], "metaphor": "就像編輯文章時，拼字檢查工具不只畫紅線提示錯誤，還會建議正確的拼法。", "layout": "泳道圖（Swimlane Diagram）。劃分「Agent」、「Policy Server」與「External System」三條泳道，展示違規攔截、回傳錯誤、Agent 修正重發、最終放行的動態過程。", "code": ""}, {"num": 201, "title": "語義安全性分析程式碼剖析", "chapter": 11, "takeaway": "用輕量 Python 服務封裝安全邏輯，無縫嵌入任何 Agent 框架。", "details": ["解析 Snippet 5：`PolicyService` 類別的實現細節。", "`check_action_semantic` 異步調用 Gemini 評估 PII，解析 response 是否以 \"VIOLATION\" 開頭，決定放行與否。"], "metaphor": "就像在自來水管線上加裝一個「水質採樣閥門」，隨時將水樣送去實驗室快速化驗。", "layout": "程式碼高亮排版。高亮 `client.models.generate_content` 與 `response.text.strip().upper().startswith(\"VIOLATION\")`，並用標籤指出這是「語義判決的核心程式碼」。", "code": ""}, {"num": 202, "title": "無菌數據的核心：上下文衛生", "chapter": 11, "takeaway": "從源頭防範洩密，不讓任何敏感數據進入 Agent 的運行記憶體。", "details": ["策略伺服器是「事後攔截」，而 Context Hygiene 是「事前防禦」。", "透過在 memory/prompt 中使用 placeholders，確保 Agent 從一開始就接觸不到真實敏感資訊。"], "metaphor": "就像進入無菌室前，必須先穿上防塵衣並進行全身消殺，而不是等髒污進了無菌室再清掃。", "layout": "雙向對比圖。左邊「骯髒 Context：內含真名、密鑰、私有 URL」，右邊「無菌 Context：全數替換為 [[USER_NAME]], [[API_KEY]] 等佔位符」。", "code": ""}, {"num": 203, "title": "什麼是上下文幻覺風險？", "chapter": 11, "takeaway": "AI 缺乏真實數據時會用 context 中的敏感詞湊數，造成隨機洩密。", "details": ["當 Agent 被要求調用 API 但缺少參數時，會搜尋對話歷史中類似格式的字串填補空缺。", "若歷史記錄中存有真實用戶 Email，該 Email 就可能被 Agent 拿去發送垃圾測試信。"], "metaphor": "就像桌上散落著客戶名單，秘書在找不到測試名單時，隨手抓了桌上的「真實名單」寄出了測試信。", "layout": "情境還原圖。展示 Agent 腦袋中發生的推演：「需要 Email 參數 -> 搜尋 Memory -> 發現歷史記錄中有 'boss@company.com' -> 自動套用 -> 悲劇發生（信件寄出）」。", "code": ""}, {"num": 204, "title": "動態上下文解析器：Dynamic ContextResolver", "chapter": 11, "takeaway": "使用雙中括號語法定義佔位符，實現安全變數的延遲綁定。", "details": ["在模板或 prompt 中使用 `[[VARIABLE_NAME]]` 作為符號。", "ContextResolver 會在 Tool 實際執行前的最後一毫秒，將其動態替換為安全的測試環境數據。"], "metaphor": "就像好萊塢電影劇本中用「[男女主角擁抱]」作為動作標記，等開拍時再由真實演員現場演出。", "layout": "解析示意圖。展示一個模板字串 \"Send report to [[USER_EMAIL]]\"，經過 Resolver 處理後，輸出 \"Send report to test-user@sandbox.internal\"。", "code": ""}, {"num": 205, "title": "ContextResolver 的替換優先級順序", "chapter": 11, "takeaway": "遵循「運行時覆寫 > 環境變量」的三級降級策略，確保安全與彈性。", "details": ["第一優先級：Runtime State Overrides（運行時覆寫，如特定的 Session 數據）。", "第二優先級：Validated Environment Variables（已驗證的環境變數）。", "第三優先級：若皆無，保留佔位符原樣，防止隱性靜默失敗。"], "metaphor": "就像公司的代班順位：第一優先是指定代理人，若沒有則由部門主管代行，若再沒有則工作暫停，絕不隨便找路人代班。", "layout": "階梯式降級流程圖。從「1. Override State」->「2. OS Environment」->「3. Keep Original Match」，以箭頭依序向下指引。", "code": ""}, {"num": 206, "title": "預防無聲失敗的容錯設計", "chapter": 11, "takeaway": "未解析的佔位符寧可保留原樣，也不可替換為空字串或猜測值。", "details": ["若將找不到的佔位符替換為空字串，系統可能會在沒有參數的情況下執行，造成難以排查的 bug。", "保留原樣 `[[VAR]]` 會在 API 調用時拋出明顯格式錯誤，便於開發者立即修正。"], "metaphor": "就像填寫報稅單時，如果某個機密項目你不知道，寧可留白讓系統報錯，也不要隨便填個 0 元。", "layout": "對比卡片。左卡「錯誤做法：替換為空 -> 系統靜默通過 -> 數據損壞」；右卡「正確做法：保留 [[VAR]] -> 觸發 schema error -> 立即定位修復」。", "code": ""}, {"num": 207, "title": "解構 context_resolver.py 程式碼", "chapter": 11, "takeaway": "用高效的正則表達式與閉包函數，實現無狀態的 context 解析。", "details": ["解析 Snippet 6：使用 `re.sub(r'\\[\\[([^\\]]+)\\]\\]', replacement, template_str)`。", "閉包函數 `replacement(match)` 動態獲取匹配的變數名，執行優先級判定，代碼結構清晰。"], "metaphor": "就像一個高度專業的郵件分揀機，看到特定格式的信件就自動拆開，根據規則分派到不同的投遞口。", "layout": "程式碼卡片。展示 `resolve_context` 函數，使用不同顏色框出正則表達式、閉包替換邏輯與優先級判定的 `if-elif-else` 區塊。", "code": ""}, {"num": 208, "title": "在 Tool 執行管道中全域強制執行去敏感化", "chapter": 11, "takeaway": "將 Resolver 掛載為全域 Middleware，使去敏感化成為系統內建屬性。", "details": ["不能指望開發者在每個 Tool 中手動調用解析器，這容易遺漏。", "在 Agent Framework 的 `validate_tool_call` 階段統一攔截，自動過濾所有輸入參數。"], "metaphor": "就像在整座大樓的總水管安裝過濾器，確保所有水龍頭流出來的都是淨水，不需各別安裝淨水器。", "layout": "管道攔截圖。展示 Tool Call 穿過一條名為「Middleware validation step」的管道，管道兩側裝有 ContextResolver 過濾器，隨後流向 Target Tool。", "code": ""}, {"num": 209, "title": "遞迴處理複雜 Parameter 參數", "chapter": 11, "takeaway": "遍歷 nested List 與 Dict 結構，不放過深埋在參數結構中的敏感詞。", "details": ["解析 Snippet 7：遍歷 `args.items()`。", "判斷類型：若為 string 則直接 resolve；若為 list 則遞迴處理每個元素；若為 dict 也同樣遞迴解析，確保複雜 JSON payload 的安全性。"], "metaphor": "就像快遞安檢：不只掃描包裹外箱，還要把箱子裡的多個小盒子、小袋子逐一打開檢查。", "layout": "遞迴樹狀圖。最上層是 `args (Dict)`，分叉出 `str_param`、`list_param`，再向下延伸到 list 中的各個元素，每個節點都打上綠色的「Sterilized」盾牌標記。", "code": ""}, {"num": 210, "title": "實戰演練：從 [[COMMENTER_EMAIL]] 到安全執行的動態變化", "chapter": 11, "takeaway": "見證動態替換流程，確保敏感 PII 資訊在零暴露下安全執行。", "details": ["開發階段：Prompt 寫 \"Notify [[COMMENTER_EMAIL]] about the change\"。", "執行階段：Middleware 攔截，讀取環境變數，將其替換為 \"dev-sandbox@company.com\"。"], "metaphor": "就像軍事演習時，地圖上標示的目標都是代號（如「藍軍 A 點」），只有在發射飛彈的最後一刻，導引系統才代入真實座標。", "layout": "橫向三階段圖：1. Template State (含有佔位符) -> 2. Resolution Middleware (動態注入) -> 3. Execution State (無敏感數據洩露)，各階段以箭頭和數據卡片展示。", "code": ""}, {"num": 211, "title": "第十一章總結：零信任 Agent 治理體系", "chapter": 11, "takeaway": "以 Policy Server 控邊界，以 Context Hygiene 淨內存，構建主動防禦閉環。", "details": ["外部 Policy Server 進行嚴格的角色與環境限制，實行二元與語義攔截。", "內部 Context Hygiene 排除 PII 污染，消除上下文幻覺。"], "metaphor": "就像一座堅固的城堡：外有護城河與城門守衛（Policy Server），內有嚴格的衛生檢疫措施（Context Hygiene）。", "layout": "綜合防禦架構圖。將城堡、護城河、安檢網與城堡內部乾淨水源的意象融合成一張系統拓撲圖。", "code": ""}, {"num": 212, "title": "實踐指引與全書總結", "chapter": 12, "takeaway": "將理論化為行動，以工具鏈輔能團隊，引領 Spec-Driven 生態演進。", "details": ["本章為全書畫下句點，提供具體的落地方案與命令工具。", "重申在 Vibe Coding 時代，人機協同文化與研發流程的終極演化方向。"], "metaphor": "就像完成了一份宏偉的「城市規劃藍圖」，現在要發放「標準施工工具箱」給工程隊。", "layout": "全螢幕深色底，左側放置金色「CHAPTER 12」大字，右側展示一個從 spec 符號到雲端部署的抽象火箭升空路徑。", "code": ""}, {"num": 213, "title": "AI 消除生產瓶頸後的「新第一瓶頸」", "chapter": 12, "takeaway": "開發瓶頸已移至下游，人類的「審查與集成能力」決定交付天花板。", "details": ["AI 寫程式碼快了 10 倍，但人類閱讀、理解與測試這些代碼的速度沒有變快。", "若沿用舊有流程，團隊將被海量 AI PR 淹沒，造成嚴重的整合塞車（Integration Jam）。"], "metaphor": "就像把農田的「收割機速度提升了 100 倍」，但「運送卡車和加工廠」的容量沒變，導致糧食全爛在田裡。", "layout": "管道流量圖。左側「Code Generation」管道極寬，流量標示「10x」；中間「Human Review & Testing」管道極窄，流量標示「1x（瓶頸紅色高亮）」，右側「Production Release」流量受限於 1x。", "code": ""}, {"num": 214, "title": "人機協同的「共享認知負荷」模型", "chapter": 12, "takeaway": "人類升級為架構設計師，AI 承接執行細節，實現高價值的分工。", "details": ["人類職責：編寫 High-Quality Specs（測試規格、集成規格、DevOps 藍圖）。", "AI 職責：編寫單元測試、進行 API 串接、自動排查低級錯誤、生成部署配置。"], "metaphor": "就像建築大師專注於「繪製精準的摩天大樓結構藍圖與力學分析」，而把「砌磚、拉管線」等體力活交給自動化工程機具。", "layout": "左右天平圖或分工矩陣。左側「人類的腦：架構設計、邊界防禦、業務意圖」，右側「AI 的手：代碼編寫、測試生成、環境配置」，中間是「規格書（Spec）」作為連接樞紐。", "code": ""}, {"num": 215, "title": "跳脫 Prompt 優化的迷思", "chapter": 12, "takeaway": "系統工程勝過文字遊戲，不要用 Prompt 補償系統架構的缺失。", "details": ["許多團隊花費數週優化 Prompt 的措辭，但效果仍不穩定。", "正確做法是透過 BDD 規格（Gherkin）、Policy Server 和 Sandboxing 等「工程體制」來約束 AI 行為。"], "metaphor": "就像與其花費無數精力去「教育火車司機開車不要偏離軌道」，不如直接「鋪設實體鐵軌」來得保險。", "layout": "維度比較圖。左側「Prompt 技巧（低回報、高變異性）」，右側「SDD 與工程隔離（高回報、高決定性）」，以向上與向下的柱狀圖展示投資報酬率。", "code": ""}, {"num": 216, "title": "敏捷團隊的文化演化：從 Code-First 到 Spec-First", "chapter": 12, "takeaway": "放棄「先寫代碼再調試」的舊習慣，建立「先寫規格再生成」的新文化。", "details": ["程式碼是 disposable（可隨時丟棄的），只有 Spec 是永久資產。", "團隊應以 /specs 資料夾作為唯一真理源頭，程式碼審查應轉化為「規格審查」。"], "metaphor": "就像古人做雕刻，一刀錯就全毀，所以極度小心（Code-First）；現代人用 3D 列印，只要 CAD 檔案完美，隨時可以印了又丟（Spec-First）。", "layout": "文化演進時間軸。左側「傳統敏捷：User Story -> Code -> Test -> Refactor」，右側「AI 敏捷：User Intent -> SDD Spec -> AI Auto-Gen & Test -> Verified Deploy」。", "code": ""}, {"num": 217, "title": "立即啟動：使用 uv google-agents-cli 初始化", "chapter": 12, "takeaway": "一鍵安裝官方 CLI 工具鏈，秒級為 coding agent 裝備工程技能。", "details": ["使用 `uv google-agents-cli setup` 命令快速初始化環境。", "自動在專案中部署七個預設 Skill，包含 scaffolding、evaluation 等，開箱即用。"], "metaphor": "就像買來一部新手機，按下「一鍵還原/一鍵裝機」，所有常用且必備的 App 瞬間安裝妥當。", "layout": "終端機視窗。展示 `uv google-agents-cli setup` 命令的運行過程，並以綠色打勾符號列出成功安裝的七大 Skill 模組。", "code": ""}, {"num": 218, "title": "解構 Coding Agent 的七大核心技能", "chapter": 12, "takeaway": "掌握七大維度，讓你的 Agent 具備完整軟體生命週期的開發能力。", "details": ["涵蓋：Scaffolding（腳手架）、ADK Code（ADK 代碼）、Evaluation（行為評估）、Deployment（部署）、Publishing（發佈）、Observability（可觀測性）以及 Security Sandbox（安全沙盒）。", "這七大技能共同構成了 Spec-Driven Development 的完整工具閉環。"], "metaphor": "就像瑞士刀的七個工具配件，有開瓶器、小刀、剪刀等，每一件都針對特定任務進行優化。", "layout": "環形七瓣圖（花瓣圖）。每個花瓣標註一項技能與簡短說明，中心為「SDD Core Engine」。", "code": ""}, {"num": 219, "title": "從 Spec 到 Scaffold 的一鍵生成實踐", "chapter": 12, "takeaway": "用 agents-cli scaffold 實踐「規格即代碼」，瞬間生成乾淨專案骨架。", "details": ["讀取 `/specs` 下的 YAML 與 Markdown 規範，自動生成目錄結構、配置與基礎代碼。", "避免手動設定 boilerplate，確保專案架構完全符合 Google 生產級標準。"], "metaphor": "就像建築工地使用的「預製鋼骨模板」，只要規格輸入，機器當場灌漿出完美的大樓框架。", "layout": "輸入輸出對比。左側為 `specs/app.yaml` 規格文件，中間是 `agents-cli scaffold` 圖示，右側是展開的專案目錄結構樹（如 src/, tests/, config/）。", "code": ""}, {"num": 220, "title": "建立行為評估品質閘門的自動化運行", "chapter": 12, "takeaway": "以 agents-cli eval run 驅動持續評估，在 CI/CD 中鎖死質量防線。", "details": ["將行為評估命令寫入 CI 腳本（例如 GitHub Actions）。", "每次 PR 提交時，自動運行基準測試並交由 LLM-as-judge 評估，未達標則禁止 Merge。"], "metaphor": "就像在工廠的出貨大門安裝「自動重量與成分檢測儀」，任何少裝或瑕疵的箱子都會被自動推下輸送帶。", "layout": "CI/CD Pipeline 流程圖。展示 Code Commit -> Lint -> Unit Tests -> `agents-cli eval run` -> Production Release，將 eval run 步驟以金色光圈高亮標記。", "code": ""}, {"num": 221, "title": "沙盒化安全部署的標準流水線", "chapter": 12, "takeaway": "使用 agents-cli deploy 實現無痛的沙盒部署與主動防禦。", "details": ["自動包裝代碼至安全 Docker 沙盒，隔離敏感環境變數。", "一鍵部署至 Cloud Run 或 Vertex AI Agent Engine，完成生產級上線，確保基礎設施不受威脅。"], "metaphor": "就像將貴重且有潛在危險的化學品，裝在「特製的雙層密封防爆桶」中，再用無人搬運車送入無菌倉庫。", "layout": "部署拓撲圖。左側為 Local Agent Sandbox，中間為加密傳輸管道，右側為 Cloud Run 與 Vertex AI Agent Engine，上方標註「Zero-Trust Sandbox Deployment」。", "code": ""}, {"num": 222, "title": "全書知識地圖總回顧", "chapter": 12, "takeaway": "融會貫通三大核心模組，構建企業級 vibe coding 時代的鐵三角。", "details": ["規格驅動開發（SDD）：解決「建構什麼」的精準度問題。", "零信任安全架構（Policy & Sandbox）：解決「如何安全建構」的防護問題。", "人機協作與工具鏈（CLI & Skills）：解決「如何高效交付」的落地問題。"], "metaphor": "就像一座堅固的鼎，三隻腳分別是規格、安全與工具，缺任何一隻腳鼎就會傾倒。", "layout": "三角形鐵三角架構圖。三個頂點分別是「Spec-Driven Development」、「Zero-Trust Governance」、「Automated CLI Tooling」，中心為「Production-Grade AI Agents」。", "code": ""}, {"num": 223, "title": "結語：迎向 Spec-Driven 開發的新紀元", "chapter": 12, "takeaway": "不要抗拒改變，用規格與制度掌控 AI，成為 AI 時代的軟體架構師。", "details": ["軟體工程的本質沒有變，依然是解決問題並交付業務價值；改變的只是實現細節的手段。", "掌握規格編寫與安全治理的工程師，將是未來研發團隊的核心領袖。"], "metaphor": "就像從「手持皮鞭的馬車夫」升級為「掌控高鐵控制台的調度總長」。", "layout": "全螢幕高對比視覺。背景是燦爛的黎明或星空，中央大字寫著「The future of software is not written, it is specified.（軟體工程的未來不是寫出來的，而是規範出來的）」。", "code": ""}];

        window.onload = function() {

            // Add keyboard navigation

                if (e.key === 'ArrowRight' || e.key === ' ') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
                    prevSlide();
                } else if (e.key.toLowerCase() === 'm') {

                } else if (e.key.toLowerCase() === 'f') {

        function populateChapters() {
            const dropdown = document.getElementById('chapterDropdown');
            dropdown.innerHTML = '<option value="all">所有章節目錄</option>';
            chapters.forEach(ch => {
                dropdown.innerHTML += `<option value="${ch.num}">第 ${ch.num} 章：${ch.name}</option>`;
            });
        }

        function getActiveSlides() {
            return currentMode === 'overview' ? overviewSlides : detailedSlides;
        }

        function renderSlide() {
            const slides = getActiveSlides();
            const slide = slides[currentSlideIdx];
            
            // Update page info
            document.getElementById('slidePageInfo').innerText = `投影片 ${currentSlideIdx + 1} / ${slides.length}`;
            document.getElementById('footerProgress').innerText = `${currentSlideIdx + 1} / ${slides.length}`;
            
            // Highlight active chapter in dropdown
            const dropdown = document.getElementById('chapterDropdown');
            dropdown.value = slide.chapter;
            
            // Check if mindmap slide (Overview slide #2)
            if (currentMode === 'overview' && slide.num === 2) {
                document.getElementById('slideNormalBody').style.display = 'none';
                document.getElementById('slideMindmapBody').style.display = 'block';
                document.getElementById('slideTitle').innerText = slide.title;
                document.getElementById('slideSubtitle').innerText = slide.subtitle;
                document.getElementById('slideMeta').innerText = "全書架構關係心智圖";
                
                renderMindmap();
                return;
            }
            
            // Else render normal slide
            document.getElementById('slideNormalBody').style.display = 'flex';
            document.getElementById('slideMindmapBody').style.display = 'none';
            
            document.getElementById('slideTitle').innerText = slide.title;
            document.getElementById('slideSubtitle').innerText = slide.subtitle || `第 ${slide.chapter} 章節細節說明`;
            
            // Set slide meta (chapter & PDF page reference)
            const chName = chapters.find(c => c.num === slide.chapter)?.name || "";
            const pageRef = slide.page_ref || `PDF 第 ${chapters.find(c => c.num === slide.chapter)?.pages} 頁`;
            document.getElementById('slideMeta').innerText = `${slide.chapter} Overview of ${chName} (${pageRef})`;
            
            // Set Takeaway
            document.getElementById('slideTakeaway').innerText = slide.takeaway;
            
            // Set Points
            const pointsContainer = document.getElementById('slidePoints');
            pointsContainer.innerHTML = '';
            if (slide.details && slide.details.length > 0) {
                slide.details.forEach((pt, i) => {
                    pointsContainer.innerHTML += `
                        <div class="point-item">
                            <div class="point-badge">${i + 1}</div>
                            <div class="point-content">${pt}</div>
                        </div>
                    `;
                });
            }
            
            // Set Code block
            const codeBox = document.getElementById('slideCodeContainer');
            if (slide.code) {
                codeBox.innerText = slide.code;
                codeBox.style.display = 'block';
            } else {
                codeBox.style.display = 'none';
            }
            
            // Set Metaphor
            document.getElementById('slideMetaphor').innerText = slide.metaphor || "無概念類比，採用標準工程實務指引。";
            
            // Render Flowchart
            renderFlowchart(slide.chapter);
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            
            document.getElementById('overviewModeBtn').classList.toggle('active', mode === 'overview');
            document.getElementById('detailedModeBtn').classList.toggle('active', mode === 'detailed');
            
            // Reset index
            currentSlideIdx = 0;
            renderSlide();
        }

        function jumpToChapter(chNum) {
            if (chNum === 'all') return;
            const targetCh = parseInt(chNum);
            const slides = getActiveSlides();
            
            // Find first slide in this chapter
            const targetIdx = slides.findIndex(s => s.chapter === targetCh);
            if (targetIdx !== -1) {
                currentSlideIdx = targetIdx;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) {
                currentSlideIdx--;
                renderSlide();
            }
        }

        function nextSlide() {
            const slides = getActiveSlides();
            if (currentSlideIdx < slides.length - 1) {
                currentSlideIdx++;
                renderSlide();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`無法開啟全螢幕模式: ${err.message}`);

                document.exitFullscreen();

        // Flowchart Render (Dynamic SVG generator)
        const chapterFlowchartNodes = {

            2: ["模糊業務需求", "BDD 規格化", "YAML 架構描述", "SkCC 編譯優化"],

            5: ["整合痛點", "MCP SQLite 伺服器", "Stdio 連接管道", "MCP 用戶端呼叫"],
            6: ["Merge 衝突過載", "Russian-doll PR", "PR AI Summary", "Conditional LGTM"],

            8: ["審查疲勞 (45%)", "低反差同意", "Digital Quiet Hours", "Insight 經驗分享"],
            9: ["YOLO mode 執行", "代碼沙箱隔離", "Docker 沙箱 (`GEMINI_SANDBOX`)", "安全邊界保護"],
            10: ["行為漂移漏洞", "重現單元測試", "LLM-as-Judge 評估", "軌跡與容差判定"],
            11: ["工具請求攔截", "策略服務 policies.yaml", "結構閘驗證", "語意閘安全過濾"],
            12: ["CLI 初始化", "scaffold 生成", "eval run 測試柵欄", "deploy 沙箱部署"]
        };

        function renderFlowchart(chapterNum) {
            const nodes = chapterFlowchartNodes[chapterNum] || ["步驟 1", "步驟 2", "步驟 3"];
            const canvas = document.getElementById('flowchartCanvas');
            canvas.innerHTML = '';
            
            fcZoom = 1.0;
            fcPanX = 0;
            fcPanY = 0;
            
            // Build SVG dynamically
            let svgContent = `<svg id="flowchartSvg" viewBox="0 0 400 300">
                <g id="fcGroup" transform="translate(0, 0) scale(1)">`;
            
            // Nodes layout in a vertical/horizontal cascade
            const nodeWidth = 140;
            const nodeHeight = 40;
            const startX = 130;
            const startY = 30;
            const gapY = 60;
            
            nodes.forEach((n, idx) => {
                const y = startY + idx * gapY;
                svgContent += `
                    <!-- Arrow -->
                    ${idx > 0 ? `<path d="M 200 ${y - gapY + nodeHeight} L 200 ${y}" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>` : ''}
                    <!-- Node Card -->
                    <rect x="${startX}" y="${y}" width="${nodeWidth}" height="${nodeHeight}" rx="6" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1.5"/>
                    <text x="${startX + nodeWidth/2}" y="${y + 24}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text-color)">${n}</text>
                `;
            });
            
            // Marker
            svgContent += `
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 2 L 10 5 L 0 8 z" fill="#4f46e5" />
                    </marker>
                </defs>
                </g>
            </svg>`;
            
            canvas.innerHTML = svgContent;
        }

        function zoomFlowchart(factor) {
            fcZoom *= factor;
            updateFlowchartTransform();
        }

        function resetFlowchart() {
            fcZoom = 1.0;
            fcPanX = 0;
            fcPanY = 0;
            updateFlowchartTransform();
        }

        function updateFlowchartTransform() {
            const group = document.getElementById('fcGroup');
            if (group) {
                group.setAttribute('transform', `translate(${fcPanX}, ${fcPanY}) scale(${fcZoom})`);
            }
        }

        // Setup mouse drag & zoom on Flowchart & Mindmap
        function setupDragAndZoom() {

                isFcDragging = true;
                fcStartX = e.clientX - fcPanX;
                fcStartY = e.clientY - fcPanY;

                isFcDragging = false;
                isMmDragging = false;
            });
            fcCanvas.addEventListener('mousemove', (e) => {
                if (isFcDragging) {
                    fcPanX = e.clientX - fcStartX;
                    fcPanY = e.clientY - fcStartY;
                    updateFlowchartTransform();
                }
            });
            fcCanvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                zoomFlowchart(factor);
            });

            const mmCanvas = document.getElementById('mindmapContainer');
            mmCanvas.addEventListener('mousedown', (e) => {
                if (e.target.closest('.mindmap-control-btn') || e.target.closest('.node-detail-panel')) return;
                isMmDragging = true;
                mmStartX = e.clientX - mmPanX;
                mmStartY = e.clientY - mmPanY;
            });
            mmCanvas.addEventListener('mousemove', (e) => {
                if (isMmDragging) {
                    mmPanX = e.clientX - mmStartX;
                    mmPanY = e.clientY - mmStartY;
                    updateMindmapTransform();
                }
            });
            mmCanvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                zoomMindmap(factor);
            });
        }

        // Mindmap Render (Interactive SVG graph)
        const chapterSummaries = {
            1: "前言與 Vibe Coding 的挑戰：討論 AI 帶來的程式生產速度幻覺，以及人機混合團隊（LLM做腦，工具做手）的企業級可靠性落地痛點。",
            2: "規格驅動開發與 BDD 規範：介紹 Gherkin 語法（Given/When/Then），SkCC 框架編譯優化，以及 YAML 在深度嵌套結構的解析優勢。",
            3: "指令管理與系統提示詞：剖析 ephemeral Chat、靜態 /specs 資料夾、動態 SKILL 行為模組，以及 Global/Shared/Project 系統提示詞階層。",
            4: "Agent 的五大執行模式：細分 Architect、Builder、Forensic（證據提示修復）、Author（Docstring/README）、Librarian 五種角色及沙箱瀏覽器驗證機制。",
            5: "模型上下文協定 (MCP)：深入說明 SQLite MCP 伺服器建置與 Stdio 連線，將多框架 AI 工具調用標準化，形成「AI 時代的 USB-C」。",
            6: "團隊文化與開發流程：應對 PR 衝突與俄羅斯娃娃 PR 的整合策略，引進 AI-generated Summary、風險審查、Conditional LGTM 與無責文化。",
            7: "自動化審查與三層級：分析 Managed、Hybrid（Antigravity CLI）、Custom 審查，並用 Spanner Graph 提供圖譜代碼依賴理解。",
            8: "開發永續性與審查疲勞：應對 45% AI 使用者高過載疲勞的數位靜音機制 (Digital Quiet Hours) 與 Agent Insight 團隊共享心法。",
            9: "零信任安全與沙箱機制：防範 YOLO mode 執行下 Agent Hallucination 亂點按鈕釀災，採取 Docker 沙箱與 terminal sandbox 安全邊界。",
            10: "行為評估與 AI 自動生成測試：說明單元測試（二進位判定）與行為評估（LLM-as-Judge 評分、軌跡比對與容差門檻）的混合使用。",
            11: "策略伺服器與去敏感化：實作 PolicyService policy_server.py 以進行結構閘/語意閘檢查，並用 context_resolver 解決變數敏感性。",
            12: "實踐指引與全書總結：以 google-agents-cli 為基礎，示範 scaffold、eval run、deploy 指令，實現從 Vibe 走向 Production 的全套流程。"
        };

        const partColors = {
            1: "#6366f1", // Part I
            2: "#3b82f6", // Part II
            3: "#10b981", // Part III
            4: "#f59e0b"  // Part IV
        };

        function renderMindmap() {
            const container = document.getElementById('mindmapContainer');
            // Remove previous svg if exists
            const prevSvg = document.getElementById('mindmapSvg');
            if (prevSvg) prevSvg.remove();

            mmZoom = 1.0;
            mmPanX = 0;
            mmPanY = 0;

            const width = 1200;
            const height = 750;
            
            // Create SVG element
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("id", "mindmapSvg");
            svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
            svg.style.width = "100%";
            svg.style.height = "100%";
            
            // Define arrowhead marker
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            defs.innerHTML = `
                <marker id="mmArrow" viewBox="0 0 10 10" refX="18" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 2 L 10 5 L 0 8 z" fill="#4f46e5" />
                </marker>
            `;
            svg.appendChild(defs);

            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute("id", "mmGroup");
            svg.appendChild(group);

            // 1. Coordinates and Nodes Data
            const center = { x: 600, y: 375, label: "Vibe Coding 生產級開發藍圖", type: "center" };
            
            const parts = [
                { id: 1, x: 380, y: 220, label: "Part I: 開發正規化與規格驅動", color: "#1e293b" },
                { id: 2, x: 820, y: 220, label: "Part II: 執行模式與工具協定", color: "#1e293b" },
                { id: 3, x: 380, y: 530, label: "Part III: 團隊整合與流程自動化", color: "#1e293b" },
                { id: 4, x: 820, y: 530, label: "Part IV: 零信任安全與行為防護", color: "#1e293b" }
            ];
            
            const chs = [
                // Part I
                { id: 1, part: 1, x: 180, y: 120, label: "Ch 1: Vibe Coding 生產環境挑戰" },
                { id: 2, part: 1, x: 180, y: 220, label: "Ch 2: 規格驅動與 BDD 規範" },
                { id: 3, part: 1, x: 180, y: 320, label: "Ch 3: 指令管理與系統提示詞" },
                // Part II
                { id: 4, part: 2, x: 1020, y: 170, label: "Ch 4: Agent 的五大執行模式" },
                { id: 5, part: 2, x: 1020, y: 270, label: "Ch 5: 模型上下文協定 (MCP)" },
                // Part III
                { id: 6, part: 3, x: 180, y: 430, label: "Ch 6: 團隊文化與流程演進" },
                { id: 7, part: 3, x: 180, y: 530, label: "Ch 7: 自動化審查與三層級" },
                { id: 8, part: 3, x: 180, y: 630, label: "Ch 8: 開發永續性與審查疲勞" },
                // Part IV
                { id: 9, part: 4, x: 1020, y: 430, label: "Ch 9: 零信任安全與沙箱機制" },
                { id: 10, part: 4, x: 1020, y: 510, label: "Ch 10: 行為評估與自動生成測試" },
                { id: 11, part: 4, x: 1020, y: 590, label: "Ch 11: 策略伺服器與去敏感化" },
                { id: 12, part: 4, x: 1020, y: 670, label: "Ch 12: 實踐指引與全書總結" }
            ];

            // 2. Draw Links (Relations)
            // Center to Parts (Dashed gray)
            parts.forEach(p => {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", center.x);
                line.setAttribute("y1", center.y);
                line.setAttribute("x2", p.x);
                line.setAttribute("y2", p.y);
                line.setAttribute("class", "mindmap-link center-to-part");
                line.style.stroke = "#cbd5e1";
                line.style.strokeWidth = "2";
                line.style.strokeDasharray = "4 4";
                group.appendChild(line);
            });

            // Parts to Chapters (Dotted colors)
            chs.forEach(c => {
                const p = parts.find(pt => pt.id === c.part);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", p.x);
                line.setAttribute("y1", p.y);
                line.setAttribute("x2", c.x);
                line.setAttribute("y2", c.y);
                line.setAttribute("class", `mindmap-link part-to-ch ch-${c.id}`);
                line.style.stroke = "#cbd5e1";
                line.style.strokeWidth = "1.5";
                line.style.strokeDasharray = "3 3";
                group.appendChild(line);
            });

            // Sequenced flow between chapters (Arrows representing relationship)
            for(let i=0; i < chs.length - 1; i++) {
                const c1 = chs[i];
                const c2 = chs[i+1];
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                // Draw curve arrow from c1 to c2
                const dx = c2.x - c1.x;
                const dy = c2.y - c1.y;
                const cx = (c1.x + c2.x) / 2 + (dy * 0.1);
                const cy = (c1.y + c2.y) / 2 - (dx * 0.1);
                
                path.setAttribute("d", `M ${c1.x} ${c1.y} Q ${cx} ${cy} ${c2.x} ${c2.y}`);
                path.setAttribute("class", `mindmap-link flow-link fl-${c1.id}-${c2.id}`);
                path.style.fill = "none";
                path.style.stroke = "#e2e8f0";
                path.style.strokeWidth = "1.5";
                path.setAttribute("marker-end", "url(#mmArrow)");
                group.appendChild(path);
            }

            // 3. Draw Center Node
            const cNode = document.createElementNS("http://www.w3.org/2000/svg", "g");
            cNode.setAttribute("class", "mindmap-node center-node");
            cNode.innerHTML = `
                <circle cx="${center.x}" cy="${center.y}" r="55" fill="var(--primary-color)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"/>
                <text x="${center.x}" y="${center.y - 10}" text-anchor="middle" font-size="13" font-weight="800" fill="white">Vibe Coding</text>
                <text x="${center.x}" y="${center.y + 10}" text-anchor="middle" font-size="12" font-weight="800" fill="white">生產級開發藍圖</text>
            `;
            group.appendChild(cNode);

            // 4. Draw Parts Nodes (Black rectangles)
            parts.forEach(p => {
                const pNode = document.createElementNS("http://www.w3.org/2000/svg", "g");
                pNode.setAttribute("class", "mindmap-node part-node");
                const w = 210;
                const h = 34;
                pNode.innerHTML = `
                    <rect x="${p.x - w/2}" y="${p.y - h/2}" width="${w}" height="${h}" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
                    <text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="white">${p.label}</text>
                `;
                group.appendChild(pNode);
            });

            // 5. Draw Chapters Nodes (White rounded rectangles)
            chs.forEach(c => {
                const cNode = document.createElementNS("http://www.w3.org/2000/svg", "g");
                cNode.setAttribute("id", `mmNode-${c.id}`);
                cNode.setAttribute("class", `mindmap-node chapter-node ch-node-${c.id}`);
                
                const w = 220;
                const h = 36;
                
                cNode.innerHTML = `
                    <rect x="${c.x - w/2}" y="${c.y - h/2}" width="${w}" height="${h}" rx="6" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1.5" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.05))"/>
                    <text x="${c.x}" y="${c.y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-color)">${c.label}</text>
                `;
                
                // Add click event to node
                cNode.addEventListener('click', (e) => {
                    e.stopPropagation();
                    highlightNode(c.id, c.label);
                });
                
                group.appendChild(cNode);
            });

            // Click container outside nodes to clear highlight
            container.appendChild(svg);
            svg.addEventListener('click', () => {
                clearHighlight();
            });
        }

        function highlightNode(id, label) {
            // Highlight nodes and fade others
            document.querySelectorAll('.mindmap-node').forEach(node => {
                node.classList.add('dimmed');
                node.classList.remove('active');
            });
            const activeNode = document.getElementById(`mmNode-${id}`);
            if (activeNode) {
                activeNode.classList.remove('dimmed');
                activeNode.classList.add('active');
            }

            // Highlight connections related to this chapter
            document.querySelectorAll('.mindmap-link').forEach(link => {
                link.classList.add('dimmed');
                link.classList.remove('active');
            });

            // Highlight part-to-ch link for this chapter
            const partToCh = document.querySelector(`.part-to-ch.ch-${id}`);
            if (partToCh) {
                partToCh.classList.remove('dimmed');
                partToCh.classList.add('active');
            }

            // Highlight flow links connected to this chapter
            const flowPrev = document.querySelector(`.flow-link.fl-${id-1}-${id}`);
            if (flowPrev) {
                flowPrev.classList.remove('dimmed');
                flowPrev.classList.add('active');
            }
            const flowNext = document.querySelector(`.flow-link.fl-${id}-${id+1}`);
            if (flowNext) {
                flowNext.classList.remove('dimmed');
                flowNext.classList.add('active');
            }

            // Show details card in bottom right
            const detailPanel = document.getElementById('nodeDetailPanel');
            const detailTitle = document.getElementById('nodeDetailTitle');
            const detailDesc = document.getElementById('nodeDetailDesc');
            
            detailTitle.innerText = label;
            detailDesc.innerText = chapterSummaries[id] || "點擊高亮查看詳細章節架構與分析。";
            detailPanel.style.display = 'block';
        }

        function clearHighlight() {
            document.querySelectorAll('.mindmap-node').forEach(node => {
                node.classList.remove('dimmed');
                node.classList.remove('active');
            });
            document.querySelectorAll('.mindmap-link').forEach(link => {
                link.classList.remove('dimmed');
                link.classList.remove('active');
            });
            document.getElementById('nodeDetailPanel').style.display = 'none';
        }

        function zoomMindmap(factor) {
            mmZoom *= factor;
            updateMindmapTransform();
        }

        function resetMindmap() {
            mmZoom = 1.0;
            mmPanX = 0;
            mmPanY = 0;
            updateMindmapTransform();
            clearHighlight();
        }

        function updateMindmapTransform() {
            const group = document.getElementById('mmGroup');
            if (group) {
                group.setAttribute('transform', `translate(${mmPanX}, ${mmPanY}) scale(${mmZoom})`);
            }
        }
    </script>
</body>
</html>
