<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding Agent Security and Evaluation - 說明投影片</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-success: #059669;
            --color-success-bg: #ecfdf5;
            --color-warning: #dc2626;
            --color-warning-bg: #fef2f2;
            --color-accent: #8b5cf6;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
        }

        .dark-mode {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --color-primary: #3b82f6;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header Styles */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            color: white;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .logo-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .nav-tabs {
            display: flex;
            background-color: var(--bg-main);
            padding: 0.25rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            padding: 0.5rem 1.25rem;
            border: none;
            background: none;
            font-family: var(--font-family);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--bg-card);
            color: var(--color-primary);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        select.chapter-select {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.9rem;
            outline: none;
            max-width: 250px;
            cursor: pointer;
        }

        .icon-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--bg-main);
        }

        /* Main Container Styles */
        main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            padding: 2rem;
            justify-content: center;
            align-items: center;
        }

        .slide-container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            background-color: var(--bg-card);
            border-radius: 1rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: all 0.3s;
        }

        .slide-header {
            padding: 1.5rem 2rem 0.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .slide-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            padding: 1rem 2rem 2rem 2rem;
            gap: 2.5rem;
            overflow-y: auto;
        }

        /* Left Column Styles */
        .left-col {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .slide-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        .slide-subtitle {
            font-size: 1.1rem;
            color: var(--color-primary);
            font-weight: 600;
            line-height: 1.4;
        }

        .section-divider {
            height: 1px;
            background-color: var(--border-color);
            width: 100%;
        }

        .bullet-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .bullet-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            list-style: none;
        }

        .bullet-item {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .bullet-num {
            background-color: #eff6ff;
            color: var(--color-primary);
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
            border: 1px solid #dbeafe;
        }

        .detailed-explanation {
            margin-top: 1rem;
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Code Block Styling */
        .code-block-container {
            margin-top: 1rem;
            background-color: #0f172a;
            color: #f8fafc;
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            border: 1px solid #334155;
            position: relative;
        }

        .code-block-container::before {
            content: "PYTHON";
            position: absolute;
            top: 0.25rem;
            right: 0.5rem;
            font-size: 0.7rem;
            color: #475569;
            font-weight: 700;
        }

        /* Right Column Styles */
        .right-col {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
            border: 1px solid var(--border-color);
        }

        .metaphor-card {
            background-color: var(--color-success-bg);
            border-left: 5px solid var(--color-success);
        }

        .metaphor-card.dark {
            background-color: rgba(5, 150, 105, 0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .metaphor-icon {
            color: var(--color-success);
        }

        .metaphor-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .visual-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 280px;
        }

        .visual-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reset-btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            cursor: pointer;
            font-family: var(--font-family);
        }

        .visual-viewport {
            flex: 1;
            border: 1px dashed var(--border-color);
            border-radius: 0.5rem;
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .visual-fallback-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 1rem;
        }

        /* Footer Styles */
        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .footer-shortcuts {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .footer-shortcuts kbd {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            padding: 0.1rem 0.4rem;
            font-size: 0.75rem;
            box-shadow: 0 1px 0 rgba(0,0,0,0.1);
        }

        .footer-pagination {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            padding: 0.5rem 1.25rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: var(--bg-main);
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* SVG 圖表樣式 */
        .zoomable-svg {
            width: 100%;
            height: 100%;
            cursor: grab;
            user-select: none;
        }

        .zoomable-svg:active {
            cursor: grabbing;
        }

        .svg-node {
            cursor: pointer;
            transition: filter 0.2s;
        }

        .svg-node:hover {
            filter: drop-shadow(0px 4px 8px rgba(37, 99, 235, 0.4));
        }

        /* 心智圖特定樣式 */
        .mindmap-node rect, .mindmap-node circle {
            fill: var(--bg-card);
            stroke: var(--color-primary);
            stroke-width: 2;
            rx: 6;
            ry: 6;
        }

        .mindmap-node.center circle {
            fill: var(--color-primary);
            stroke: var(--color-accent);
            stroke-width: 3;
        }

        .mindmap-node.center text {
            fill: white !important;
            font-weight: 800;
        }

        .mindmap-node.chapter rect {
            stroke: var(--color-accent);
        }

        .mindmap-node text {
            font-family: var(--font-family);
            font-size: 11px;
            font-weight: 600;
            fill: var(--text-primary);
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .mindmap-link {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 1.5;
            stroke-dasharray: 4,4;
            transition: stroke 0.2s, stroke-width 0.2s, stroke-dasharray 0.2s;
        }

        .mindmap-link.active {
            stroke: var(--color-accent);
            stroke-width: 3;
            stroke-dasharray: none;
        }

        .mindmap-node:hover rect, .mindmap-node:hover circle {
            fill: #eff6ff;
            stroke: var(--color-accent);
            stroke-width: 3;
        }

        /* 心智圖詳細卡片浮窗 */
        .mindmap-info-card {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 320px;
            background-color: var(--bg-card);
            border: 2px solid var(--color-primary);
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: var(--shadow);
            z-index: 100;
            display: none;
            pointer-events: none;
        }

        .mindmap-info-card h4 {
            font-size: 0.95rem;
            color: var(--color-primary);
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .mindmap-info-card p {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-primary);
        }

        /* 響應式佈局 */
        @media (max-width: 1024px) {
            .slide-content {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
            body {
                overflow: auto;
                height: auto;
            }
            main {
                height: auto;
            }
            .slide-container {
                height: auto;
                min-height: 600px;
            }
        }

        /* 整頁模式特定樣式 */
        .slide-content.fullscreen-layout {
            grid-template-columns: 1fr !important;
            height: 100% !important;
            padding: 1rem !important;
        }
        .slide-content.fullscreen-layout .left-col {
            display: none !important;
        }
        .slide-content.fullscreen-layout .right-col {
            gap: 0 !important;
            height: 100% !important;
        }
        .slide-content.fullscreen-layout .right-col .metaphor-card {
            display: none !important;
        }
        .slide-content.fullscreen-layout .right-col .visual-card {
            height: 100% !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }
        .slide-content.fullscreen-layout .right-col .visual-card .visual-viewport {
            border: none !important;
            background-color: var(--bg-card) !important;
        }

        /* 全螢幕模式額外樣式 */
        .fullscreen-active {
            padding: 0 !important;
            background-color: var(--bg-main) !important;
        }
        .fullscreen-active .slide-container {
            max-width: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            height: 100vh !important;
        }
    </style>
</head>

        // 心智圖節點數據，用於渲染第 2 頁心智圖與懸停提示
        const mindmapNodes = [
            { id: "center", text: "Vibe Coding 安全與評估", x: 600, y: 350, r: 80, type: "center", desc: "Day 4 核心主題：在 Vibe Coding 時代如何重塑信任與建立評估機制。" },
            { id: "ch1", text: "Ch 1: 導論與典範轉移", x: 250, y: 150, type: "chapter", slideIdx: 0, desc: "探討從撰寫代碼到表達意圖的深刻轉移，及 deterministic 信任的失效。" },
            { id: "ch2", text: "Ch 2: 7柱安全防禦架構", x: 250, y: 280, type: "chapter", slideIdx: 15, desc: "介紹 Mandiant 推薦的多層外部「安全包絡」架構基礎。" },
            { id: "ch3", text: "Ch 3: 沙箱與供應鏈安全", x: 250, y: 410, type: "chapter", slideIdx: 30, desc: "解析 Ephemeral Sandbox 動態執行與 Slopsquatting 幻覺套件防禦。" },
            { id: "ch4", text: "Ch 4: 應用邏輯與 MCP 安全", x: 250, y: 550, type: "chapter", slideIdx: 45, desc: "解決前端 API 密鑰洩漏漏洞與 MCP 偽造工具攻擊威脅。" },
            { id: "ch5", text: "Ch 5: 身分信賴與高權限動作", x: 950, y: 150, type: "chapter", slideIdx: 60, desc: "以 SPIFFE ID、JIT downscoping 與 Vibe Diff 阻斷權限濫用。" },
            { id: "ch6", text: "Ch 6: 主動防禦三聯軍", x: 950, y: 280, type: "chapter", slideIdx: 75, desc: "透過 Red-teaming 注入 Adversarial Vibes，與 Blue/Green 聯防自我修復。" },
            { id: "ch7", text: "Ch 7: 心智觀測與軌跡審計", x: 950, y: 410, type: "chapter", slideIdx: 90, desc: "以 Vibe Trajectory 與狀態斷路器防範 Denial of Wallet 錢包攻擊。" },
            { id: "ch8", text: "Ch 8: 意圖驅動評估體系", x: 950, y: 550, type: "chapter", slideIdx: 105, desc: "剖析評估的 7 個指標維度與 8 大主流評估方法。" },
            { id: "ch9", text: "Ch 9: 實務評估技巧與程式", x: 600, y: 600, type: "chapter", slideIdx: 120, desc: "深度解讀 4 大 Python 程式碼片段與多模態截圖打分實作。" }
        ];

        // 連接關係 (心智圖的相互關係連線)
        const mindmapLinks = [
            { source: "center", target: "ch1" },
            { source: "center", target: "ch2" },
            { source: "center", target: "ch3" },
            { source: "center", target: "ch4" },
            { source: "center", target: "ch5" },
            { source: "center", target: "ch6" },
            { source: "center", target: "ch7" },
            { source: "center", target: "ch8" },
            { source: "center", target: "ch9" },
            // 節點間的互聯網狀關係
            { source: "ch2", target: "ch5", label: "身分與安全基礎" },
            { source: "ch7", target: "ch8", label: "觀測是評估前提" },
            { source: "ch3", target: "ch6", label: "沙箱與修復隔離" },
            { source: "ch4", target: "ch7", label: "MCP 閘道審計" },
            { source: "ch6", target: "ch9", label: "三聯軍程式實作" }
        ];

        // 初始化
        window.onload = function() {
            renderSlide();
            setupKeyboardShortcuts();
        };

        function getSlides() {
            return currentTab === 'overview' ? overviewSlides : detailedSlides;
        }

        function getIndex() {
            return currentTab === 'overview' ? overviewIndex : detailIndex;
        }

        function setIndex(val) {
            if (currentTab === 'overview') {
                overviewIndex = val;
            } else {
                detailIndex = val;
            }
        }

        // 渲染投影片
        function renderSlide() {
            const slides = getSlides();
            const idx = getIndex();
            const slide = slides[idx];

            // 填寫基本資料
            document.getElementById('slide-chapter-tag').innerText = slide.chapter;
            document.getElementById('slide-pdf-page').innerText = `PDF 第 ${slide.pdfPage} 頁`;
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-subtitle').innerText = slide.subtitle;
            document.getElementById('slide-takeaway').innerText = slide.takeaway;

            // 渲染論證細節
            const bulletContainer = document.getElementById('slide-bullets');
            bulletContainer.innerHTML = '';
            slide.details.forEach((bullet, index) => {
                const li = document.createElement('li');
                li.className = 'bullet-item';
                li.innerHTML = `<div class="bullet-num">${index + 1}</div><div>${bullet}</div>`;
                bulletContainer.appendChild(li);
            });

            // 處理代碼區塊
            const codeContainer = document.getElementById('slide-code-container');
            if (slide.code && slide.code.trim() !== '') {
                codeContainer.style.display = 'block';
                document.getElementById('slide-code').innerText = slide.code;
            } else {
                codeContainer.style.display = 'none';
            }

            // 類比卡片
            document.getElementById('slide-metaphor-title').innerText = `概念類比：${slide.metaphorTitle}`;
            document.getElementById('slide-metaphor-text').innerText = slide.metaphor;

            // 渲染分頁
            document.getElementById('footer-pagination').innerText = `投影片 ${idx + 1} / ${slides.length}`;
            document.getElementById('btn-prev').disabled = idx === 0;
            document.getElementById('btn-next').disabled = idx === slides.length - 1;

            // 處理整頁模式 (全書章節核心互聯網狀心智圖)
            const contentArea = document.querySelector('.slide-content');
            if (currentTab === 'overview' && idx === 1) {
                contentArea.classList.add('fullscreen-layout');
            } else {
                contentArea.classList.remove('fullscreen-layout');
            }

            // 更新下拉選單
            updateDropdownSelection(slide.chapter);

            // 渲染右側圖表/心智圖
            renderRightVisual(slide);
        }

        // 根據投影片章節同步下拉選單
        function updateDropdownSelection(chapterName) {
            if (!chapterName) return;
            const select = document.getElementById('chapter-select');
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].text.includes(chapterName) || chapterName.includes(select.options[i].text)) {
                    select.selectedIndex = i;
                    break;
                }
            }
        }

        // 渲染右側 SVG 視窗
        function renderRightVisual(slide) {
            const viewport = document.getElementById('visual-viewport');
            viewport.innerHTML = '';
            resetSvgTransformValues();

            // 如果是大綱的第二張投影片，繪製「核心網狀心智圖」
            if (currentTab === 'overview' && getIndex() === 1) {
                document.getElementById('slide-visual-title').innerText = "全書 9 章節核心互聯網狀心智圖 (滾輪可縮放，可拖曳，點擊跳轉)";
                drawMindmap(viewport);
            } else {
                document.getElementById('slide-visual-title').innerText = "本章邏輯流程圖 (滾輪可縮放，可拖曳)";
                drawChapterFlowchart(viewport, slide.chapter);
            }
        }

        // 繪製心智圖 (SVG)
        function drawMindmap(container) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 1200 700");
            svg.setAttribute("class", "zoomable-svg");
            svg.setAttribute("id", "interactive-svg");

            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("id", "svg-group");
            svg.appendChild(g);

            // 1. 繪製連線
            mindmapLinks.forEach(link => {
                const sourceNode = mindmapNodes.find(n => n.id === link.source);
                const targetNode = mindmapNodes.find(n => n.id === link.target);
                if (sourceNode && targetNode) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    // 使用二次貝茲曲線使線條柔和
                    const dx = targetNode.x - sourceNode.x;
                    const dy = targetNode.y - sourceNode.y;
                    const cx = sourceNode.x + dx / 2;
                    const cy = sourceNode.y + dy / 2 + (link.label ? 40 : 0);
                    
                    line.setAttribute("d", `M ${sourceNode.x} ${sourceNode.y} Q ${cx} ${cy} ${targetNode.x} ${targetNode.y}`);
                    line.setAttribute("class", "mindmap-link");
                    line.setAttribute("id", `link-${link.source}-${link.target}`);
                    g.appendChild(line);

                    if (link.label) {
                        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        text.setAttribute("x", cx);
                        text.setAttribute("y", cy - 10);
                        text.setAttribute("fill", "var(--text-secondary)");
                        text.setAttribute("font-size", "9px");
                        text.setAttribute("text-anchor", "middle");
                        text.textContent = link.label;
                        g.appendChild(text);
                    }
                }
            });

            // 2. 繪製節點
            mindmapNodes.forEach(node => {
                const nodeG = document.createElementNS("http://www.w3.org/2000/svg", "g");
                nodeG.setAttribute("class", `svg-node mindmap-node ${node.type}`);
                nodeG.setAttribute("transform", `translate(${node.x}, ${node.y})`);

                if (node.type === 'center') {
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute("r", node.r);
                    nodeG.appendChild(circle);

                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("y", 0);
                    text.textContent = node.text;
                    nodeG.appendChild(text);
                } else {
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    const width = 160;
                    const height = 40;
                    rect.setAttribute("x", -width/2);
                    rect.setAttribute("y", -height/2);
                    rect.setAttribute("width", width);
                    rect.setAttribute("height", height);
                    nodeG.appendChild(rect);

                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("y", 0);
                    text.textContent = node.text;
                    nodeG.appendChild(text);
                }

                // 綁定心智圖滑鼠互動
                nodeG.onmouseenter = function(e) {
                    highlightMindmapConnections(node.id);
                    showMindmapInfoCard(node, e);
                };
                nodeG.onmouseleave = function() {
                    resetMindmapHighlights();
                    hideMindmapInfoCard();
                };
                nodeG.onclick = function() {
                    if (node.type !== 'center') {
                        switchTab('detail');
                        detailIndex = node.slideIdx;
                        renderSlide();
                    }
                };

                g.appendChild(nodeG);
            });

            container.appendChild(svg);
            setupSvgPanZoom(svg, g);
        }

        // 高亮心智圖連結
        function highlightMindmapConnections(nodeId) {
            mindmapLinks.forEach(link => {
                if (link.source === nodeId || link.target === nodeId) {
                    const line = document.getElementById(`link-${link.source}-${link.target}`);
                    if (line) line.classList.add('active');
                }
            });
        }

        // 重置心智圖高亮
        function resetMindmapHighlights() {
            const lines = document.querySelectorAll('.mindmap-link');
            lines.forEach(line => line.classList.remove('active'));
        }

        // 顯示心智圖節點資訊卡
        function showMindmapInfoCard(node, event) {
            const card = document.getElementById('mindmap-info-card');
            document.getElementById('mindmap-info-title').innerText = node.text;
            document.getElementById('mindmap-info-desc').innerText = node.desc;
            card.style.display = 'block';
        }

        function hideMindmapInfoCard() {
            document.getElementById('mindmap-info-card').style.display = 'none';
        }

        // 繪製章節流程圖 (SVG)
        function drawChapterFlowchart(container, chapterName) {
            if (!chapterName) chapterName = "";
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 600 400");
            svg.setAttribute("class", "zoomable-svg");
            svg.setAttribute("id", "interactive-svg");

            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("id", "svg-group");
            svg.appendChild(g);

            // 依據不同章節，動態產生簡單流程圖節點與箭頭
            // 這裡實作一個美觀的流程圖範本
            let steps = ["步驟 1：意圖輸入", "步驟 2：安全閘道審查", "步驟 3：沙箱安全執行", "步驟 4：行為觀測與修復"];
            if (chapterName.includes("第一章")) {
                steps = ["表達意圖 (Fuzzy Intent)", "AI 生成引擎 (Coding Engine)", "安全包絡限制 (Harness)", "Effective Trust 生產發布"];
            } else if (chapterName.includes("第二章")) {
                steps = ["Infrastructure (硬隔離)", "Data/Model (資料/指令安全)", "IAM/App (授權防火牆)", "Observability/Governance (審計治理)"];
            } else if (chapterName.includes("第三章")) {
                steps = ["Agent 提交代碼", "SBOM 依賴包比對", "gVisor 隔離執行", "狀態徹底重置"];
            } else if (chapterName.includes("第四章")) {
                steps = ["IDE Advisory Linting", "CI/CD Pipeline SAST/SCA", "MCP Contextual Auth", "A2A Gateways"];
            } else if (chapterName.includes("第五章")) {
                steps = ["SPIFFE ID 身分註冊", "JIT Token 最小權限分配", "高風險行為偵測", "Vibe Diff / 硬體 MFA"];
            } else if (chapterName.includes("第六章")) {
                steps = ["Red Team (攻擊注入)", "Blue Team (AgBOM 監控)", "Green Team (有狀態隔離)", "Auto-Refactoring (自我修復)"];
            } else if (chapterName.includes("第七章")) {
                steps = ["OTEL Trace 追蹤", "Vibe Trajectory 心智分析", "Agent Trust Score 計分", "Stateful Circuit Breaker"];
            } else if (chapterName.includes("第八章")) {
                steps = ["Underspecification Gap", "7維度評估體系", "8方法混合評估線", "Kaggle SAE 認知校準"];
            } else if (chapterName.includes("第九章")) {
                steps = ["意圖 Criteria 自動生成", "多模態截圖外觀打分", "Cloud Trace 收斂運算", "KMeans 聚類失敗模式"];
            }

            // 繪製流程圖背景線與箭頭
            for (let i = 0; i < steps.length - 1; i++) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", 300);
                line.setAttribute("y1", 60 + i * 90 + 40);
                line.setAttribute("x2", 300);
                line.setAttribute("y2", 60 + (i + 1) * 90);
                line.setAttribute("stroke", "var(--color-primary)");
                line.setAttribute("stroke-width", "2");
                line.setAttribute("marker-end", "url(#arrow)");
                g.appendChild(line);
            }

            // 繪製 marker
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
            marker.setAttribute("id", "arrow");
            marker.setAttribute("viewBox", "0 0 10 10");
            marker.setAttribute("refX", "6");
            marker.setAttribute("refY", "5");
            marker.setAttribute("markerWidth", "6");
            marker.setAttribute("markerHeight", "6");
            marker.setAttribute("orient", "auto-start-reverse");
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
            path.setAttribute("fill", "var(--color-primary)");
            marker.appendChild(path);
            defs.appendChild(marker);
            svg.appendChild(defs);

            // 繪製步驟節點
            steps.forEach((step, i) => {
                const nodeG = document.createElementNS("http://www.w3.org/2000/svg", "g");
                nodeG.setAttribute("transform", `translate(150, ${60 + i * 90})`);

                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("width", "300");
                rect.setAttribute("height", "40");
                rect.setAttribute("rx", "8");
                rect.setAttribute("ry", "8");
                rect.setAttribute("fill", "var(--bg-card)");
                rect.setAttribute("stroke", "var(--border-color)");
                rect.setAttribute("stroke-width", "2");
                nodeG.appendChild(rect);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", "150");
                text.setAttribute("y", "20");
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("dominant-baseline", "middle");
                text.setAttribute("font-family", "var(--font-family)");
                text.setAttribute("font-size", "12px");
                text.setAttribute("font-weight", "bold");
                text.setAttribute("fill", "var(--text-primary)");
                text.textContent = step;
                nodeG.appendChild(text);

                g.appendChild(nodeG);
            });

            container.appendChild(svg);
            setupSvgPanZoom(svg, g);
        }

        // 綁定 SVG 拖曳與滾輪縮放 (Pan & Zoom)
        function setupSvgPanZoom(svg, g) {
            svg.addEventListener('mousedown', function(e) {
                isDragging = true;
                startPan = { x: e.clientX - svgTransform.x, y: e.clientY - svgTransform.y };
            });

            window.addEventListener('mouseup', function() {
                isDragging = false;
            });

            svg.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                svgTransform.x = e.clientX - startPan.x;
                svgTransform.y = e.clientY - startPan.y;
                applySvgTransform(g);
            });

            svg.addEventListener('wheel', function(e) {
                e.preventDefault();
                const zoomFactor = 1.1;
                if (e.deltaY < 0) {
                    svgTransform.scale *= zoomFactor;
                } else {
                    svgTransform.scale /= zoomFactor;
                }
                // 限制縮放範圍
                svgTransform.scale = Math.max(0.3, Math.min(5, svgTransform.scale));
                applySvgTransform(g);
            });
        }

        function applySvgTransform(g) {
            g.setAttribute("transform", `translate(${svgTransform.x}, ${svgTransform.y}) scale(${svgTransform.scale})`);
        }

        function resetSvgTransformValues() {
            svgTransform = { x: 0, y: 0, scale: 1 };
        }

        function resetSvgTransform() {
            resetSvgTransformValues();
            const g = document.getElementById('svg-group');
            if (g) applySvgTransform(g);
        }

        // 切換大綱與詳細頁籤
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-overview').classList.toggle('active', tab === 'overview');
            document.getElementById('tab-detail').classList.toggle('active', tab === 'detail');
            renderSlide();
        }

        // 上一頁、下一頁
        function prevSlide() {
            const idx = getIndex();
            if (idx > 0) {
                setIndex(idx - 1);
                renderSlide();
            }
        }

        function nextSlide() {
            const idx = getIndex();
            const slides = getSlides();
            if (idx < slides.length - 1) {
                setIndex(idx + 1);
                renderSlide();
            }
        }

        // 以章節下拉選單跳轉
        function jumpToChapter() {
            const select = document.getElementById('chapter-select');
            const val = select.value;
            if (val === 'all') return;
            
            // 跳轉至詳細說明中該章節的第一張投影片
            const chapterIndex = parseInt(val);
            const chapterName = select.options[select.selectedIndex].text;
            
            switchTab('detail');
            const targetIdx = detailedSlides.findIndex(s => s.chapter.includes(chapterName));
            if (targetIdx !== -1) {
                detailIndex = targetIdx;
                renderSlide();
            }
        }

        // 切換深色模式
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelectorAll('.metaphor-card').forEach(c => {
                c.classList.toggle('dark', isDark);
            });
            renderRightVisual(getSlides()[getIndex()]);
        }

        // 全螢幕模式
        function toggleFullscreen() {
            const main = document.getElementById('main-content');
            main.classList.toggle('fullscreen-active');
            
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`全螢幕切換失敗: ${err.message}`);
                });
            }
        }

        // 鍵盤快捷鍵綁定
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                if (event.key === 'ArrowRight' || event.key === ' ') {
                    event.preventDefault();
                    nextSlide();
                } else if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    prevSlide();
                } else if (event.key.toLowerCase() === 'm') {
                    document.getElementById('chapter-select').focus();
                } else if (event.key.toLowerCase() === 'f') {
                    toggleFullscreen();
                }
            });
        }
    </script>
</body>
</html>
