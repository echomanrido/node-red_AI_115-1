硬幣就能買水，機器不需要你註冊會員、輸入身分證字號或填寫電子信箱』。", "layout": "左側為 Host，中間為自動投幣孔與閃電符號，右側為回傳的工具響應，強調 Permissionless 特性。"}, {"id": "144", "chapter": "第十章", "pdf_page": "30", "title": "揭秘 HTTP 402 付款機制", "takeaway": "當請求未付款時，A2A 伺服器回傳 HTTP 402 狀態碼與機器可讀發票！", "details": ["Server 端攔截未授權的 HTTP 請求，響應 `HTTP 402 Payment Required`。", "響應體中綁定標準的加密發票 (Invoice)，載明金額與付款通道。"], "metaphor": "👉 就像是『你開車上高速公路沒裝 E-Tag，收費站柵欄會擋下 (HTTP 402)，並在屏幕上顯示應付金額 (Invoice)』。", "layout": "流程圖。展示 Request -> 402 Intercept -> Parse Invoice -> Auto Pay -> Retry -> 200 OK 消息迴圈。"}, {"id": "145", "chapter": "第十章", "pdf_page": "30", "title": "解讀 L402 / x402 支付標準", "takeaway": "L402/x402 標準結合 HTTP 與加密貨幣/閃電網絡，實現即付即用的微交易！", "details": ["它是一種將 API 收費與加密憑證結合的網際網絡新標準。", "智能體錢包在背後異步執行付款，獲得一串代表付款證明的 cryptographic token。"], "metaphor": "👉 就像是『你去遊樂園玩，買了一張電子入園券 (L402 Token)，每玩一個遊樂設施 (呼叫 API)，讀卡機刷一下就扣一次點數』。", "layout": "左側展示 L402 協議結構圖，中間為加密支付證書，右側為驗證通過的數據服務器。"}, {"id": "146", "chapter": "第十章", "pdf_page": "31", "title": "自主付款與 Proof-of-Payment", "takeaway": "調用端智能體攜帶加密付款證明重新發起請求，Server 驗證通過即放行！", "details": ["Client 獲取 token 後，在 Retry 請求的 Authorization Header 中附加該證書。", "A2A 伺服器利用本地加密演算法驗證簽章，秒級完成交易驗證，提供無感體驗。"], "metaphor": "👉 就像是『你去遊樂園坐雲霄飛車，售票口買完票拿個蓋章 (Proof-of-Payment)，排隊入口的驗票員摸一下印記就讓你進去』。", "layout": "代碼對比。上方展示 Retry 請求的 Header 配置 api-token='PoP_...'，下方展示 Server 端的加密認證代碼塊。"}, {"id": "147", "chapter": "第十章", "pdf_page": "31", "title": "第十章邏輯關係回顧", "takeaway": "AaaS 商業模式與 M2M 微支付，為分散式智能體注入了生生不息的金融電力！", "details": ["變現需求 -> GCP Marketplace 混合計費 (Flat + Usage) 與 AaaS 四大生命週期。", "去中心化支付 -> HTTP 402 與 L402/x402 標準 -> 機器自主支付 Proof-of-Payment 連線。"], "metaphor": "👉 就像是『不僅造好了車子、修好了路，還在路口裝設了全自動扣款的收費站，讓整個商業網絡運轉起來』。", "layout": "全螢幕流程圖，展示第十章關係：智能體上線 -> 判定消費場景 -> 企業級 Marketplace -> 去中心化 HTTP 402 -> 自主微支付 -> 商業閉環。"}, {"id": "148", "chapter": "第十一章", "pdf_page": "32", "title": "人機溝通的 JSON 鴻溝", "takeaway": "智能體返回的 raw JSON 阻礙了人類的直觀理解，必須以視覺化介面打破鴻溝！", "details": ["當你向同事詢問銷售業績時，他不會唸一串資料庫欄位給你，而是在白板上畫圖。", "現有智能體習慣返回冗長難懂的 JSON 數據包，迫使人類在程式碼中進行二次轉換。"], "metaphor": "👉 就像是『你去餐廳吃飯，廚師不給你做好的牛排，而是給你一盤生牛肉、鹽巴和油 (Raw JSON) 叫你自己煎』。", "layout": "左側為密密麻麻的 JSON 數據（標有人類看不懂），右側為在白板上用藍色粉筆畫出的精美折線圖，形成強烈對比。"}, {"id": "149", "chapter": "第十一章", "pdf_page": "32", "title": "什麼是 Generative UI", "takeaway": "Generative UI 是大模型在運行期 (Runtime) 根據用戶意圖動態合成介面！", "details": ["擺脫開發者為每種狀態硬編碼前端介面的傳統限制。", "系統根據 Query (如：比較 Q4 業績) 動態組裝卡片、圖表、篩選器與控制按鈕。"], "metaphor": "👉 就像是『哈利波特裡的萬應室』，你進去時需要什麼 (意圖)，房間就會動態變出沙發、書桌或武器，不需要事先裝潢。", "layout": "左側為用戶輸入意圖輸入框，中間為 LLM UI Generator 大腦，右側動態彈出一個包含圓餅圖與導航按鈕的卡片。"}, {"id": "150", "chapter": "第十一章", "pdf_page": "32", "title": "Generative UI 的安全紅線", "takeaway": "在客戶端直接執行大模型產生的任意代碼，會帶來災難性的安全威脅！", "details": ["LLM 生成的 Raw HTML/JS 代碼可能夾帶惡意腳本，引發 XSS (跨站腳本攻擊)。", "任意代碼執行還會造成客戶端 Cookie 洩漏、惡意重定向與不可控的系統副作用。"], "metaphor": "👉 就像是『你請了一位不認識的畫家來家裡畫壁畫，結果他偷偷在牆角裝了一個監視器 (惡意代碼注入) 偷看你生活』。", "layout": "左側為運行的代碼流，中央為紅色骷髏頭安全警示卡片，列出三項安全威脅 (Code Injection, XSS, Session Hijack)。"}, {"id": "151", "chapter": "第十一章", "pdf_page": "33", "title": "A2UI：安全宣告式 UI 標準", "takeaway": "A2UI 是一個框架無關的 UI 意圖宣告標準，兼顧動態性與絕對安全性！", "details": ["Google 發布的開源標準，讓智能體以宣告式格式 (Declarative JSON) 描述介面意圖。", "不發送可執行的代碼，不發送預渲染的靜態像素，只發送 UI 元件組裝邏輯。"], "metaphor": "👉 就像是『樂譜 (A2UI) 規定了音符和旋律，但它本身不能發出聲音 (無代碼風險)，必須由樂器彈奏出來』。", "layout": "中央展示一份 A2UI 樂譜 JSON，上方為安全盾牌，下方有 React, Flutter, SwiftUI 三種渲染器對照圖。"}, {"id": "152", "chapter": "第十一章", "pdf_page": "33", "title": "解讀『樂譜 (Sheet Music)』類比", "takeaway": "同一份 A2UI 樂譜，由不同設備的 Native 渲染器演奏出最完美的原生音色！", "details": ["智能體只需撰寫一次 UI 宣告意圖，無需關心用戶是在用手機、網頁還是手錶。", "客戶端的渲染器會調用本地的 Native 設計系統元件，確保 UI 符合該設備的排版美感。"], "metaphor": "👉 就像是『貝多芬的命運交響曲樂譜 (A2UI)，你可以用鋼琴彈、可以用交響樂團演，也可以用電子琴放，旋律相同但音色原生』。", "layout": "左側為統一的 A2UI 樂譜，中間輻射出三條線，右側分別展示 Web (React)、Mobile (Flutter) 與 Wearable 的原生渲染效果。"}, {"id": "153", "chapter": "第十一章", "pdf_page": "33", "title": "A2UI 的關注點分離 (SoC)", "takeaway": "分離 UI 佈局決定權與具體渲染實作，保障系統架構的高度解耦！", "details": ["智能體只決定『要放什麼元件、元件如何排列』(SoC 的意圖層)。", "客戶端渲染器只負責『如何安全、美觀地將元件繪製到屏幕上』(SoC 的渲染層)。"], "metaphor": "👉 就像是『建築師只負責畫房屋結構藍圖 (智能體)，而施工隊則負責去買磚頭並動手把房子蓋出來 (渲染器)』。", "layout": "雙色分欄對比。左側為 Intent Layer（智能體控制，高亮 JSON），右側為 Render Layer（客戶端控制，高亮 Native UI）。"}, {"id": "154", "chapter": "第十一章", "pdf_page": "33", "title": "積木式的 UI 組裝 (Lego Metaphor)", "takeaway": "A2UI 的元件就像是樂高積木，通過組合信任的基礎元件構建出萬千界面！", "details": ["客戶端本地只內置並信任一組經過安全審計的基礎元件庫 (如 Button, Card)。", "智能體發送的 JSON 只是告訴渲染器：『請把 Card 放最上面，Card 裡面放 Text，下面接個 Button』。"], "metaphor": "👉 就像是『樂高積木』，不論你拼成城堡還是飛機，所用的每一顆積木顆粒 (基礎元件) 都是樂高工廠生產的安全塑料，沒有危險。", "layout": "左欄為各種樂高積木單體（標示 Basic Catalog），右欄為組裝好的精美控制台卡片，標明無代碼執行安全。"}, {"id": "155", "chapter": "第十一章", "pdf_page": "33", "title": "第十一章邏輯關係回顧", "takeaway": "A2UI 協定以宣告式樂譜架構，完美破解了 Generative UI 的安全與適配瓶頸！", "details": ["JSON 溝通鴻溝 -> Generative UI 的動態價值與安全 XSS 紅線。", "A2UI 標準推出 -> 樂譜 (Sheet Music) 類比 -> SoC 關注點分離與積木式安全渲染。"], "metaphor": "👉 就像是『在舞台與觀眾席之間加裝了一面安全的防彈玻璃展示窗，觀眾能看到精彩表演卻不會受到傷害』。", "layout": "全螢幕流程圖，展示第十一章關係：JSON 鴻溝 -> 引入 Generative UI -> 安全漏洞攔截 -> A2UI 宣告式樂譜 -> 跨平台 Native 渲染。"}, {"id": "156", "chapter": "第十二章", "pdf_page": "34", "title": "A2UI 基礎元件目錄 (v0.9)", "takeaway": "A2UI 官方內置 5 大類別、18 種開箱即用的基礎 UI 元件目錄！", "details": ["包含 Layout (佈局)、Display (展示)、Containers (容器)、Media (媒體) 與 Interactive (互動)。", "Vibe Coder 能利用這 18 種積木快速拼裝出高質感的數據儀表板與輸入表單。"], "metaphor": "👉 就像是『標準樂高入門套裝裡附贈的 18 種最常用積木零件』，能滿足你 90% 的拼裝需求。", "layout": "五宮格卡片，展示 Layout, Display, Containers, Media, Interactive 分類，點擊分類卡片可查看對應的 18 種元件明細。"}, {"id": "157", "chapter": "第十二章", "pdf_page": "34", "title": "自訂元件對應 (Bring Your Own)", "takeaway": "企業生產環境應定義專屬 Design System，並將其對應到 A2UI 類型中！", "details": ["v0.9 版本將元件庫重命名為 basic，意在引導開發者 Bring Your Own Catalog。", "智能體的 JSON 程式碼保持不變，只需在客戶端修改渲染器對應關係，即可換上企業品牌皮膚。"], "metaphor": "👉 就像是『麥當勞的點餐機 (渲染器) 可以換上新年喜慶皮膚，但背後的點餐品項與結帳邏輯 (智能體) 完全不用改』。", "layout": "左側為 A2UI Basic JSON，中間為企業 Design System Mapper，右側為渲染出帶有企業專屬品牌色與字體的 UI。"}, {"id": "158", "chapter": "第十二章", "pdf_page": "35", "title": "透視 A2UI JSON 訊息結構", "takeaway": "A2UI 採用扁平的 Adjacency List (鄰接表) 結構，便於增量生成與局部更新！", "details": ["元件不採用深層嵌套的樹狀 JSON，而是以 flat array 儲存，每個元件有唯一 ID。", "元件通過 children 陣列引用其他元件的 ID，這讓 LLM 能以 streaming 方式輕鬆生成。"], "metaphor": "👉 就像是『通訊錄』，每個人只有一行記錄和一個 ID (扁平化)，家庭關係通過在記錄裡寫下子女的 ID 來建立，簡單明瞭。", "layout": "左側展示嵌套的複雜 JSON (紅叉)，右側展示 A2UI 扁平鄰接表的 JSON 結構 (綠勾)，並標出 id 與 children 的對應線。"}, {"id": "159", "chapter": "第十二章", "pdf_page": "35", "title": "A2UI 消息範例詳解", "takeaway": "以 v0.9 規格為例，看一個完整的 Column 佈局與 Button 互動 JSON 實例！", "details": ["定義 version 為 v0.9，updateComponents 指定 surfaceId 為 main。", "包含 root (Column) 元件，引用 title, summary, export 元件，Button 綁定 export_csv 事件。"], "metaphor": "👉 就像是『一張家具組裝說明書：客廳放置沙發和茶几，茶几上放一個杯子，杯子點擊會發送喝水信號』。", "layout": "全螢幕代碼塊。展示 Snippet 4 的 JSON 內容，並以不同顏色語法高亮 ID 與 Component 類型。"}, {"id": "160", "chapter": "第十二章", "pdf_page": "35", "title": "產出 A2UI 的兩大開發模式", "takeaway": "根據佈局決定權歸屬，靈活選擇 LLM 動態生成模式或 Tool 固定範本模式！", "details": ["模式 1 - LLM-generates-UI (意圖驅動)：大模型完全掌控佈局，依據情境隨意調整。", "模式 2 - Tool-as-template (輸入驅動)：工具回傳固定 UI 與資料綁定，零 Token 消耗。"], "metaphor": "👉 意圖驅動像是『你請私人廚師，他看你今天胃口動態配菜 (LLM)』；輸入驅動像是『去定食餐廳，點 1 號餐就永遠送來排骨飯配三樣小菜 (Tool)』。", "layout": "左右分欄對比。左欄標示 Default (LLM Layout)，右欄標示 Specialization (Tool-as-template)，下方列出 Token 消耗與變更彈性對比。"}, {"id": "161", "chapter": "第十二章", "pdf_page": "36", "title": "模式 1：LLM-generates-UI 實作", "takeaway": "大模型在運行期擁有佈局控制權，根據對話上下文靈活編排元件樹！", "details": ["適用於探索性任務 (如：『幫我畫個對比圖，下面加個分析說明，再放個導出按鈕』)。", "利用 a2ui-agent-sdk 自動將 Catalog Schema 注入到模型的 system prompt 中。"], "metaphor": "👉 就像是『沙畫藝術家』，根據觀眾的呼聲實時用沙子畫出不同的圖案，隨機應變能力極強。", "layout": "左側為 system prompt 模板，右側展示模型動態輸出多種完全不同 layout 結構的 JSON 封包過程。"}, {"id": "162", "chapter": "第十二章", "pdf_page": "36", "title": "模式 2：Tool-as-template 實作", "takeaway": "將工具作為伺服器端範本，回傳固定的 A2UI 結構與動態數據綁定！", "details": ["適用於格式固定的數據展示 (如：每個地區的銷售 Dashboard 結構都一模一樣)。", "工具內部以 Python 構建 JSON 結構，並使用 path 語法 (非 f-string) 進行數據綁定。"], "metaphor": "👉 就像是『印好空白表格的複寫紙 (範本)』，結構已經固定，你只需要在姓名、地址欄位填入具體文字 (資料綁定) 即可。", "layout": "左側展示 Python get_sales_dashboard 代碼，高亮顯示 path 指向，右側為資料綁定後的渲染圖卡。"}, {"id": "163", "chapter": "第十二章", "pdf_page": "36", "title": "實作 Tool-as-template Python 代碼", "takeaway": "使用 Python 定義 get_sales_dashboard 函數，回傳帶有 path 的 A2UI 結構！", "details": ["抓取資料庫數據，返回含有 version, updateComponents 與扁平 components 的字典。", "元件中的 text 屬性配置為 {'path': '/title'}，而非將變數硬編碼塞入字串。"], "metaphor": "👉 就像是『定義了一個帶有預留位置的 HTML 模板，數據更新時只需更新預留位置，不用重新發送整個 HTML 結構』。", "layout": "全螢幕代碼塊，展示 Snippet 5 中 Python 函數定義與 A2UI JSON 返回結構，高亮 path 欄位。"}, {"id": "164", "chapter": "第十二章", "pdf_page": "37", "title": "理解 updateDataModel 資料流", "takeaway": "透過 updateDataModel 獨立更新數據，實現 UI 結構與資料內容的完全解耦！", "details": ["當底層數據更新時，伺服器只發送輕量級的 updateDataModel 消息更新 path 對應值。", "客戶端渲染器在本地動態重繪數據，模型無需重新生成與傳輸龐大的 UI 結構，節省流量。"], "metaphor": "👉 就像是『電視螢幕的結構已經買回家了 (UI 結構)，電視台只需要源源不絕發送畫面像素信號 (資料流)，不用每次都送你一台新電視』。", "layout": "左側為 A2uiPartConverter，中間流出細微的 updateDataModel 數據包，右側為本地 UI 根據新數據自動跳動的動畫。"}, {"id": "165", "chapter": "第十二章", "pdf_page": "37", "title": "查詢到輸出映射矩陣 (Query to Output)", "takeaway": "根據用戶 Query 的意圖類型，自動將輸出映射為文字、LLM UI 或工具 UI！", "details": ["簡單問答 (如平均數) -> 回傳純文字；探索性對比 -> 由 LLM 動態生成 UI 結構。", "查看固定看板 -> 由 Tool 範本直接返回；API 對接 -> 返回純 JSON 數據格式。"], "metaphor": "👉 就像是『客服分流：簡單問題用自動語意回答 (純文字) -> 複雜業務引導到櫃檯辦理 (動態 UI)』。", "layout": "Table 2 視覺化。以精美表格展示 Query 與 Return 的四種對應關係，高亮顯示 LLM 與 Tool 渲染的邊界。"}, {"id": "166", "chapter": "第十二章", "pdf_page": "38", "title": "線性對話的局限與 Canvas 革命", "takeaway": "擺脫線性滾動對話的限制，引入 Canvas 持久空間實現人機協同編輯！", "details": ["傳統 Chat 界面是單向線性的，舊消息會被滾動沖走，難以對局部內容進行微調。", "Canvas (畫布) 提供一個持續存在的右側工作區，智能體與人類均能在此直接編輯。"], "metaphor": "👉 就像是『從發簡訊溝通 (線性 Chat)，升級為兩個人一起站在一塊白板前拿著筆塗改 (Canvas 協同)』。", "layout": "左欄為窄長的 Chat 線性滾動流，右欄為寬敞的純白卡片工作區 (Canvas)，以箭頭展示雙向編輯權限。"}, {"id": "167", "chapter": "第十二章", "pdf_page": "39", "title": "Canvas + A2UI 的互動時序", "takeaway": "用戶操作 Canvas UI，智能體實時捕獲行為反饋並動態調整後續決策！", "details": ["用戶在右側 Canvas 的 ChoicePicker 中選擇『二月』。", "網頁客戶端捕捉此點擊事件，發送回饋給智能體，智能體理解上下文並更新資料模型。"], "metaphor": "👉 就像是『你在開車時轉動方向盤 (用戶操作)，車載導航立刻根據你的新位置重新規劃路線 (智能體響應)』。", "layout": "時序圖 (Figure 7)。展示 User, Agent, Canvas 的三線時序交互流：發送指令 -> 繪製 UI -> 點擊下拉框 -> 自動局部更新。"}, {"id": "168", "chapter": "第十二章", "pdf_page": "40", "title": "A2UI 開發的最佳實務", "takeaway": "使用 a2ui-agent-sdk 的 SchemaManager 自動編排含有 Schema 的 System Prompt！", "details": ["手動拼接 Catalog JSON-Schema 到 prompt 中極易出錯且耗時。", "SchemaManager 能自動加載 Catalog、編譯驗證器並生成包含完整 example 的系統指令。"], "metaphor": "👉 就像是『自動裝配流水線』，你只需把零件丟進去，機器自動幫你貼好標籤、包裝完整並裝箱出貨，不用手工打包。", "layout": "左側為 a2ui-agent-sdk 的導入 Python 代碼，右側為生成的完整 System Prompt 預覽卡片。"}, {"id": "169", "chapter": "第十二章", "pdf_page": "40", "title": "實作 A2uiSchemaManager Python 代碼", "takeaway": "載入 BasicCatalog 並實例化 SchemaManager，僅需數行 Python 代碼！", "details": ["導入 A2uiSchemaManager、BasicCatalog 與 VERSION_0_9 常數。", "實例化 schema_manager，並調用 get_selected_catalog() 獲取驗證配置。"], "metaphor": "👉 就像是『在寫代碼前，先加載一個標準的翻譯字典 (SchemaManager)，確保後面的單字都不會拼錯』。", "layout": "全螢幕代碼塊，展示 Python 程式碼，高亮 A2uiSchemaManager 的初始化參數配置。"}, {"id": "170", "chapter": "第十二章", "pdf_page": "41", "title": "實作 LLM-generates-UI 核心代碼", "takeaway": "定義 LlmAgent 實例，動態生成系統 Prompt 並載入到大模型中！", "details": ["使用 schema_manager.generate_system_prompt() 生成自訂系統指令。", "參數包括角色說明、UI 使用規範，並宣告 include_schema=True 與 include_examples=True。"], "metaphor": "👉 就像是『在實習生上崗前，給他發一本附有範例與規範的公司規章手冊 (System Prompt)，確保他不會亂來』。", "layout": "全螢幕代碼塊，展示 LlmAgent 實例化過程，重點高亮 instruction 欄位的動態生成方法。"}, {"id": "171", "chapter": "第十二章", "pdf_page": "41", "title": "異步客戶端 UI 生成流", "takeaway": "使用 InMemoryRunner 建立異步會話，啟動智能體生成 UI 封包！", "details": ["實作 create_ui 異步函數，傳入用戶意圖與數據。", "調用 runner.session_service.create_session 建立對話，並異步監聽執行事件流。"], "metaphor": "👉 就像是『撥通了客服專線，啟動一個專屬的通話窗口，然後一邊聽對方說話一邊用筆記下關鍵內容』。", "layout": "全螢幕代碼塊，展示 async def create_ui 原始碼，高亮 InMemortRunner 與 session 建立邏輯。"}, {"id": "172", "chapter": "第十二章", "pdf_page": "41", "title": "解析 <a2ui-json> 標籤", "takeaway": "利用 parse_response() 精確提取 XML 格式包覆的 A2UI JSON 數據！", "details": ["模型輸出的文本中可能夾雜無關的文字說明與 Markdown 標記。", "將輸出包裹於 <a2ui-json> 標籤中，解析器只抓取標籤內的 JSON 進行結構驗證。"], "metaphor": "👉 就像是『在貨物箱外貼上黃色封條，收貨員只拆開有封條的箱子 (標籤)，忽略其他無關包裝』。", "layout": "左側為含有 Markdown 文字與 <a2ui-json> 標籤的 LLM 原始輸出，中間為 parse_response 提取器，右側為純淨的 JSON 物件。"}, {"id": "173", "chapter": "第十二章", "pdf_page": "41", "title": "Schema 驗證與重試機制", "takeaway": "若 JSON 結構未通過 Schema 驗證，攔截異常並向模型發起自動重連重試！", "details": ["在 try-except 區塊中調用 catalog.validator.validate(m) 進行校對。", "若拋出 ValidationError，將錯誤路徑與訊息拼裝入 query 中，自動要求模型修正。"], "metaphor": "👉 就像是『檢查考卷：老師發現第 3 題算錯了 (ValidationError)，把考卷退給學生並指出錯誤 (重試)，讓學生修正』。", "layout": "流程圖。展示 JSON 生成 -> 驗證失敗 -> 抓取錯誤路徑 -> 拼接錯誤訊息 -> 重新發送給 LLM (Max Retries: 3)。"}, {"id": "174", "chapter": "第十二章", "pdf_page": "42", "title": "實作除錯與重試代碼", "takeaway": "在 Python 中實作自動捕獲 ValidationError 並反饋給模型的修復迴圈！", "details": ["捕獲 jsonschema.ValidationError，解析 e.absolute_path 並組裝反饋 query。", "若超過最大重試次數 (max_retries = 3)，則拋出 ValueError 中斷流程，保障安全性。"], "metaphor": "👉 就像是『給工廠的機械手臂寫一段容錯代碼，如果抓取零件歪了，自己調整姿勢再抓一次，試了三次還不行就拉警報』。", "layout": "全螢幕代碼塊，展示 Snippet 6 中 ValidationError 捕獲、路徑提取與 query 重新拼接的核心代碼。"}, {"id": "175", "chapter": "第十二章", "pdf_page": "42", "title": "安全降級 (Graceful Fallback)", "takeaway": "在生產環境中，若 UI 生成徹底失敗，必須優雅降級回純文字響應！", "details": ["LLM 的輸出是隨機的，即使有重試也無法保證 100% 通過 Schema 驗證。", "外包裝 create_ui() 必須實作 try-except，一旦失敗則顯示純文字，絕對不能讓頁面白屏。"], "metaphor": "👉 就像是『商場的電扶梯壞了，它依然可以當作普通的樓梯給人走 (優雅降級)，不會讓顧客卡在半空中』。", "layout": "左側為破碎的 UI 圖示，中間為降級過濾器，右側為美觀排版的純文字響應畫面，標有『資料加載中，先呈現文字版』。"}, {"id": "176", "chapter": "第十二章", "pdf_page": "42", "title": "混合輸出 (Hybrid Output) 設計", "takeaway": "在響應中同時提供 data 與 ui 欄位，給予消費端最大的適配彈性！", "details": ["API 客戶端 (如機器智能體) 忽略 ui 欄位，直接抓取 data 欄位進行數據處理。", "人類面向的客戶端 (如瀏覽器) 則讀取 ui 欄位，渲染精美的 A2UI 互動卡片。"], "metaphor": "👉 就像是『買泡麵：包裝裡既有調味料包 (Data，精簡好處理)，也有漂亮的料理包 (UI，豐富好看)』，各取所需。", "layout": "左側為 Hybrid Output 的 JSON 結構，右側分岔出兩條路徑：一條通往 Machine Client (純 Data)，一條通往 Human UI (A2UI 渲染)。"}, {"id": "177", "chapter": "第十二章", "pdf_page": "43", "title": "自主商務 Protocols 的召喚", "takeaway": "智能體不僅要能讀取數據與渲染 UI，更必須執行帶有實體財務影響的行動！", "details": ["先前的 MCP、A2A 與 A2UI 主要解決了『唯讀 (Read)』與人機界面溝通的痛點。", "隨著智能體演進，我們必須打通自主採購與付款通道，讓 Agent 能合法花錢。"], "metaphor": "👉 就像是『實習生不僅要會寫報告和畫圖表，公司還得給他採購權，讓他能自己去買文具和訂便當』。", "layout": "左側為代表唯讀的眼鏡圖示（MCP, A2A, A2UI），右側為代表實體交易的購物車與錢包圖示（AP2, UCP），中間有巨大的連接箭頭。"}, {"id": "178", "chapter": "第十二章", "pdf_page": "43", "title": "商務協定的三大核心特徵", "takeaway": "商務協定具備強型別 Schema、安全沙盒與消除整合債三大商業優勢！", "details": ["1. Typed Schemas：嚴格定義商品、購物車、發票與授權合約的數據格式。", "2. Security & Sandbox：確保在交易談判期與付款執行期，資金均受嚴密保護。", "3. Vendor Neutrality：消除廠商鎖定，智能體能跨多個電商與金流平台自由交易。"], "metaphor": "👉 就像是『刷卡交易標準 (EMV Co)』，不論你在哪家商店刷哪張信用卡，底層安全認證和金額傳遞都是統一安全的。", "layout": "三分欄佈局。左分欄 Typed Schema，中分欄 Security，右分欄 Vendor Neutrality，配合精美圖示說明。"}, {"id": "179", "chapter": "第十二章", "pdf_page": "44", "title": "剖析 AP2 與 UCP 的協作", "takeaway": "UCP 作為智能商務大腦決定買什麼，AP2 作為錢包決定如何安全付款！", "details": ["UCP 負責管理詢價、目錄檢索、加入購物車與發起結帳流程。", "AP2 負責處理金流授權、校對交易限額，並簽署加密 promissory note。"], "metaphor": "👉 UCP 像是『你去超市推著推車挑選零食的腦袋』，AP2 則是『放在你口袋裡、限定今天只能花 500 元的錢包』。", "layout": "UCP 與 AP2 協作關係圖 (Figure 8)。左側為 ADK Agent，中間為 UCP (Checkout, Cart, Order)，右側為 AP2 授權流連接 Agentic Commerce。"}, {"id": "180", "chapter": "第十二章", "pdf_page": "45", "title": "UCP 情境案例：半夜點餐", "takeaway": "以 2:00 AM 宿舍點餐為例，看 UCP 如何實現完全自動化的點餐詢價！", "details": ["AI 智能體不需要開啟網頁去點擊 poorly-designed 的餐廳選單與加點按鈕。", "直接透過 UCP 向校園所有餐廳的後台發送機器語言查詢：『還開著嗎？有素捲餅嗎？』"], "metaphor": "👉 就像是『你有一個能直接接入所有餐廳後台系統的萬能點餐語音助理』，一秒問完所有店家的庫存與外送時間。", "layout": "左側為餓肚子的學生，中央為 AI Assistant 通過 UCP 協議發送點餐 JSON 包，右側為餐廳後台回傳的外送時間與稅費清單。"}, {"id": "181", "chapter": "第十二章", "pdf_page": "45", "title": "UCP 消除介面適配地獄", "takeaway": "UCP 標準化商務對話，讓模型無需為每家電商平台編寫專用網頁爬蟲！", "details": ["在 UCP 出現前，開發者得為淘寶、亞馬遜各自寫一套複雜的前端網頁解析與點擊代碼。", "UCP 將商品目錄、購物車操作與結帳接口統一為標準 API 格式，實現一勞永逸。"], "metaphor": "👉 就像是『電商平台的通用標準接口』，只要大家都支援這個接口，AI 就能用同一個語法在任何平台下單，不用模擬滑鼠去點擊網頁。", "layout": "左欄展示 UCP 介面與各大平台（淘寶、亞馬遜）圖示，右欄為統一的 API 數據對接流，消除網頁模擬爬蟲的紅字警告。"}, {"id": "182", "chapter": "第十二章", "pdf_page": "46", "title": "AP2：帶有嚴格限額的副卡", "takeaway": "AP2 協定提供嚴格的 Mandate 授權，確保智能體絕不會超額消費！", "details": ["你絕對不能把你的無額度黑卡金鑰直接貼給 LLM，那是財務自殺。", "在 AI 出發採購前，你在本地為它簽署一條數位規則：『最多只能在 Taco Bell 花費 25 元』。"], "metaphor": "👉 就像是『家長給小孩一張限定只能在學校合作社買文具、每天限額 100 元的學生信用卡』，安全可控。", "layout": "左側為帶有 $25 Limit 的 AP2 數位信用卡，中央為授權 Mandate 鎖頭，右側為商家收銀台。"}, {"id": "183", "chapter": "第十二章", "pdf_page": "46", "title": "AP2 核心防禦：The Handshake", "takeaway": "結帳時不顯示實體卡號，只出示人類簽署的加密數位承諾書！", "details": ["智能體向商家銀行展示一個經過你私鑰加密簽名的 Promissory Note (期票)。", "銀行能立刻驗證該數位簽章的真實性，並確認這筆 18.50 元的交易已獲得人類明確授權。"], "metaphor": "👉 就像是『支票』，你不用把你的銀行存摺交給商家，你只需在支票上寫下金額並簽名，商家拿著支票去銀行就能兌現領錢。", "layout": "時序圖。展示 Client -> 簽名期票 -> 商家 -> 商家銀行 -> 驗證簽章並扣款的加密握手流程。"}, {"id": "184", "chapter": "第十二章", "pdf_page": "46", "title": "AP2 核心防禦：防範隱藏收費", "takeaway": "商家若試圖暗中加價，AP2 會因為違反 Mandate 授權而瞬間阻斷交易！", "details": ["若餐廳試圖在結帳後，偷偷把 18.50 元的賬單改為 50.00 元扣款。", "AP2 協議檢測到金額超出了你當初簽署的 25.00 元上限，立刻在金流層自動拒絕付款。"], "metaphor": "👉 就像是『結帳時收銀員多刷了錢，你的手機立刻彈出警報並自動凍結該次交易』，絕不讓商家得逞。", "layout": "左側展示餐廳試圖扣款 $50 的惡意請求，中間為標有 $25 Max Limit 的紅盾阻斷器，右側為 Blocked 警示圖示。"}, {"id": "185", "chapter": "第十二章", "pdf_page": "46", "title": "UCP 與 AP2 的對比矩陣", "takeaway": "深刻理解腦 (UCP) 與錢包 (AP2) 的分工，是實作自主商務架構的前提！", "details": ["UCP 關注業務層：管理商品、目錄檢索、詢價並將東西放入購物車。", "AP2 關注財務層：處理授權、管理限額、驗證數位簽章並防止被詐騙。"], "metaphor": "👉 就像是『去買菜：大腦負責挑菜、跟老闆講價 (UCP)；手裡的錢包負責數鈔票、付錢並拿發票 (AP2)』。", "layout": "精緻對比表格 (Table 3)。包含大腦 vs. 錢包、商業對接 vs. 金流對接、統一整合 vs. 安全授權等維度的詳細比對。"}, {"id": "186", "chapter": "第十二章", "pdf_page": "47", "title": "總結：從技工到系統架構師", "takeaway": "採用 MCP, A2A, A2UI, AP2, UCP，擺脫脆弱的硬編碼，升級為 AI 總架構師！", "details": ["智能體工程不僅僅是寫寫 Prompt，而是利用工業標準協議建構自動化勞動力系統。", "這些開放協議打通了工具、智能體協作、人機界面與金融交易，解鎖全新的規模經濟。"], "metaphor": "👉 就像是從『在路邊修腳踏車的技工』升級為『設計整座城市高鐵交通網絡與調度系統的總規劃師』。", "layout": "左側為雜亂的 API 焊接工具箱，右側為閃耀著科技光芒的 Global Autonomous Workforce 網絡架構圖。"}, {"id": "187", "chapter": "第十二章", "pdf_page": "47", "title": "第十二章邏輯關係回顧", "takeaway": "A2UI 渲染模式、Canvas 協作與 AP2/UCP 商務協議，完成了智能體生態的最後拼圖！", "details": ["A2UI Catalog 與 Adjacency 結構 -> 雙模式渲染與 Canvas 互動時序。", "自主商務 UCP 大腦與 AP2 安全錢包 -> 限制額度與加密數位承諾書 -> 終極結論。"], "metaphor": "👉 就像是『工廠不僅有機器、有無線電、有收費站，還正式打開了大門，開始向全球客戶提供高效的自動化服務』。", "layout": "全螢幕流程圖，展示第十二章也是全書的終極關聯：工具連接 -> 智能體協作 -> 人機界面渲染 -> 商業支付交易 -> 虛擬員工隊伍成型。"}, {"id": "188", "chapter": "第九章(進階)", "pdf_page": "28", "title": "A2A 進階：多級委派機制", "takeaway": "在複雜業務中，遠端 Agent 可繼續向下委派任務，形成樹狀協作鏈！", "details": ["Orchestrator 委派任務給法務 Agent，法務 Agent 可進一步委派給合約審查與稅務 Agent。", "A2A 協議通過 session_id 與 parent_message_id 追蹤整個呼叫鏈，防止無限循環。"], "metaphor": "👉 就像是『總經理把專案交給經理，經理又拆解工作分給課長與專員』，層級分明，權責清晰。", "layout": "全螢幕樹狀結構圖。頂部為 Orchestrator，向下分岔為 Specialist 1，Specialist 1 再向下分岔為 Sub-Specialist A 與 B。"}, {"id": "189", "chapter": "第九章(進階)", "pdf_page": "28", "title": "A2A 回調 (Callback) 處理", "takeaway": "利用異步回調機制，在遠端任務完成時實時通知調用端！", "details": ["調用端發起請求時，在 A2A Envelope 中附加本地監聽的 callback_url。", "當遠端 Agent 執行完耗時 10 分鐘的任務後，主動向該 url 發送 POST 請求交件。"], "metaphor": "👉 就像是『去咖啡廳點餐，店員給你一個取餐號碼牌 (Callback URL)，餐點做好時號碼牌會震動閃爍通知你取餐』。", "layout": "左側為 Client，中間為帶有 Callback 箭頭的異步等待區，右側為執行完畢發送回調的 Server。"}, {"id": "190", "chapter": "第九章(進階)", "pdf_page": "28", "title": "A2A 傳輸加密與 TLS 雙向認證", "takeaway": "強制實施 mTLS 雙向認證，確保 A2A 通信的絕對機密性與不可篡改！", "details": ["不僅客戶端要校驗伺服器憑證，伺服器也必須校驗客戶端憑證 (mutual TLS)。", "防範中間人攻擊 (MITM) 與未授權的流氓智能體偽造指令入侵。"], "metaphor": "👉 就像是『軍隊的口令對答：哨兵喊出哨口口令 (Server Auth)，來人也必須對上暗號 (Client Auth) 才能通過』。", "layout": "左側 Client 憑證，右側 Server 憑證，中間在 TLS 握手層進行雙向比對，顯示綠色驗證成功盾牌。"}, {"id": "191", "chapter": "第十章(進階)", "pdf_page": "30", "title": "x402 機器支付的閃電網絡底層", "takeaway": "x402 微支付底層首選閃電網絡，實現毫秒級、零手續費的資金交割！", "details": ["傳統信用卡單筆手續費過高，不適合機器之間分角美分的微交易。", "閃電網絡提供去中心化的加密貨幣通道，支持單次調用 0.001 美元的極微支付。"], "metaphor": "👉 就像是『高速公路上的 ETC 感應，每過一個收費站自動扣幾分錢，不需要每次都下車刷卡簽名』。", "layout": "左側為 Agent 閃電錢包，中間為點對點支付通道，右側為 API 服務商，展示毫秒級扣款流程。"}, {"id": "192", "chapter": "第十章(進階)", "pdf_page": "30", "title": "解析 L402 Macaroon 憑證", "takeaway": "L402 協議利用 Macaroon 憑證將付款證明與 API 授權完美綁定！", "details": ["Macaroon 是一種具備高度限制性、可在傳輸中動態附加限制條件的加密憑證。", "憑證中寫明：『此付款證明僅授權調用 get_sales_dashboard 工具，且限當天有效』。"], "metaphor": "👉 就像是『遊樂園的限定日票：上面蓋有今日日期，且只准你坐雲霄飛車，不能拿去坐摩天輪』。", "layout": "一個帶有加密印記的 Macaroon 圖示，高亮顯示其內含的 Caveats (限制條款) JSON 結構。"}, {"id": "193", "chapter": "第十章(進階)", "pdf_page": "31", "title": "M2M 交易的異步對帳單", "takeaway": "為機器微交易建立實時審計系統，防止智能體因程序 bug 造成財務透支！", "details": ["在金流層配置硬性熔斷機制 (Circuit Breaker)，例如單日累計付款超限即阻斷。", "定期產出機器對帳單，自動比對調用成功次數與實際扣款明細是否一致。"], "metaphor": "👉 就像是『給智能體裝上一個保險絲 (熔斷器)，如果水管漏水流量太大 (扣款異常)，保險絲會自動燒斷防大火』。", "layout": "左側為帶有『熔斷器/保險絲』字樣的交易安全控制面板，右側展示對帳單匹配的核對勾選示意圖。"}, {"id": "194", "chapter": "第十一章(進階)", "pdf_page": "33", "title": "A2UI 事件反饋閉環", "takeaway": "用戶點擊 UI 按鈕觸發 Action，瀏覽器將其封裝為 Event 傳回給 Agent！", "details": ["當用戶點擊 A2UI 渲染出的 Button，客戶端不執行本地 action，而是捕獲事件。", "將事件名稱與參數包裝成 A2UI 消息回傳給智能體，驅動智能體下一輪推理。"], "metaphor": "👉 就像是『遊戲手把：你按了 A 鍵 (UI 點擊)，手把把信號傳給主機 (回傳事件)，主機裡的遊戲角色跳了一下』。", "layout": "左側為瀏覽器渲染的 Button，中間有一條名為 A2UI Event 的向左箭頭，右側為接收事件的大腦。"}, {"id": "195", "chapter": "第十一章(進階)", "pdf_page": "33", "title": "A2UI 的跨平台渲染適配", "takeaway": "同一個 A2UI JSON，在 React、Flutter 與 Jetpack Compose 中的具體映射實作！", "details": ["Web 端 (React)：將 component='Button' 映射為 <MuiButton onClick={onAction}/>。", "Android 端 (Compose)：映射為 Button(onClick = { sendEvent() }) { Text(...) }。", "藉此確保 UI 元件庫完全遵循各平台的原生交互習慣與流暢度。"], "metaphor": "👉 就像是『世界語翻譯：同一句問候語，在美國人聽來是 Hello，在法國人聽來是 Bonjour』，完全在地化。", "layout": "三分欄佈局。分別展示同一 JSON 片段在 React, Flutter, Compose 三種前端代碼的具體對應適配器語法。"}, {"id": "196", "chapter": "第十二章(進階)", "pdf_page": "36", "title": "自定義 Catalog 組件開發", "takeaway": "當 basic 元件不敷使用時，遵循 A2UI 標準開發安全的自定義組件！", "details": ["在 XML Schema 中定義新組件 (如: CustomSalesChart) 的屬性與輸入參數限制。", "將組件註冊至客戶端的 A2UI Catalog，確保智能體能以相同語法聲明調用。"], "metaphor": "👉 就像是『在樂高積木箱裡自己用 3D 列印造出了一顆特殊形狀的積木，只要卡槽規格一樣，就能接在一起』。", "layout": "左側為 Custom Component Schema 定義，右側為在渲染器中註冊的代碼，中間為連結鎖頭象徵安全註冊。"}, {"id": "197", "chapter": "第十二章(進階)", "pdf_page": "37", "title": "資料綁定語法深挖", "takeaway": "使用 path 指向資料模型中的具體節點，避免拼接字符串帶來的 Token 浪費！", "details": ["若使用 f-string 拼接，每次數據微調都需要 LLM 重新生成整個 UI JSON，極其昂貴。", "使用 {'path': '/regions/0/sales'}，客戶端在接收到 updateDataModel 時會自動尋址替換。"], "metaphor": "👉 就像是『在合約書中寫：請參照附件一 (Path)，而不是把附件一的幾萬字條款在合約中重複抄寫十遍』。", "layout": "左側為 A2UI 元件樹 JSON，高亮顯示 path 節點，右側為 Data Model JSON，以虛線表示對應尋址路徑。"}, {"id": "198", "chapter": "第十二章(進階)", "pdf_page": "40", "title": "A2uiSchemaManager 提示詞優化", "takeaway": "優化 SchemaManager 生成的指令，大幅縮減上下文 Token 的佔用體積！", "details": ["默認生成的 Prompt 包含完整的元件 Schema，體積龐大，容易耗盡 Token。", "實作精簡化壓縮算法 (minify_schema)，只保留模型決策必需的屬性聲明。"], "metaphor": "👉 就像是『考試前整理的精簡版小抄 (Minified Prompt)，只留下公式和關鍵字，把廢話全部刪掉』。", "layout": "左欄展示 Minify 前的巨大 schema (紅字 Token 消耗大)，右欄展示 Minify 後的緊湊 schema (綠字 節省 60% Token)。"}, {"id": "199", "chapter": "第十二章(進階)", "pdf_page": "41", "title": "防範 LLM 輸出截斷與異常處理", "takeaway": "在 create_ui 異步流中，實作完整性校對，嚴防殘缺的 JSON 導致渲染崩潰！", "details": ["大模型在輸出長 JSON 時容易因為 Token 上限或網絡中斷而產生殘缺代碼 (如缺少右括號)。", "在解析前使用正則表達式或狀態堆疊檢查 JSON 的閉合完整性，殘缺則直接觸發修復重試。"], "metaphor": "👉 就像是『工廠出貨檢驗：發現箱子沒封好、少了一角 (殘缺 JSON)，立刻退回生產線重新打包，不送出工廠』。", "layout": "流程圖。展示：接收 Stream -> 閉合檢測 -> 發現殘缺 -> 拋出 ParseError -> 自動 Retry。"}, {"id": "200", "chapter": "第十二章(進階)", "pdf_page": "45", "title": "UCP 購物車管理底層", "takeaway": "UCP 協議對應的購物車管理包含 add_item、remove_item 與 update_qty 狀態流！", "details": ["嚴格採用狀態同步機制，確保智能體本地的購物車狀態與電商伺服器 100% 同步。", "在金流層發起 checkout 前，必須進行 final price validation，校對總金額。"], "metaphor": "👉 就像是『去超商買東西，你在購物籃裡拿進拿出，收銀台的電腦會實時同步明細與金額，最後刷卡前做最終核對』。", "layout": "狀態移轉圖。展示購物車元件從 Empty -> Items Added -> Final Validation -> Checked Out 的生命週期流程。"}, {"id": "201", "chapter": "第十二章(進階)", "pdf_page": "46", "title": "AP2 數位期票的加密驗證", "takeaway": "數位期票採用 SHA-256 加密雜湊與私鑰簽名，防止篡改與重放攻擊！", "details": ["Promissory Note 中寫有唯一 nonce 與時間戳記，商家無法重複提交同一張期票扣款 (防重放)。", "商家銀行利用你的公鑰解密簽章，校對雜湊值，秒級驗證交易合法性。"], "metaphor": "👉 就像是『蓋有防偽水印與唯一編號的支票，商家拿去銀行兌現，銀行核對水印和印鑑章，對不上就報警』。", "layout": "加密驗證流程。左側展示期票內容 -> SHA-256 -> 私鑰簽名 -> 生成數位簽章，右側展示公鑰解密與雜湊比對。"}, {"id": "202", "chapter": "第十二章(進階)", "pdf_page": "46", "title": "商務交易中的異常與退款", "takeaway": "實作 UCP 與 AP2 的退款與交易回滾協議，保障商務交易的最終容錯性！", "details": ["當訂單因庫存不足而失敗，UCP 觸發 CancelOrder，AP2 發起對應的授權撤銷與退款流。", "確保智能體在遇到不可抗力時，能安全地退回資金，不造成企業財產損失。"], "metaphor": "👉 就像是『你在自動販賣機買飲料，貨賣光了沒掉下來，機器自動退回你的零錢，不會吞你的錢』。", "layout": "流程圖。展示：訂單異常 -> 觸發 Cancel -> 撤銷 AP2 授權 -> 釋放卡片額度 -> 回傳異常日誌給 Orchestrator。"}, {"id": "203", "chapter": "第一章(深挖)", "pdf_page": "6", "title": "智能體工程與軟體工程的融合", "takeaway": "智能體工程並非取代傳統軟體工程，而是其在高維度空間的延伸與融合！", "details": ["傳統代碼 (Raw Code) 充當智能體系統的微觀器官與具體操作工具。", "智能體系統 (Agentic System) 則扮演宏觀的協調者與動態決策大腦。"], "metaphor": "👉 就像是『有了自動駕駛系統 (智能體)，車子依然需要引擎、輪胎和剎車系統 (傳統軟體) 才能前進』。", "layout": "雙環交疊圖。左環為 Software Engineering，右環為 Agentic Engineering，重疊區標示為 Hybrid Systems。"}, {"id": "204", "chapter": "第一章(深挖)", "pdf_page": "7", "title": "工業標準如何消滅整合債", "takeaway": "歷史經驗證明，每一次標準接口的誕生，都會帶來產業效率的萬倍爆發！", "details": ["沒有標準插座前，世界電器製造業舉步維艱；沒有集裝箱前，全球航運耗時數月。", "五大協定標準化了 AI 交互，將徹底消滅開發者身上的整合代碼債務。"], "metaphor": "👉 就像是『螺絲釘標準化』，讓全球汽車零件能跨廠裝配，直接開啟了現代汽車工業的大量生產時代。", "layout": "歷史事件時間軸，標註：插座標準化 -> 貨櫃標準化 -> TCP/IP 標準化 -> A2A/MCP 標準化，展現效率的跳躍式上升。"}, {"id": "205", "chapter": "第二章(深挖)", "pdf_page": "10", "title": "MCP Server 的運行時隔離", "takeaway": "在本地運行 MCP 時，強制將子進程運行在極低權限的專用 OS 用戶下！", "details": ["防止 LLM 因惡意注入而生成並執行指令：rm -rf /。", "為 MCP 進程配置唯讀環境變數，並利用 OS 的 sandbox 機制進行資源限額。"], "metaphor": "👉 就像是『把新來的見習生安排在玻璃隔間的辦公室裡，他只能看資料，不准碰主控制台』。", "layout": "左側為 Host Process (高權限)，中間為 OS 沙盒牆，右側為 Low-privilege OS User 運行的 MCP Server 子進程。"}, {"id": "206", "chapter": "第二章(深挖)", "pdf_page": "11", "title": "GCP Agent Registry 底層機制", "takeaway": "企業級 Registry 採用 GCP IAM 控制，實現細粒度的 Agent 權限託管！", "details": ["利用 IAM Service Account 與 Workload Identity 進行跨智能體認證。", "註冊表自動為每次 A2A 連接分發短效 token，防止長期密鑰洩漏。"], "metaphor": "👉 習慣是『公司內部的通行證系統，保安會根據你的部門發給你一張限時 8 小時的臨時門禁卡』。", "layout": "左側展示 GCP 鑰匙與鎖頭圖示，中間為發放臨時 Token 的 Registry，右側為驗證成功的 A2A Agent。"}, {"id": "207", "chapter": "第三章(深挖)", "pdf_page": "13", "title": "O(N x M) 對比的數學建模", "takeaway": "建立整合成本的數學模型，證明 MCP 在 N, M 大於 3 時的絕對經濟性！", "details": ["設單次對接開發成本為 C，維護係數為 k。傳統成本：SE = C * N * M * k。", "MCP 成本：SM = C * (N + M) * k。當 N, M 增加，SM 遠遠小於 SE，優勢呈幾何級放大。"], "metaphor": "👉 就像是『開會：N 個人互相私聊需要打 N*(N-1)/2 通電話 (指數)；拉一個群組開會只需 1 個群 (線性)』。", "layout": "全螢幕數學函數對比圖，以曲線展示 N x M 的陡峭上升與 N + M 的平緩線性延伸，交叉點後標註經濟優勢區。"}, {"id": "208", "chapter": "第三章(深挖)", "pdf_page": "14", "title": "stdio 與處理器管道緩衝區", "takeaway": "實作 stdio 傳輸時，務必在代碼中強制 flush 緩衝區以                 const s = mindmapData.nodes.find(n => n.id === link.source);
                const t = mindmapData.nodes.find(n => n.id === link.target);
                if (s && t) {
                    content += `<path class="mindmap-link" d="M ${s.x} ${s.y} Q ${(s.x+t.x)/2 + 20} ${(s.y+t.y)/2 - 20} ${t.x} ${t.y}" id="link-${idx}" data-source="${link.source}" data-target="${link.target}"/>`;

            });

        // 高亮節點相連的連線
        function highlightNodeLinks(nodeId, highlight) {
            const links = document.querySelectorAll('.mindmap-link');
            links.forEach(link => {
                const src = link.getAttribute('data-source');
                const tgt = link.getAttribute('data-target');
                if (src == nodeId || tgt == nodeId) {
                    if (highlight) {
                        link.classList.add('highlight');
                    } else {
                        link.classList.remove('highlight');
                    }
                }
            });

            if (nodeG) {

                    nodeG.classList.add('active');

        // 心智圖 Pan & Zoom 實作
        let mindmapScale = 1;
        let mindmapX = 0;
        let mindmapY = 0;
        
        function initMindmapPanZoom() {
            const container = document.getElementById('mindmap-container');
            const svgContent = document.getElementById('mindmap-content-group');
            if (!container || !svgContent) return;

            let isDragging = false;
            let startX, startY;

            container.addEventListener('mousedown', (e) => {
                // 如果點擊的是節點本身，不觸發拖拽
                if (e.target.closest('.mindmap-node') || e.target.closest('.mindmap-info-popup')) return;
                isDragging = true;
                container.style.cursor = 'grabbing';
                startX = e.clientX - mindmapX;
                startY = e.clientY - mindmapY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                mindmapX = e.clientX - startX;
                mindmapY = e.clientY - startY;
                updateMindmapTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                if (container) container.style.cursor = 'grab';
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.1;
                if (e.deltaY < 0) {
                    mindmapScale *= zoomFactor;
                } else {
                    mindmapScale /= zoomFactor;
                }
                mindmapScale = Math.min(Math.max(mindmapScale, 0.4), 3.0);
                updateMindmapTransform();
            });
        }

        function updateMindmapTransform() {
            const svgContent = document.getElementById('mindmap-content-group');
            if (svgContent) {
                svgContent.setAttribute('transform', `translate(${mindmapX}, ${mindmapY}) scale(${mindmapScale})`);
            }
        }

        function zoomMindmap(factor) {
            mindmapScale *= factor;
            mindmapScale = Math.min(Math.max(mindmapScale, 0.4), 3.0);
            updateMindmapTransform();
        }

        function resetMindmapZoom() {
            mindmapScale = 1;
            mindmapX = 0;
            mindmapY = 0;
            updateMindmapTransform();
            const popup = document.getElementById('mindmap-popup');
            if (popup) popup.style.display = 'none';
        }

        // 繪製各章節流程圖
        function generateFlowchart(chapter) {
            const svg = document.getElementById('flowchart-svg');
            if (!svg) return;
            
            // 清理舊標記
            svg.innerHTML = `
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-muted)"/>
                </marker>
            </defs>
            <g id="flowchart-content-group">
                ${flowchartData[chapter.substring(0, 3)] || ''}
            </g>`;
        }

        // 流程圖 Pan & Zoom 實作
        let chartScale = 1;
        let chartX = 0;
        let chartY = 0;
        
        function initChartPanZoom() {
            const viewport = document.getElementById('chart-viewport');
            const svgContent = document.getElementById('flowchart-content-group');
            if (!viewport || !svgContent) return;

            let isDragging = false;
            let startX, startY;

            viewport.addEventListener('mousedown', (e) => {
                isDragging = true;
                viewport.style.cursor = 'grabbing';
                startX = e.clientX - chartX;
                startY = e.clientY - chartY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                chartX = e.clientX - startX;
                chartY = e.clientY - startY;
                updateChartTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                if (viewport) viewport.style.cursor = 'grab';
            });

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.1;
                if (e.deltaY < 0) {
                    chartScale *= zoomFactor;
                } else {
                    chartScale /= zoomFactor;
                }
                chartScale = Math.min(Math.max(chartScale, 0.5), 4.0);
                updateChartTransform();
            });
        }

        function updateChartTransform() {
            const svgContent = document.getElementById('flowchart-content-group');
            if (svgContent) {
                svgContent.setAttribute('transform', `translate(${chartX}, ${chartY}) scale(${chartScale})`);
            }
        }

        window.zoomChart = function(factor) {
            chartScale *= factor;
            chartScale = Math.min(Math.max(chartScale, 0.5), 4.0);
            updateChartTransform();
        }

        window.resetChartZoom = function() {
            chartScale = 1;
            chartX = 0;
            chartY = 0;
            updateChartTransform();
        }


        // ------------------ 播放器路由控制 ------------------
        function setMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            currentSlideIndex = 0;

            if (mode === 'overview') {
                btnOverview.classList.add('active');
                btnDetail.classList.remove('active');
                chapterSelector.style.display = 'none';
            } else {
                btnOverview.classList.remove('active');
                btnDetail.classList.add('active');
                chapterSelector.style.display = 'block';
            }

            renderSlide();
        }

        function navigateSlide(dir) {
            const slides = getCurrentSlides();
            const newIndex = currentSlideIndex + dir;
            if (newIndex >= 0 && newIndex < slides.length) {
                currentSlideIndex = newIndex;
                renderSlide();
                
                // 如果是詳細模式，同步章節下拉選單的選中狀態
                if (currentMode === 'detail' && currentSlideIndex !== 1) {
                    const slide = slides[currentSlideIndex];
                    syncChapterSelector(slide.chapter);
                }
            }
        }

        // 同步章節下拉選單選中狀態
        function syncChapterSelector(chapterName) {
            const cleanName = chapterName.substring(0, 3); // "第一章", "第二章"
            const options = chapterSelector.options;
            for (let i = 0; i < options.length; i++) {
                if (options[i].textContent.includes(cleanName)) {
                    chapterSelector.selectedIndex = i;
                    break;
                }
            }
        }

        // 綁定 DOM 事件
        btnOverview.addEventListener('click', () => setMode('overview'));
        btnDetail.addEventListener('click', () => setMode('detail'));
        btnPrev.addEventListener('click', () => navigateSlide(-1));
        btnNext.addEventListener('click', () => navigateSlide(1));

        // 章節選擇事件
        chapterSelector.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'all') {
                currentSlideIndex = 0;
                renderSlide();
                return;
            }
            
            // 找出對應章節的第一張投影片 index
            const targetCh = chapters.find(ch => ch.id === val);
            if (targetCh) {
                const cleanName = targetCh.name.split('：')[0]; // "第一章", "第二章"
                const idx = detailSlides.findIndex(s => s.chapter && s.chapter.includes(cleanName));
                if (idx !== -1) {
                    currentSlideIndex = idx;
                    renderSlide();
                }
            }
        });

        // 鍵盤控制
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                navigateSlide(1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                navigateSlide(-1);
            } else if (e.key.toLowerCase() === 'm') {
                // 切換章節目錄下拉
                chapterSelector.focus();
            } else if (e.key.toLowerCase() === 'f') {
                toggleFullscreen();
            }
        });

        // 深淺色主題切換
        btnTheme.addEventListener('click', () => {
            if (activeTheme === 'light') {
                document.body.setAttribute('data-theme', 'dark');
                activeTheme = 'dark';
                btnTheme.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
            } else {
                document.body.removeAttribute('data-theme');
                activeTheme = 'light';
                btnTheme.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a7 7 0 1 1-7.64-7.64c.44.06.9.1 1.36.1z"/></svg>`;
            }
            // 重新繪製當前投影片，以適應主題顏色
            renderSlide();
        });

        // 全螢幕切換
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`無法開啟全螢幕模式: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
        btnFullscreen.addEventListener('click', toggleFullscreen);

        // 初始化
        initChapterSelector();
        chapterSelector.style.display = 'none'; // 預設 overview 隱藏目錄
        renderSlide();
    </script>
