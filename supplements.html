<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五股職訓局-機電AI_115-1期 | 補充教材</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar / 左側補充教材選單 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <i class="fa-solid fa-microchip logo-icon"></i>
          <div class="brand-titles">
            <h1 class="main-title">五股職訓局</h1>
            <span class="sub-title">機電AI_115-1期（作者：Rido老師）</span>
          </div>
        </div>
        <button class="mobile-toggle-btn" id="sidebarCloseBtn" aria-label="關閉選單">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="sidebar-search">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" placeholder="搜尋補充標題、內容..." />
        </div>
      </div>

      <div class="sidebar-menu-title">
        <span>補充教材 (SUPPLEMENTS)</span>
        <span class="lab-count-badge" id="labCountBadge" style="background: var(--primary-alpha); color: var(--primary); border-color: rgba(56, 189, 248, 0.3);">0</span>
      </div>

      <nav class="lab-list" id="labList">
        <!-- 動態渲染補充教材選單列表 -->
      </nav>

      <div class="sidebar-footer">
        <div class="footer-info" style="display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem;">
          <div><i class="fa-solid fa-book"></i> Node-RED 補充學習資源</div>
          <div style="opacity: 0.7; font-size: 0.72rem; padding-left: 18px;">作者：Rido老師</div>
        </div>
      </div>
    </aside>

    <!-- 主內容區域 -->
    <main class="main-content">
      <!-- 頂部 Header -->
      <header class="top-header">
        <button class="mobile-toggle-btn" id="sidebarOpenBtn" aria-label="開啟選單">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="breadcrumb" id="breadcrumb">
          <a href="index.html" class="back-home-link"><i class="fa-solid fa-house"></i> 首頁</a> / <span class="active-lab-name">載入中...</span>
        </div>
        <div class="header-actions">
          <span class="status-tag" style="background: var(--primary-alpha); color: var(--primary); border-color: rgba(56, 189, 248, 0.25);"><i class="fa-solid fa-book-open-reader"></i> 115-1期 補充教材</span>
        </div>
      </header>

      <!-- 動態載入補充教材內容 -->
      <div class="content-body" id="contentBody">
        <!-- JS 動態插入內容 -->
      </div>
    </main>
  </div>

  <!-- Lightbox Modal (圖片放大預覽) -->
  <div class="lightbox-modal" id="lightboxModal">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-content" id="lightboxImg" alt="照片放大預覽">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <!-- Toast Notification 通知 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="supplementsData.js?v=1.0"></script>
  <script src="supplementsApp.js?v=1.0"></script>
</body>
</html>
