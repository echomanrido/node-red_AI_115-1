<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b1522 0%, #171d3d 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <filter id="cardGlow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景細格線 -->
  <pattern id="gridPattern3" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern3)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar3)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：大語言模型四大評測體系與選型決策</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">模型評測：跳脫官方發表會行銷！盲測對戰 · 真實用量 · 帕累托性價比 · 硬核基準全解析</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: LMarena 盲測投票 -->
  <g filter="url(#cardGlow3)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#ea580c"/>
    <circle cx="48" cy="122" r="12" fill="rgba(234, 88, 12, 0.15)" stroke="#ea580c" stroke-width="1"/>
    <text x="48" y="126" fill="#f97316" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(234, 88, 12, 0.15)"/>
    <text x="141" y="124" fill="#fb923c" font-size="8.5" text-anchor="middle">盲測對決</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">LMarena 盲測</text>
    <text x="38" y="174" fill="#fdba74" font-size="9.5">• 350萬+次雙盲對戰</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• Bradley-Terry Elo</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• 杜絕題庫污染刷分</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <path d="M 191 160 L 205 160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- 卡片 2: OpenRouter 真實用量 -->
  <g filter="url(#cardGlow3)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#2563eb"/>
    <circle cx="233" cy="122" r="12" fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="1"/>
    <text x="233" y="126" fill="#60a5fa" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(37, 99, 235, 0.15)"/>
    <text x="326" y="124" fill="#60a5fa" font-size="8.5" text-anchor="middle">真金白銀</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">OpenRouter 用量</text>
    <text x="223" y="174" fill="#93c5fd" font-size="9.5">• 週消耗 200T+ Tokens</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• 全球百萬工程師選擇</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• Flash 輕量模型熱潮</text>
  </g>

  <!-- 箭頭 2 -> 3 -->
  <path d="M 376 160 L 390 160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- 卡片 3: Artificial Analysis 效能成本 -->
  <g filter="url(#cardGlow3)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
    <rect x="395" y="96" width="160" height="4" rx="2" fill="#9333ea"/>
    <circle cx="418" cy="122" r="12" fill="rgba(147, 51, 234, 0.15)" stroke="#9333ea" stroke-width="1"/>
    <text x="418" y="126" fill="#c084fc" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="475" y="112" width="68" height="18" rx="4" fill="rgba(147, 51, 234, 0.15)"/>
    <text x="509" y="124" fill="#c084fc" font-size="8.5" text-anchor="middle">獨立實測</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">Artificial Analysis</text>
    <text x="408" y="174" fill="#d8b4fe" font-size="9.5">• TTFT 首字延遲實測</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• TPS 每秒生成吞吐量</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 帕累托 (Pareto) 最優</text>
  </g>

  <!-- 箭頭 3 -> 4 -->
  <path d="M 561 160 L 575 160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- 卡片 4: llm-stats 學術基準 -->
  <g filter="url(#cardGlow3)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#059669"/>
    <circle cx="603" cy="122" r="12" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-width="1"/>
    <text x="603" y="126" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(5, 150, 105, 0.15)"/>
    <text x="689" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">基準跑分</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">llm-stats 聚合</text>
    <text x="593" y="174" fill="#a7f3d0" font-size="9.5">• SWE-bench 代碼能力</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• GPQA 專家推理指標</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• 上下文長度與價格比</text>
  </g>

  <!-- 下方大閉環箭頭與選型策略 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowIndigo)"/>
  <rect x="135" y="278" width="490" height="28" rx="14" fill="#1e1b4b" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
  <text x="380" y="296" fill="#c7d2fe" font-size="10.5" text-anchor="middle" font-weight="bold">
    工程決策漏斗：任務智力需求 ⟹ 交互延遲/吞吐門檻 ⟹ 成本與私有化邊界 ⟹ 精準選型
  </text>
</svg>
