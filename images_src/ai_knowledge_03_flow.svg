<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b1522 0%, #151a36 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <filter id="cardGlow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <pattern id="gridPattern3" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern3)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar3)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：ReAct 自主代理 (Autonomous Agent) 閉環</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">架構範式：從聊天文字生成到 Thought -> Action -> Observation -> Reflection 閉環</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: Thought 意圖推理 -->
  <g filter="url(#cardGlow3)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#38bdf8"/>
    <circle cx="48" cy="122" r="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="48" y="126" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="141" y="124" fill="#38bdf8" font-size="8.5" text-anchor="middle">Thought</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">意圖與思維鏈</text>
    <text x="38" y="174" fill="#bae6fd" font-size="9.5">• 需求解構與規劃</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• 假設條件驗證</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• 形成下一步策略</text>
  </g>

  <path d="M 191 160 L 205 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 卡片 2: Action 工具調用 -->
  <g filter="url(#cardGlow3)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#a855f7"/>
    <circle cx="233" cy="122" r="12" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="233" y="126" fill="#a855f7" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="326" y="124" fill="#c084fc" font-size="8.5" text-anchor="middle">Action</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">工具行動調度</text>
    <text x="223" y="174" fill="#e9d5ff" font-size="9.5">• 終端命令執行</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• MCP 協議通訊</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• 跨環境 API 呼叫</text>
  </g>

  <path d="M 376 160 L 390 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 卡片 3: Observation 結果觀測 -->
  <g filter="url(#cardGlow3)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.2"/>
    <rect x="395" y="96" width="160" height="4" rx="2" fill="#f43f5e"/>
    <circle cx="418" cy="122" r="12" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="418" y="126" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="465" y="112" width="78" height="18" rx="4" fill="rgba(244, 63, 94, 0.15)"/>
    <text x="504" y="124" fill="#fb7185" font-size="8.5" text-anchor="middle">Observation</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">回傳客觀事實</text>
    <text x="408" y="174" fill="#fca5a5" font-size="9.5">• 讀取日誌與報錯</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• PLC 暫存器回傳值</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 確定性反饋數據</text>
  </g>

  <path d="M 561 160 L 575 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 卡片 4: Reflection 自主自愈 -->
  <g filter="url(#cardGlow3)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad3)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#10b981"/>
    <circle cx="603" cy="122" r="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="603" y="126" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="689" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">Reflection</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">自我反思修正</text>
    <text x="593" y="174" fill="#6ee7b7" font-size="9.5">• 錯誤堆疊診斷</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• 自主自愈 (Heal)</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• 交付驗收工件</text>
  </g>

  <!-- 下方大閉環箭頭與總結 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowCyan)"/>
  <rect x="180" y="278" width="400" height="28" rx="14" fill="#082f49" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="380" y="296" fill="#7dd3fc" font-size="10.5" text-anchor="middle" font-weight="bold">
    自主循環：思考、行動、觀測、反思，直到確定性驗收滿足目標條件
  </text>
</svg>
