<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #090d16 0%, #111827 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151e2e"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <filter id="cardGlow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 背景細網格 -->
  <pattern id="gridPattern6" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern6)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar6)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：什麼是 AI 斬殺線 (AI Kill Line)？</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">評測深層洞察：能力邊界 × 成本崩塌 · 開源大遷移 · 三重戰場與人類防禦線</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: 斬殺線定義 -->
  <g filter="url(#cardGlow6)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad6)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#f43f5e"/>
    <circle cx="48" cy="122" r="12" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="48" y="126" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(244, 63, 94, 0.15)"/>
    <text x="141" y="124" fill="#fb7185" font-size="8.5" text-anchor="middle">概念核心</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">臨界點觸發</text>
    <text x="38" y="174" fill="#fda4af" font-size="9.5">• 智力水準大於門檻</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• 呼叫成本降至 1/10</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• 昂貴中庸產品瞬間歸零</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <path d="M 191 160 L 205 160" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- 卡片 2: 四象限圖譜 -->
  <g filter="url(#cardGlow6)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad6)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#f59e0b"/>
    <circle cx="233" cy="122" r="12" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="233" y="126" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="326" y="124" fill="#fbbf24" font-size="8.5" text-anchor="middle">象限矩陣</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">四象限空間</text>
    <text x="223" y="174" fill="#fde68a" font-size="9.5">• 高能力低成本霸主區</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• 昂貴旗艦思考特攻區</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• 低效高價遭直接淘汰</text>
  </g>

  <!-- 箭頭 2 -> 3 -->
  <path d="M 376 160 L 390 160" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- 卡片 3: 路線對決與大遷移 -->
  <g filter="url(#cardGlow6)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad6)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.2"/>
    <rect x="395" y="96" width="160" height="4" rx="2" fill="#06b6d4"/>
    <circle cx="418" cy="122" r="12" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="418" y="126" fill="#22d3ee" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="475" y="112" width="68" height="18" rx="4" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="509" y="124" fill="#22d3ee" font-size="8.5" text-anchor="middle">路線碰撞</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">全球大遷移</text>
    <text x="408" y="174" fill="#a5f3fc" font-size="9.5">• 暴力堆砌 vs 精準蒸餾</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• 開發者轉投開源生態</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 價格戰壓榨邊際成本</text>
  </g>

  <!-- 箭頭 3 -> 4 -->
  <path d="M 561 160 L 575 160" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- 卡片 4: 大小模型分工與人類防禦 -->
  <g filter="url(#cardGlow6)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad6)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#10b981"/>
    <circle cx="603" cy="122" r="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="603" y="126" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="689" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">突圍策略</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">協作與防禦</text>
    <text x="593" y="174" fill="#a7f3d0" font-size="9.5">• Router 動態路由分流</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• 輕量模型扛 90% 吞吐</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• 人類深耕系統問題定義</text>
  </g>

  <!-- 下方大閉環箭頭與突圍哲學 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowRose)"/>
  <rect x="135" y="278" width="490" height="28" rx="14" fill="#1c1917" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1"/>
  <text x="380" y="296" fill="#fecdd3" font-size="10.5" text-anchor="middle" font-weight="bold">
    工程生存哲學：當執行成本歸零，遠離單一操作斬殺線，做高階路由架構師與領域問題定義者
  </text>
</svg>
