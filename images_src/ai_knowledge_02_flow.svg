<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b1522 0%, #17112c 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <filter id="cardGlow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <pattern id="gridPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern2)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar2)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：AI 幻覺根源與工業級多層防禦護欄</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">機制剖析：自回歸隨機取樣、討好傾向與確定性代碼驗收門禁</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: 幻覺成因 -->
  <g filter="url(#cardGlow2)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#f59e0b"/>
    <circle cx="48" cy="122" r="12" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="48" y="126" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="141" y="124" fill="#fbbf24" font-size="8.5" text-anchor="middle">成因解密</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">機率取樣偏差</text>
    <text x="38" y="174" fill="#fed7aa" font-size="9.5">• Softmax 尾端取樣</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• 知識截止與盲區</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• 討好性瞎掰</text>
  </g>

  <path d="M 191 160 L 205 160" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- 卡片 2: RAG 知識錨定 -->
  <g filter="url(#cardGlow2)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#ef4444"/>
    <circle cx="233" cy="122" r="12" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1"/>
    <text x="233" y="126" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="326" y="124" fill="#f87171" font-size="8.5" text-anchor="middle">錨定防線</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">RAG 檢索增強</text>
    <text x="223" y="174" fill="#fca5a5" font-size="9.5">• PLC 暫存器規格書</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• 現場 Modbus 手冊</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• 事實資料注入</text>
  </g>

  <path d="M 376 160 L 390 160" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- 卡片 3: JSON Schema 約束 -->
  <g filter="url(#cardGlow2)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
    <rect x="395" y="96" width="160" height="4" rx="2" fill="#a855f7"/>
    <circle cx="418" cy="122" r="12" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="418" y="126" fill="#a855f7" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="475" y="112" width="68" height="18" rx="4" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="509" y="124" fill="#c084fc" font-size="8.5" text-anchor="middle">結構輸出</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">JSON 語法約束</text>
    <text x="408" y="174" fill="#d8b4fe" font-size="9.5">• 限制生成格式</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• 範圍合法性校驗</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 消除通靈自由度</text>
  </g>

  <path d="M 561 160 L 575 160" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- 卡片 4: 確定性測試門禁 -->
  <g filter="url(#cardGlow2)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#10b981"/>
    <circle cx="603" cy="122" r="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="603" y="126" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="689" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">終極門禁</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">單元測試驗收</text>
    <text x="593" y="174" fill="#6ee7b7" font-size="9.5">• Linter 靜態語法檢查</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• 自動化回歸測試</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• 拒絕未驗證上線</text>
  </g>

  <!-- 下方大閉環箭頭與總結 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowAmber)"/>
  <rect x="180" y="278" width="400" height="28" rx="14" fill="#2d1600" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
  <text x="380" y="296" fill="#fde68a" font-size="10.5" text-anchor="middle" font-weight="bold">
    防禦心法：以確定性的代碼工程與單元驗收，駕馭不確定性的機率文字生成
  </text>
</svg>
