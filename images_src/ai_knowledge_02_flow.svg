<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b1522 0%, #111e33 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <filter id="cardGlow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景細格線 -->
  <pattern id="gridPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern2)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar2)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：Anthropic 4D 野心評估模型</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">思維躍遷：限制你的從來不是模型智商，而是舊習慣與想像力！突破平庸的 4 大關鍵維度</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: 速度 (Speed) -->
  <g filter="url(#cardGlow2)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#0284c7"/>
    <circle cx="48" cy="122" r="12" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="1"/>
    <text x="48" y="126" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(2, 132, 199, 0.15)"/>
    <text x="141" y="124" fill="#38bdf8" font-size="8.5" text-anchor="middle">速度 Speed</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">做得更快 · 自動化</text>
    <text x="38" y="174" fill="#94a3b8" font-size="9.5">• 數小時縮短至數分</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• 效率提升的起點</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• 擺脫同質化競爭</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <path d="M 191 160 L 205 160" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 卡片 2: 高度 (Height) -->
  <g filter="url(#cardGlow2)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#7c3aed"/>
    <circle cx="233" cy="122" r="12" fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" stroke-width="1"/>
    <text x="233" y="126" fill="#c084fc" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(124, 58, 237, 0.15)"/>
    <text x="326" y="124" fill="#c084fc" font-size="8.5" text-anchor="middle">高度 Height</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">對最終結果負責</text>
    <text x="223" y="174" fill="#e9d5ff" font-size="9.5">• 拒絕微觀管理步驟</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• 「然後呢」4層推演</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• 填資料升級重構流程</text>
  </g>

  <!-- 箭頭 2 -> 3 -->
  <path d="M 376 160 L 390 160" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 卡片 3: 深度 (Depth) -->
  <g filter="url(#cardGlow2)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
    <rect x="395" y="96" width="160" height="4" rx="2" fill="#059669"/>
    <circle cx="418" cy="122" r="12" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-width="1"/>
    <text x="418" y="126" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="475" y="112" width="68" height="18" rx="4" fill="rgba(5, 150, 105, 0.15)"/>
    <text x="509" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">深度 Depth</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">頂尖專家框架</text>
    <text x="408" y="174" fill="#a7f3d0" font-size="9.5">• 4個專家診斷問題</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• 給定極限高標挑戰</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 逼出底層架構重構</text>
  </g>

  <!-- 箭頭 3 -> 4 -->
  <path d="M 561 160 L 575 160" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 卡片 4: 廣度 (Breadth) -->
  <g filter="url(#cardGlow2)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad2)" stroke="rgba(234, 88, 12, 0.3)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#ea580c"/>
    <circle cx="603" cy="122" r="12" fill="rgba(234, 88, 12, 0.15)" stroke="#ea580c" stroke-width="1"/>
    <text x="603" y="126" fill="#fb923c" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(234, 88, 12, 0.15)"/>
    <text x="689" y="124" fill="#fb923c" font-size="8.5" text-anchor="middle">廣度 Breadth</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">名詞轉動詞跨界</text>
    <text x="593" y="174" fill="#fed7aa" font-size="9.5">• 撕掉行業刻板標籤</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• 描述背後本質作用</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• 借調短影音/電影法</text>
  </g>

  <!-- 下方大閉環箭頭與期望值公式 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#f97316" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="150" y="278" width="460" height="28" rx="14" fill="#1e1b4b" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1"/>
  <text x="380" y="296" fill="#fdba74" font-size="10.5" text-anchor="middle" font-weight="bold">
    期望值證明：失敗成本 C ≈ 0 ⟹ E &gt; 0！敢問大問題、大膽拓展野心與認知
  </text>
</svg>
