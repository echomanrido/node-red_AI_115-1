<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b1522 0%, #162438 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <filter id="cardGlow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景細格線 -->
  <pattern id="gridPattern4" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern4)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar4)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：大語言模型自設題目橫向評測</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">實證評測：從藝術歷史、幾何數學、地區辨識到多模態先驗偏誤的實測全貌</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: 藝術歷史 (梵谷自畫像) -->
  <g filter="url(#cardGlow4)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad4)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#d97706"/>
    <circle cx="48" cy="122" r="12" fill="rgba(217, 119, 6, 0.15)" stroke="#d97706" stroke-width="1"/>
    <text x="48" y="126" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(217, 119, 6, 0.15)"/>
    <text x="141" y="124" fill="#fbbf24" font-size="8.5" text-anchor="middle">藝術歷史</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">梵谷自畫像</text>
    <text x="38" y="174" fill="#fde68a" font-size="9.5">• 鏡像翻轉辨析</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• 博物館權威證實</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• 實質為右撇子作畫</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <path d="M 191 160 L 205 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

  <!-- 卡片 2: 幾何數學 (長方形面積) -->
  <g filter="url(#cardGlow4)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad4)" stroke="rgba(2, 132, 199, 0.3)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#0284c7"/>
    <circle cx="233" cy="122" r="12" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="1"/>
    <text x="233" y="126" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(2, 132, 199, 0.15)"/>
    <text x="326" y="124" fill="#38bdf8" font-size="8.5" text-anchor="middle">幾何推理</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">長方形面積題</text>
    <text x="223" y="174" fill="#bae6fd" font-size="9.5">• 多模態 OCR 圖解</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• 相似三角形輔助線</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• 坐標代數幾何推導</text>
  </g>

  <!-- 箭頭 2 -> 3 -->
  <path d="M 376 160 L 390 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

  <!-- 卡片 3: 地區辨識 (高雄愛河灣) -->
  <g filter="url(#cardGlow4)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad4)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
    <rect x="395" y="96" width="160" height="4" rx="2" fill="#059669"/>
    <circle cx="418" cy="122" r="12" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-width="1"/>
    <text x="418" y="126" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="475" y="112" width="68" height="18" rx="4" fill="rgba(5, 150, 105, 0.15)"/>
    <text x="509" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">地區分析</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">地標景點定位</text>
    <text x="408" y="174" fill="#a7f3d0" font-size="9.5">• 高雄流行音樂中心</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• 愛河灣巨型充氣偶</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 空間地理場景感知</text>
  </g>

  <!-- 箭頭 3 -> 4 -->
  <path d="M 561 160 L 575 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

  <!-- 卡片 4: 常識盲區 (六指計數與物理時鐘) -->
  <g filter="url(#cardGlow4)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad4)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#e11d48"/>
    <circle cx="603" cy="122" r="12" fill="rgba(225, 29, 72, 0.15)" stroke="#e11d48" stroke-width="1"/>
    <text x="603" y="126" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(225, 29, 72, 0.15)"/>
    <text x="689" y="124" fill="#fda4af" font-size="8.5" text-anchor="middle">常識偏誤</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">先驗常識盲區</text>
    <text x="593" y="174" fill="#fecdd3" font-size="9.5">• 6指計數腦補成5指</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• 6:30時針物理位置</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• 程式幾何解法更精確</text>
  </g>

  <!-- 下方大閉環箭頭與選型策略 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowSky)"/>
  <rect x="135" y="278" width="490" height="28" rx="14" fill="#1e1b4b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="380" y="296" fill="#7dd3fc" font-size="10.5" text-anchor="middle" font-weight="bold">
    評測結論：看穿模型先驗偏見 (Prior Bias) · 精準任務結合程式與外掛驗證
  </text>
</svg>
