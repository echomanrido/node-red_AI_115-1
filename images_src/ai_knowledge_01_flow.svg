<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b1522 0%, #111e33 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <filter id="cardGlow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景細格線 -->
  <pattern id="gridPattern1" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern1)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar1)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：世界模型 vs 機率文字接龍</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">認知科學洞察：大語言模型究竟只是話術統計，還是具備深層因果理解？</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: 人類心智世界模型 -->
  <g filter="url(#cardGlow1)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#38bdf8"/>
    <circle cx="48" cy="122" r="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="48" y="126" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="141" y="124" fill="#38bdf8" font-size="8.5" text-anchor="middle">人類心智</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">真實物理因果</text>
    <text x="38" y="174" fill="#94a3b8" font-size="9.5">• 觸覺重力體驗</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• 內在世界模型</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• 具備因果心智</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <path d="M 191 160 L 205 160" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- 卡片 2: LLM 文字接龍本質 -->
  <g filter="url(#cardGlow1)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad1)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#f43f5e"/>
    <circle cx="233" cy="122" r="12" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="233" y="126" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(244, 63, 94, 0.15)"/>
    <text x="326" y="124" fill="#f43f5e" font-size="8.5" text-anchor="middle">機率接龍</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">統計預測本質</text>
    <text x="223" y="174" fill="#fca5a5" font-size="9.5">• Next-Token 預測</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• Rido 名言：話術</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• 缺乏物理守護</text>
  </g>

  <!-- 箭頭 2 -> 3 -->
  <path d="M 376 160 L 390 160" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- 卡片 3: 諾貝爾獎教父 Hinton 觀點 -->
  <g filter="url(#cardGlow1)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
    <rect x="395" y="96" width="160" height="4" rx="2" fill="#a855f7"/>
    <circle cx="418" cy="122" r="12" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="418" y="126" fill="#a855f7" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="475" y="112" width="68" height="18" rx="4" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="509" y="124" fill="#c084fc" font-size="8.5" text-anchor="middle">Hinton觀點</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">黑白棋隱含推演</text>
    <text x="408" y="174" fill="#d8b4fe" font-size="9.5">• 預測棋局需建模</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• 壓縮人類全知識</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 湧現出世界模型</text>
  </g>

  <!-- 箭頭 3 -> 4 -->
  <path d="M 561 160 L 575 160" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- 卡片 4: 工控工程實踐啟示 -->
  <g filter="url(#cardGlow1)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#10b981"/>
    <circle cx="603" cy="122" r="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="603" y="126" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="689" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">工控落地</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">鷹架與護欄防呆</text>
    <text x="593" y="174" fill="#6ee7b7" font-size="9.5">• 不迷信話術產碼</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• 規格 (Spec) 鷹架</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• PLC 看門狗防護</text>
  </g>

  <!-- 下方大閉環箭頭與總結 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowRose)"/>
  <rect x="180" y="278" width="400" height="28" rx="14" fill="#1e1b4b" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
  <text x="380" y="296" fill="#fda4af" font-size="10.5" text-anchor="middle" font-weight="bold">
    核心心法：看穿「話術接龍」表象，引導「世界模型」於工控安全精準落地
  </text>
</svg>
