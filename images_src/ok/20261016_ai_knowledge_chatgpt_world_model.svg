<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%" style="background: linear-gradient(135deg, #090d16 0%, #15102a 50%, #0d1527 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;">
  <defs>
    <!-- 漸層色彩定義 -->
    <linearGradient id="gradTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="gradCardRido" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.18)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="gradCardHinton" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.18)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>

    <filter id="boxGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 背景科技微網格 -->
  <pattern id="bgGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
  </pattern>
  <rect width="820" height="420" fill="url(#bgGrid)" />

  <!-- 頂部標題列 -->
  <rect x="25" y="22" width="5" height="32" rx="2.5" fill="url(#gradTitle)" />
  <text x="40" y="44" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">AI 知識核心洞察：ChatGPT 只是文字接龍？諾貝爾獎教父論證世界模型</text>
  <text x="40" y="66" fill="#94a3b8" font-size="12">人類因果心智模型 vs 統計機率接龍 vs Rido 名言「話術本質」vs 工控防呆實踐</text>
  <line x1="25" y1="84" x2="795" y2="84" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- 四大核心架構卡片橫排 -->

  <!-- 卡片 1: 大眾迷思 (文字接龍) -->
  <g filter="url(#boxGlow)">
    <rect x="25" y="105" width="175" height="200" rx="12" fill="#111827" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" />
    <rect x="25" y="105" width="175" height="5" rx="2.5" fill="#f43f5e" />
    
    <rect x="37" y="122" width="60" height="20" rx="4" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.3)" />
    <text x="67" y="136" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">迷思觀點</text>
    
    <text x="37" y="165" fill="#ffffff" font-size="14" font-weight="800">01. 高級文字接龍</text>
    <text x="37" y="188" fill="#cbd5e1" font-size="11" font-weight="600">• Next-Token 預測</text>
    <text x="37" y="208" fill="#94a3b8" font-size="10.5">基於海量文字機率</text>
    <text x="37" y="228" fill="#94a3b8" font-size="10.5">能言善道卻常露破綻</text>
    <text x="37" y="258" fill="#f87171" font-size="11" font-weight="700">✘ 缺乏物理因果認知</text>
    <text x="37" y="278" fill="#64748b" font-size="9.5">易產生一本正經的幻覺</text>
  </g>

  <!-- 箭頭 1 -->
  <path d="M 205 205 L 221 205" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)" />

  <!-- 卡片 2: Rido 老師一針見血名言 (話術觀點) -->
  <g filter="url(#boxGlow)">
    <rect x="225" y="105" width="180" height="200" rx="12" fill="url(#gradCardRido)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.4" />
    <rect x="225" y="105" width="180" height="5" rx="2.5" fill="#f59e0b" />
    
    <rect x="237" y="122" width="76" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.4)" />
    <text x="275" y="136" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">Rido's View</text>

    <text x="237" y="165" fill="#ffffff" font-size="14" font-weight="800">02. 「那叫話術」</text>
    
    <rect x="235" y="176" width="160" height="42" rx="6" fill="rgba(0, 0, 0, 0.35)" />
    <text x="242" y="193" fill="#fef08a" font-size="11" font-weight="800">「預測下一個字說什麼？」</text>
    <text x="242" y="210" fill="#fef08a" font-size="11.5" font-weight="900">「如果是，那叫話術。」</text>
    
    <text x="237" y="240" fill="#cbd5e1" font-size="10.5">流暢話術 ≠ 懂真實世界</text>
    <text x="237" y="260" fill="#cbd5e1" font-size="10.5">迎合心理 ≠ 具因果架構</text>
    <text x="237" y="285" fill="#f59e0b" font-size="10" font-weight="700">★ 警惕：工控不可靠通靈！</text>
  </g>

  <!-- 箭頭 2 -->
  <path d="M 410 205 L 426 205" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)" />

  <!-- 卡片 3: Geoffrey Hinton (諾貝爾獎教父) -->
  <g filter="url(#boxGlow)">
    <rect x="430" y="105" width="180" height="200" rx="12" fill="url(#gradCardHinton)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.4" />
    <rect x="430" y="105" width="180" height="5" rx="2.5" fill="#a855f7" />

    <rect x="442" y="122" width="76" height="20" rx="4" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.4)" />
    <text x="480" y="136" fill="#c084fc" font-size="10" font-weight="800" text-anchor="middle">諾貝爾教父</text>

    <text x="442" y="165" fill="#ffffff" font-size="14" font-weight="800">03. 湧現世界模型</text>
    <text x="442" y="188" fill="#e2e8f0" font-size="11" font-weight="700">Geoffrey Hinton 觀點：</text>
    <text x="442" y="208" fill="#cbd5e1" font-size="10.5">• 黑白棋預測案例：</text>
    <text x="442" y="226" fill="#94a3b8" font-size="10">表面預測落子，內部必須</text>
    <text x="442" y="244" fill="#94a3b8" font-size="10">自發建構 8x8 棋盤狀態！</text>
    <text x="442" y="272" fill="#c084fc" font-size="10.5" font-weight="700">✔ 模型已內化人類因果邏輯</text>
  </g>

  <!-- 箭頭 3 -->
  <path d="M 615 205 L 631 205" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)" />

  <!-- 卡片 4: 工控與 Vibe Coding 實戰 -->
  <g filter="url(#boxGlow)">
    <rect x="635" y="105" width="160" height="200" rx="12" fill="#111827" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <rect x="635" y="105" width="160" height="5" rx="2.5" fill="#0ea5e9" />

    <rect x="647" y="122" width="60" height="20" rx="4" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(14, 165, 233, 0.3)" />
    <text x="677" y="136" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">工程落地</text>

    <text x="647" y="165" fill="#ffffff" font-size="14" font-weight="800">04. 因果防呆實踐</text>
    <text x="647" y="188" fill="#cbd5e1" font-size="11" font-weight="600">• 規格鷹架 (Spec)</text>
    <text x="647" y="208" fill="#94a3b8" font-size="10.5">提供確定的架構邊界</text>
    <text x="647" y="228" fill="#cbd5e1" font-size="11" font-weight="600">• 實體防呆 Guardrails</text>
    <text x="647" y="248" fill="#94a3b8" font-size="10.5">Watchdog 看門狗與互鎖</text>
    <text x="647" y="278" fill="#38bdf8" font-size="10.5" font-weight="700">✔ 駕馭 AI 世界模型</text>
  </g>

  <!-- 底部核心結論導言光帶 -->
  <g filter="url(#boxGlow)">
    <rect x="25" y="325" width="770" height="72" rx="10" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.2" />
    <circle cx="50" cy="361" r="14" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1" />
    <text x="50" y="366" fill="#fb7185" font-size="13" font-weight="900" text-anchor="middle">💡</text>
    
    <text x="75" y="352" fill="#ffffff" font-size="12.5" font-weight="800">結論：既不神化 AI，亦不把 AI 當笨蛋。穿透「話術」表象，引導其「世界模型」嚴謹落地！</text>
    <text x="75" y="376" fill="#cbd5e1" font-size="11">工程師的核心價值在於提供因果約束與規格護欄 (Spec Guardrails)，將統計預測轉化為 100% 確定性的工業自動化控制。</text>
  </g>
</svg>
