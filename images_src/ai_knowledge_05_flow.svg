<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b1522 0%, #151b3b 100%); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif;">
  <defs>
    <linearGradient id="gradBar5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <filter id="cardGlow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景細格線 -->
  <pattern id="gridPattern5" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="760" height="360" fill="url(#gridPattern5)" />

  <!-- 頂部標題裝飾區 -->
  <rect x="25" y="22" width="4" height="28" rx="2" fill="url(#gradBar5)" />
  <text x="38" y="40" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">AI 知識專區：看懂 Artificial Analysis 排行榜與權威評測維度</text>
  <text x="38" y="58" fill="#94a3b8" font-size="11">評測體系：三大機構來源 · 四大核心指標 · 三大盲點爭議 · 實戰選型決策指南</text>
  <rect x="25" y="74" width="710" height="1" fill="rgba(255,255,255,0.08)" />

  <!-- 卡片 1: 三大評測機構 -->
  <g filter="url(#cardGlow5)">
    <rect x="25" y="96" width="160" height="128" rx="10" fill="url(#cardGrad5)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2"/>
    <rect x="25" y="96" width="160" height="4" rx="2" fill="#06b6d4"/>
    <circle cx="48" cy="122" r="12" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="48" y="126" fill="#22d3ee" font-size="10" font-weight="bold" text-anchor="middle">01</text>
    <rect x="110" y="112" width="62" height="18" rx="4" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="141" y="124" fill="#22d3ee" font-size="8.5" text-anchor="middle">機構來源</text>
    <text x="38" y="154" fill="#ffffff" font-size="13" font-weight="bold">三大評測體系</text>
    <text x="38" y="174" fill="#67e8f9" font-size="9.5">• Artificial Analysis</text>
    <text x="38" y="190" fill="#94a3b8" font-size="9.5">• METR 安全自主能力</text>
    <text x="38" y="206" fill="#64748b" font-size="9">• ARC-AGI 抽象推理</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <path d="M 191 160 L 205 160" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 卡片 2: 四大核心公信力指標 -->
  <g filter="url(#cardGlow5)">
    <rect x="210" y="96" width="160" height="128" rx="10" fill="url(#cardGrad5)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.2"/>
    <rect x="210" y="96" width="160" height="4" rx="2" fill="#3b82f6"/>
    <circle cx="233" cy="122" r="12" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1"/>
    <text x="233" y="126" fill="#60a5fa" font-size="10" font-weight="bold" text-anchor="middle">02</text>
    <rect x="295" y="112" width="62" height="18" rx="4" fill="rgba(59, 130, 246, 0.15)"/>
    <text x="326" y="124" fill="#60a5fa" font-size="8.5" text-anchor="middle">關鍵指標</text>
    <text x="223" y="154" fill="#ffffff" font-size="13" font-weight="bold">四大核心維度</text>
    <text x="223" y="174" fill="#93c5fd" font-size="9.5">• Quality Index (智力)</text>
    <text x="223" y="190" fill="#94a3b8" font-size="9.5">• TTFT 首字響應延遲</text>
    <text x="223" y="206" fill="#64748b" font-size="9">• TPS 吞吐 & 混合價格</text>
  </g>

  <!-- 箭頭 2 -> 3 -->
  <path d="M 376 160 L 390 160" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 卡片 3: 三大爭議與盲點 -->
  <g filter="url(#cardGlow5)">
    <rect x="395" y="96" width="160" height="128" rx="10" fill="url(#cardGrad5)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2"/>
    <rect x="395" y="96" width="4" height="4" rx="2" fill="#f43f5e"/>
    <circle cx="418" cy="122" r="12" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="418" y="126" fill="#fb7185" font-size="10" font-weight="bold" text-anchor="middle">03</text>
    <rect x="475" y="112" width="68" height="18" rx="4" fill="rgba(244, 63, 94, 0.15)"/>
    <text x="509" y="124" fill="#fb7185" font-size="8.5" text-anchor="middle">盲點警示</text>
    <text x="408" y="154" fill="#ffffff" font-size="13" font-weight="bold">三大評測爭議</text>
    <text x="408" y="174" fill="#fca5a5" font-size="9.5">• 廠商自誇與刻意挑題</text>
    <text x="408" y="190" fill="#94a3b8" font-size="9.5">• 評估外包利益衝突</text>
    <text x="408" y="206" fill="#64748b" font-size="9">• 資料集污染「背題」</text>
  </g>

  <!-- 箭頭 3 -> 4 -->
  <path d="M 561 160 L 575 160" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- 卡片 4: 實戰選型指南 -->
  <g filter="url(#cardGlow5)">
    <rect x="580" y="96" width="155" height="128" rx="10" fill="url(#cardGrad5)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.2"/>
    <rect x="580" y="96" width="155" height="4" rx="2" fill="#10b981"/>
    <circle cx="603" cy="122" r="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="603" y="126" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">04</text>
    <rect x="655" y="112" width="68" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="689" y="124" fill="#34d399" font-size="8.5" text-anchor="middle">實戰選型</text>
    <text x="593" y="154" fill="#ffffff" font-size="13" font-weight="bold">四步決策漏斗</text>
    <text x="593" y="174" fill="#a7f3d0" font-size="9.5">• 任務複雜度 (推理/常態)</text>
    <text x="593" y="190" fill="#94a3b8" font-size="9.5">• 延遲門檻 (TTFT &lt; 1s)</text>
    <text x="593" y="206" fill="#64748b" font-size="9">• 混合成本與隱私邊界</text>
  </g>

  <!-- 下方大閉環箭頭與選型策略 -->
  <path d="M 657 236 C 657 290, 105 290, 105 236" stroke="#06b6d4" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowCyan)"/>
  <rect x="135" y="278" width="490" height="28" rx="14" fill="#0c2340" stroke="rgba(6, 182, 212, 0.45)" stroke-width="1"/>
  <text x="380" y="296" fill="#a5f3fc" font-size="10.5" text-anchor="middle" font-weight="bold">
    架構師選型原則：找帕累托最優前緣（Pareto Frontier），在智力、速度與成本間取得黃金平衡
  </text>
</svg>
