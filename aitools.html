<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五股職訓局-機電AI_115-1期 | AI 工具教學系統</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar / 左側 AI 工具選單 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <i class="fa-solid fa-microchip logo-icon"></i>
          <div class="brand-titles">
            <h1 class="main-title">五股職訓局</h1>
            <span class="sub-title">機電AI_115-1期（作者：Rido老師）</span>
          </div>
        </div>
        <button class="mobile-toggle-btn" id="sidebarCloseBtn" aria-label="關閉選單">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="sidebar-search">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" placeholder="搜尋 AI 工具、分類..." />
        </div>
      </div>

      <div class="sidebar-menu-title" style="color: #ec4899;">
        <span>AI 協作工具 (AI TOOLS)</span>
        <span class="lab-count-badge" id="toolCountBadge" style="background: rgba(236, 72, 153, 0.2); color: #ec4899;">0</span>
      </div>

      <nav class="lab-list" id="toolList">
        <!-- 動態渲染 AI 工具選單列表 -->
      </nav>

      <div class="sidebar-footer">
        <div class="footer-info" style="display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem;">
          <div><i class="fa-solid fa-graduation-cap"></i> AI 智慧輔助協作講義</div>
          <div style="opacity: 0.7; font-size: 0.72rem; padding-left: 18px;">作者：Rido老師</div>
        </div>
      </div>
    </aside>

    <!-- 主內容區域 -->
    <main class="main-content">
      <!-- 頂部 Header -->
      <header class="top-header">
        <button class="mobile-toggle-btn" id="sidebarOpenBtn" aria-label="開啟選單">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="breadcrumb" id="breadcrumb">
          <a href="index.html" class="back-home-link"><i class="fa-solid fa-house"></i> 首頁</a> / <span class="active-lab-name">載入中...</span>
        </div>
        <div class="header-actions">
          <span class="status-tag" style="background: rgba(236, 72, 153, 0.1); border-color: rgba(236, 72, 153, 0.2); color: #ec4899;">
            <i class="fa-solid fa-robot"></i> AI 工具教學
          </span>
        </div>
      </header>

      <!-- 動態載入 AI 工具教學內容 -->
      <div class="content-body" id="contentBody">
        <!-- JS 動態插入內容 -->
      </div>
    </main>
  </div>

  <!-- Lightbox Modal (圖片放大預覽) -->
  <div class="lightbox-modal" id="lightboxModal">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-content" id="lightboxImg" alt="照片放大預覽">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <!-- Toast Notification 通知 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="aitoolsData.js?v=1.0"></script>
  <script src="aitoolsApp.js?v=1.0"></script>
</body>
</html>
